# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-registry-set-02
name: "Sigma: Windows registry set (2 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows registry set events, grouped by tactic Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - registry-set
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13)
rules:
  - key: new-bginfo-exe-custom-vbscript-registr-992dd79f
    name: New BgInfo.EXE Custom VBScript Registry Configuration
    description: 'Detects setting of a new registry value related to BgInfo configuration, which can be abused to execute custom VBScript via "BgInfo.exe" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate VBScript. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 992dd79f-dde8-4bb0-9085-6350ba97cfb3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_bginfo_custom_vbscript.yml'
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\Software\\Winternals\\BGInfo\\UserFields\\" and xdm.target.registry.data ~= "^4")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
