    description: "Detects potentially suspicious changes to the SentinelOne context menu scan command by a process other than SentinelOne. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6c304b02-06e6-402d-8be4-d5833cdf8198. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_sentinelone_shell_context_tampering.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\shell\\SentinelOneScan\\command\\" and not (((xdm.target.registry.data ~= "^(?:C:\\\\Program Files\\\\SentinelOne\\\\Sentinel Agent|C:\\\\Program Files \\(x86\\)\\\\SentinelOne\\\\Sentinel Agent)" and xdm.target.registry.data contains "\\SentinelScanFromContextMenu.exe") or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\SentinelOne\\\\|C:\\\\Program Files \\(x86\\)\\\\SentinelOne\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-wsl-installlocation-registry-83475063
    name: Potential WSL InstallLocation Registry Key Modification
    description: |-
      Detects modifications to the Windows Subsystem for Linux (WSL) InstallLocation registry key.
      Attackers can modify this registry key to redirect the execution flow of legitimate WSL processes (wsl.exe or bash.exe) to a malicious payload, acting as a proxy execution and defense evasion technique. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Liran Ravich, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 83475063-b1c8-4774-9568-69bbda71a539. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_wsl_installlocation_registry_key_modification.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\Lxss\\MSI\\InstallLocation" and not (((xdm.target.registry.data ~= "^(?:C:\\\\Program Files\\\\WSL|%ProgramFiles%\\\\WSL)$" or xdm.target.registry.data ~= "(?::\\\\Program Files\\\\WindowsApps\\\\MicrosoftCorporationII\\.WindowsSubsystemForLinux_|\\\\AppData\\\\Local\\\\Microsoft\\\\WindowsApps|%ProgramFiles%\\\\WindowsApps\\\\MicrosoftCorporationII\\.WindowsSubsystemForLinux_)") or xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\msiexec\\.exe|C:\\\\Windows\\\\SysWOW64\\\\msiexec\\.exe)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-desktop-backgro-85b88e05
    name: Potentially Suspicious Desktop Background Change Via Registry
    description: |-
      Detects registry value settings that would replace the user's desktop background.
      This is a common technique used by malware to change the desktop background to a ransom note or other image. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Administrative scripts that change the desktop background to a company logo or other image.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Stephen Lincoln @slincoln-aiq (AttackIQ), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 85b88e05-dadc-430b-8a9e-53ff1cd30aae. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_desktop_background_change.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
      - T1491.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "(?:Control Panel\\\\Desktop|CurrentVersion\\\\Policies\\\\ActiveDesktop|CurrentVersion\\\\Policies\\\\System)" and ((xdm.target.registry.path ~= "NoChangingWallpaper$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$") or xdm.target.registry.path ~= "\\\\Wallpaper$" or (xdm.target.registry.path ~= "\\\\WallpaperStyle$" and xdm.target.registry.data ~= "^2$")) and not ((xdm.source.process.executable.path ~= "\\\\svchost\\.exe$" or (xdm.target.registry.path ~= "\\\\Control Panel\\\\Desktop\\\\Wallpaper$" and xdm.target.registry.data ~= "^\\(Empty\\)$") or xdm.source.process.executable.path ~= "C:\\\\Windows\\\\Explorer\\.EXE$")) and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Amazon\\\\EC2Launch\\\\EC2Launch\\.exe|C:\\\\Program Files \\(x86\\)\\\\Amazon\\\\EC2Launch\\\\EC2Launch\\.exe)$" and xdm.target.registry.path ~= "\\\\Control Panel\\\\Desktop\\\\Wallpaper$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-odbc-driver-reg-e4d22291
    name: Potentially Suspicious ODBC Driver Registered
    description: "Detects the registration of a new ODBC driver where the driver is located in a potentially suspicious location Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_odbc_driver_registered_susp.yml"
