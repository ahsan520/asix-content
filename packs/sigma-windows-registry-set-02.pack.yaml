  - key: persistence-via-disk-cleanup-handler-a-d4e2745c
    name: Persistence Via Disk Cleanup Handler - Autorun
    description: |-
      Detects when an attacker modifies values of the Disk Cleanup Handler in the registry to achieve persistence via autorun.
      The disk cleanup manager is part of the operating system.
      It displays the dialog box […] The user has the option of enabling or disabling individual handlers by selecting or clearing their check box in the disk cleanup manager's UI.
      Although Windows comes with a number of disk cleanup handlers, they aren't designed to handle files produced by other applications.
      Instead, the disk cleanup manager is designed to be flexible and extensible by enabling any developer to implement and register their own disk cleanup handler.
      Any developer can extend the available disk cleanup services by implementing and registering a disk cleanup handler. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d4e2745c-f0c6-4bde-a3ab-b553b3f693cc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_disk_cleanup_handler_autorun_persistence.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\VolumeCaches\\" and ((xdm.target.registry.path contains "\\Autorun" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$") or (xdm.target.registry.path ~= "(?:\\\\CleanupString|\\\\PreCleanupString)" and xdm.target.registry.data ~= "(?:cmd|powershell|rundll32|mshta|cscript|wscript|wsl|\\\\Users\\\\Public\\\\|\\\\Windows\\\\TEMP\\\\|\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: persistence-via-hhctrl-ocx-f10ed525
