  - key: potential-persistence-via-app-paths-de-707e097c
    name: Potential Persistence Via App Paths Default Property
    description: |-
      Detects changes to the "Default" property for keys located in the \Software\Microsoft\Windows\CurrentVersion\App Paths\ registry. Which might be used as a method of persistence
      The entries found under App Paths are used primarily for the following purposes.
      First, to map an application's executable file name to that file's fully qualified path.
      Second, to prepend information to the PATH environment variable on a per-application, per-process basis. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate applications registering their binary from on of the suspicious locations mentioned above (tune it). Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 707e097c-e20f-4f67-8807-1f72ff4500d6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_persistence_app_paths.yml
