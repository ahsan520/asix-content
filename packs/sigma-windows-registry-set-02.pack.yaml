  - key: powershell-logging-disabled-via-regist-fecfd1a1
    name: PowerShell Logging Disabled Via Registry Key Tampering
    description: "Detects changes to the registry for the currently logged-in user. In order to disable PowerShell module logging, script block logging or transcription and script execution logging Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_powershell_logging_disabled.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1564.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "(?:\\\\Microsoft\\\\Windows\\\\PowerShell\\\\|\\\\Microsoft\\\\PowerShellCore\\\\)" and xdm.target.registry.path ~= "(?:\\\\ModuleLogging\\\\EnableModuleLogging|\\\\ScriptBlockLogging\\\\EnableScriptBlockLogging|\\\\ScriptBlockLogging\\\\EnableScriptBlockInvocationLogging|\\\\Transcription\\\\EnableTranscripting|\\\\Transcription\\\\EnableInvocationHeader|\\\\EnableScripts)$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: rdp-sensitive-settings-changed-3f6b7b62
    name: RDP Sensitive Settings Changed
    description: |-
      Detects tampering of RDP Terminal Service/Server sensitive settings.
      Such as allowing unauthorized users access to a system via the 'fAllowUnsolicited' or enabling RDP via 'fDenyTSConnections', etc.

      Below is a list of registry keys/values that are monitored by this rule:

      - Shadow: Used to enable Remote Desktop shadowing, which allows an administrator to view or control a user's session.
      - DisableRemoteDesktopAntiAlias: Disables anti-aliasing for remote desktop sessions.
      - DisableSecuritySettings: Disables certain security settings for Remote Desktop connections.
      - fAllowUnsolicited: Allows unsolicited remote assistance offers.
      - fAllowUnsolicitedFullControl: Allows unsolicited remote assistance offers with full control.
      - InitialProgram: Specifies a program to run automatically when a user logs on to a remote computer.
      - ServiceDll: Used in RDP hijacking techniques to specify a custom DLL to be loaded by the Terminal Services service.
      - SecurityLayer: Specifies the security layer used for RDP connections. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Some of the keys mentioned here could be modified by an administrator while setting group policy (it should be investigated either way). Sigma rule by Samir Bousseaden, David ANDRE, Roberto Rodriguez @Cyb3rWard0g, Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3f6b7b62-61aa-45db-96bd-9c31b36b653c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_terminal_server_tampering.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "(?:\\\\Control\\\\Terminal Server\\\\|\\\\Windows NT\\\\Terminal Services\\\\)" and xdm.target.registry.path ~= "\\\\Shadow$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000001\\)|DWORD \\(0x00000002\\)|DWORD \\(0x00000003\\)|DWORD \\(0x00000004\\))$") or (xdm.target.registry.path ~= "(?:\\\\Control\\\\Terminal Server\\\\|\\\\Windows NT\\\\Terminal Services\\\\)" and xdm.target.registry.path ~= "(?:\\\\DisableRemoteDesktopAntiAlias|\\\\DisableSecuritySettings|\\\\fAllowUnsolicited|\\\\fAllowUnsolicitedFullControl)$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$") or (xdm.target.registry.path ~= "(?:\\\\Control\\\\Terminal Server\\\\InitialProgram|\\\\Control\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\InitialProgram|\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\SecurityLayer|\\\\Windows NT\\\\Terminal Services\\\\InitialProgram)" or xdm.target.registry.path ~= "\\\\services\\\\TermService\\\\Parameters\\\\ServiceDll$")) and not (((xdm.target.registry.path ~= "\\\\SecurityLayer$" and xdm.target.registry.data ~= "^DWORD \\(0x00000002\\)$") or (xdm.target.registry.path ~= "\\\\services\\\\TermService\\\\Parameters\\\\ServiceDll$" and xdm.target.registry.data ~= "^(?:%%SystemRoot%%\\\\System32\\\\termsrv\\.dll|%%SystemRoot%%\\\\SysWOW64\\\\termsrv\\.dll|%%windir%%\\\\System32\\\\termsrv\\.dll|%%windir%%\\\\SysWOW64\\\\termsrv\\.dll|%SystemRoot%\\\\System32\\\\termsrv\\.dll|%SystemRoot%\\\\SysWOW64\\\\termsrv\\.dll|%windir%\\\\System32\\\\termsrv\\.dll|%windir%\\\\SysWOW64\\\\termsrv\\.dll|C:\\\\Windows\\\\System32\\\\termsrv\\.dll|C:\\\\Windows\\\\SysWOW64\\\\termsrv\\.dll)$") or (xdm.target.registry.path ~= "(?:\\\\Control\\\\Terminal Server\\\\InitialProgram|\\\\Control\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\InitialProgram|\\\\Windows NT\\\\Terminal Services\\\\InitialProgram)" and (not (xdm.target.registry.data ~= ".") or xdm.target.registry.data ~= "^\\(Empty\\)$")))) and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\|C:\\\\Windows\\\\WinSxS\\\\)" and xdm.source.process.executable.path ~= "\\\\containerworker\\.exe$" and xdm.target.registry.path contains "\\Windows\\Containers\\Layers\\")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
