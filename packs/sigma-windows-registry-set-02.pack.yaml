  - key: new-dns-serverlevelplugindll-installed-e61e8a88
    name: New DNS ServerLevelPluginDll Installed
    description: "Detects the installation of a DNS plugin DLL via ServerLevelPluginDll parameter in registry, which can be used to execute code in context of the DNS server (restart required) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e61e8a88-59a9-451c-874e-70fcc9740d67. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_dns_server_level_plugin_dll.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1574.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "\\\\services\\\\DNS\\\\Parameters\\\\ServerLevelPluginDll$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: new-netsh-helper-dll-registered-from-a-e7b18879
    name: New Netsh Helper DLL Registered From A Suspicious Location
    description: "Detects changes to the Netsh registry key to add a new DLL value that is located on a suspicious location. This change might be an indication of a potential persistence attempt by adding a malicious Netsh helper Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e7b18879-676e-4a0e-ae18-27039185a8e7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_netsh_help_dll_persistence_susp_location.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1546.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\NetSh" and (xdm.target.registry.data ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Temporary Internet)" or ((xdm.target.registry.data ~= ":\\\\Users\\\\" and xdm.target.registry.data ~= "\\\\Favorites\\\\") or (xdm.target.registry.data ~= ":\\\\Users\\\\" and xdm.target.registry.data ~= "\\\\Favourites\\\\") or (xdm.target.registry.data ~= ":\\\\Users\\\\" and xdm.target.registry.data ~= "\\\\Contacts\\\\") or (xdm.target.registry.data ~= ":\\\\Users\\\\" and xdm.target.registry.data ~= "\\\\Pictures\\\\"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: new-odbc-driver-registered-3390fbef
