      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\ODBC\\ODBCINST.INI\\" and xdm.target.registry.path ~= "(?:\\\\Driver|\\\\Setup)$" and (xdm.target.registry.data ~= "(?::\\\\PerfLogs\\\\|:\\\\ProgramData\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Registration\\\\CRMLog|:\\\\Windows\\\\System32\\\\com\\\\dmp\\\\|:\\\\Windows\\\\System32\\\\FxsTmp\\\\|:\\\\Windows\\\\System32\\\\Microsoft\\\\Crypto\\\\RSA\\\\MachineKeys\\\\|:\\\\Windows\\\\System32\\\\spool\\\\drivers\\\\color\\\\|:\\\\Windows\\\\System32\\\\spool\\\\PRINTERS\\\\|:\\\\Windows\\\\System32\\\\spool\\\\SERVERS\\\\)" or xdm.target.registry.data ~= "(?::\\\\Windows\\\\System32\\\\Tasks_Migrated\\\\|:\\\\Windows\\\\System32\\\\Tasks\\\\Microsoft\\\\Windows\\\\SyncCenter\\\\|:\\\\Windows\\\\SysWOW64\\\\com\\\\dmp\\\\|:\\\\Windows\\\\SysWOW64\\\\FxsTmp\\\\|:\\\\Windows\\\\SysWOW64\\\\Tasks\\\\Microsoft\\\\Windows\\\\PLA\\\\System\\\\|:\\\\Windows\\\\SysWOW64\\\\Tasks\\\\Microsoft\\\\Windows\\\\SyncCenter\\\\|:\\\\Windows\\\\Tasks\\\\|:\\\\Windows\\\\Temp\\\\|:\\\\Windows\\\\Tracing\\\\|\\\\AppData\\\\Local\\\\Temp\\\\)" or xdm.target.registry.data ~= "\\\\AppData\\\\Roaming\\\\"))
      group_by: field:xdm.source.host.hostname
