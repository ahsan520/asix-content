  - key: new-timeproviders-registered-with-unco-e88a6ddc
    name: New TimeProviders Registered With Uncommon DLL Name
    description: |-
      Detects processes setting a new DLL in DllName in under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
      Adversaries may abuse time providers to execute DLLs when the system boots.
      The Windows Time service (W32Time) enables time synchronization across and within domains. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e88a6ddc-74f7-463b-9b26-f69fc0d2ce85. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_timeproviders_dllname.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path contains "\\Services\\W32Time\\TimeProviders" and xdm.target.registry.path ~= "\\\\DllName$") and not (xdm.target.registry.data ~= "^(?:%SystemRoot%\\\\System32\\\\vmictimeprovider\\.dll|%systemroot%\\\\system32\\\\w32time\\.dll|C:\\\\Windows\\\\SYSTEM32\\\\w32time\\.DLL)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: office-autorun-keys-modification-baecf8fb
    name: Office Autorun Keys Modification
    description: |-
      Detects modification of autostart extensibility point (ASEP) in registry. Adversaries may modify these keys to execute malicious code when Office files are opened.
      There are various legitimate add-ins that also use these keys and this filter list might not be exhaustive.
      Thus, it is recommended to review and tune filters for your environment to reduce false positives before deploying to production. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate software or add-in installations and administrative configurations; Automatic registry modifications during legitimate software installations. Sigma rule by Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id baecf8fb-edbf-429f-9ade-31fc3f22b970. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_office.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1547.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "(?:\\\\Software\\\\Wow6432Node\\\\Microsoft\\\\Office|\\\\Software\\\\Microsoft\\\\Office)" and xdm.target.registry.path ~= "(?:\\\\Word\\\\Addins|\\\\PowerPoint\\\\Addins|\\\\Outlook\\\\Addins|\\\\Onenote\\\\Addins|\\\\Excel\\\\Addins|\\\\Access\\\\Addins|test\\\\Special\\\\Perf)") and not ((xdm.target.registry.data ~= "^\\(Empty\\)$" or not (xdm.target.registry.data ~= ".") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Microsoft Office\\\\|C:\\\\Program Files \\(x86\\)\\\\Microsoft Office\\\\|C:\\\\PROGRA~2\\\\MICROS~2\\\\Office|C:\\\\Windows\\\\System32\\\\msiexec\\.exe|C:\\\\Windows\\\\SysWOW64\\\\msiexec\\.exe|C:\\\\Windows\\\\System32\\\\regsvr32\\.exe|C:\\\\Windows\\\\SysWOW64\\\\regsvr32\\.exe)" and (xdm.target.registry.path ~= "(?:\\\\Excel\\\\Addins\\\\AdHocReportingExcelClientLib\\.AdHocReportingExcelClientAddIn\\.1\\\\|\\\\Excel\\\\Addins\\\\ExcelPlugInShell\\.PowerMapConnect\\\\|\\\\Excel\\\\Addins\\\\NativeShim\\\\|\\\\Excel\\\\Addins\\\\NativeShim\\.InquireConnector\\.1\\\\|\\\\Excel\\\\Addins\\\\PowerPivotExcelClientAddIn\\.NativeEntry\\.1\\\\|\\\\Outlook\\\\AddIns\\\\AccessAddin\\.DC\\\\|\\\\Outlook\\\\AddIns\\\\ColleagueImport\\.ColleagueImportAddin\\\\)" or xdm.target.registry.path ~= "(?:\\\\Outlook\\\\AddIns\\\\EvernoteCC\\.EvernoteContactConnector\\\\|\\\\Outlook\\\\AddIns\\\\EvernoteOLRD\\.Connect\\\\|\\\\Outlook\\\\Addins\\\\OneNote\\.OutlookAddin|\\\\Outlook\\\\Addins\\\\DriveFSExtensionLib\\.Connect\\\\|\\\\Outlook\\\\Addins\\\\GoogleAppsSync\\.Connect\\\\|\\\\Outlook\\\\Addins\\\\Microsoft\\.VbaAddinForOutlook\\.1\\\\|\\\\Outlook\\\\Addins\\\\OcOffice\\.OcForms\\\\|\\\\Outlook\\\\Addins\\\\OscAddin\\.Connect\\\\)" or xdm.target.registry.path ~= "(?:\\\\Outlook\\\\Addins\\\\OutlookChangeNotifier\\.Connect\\\\|\\\\Outlook\\\\Addins\\\\UCAddin\\.LyncAddin\\.1|\\\\Outlook\\\\Addins\\\\UCAddin\\.UCAddin\\.1|\\\\Outlook\\\\Addins\\\\UmOutlookAddin\\.FormRegionAddin\\\\|AddinTakeNotesService\\\\FriendlyName)")) or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\|C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\ClickToRun\\\\Updates\\\\)" and xdm.source.process.executable.path ~= "\\\\OfficeClickToRun\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\VSTO\\\\|C:\\\\Program Files \\(x86\\)\\\\Microsoft Shared\\\\VSTO\\\\)" and xdm.source.process.executable.path ~= "\\\\VSTOInstaller\\.exe$"))) and not (((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\AVG\\\\Antivirus\\\\RegSvr\\.exe|C:\\\\Program Files\\\\AVG\\\\Antivirus\\\\x86\\\\RegSvr\\.exe)$" and xdm.target.registry.path contains "\\Microsoft\\Office\\Outlook\\Addins\\Antivirus.AsOutExt\\") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Avast Software\\\\Avast\\\\RegSvr\\.exe|C:\\\\Program Files\\\\Avast Software\\\\Avast\\\\x86\\\\RegSvr\\.exe)$" and xdm.target.registry.path contains "\\Microsoft\\Office\\Outlook\\Addins\\Avast.AsOutExt\\"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
