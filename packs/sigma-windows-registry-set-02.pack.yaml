    category: Persistence
    mitre:
      - T1546.012
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths" and xdm.target.registry.path ~= "(?:\\(Default\\)|Path)$" and xdm.target.registry.data ~= "(?:\\\\Users\\\\Public|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Windows\\\\Temp\\\\|\\\\Desktop\\\\|\\\\Downloads\\\\|%temp%|%tmp%|iex|Invoke-|rundll32|regsvr32|mshta|cscript|wscript|\\.bat|\\.hta|\\.dll|\\.ps1)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
