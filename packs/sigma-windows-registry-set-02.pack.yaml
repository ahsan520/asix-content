      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "(?:\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run)" and (xdm.target.registry.data ~= "(?::\\\\Perflogs|:\\\\ProgramData'|:\\\\Windows\\\\Temp|:\\\\Temp|\\\\AppData\\\\Local\\\\Temp|\\\\AppData\\\\Roaming|:\\\\\\$Recycle\\.bin|:\\\\Users\\\\Default|:\\\\Users\\\\public|%temp%|%tmp%|%Public%|%AppData%)" or (xdm.target.registry.data contains ":\\Users\\" and xdm.target.registry.data ~= "(?:\\\\Favorites|\\\\Favourites|\\\\Contacts|\\\\Music|\\\\Pictures|\\\\Documents|\\\\Photos)")) and not ((xdm.target.registry.path contains "\\Microsoft\\Windows\\CurrentVersion\\RunOnce\\" and xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\SoftwareDistribution\\\\Download\\\\" and (xdm.target.registry.data ~= "rundll32\\.exe " and xdm.target.registry.data ~= "C:\\\\WINDOWS\\\\system32\\\\advpack\\.dll,DelNodeRunDLL32") and xdm.target.registry.data ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\|C:\\\\Windows\\\\Temp\\\\)")) and not ((xdm.source.process.executable.path ~= "(?:C:\\\\Program Files\\\\Spotify\\\\Spotify\\.exe|C:\\\\Program Files \\(x86\\)\\\\Spotify\\\\Spotify\\.exe|\\\\AppData\\\\Roaming\\\\Spotify\\\\Spotify\\.exe)$" and xdm.target.registry.path ~= "SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\Spotify$" and xdm.target.registry.data ~= "Spotify\\.exe --autostart --minimized$")))
