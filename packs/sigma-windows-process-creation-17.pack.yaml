      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\ssh\\.exe$" and xdm.target.process.command_line contains ":3389")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-reconnaissance-for-cached-cr-07f8bdc2
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    description: "Detects usage of cmdkey to look for cached credentials on the system Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative tasks. Sigma rule by jmallette, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 07f8bdc2-c9b3-472a-9817-5a670b872f53. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmdkey_recon.yml"
