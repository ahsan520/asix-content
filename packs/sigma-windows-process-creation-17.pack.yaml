    name: Potential Download/Upload Activity Using Type Command
    description: 'Detects usage of the "type" command to download/upload data from WebDAV server Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id aa0b3a82-eacc-4ec3-9150-b5a9a3e3f82f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_type_arbitrary_file_download.yml'
