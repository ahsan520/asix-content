  - key: potential-defense-evasion-via-binary-r-36480ae1
    name: Potential Defense Evasion Via Binary Rename
    description: "Detects the execution of a renamed binary often used by attackers or malware leveraging new Sysmon OriginalFileName datapoint. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Custom applications use renamed binaries adding slight change to binary name. Typically this is easy to spot and add to whitelist. Sigma rule by Matthew Green @mgreen27, Ecco, James Pemberton @4A616D6573, oscd.community, Andreas Hunkeler (@Karneades), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 36480ae1-a1cb-4eaa-a0d6-29801d7e9142. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_binary.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.original_file_name ~= "^(?:Cmd\\.Exe|CONHOST\\.EXE|7z\\.exe|7za\\.exe|7zr\\.exe|WinRAR\\.exe|wevtutil\\.exe|net\\.exe|net1\\.exe|netsh\\.exe|InstallUtil\\.exe)$" and not (xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\conhost\\.exe|\\\\7z\\.exe|\\\\7za\\.exe|\\\\7zr\\.exe|\\\\WinRAR\\.exe|\\\\wevtutil\\.exe|\\\\net\\.exe|\\\\net1\\.exe|\\\\netsh\\.exe|\\\\InstallUtil\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-defense-evasion-via-rename-o-0ba1da6d
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    description: "Detects the execution of a renamed binary often used by attackers or malware leveraging new Sysmon OriginalFileName datapoint. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Custom applications use renamed binaries adding slight change to binary name. Typically this is easy to spot and add to whitelist; PsExec installed via Windows Store doesn't contain original filename field (False negative). Sigma rule by Matthew Green - @mgreen27, Florian Roth (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0ba1da6d-b6ce-4366-828c-18826c9de23e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_binary_highly_relevant.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.description ~= "^Execute processes remotely$" or xdm.target.process.product ~= "^Sysinternals PsExec$" or xdm.target.process.description ~= "^(?:Windows PowerShell|pwsh)" or xdm.target.process.original_file_name ~= "^(?:certutil\\.exe|cmstp\\.exe|cscript\\.exe|IE4UINIT\\.EXE|finger\\.exe|mshta\\.exe|msiexec\\.exe|msxsl\\.exe|powershell_ise\\.exe|powershell\\.exe|psexec\\.c|psexec\\.exe|psexesvc\\.exe|pwsh\\.dll|reg\\.exe|regsvr32\\.exe|rundll32\\.exe|WerMgr|wmic\\.exe|wscript\\.exe)$") and not (xdm.target.process.executable.path ~= "(?:\\\\certutil\\.exe|\\\\cmstp\\.exe|\\\\cscript\\.exe|\\\\ie4uinit\\.exe|\\\\finger\\.exe|\\\\mshta\\.exe|\\\\msiexec\\.exe|\\\\msxsl\\.exe|\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\psexec\\.exe|\\\\psexec64\\.exe|\\\\psexec64a\\.exe|\\\\PSEXESVC\\.exe|\\\\pwsh\\.exe|\\\\reg\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wermgr\\.exe|\\\\wmic\\.exe|\\\\wscript\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-defense-evasion-via-right-to-ad691d92
    name: Potential Defense Evasion Via Right-to-Left Override
    description: |-
      Detects the presence of the "u202+E" character, which causes a terminal, browser, or operating system to render text in a right-to-left sequence.
      This character is used as an obfuscation and masquerading techniques by adversaries to trick users into opening malicious files. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Commandlines that contains scriptures such as arabic or hebrew might make use of this character. Sigma rule by Micah Babinski, @micahbabinski, Swachchhanda Shrawan Poudel (Nextron Systems), Luc Génaux, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ad691d92-15f2-4181-9aa4-723c74f9ddc3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_right_to_left_override.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:\\\\u202e|\\[U\\+202E\\]|‮)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-dll-injection-or-execution-u-148431ce
    name: Potential DLL Injection Or Execution Using Tracker.exe
    description: 'Detects potential DLL injection and execution using "Tracker.exe" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Avneet Singh @v3t0_, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 148431ce-4b70-403d-8525-fcc2993f29ea. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_tracker.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1055.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\tracker\\.exe$" or xdm.target.process.description ~= "^Tracker$") and xdm.target.process.command_line ~= "(?: /d | /c )") and not ((xdm.target.process.command_line contains " /ERRORREPORT:PROMPT " or xdm.source.process.executable.path ~= "(?:\\\\Msbuild\\\\Current\\\\Bin\\\\MSBuild\\.exe|\\\\Msbuild\\\\Current\\\\Bin\\\\amd64\\\\MSBuild\\.exe)$")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
