  - key: potential-powershell-execution-policy-cf2e938e
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    description: "Detects changes to the PowerShell execution policy registry key in order to bypass signing requirements for script execution from the CommandLine Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cf2e938e-9a3e-4fe8-a347-411642b28a9f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_set_unsecure_powershell_policy.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:\\\\ShellIds\\\\Microsoft\\.PowerShell\\\\ExecutionPolicy|\\\\Policies\\\\Microsoft\\\\Windows\\\\PowerShell\\\\ExecutionPolicy)" and xdm.target.process.command_line ~= "(?:Bypass|RemoteSigned|Unrestricted)")
      group_by: field:xdm.source.host.hostname
