# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-17
name: "Sigma: Windows process creation (17 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: potential-arbitrary-command-execution-258fc8ce
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    description: 'Detects processes leveraging the "ms-msdt" handler or the "msdt.exe" binary to execute arbitrary commands as seen in the follina (CVE-2022-30190) vulnerability Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 258fc8ce-8352-443a-9120-8a11e4857fa5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_msdt_arbitrary_command_execution.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\msdt\\.exe$" or xdm.target.process.original_file_name ~= "^msdt\\.exe$") and (xdm.target.process.command_line contains "IT_BrowseForFile=" or (xdm.target.process.command_line contains " PCWDiagnostic" and xdm.target.process.command_line ~= " [-/–—―]af ")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-arbitrary-dll-load-using-win-f7375e28
    name: Potential Arbitrary DLL Load Using Winword
    description: "Detects potential DLL sideloading using the Microsoft Office winword process via the '/l' flag. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Victor Sergeev, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f7375e28-5c14-432f-b8d1-1db26c832df3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_office_winword_dll_load.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\WINWORD\\.exe$" or xdm.target.process.original_file_name ~= "^WinWord\\.exe$") and (xdm.target.process.command_line ~= "/l " and xdm.target.process.command_line ~= "\\.dll"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-arbitrary-file-download-usin-4ae3e30b
    name: Potential Arbitrary File Download Using Office Application
    description: "Detects potential arbitrary file download using a Microsoft Office application Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Beyu Denis, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4ae3e30b-b03f-43aa-87e3-b622f4048eed. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_office_arbitrary_cli_download.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\EXCEL\\.EXE|\\\\MSOXMLED\\.EXE|\\\\POWERPNT\\.EXE|\\\\WINWORD\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:Excel\\.exe|msoxmled\\.exe|POWERPNT\\.EXE|WinWord\\.exe)$") and xdm.target.process.command_line ~= "(?:http://|https://)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-binary-proxy-execution-via-v-ac1c92b4
    name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
    description: 'Detects execution of "VSDiagnostics.exe" with the "start" command in order to launch and proxy arbitrary binaries. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate usage for tracing and diagnostics purposes. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ac1c92b4-ac81-405a-9978-4604d78cc47e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_vsdiagnostics_execution_proxy.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\VSDiagnostics\\.exe$" or xdm.target.process.original_file_name ~= "^VSDiagnostics\\.exe$") and xdm.target.process.command_line contains "start" and xdm.target.process.command_line ~= "(?: /launch:| -launch:)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-browser-data-stealing-47147b5b
    name: Potential Browser Data Stealing
    description: |-
      Adversaries may acquire credentials from web browsers by reading files specific to the target browser.
      Web browsers commonly save credentials such as website usernames and passwords so that they do not need to be entered manually in the future.
      Web browsers typically store the credentials in an encrypted format within a credential store. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_copy_browser_data.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1555.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "(?:copy-item|copy |cpi | cp |move |move-item| mi | mv )" or xdm.target.process.executable.path ~= "(?:\\\\esentutl\\.exe|\\\\xcopy\\.exe|\\\\robocopy\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:esentutl\\.exe|XCOPY\\.EXE|robocopy\\.exe)$") and (xdm.target.process.command_line ~= "(?:\\\\Amigo\\\\User Data|\\\\BraveSoftware\\\\Brave-Browser\\\\User Data|\\\\CentBrowser\\\\User Data|\\\\Chromium\\\\User Data|\\\\CocCoc\\\\Browser\\\\User Data|\\\\Comodo\\\\Dragon\\\\User Data|\\\\Elements Browser\\\\User Data|\\\\Epic Privacy Browser\\\\User Data|\\\\Google\\\\Chrome Beta\\\\User Data|\\\\Google\\\\Chrome SxS\\\\User Data|\\\\Google\\\\Chrome\\\\User Data\\\\|\\\\Kometa\\\\User Data|\\\\Maxthon5\\\\Users)" or xdm.target.process.command_line ~= "(?:\\\\Microsoft\\\\Edge\\\\User Data|\\\\Mozilla\\\\Firefox\\\\Profiles|\\\\Nichrome\\\\User Data|\\\\Opera Software\\\\Opera GX Stable\\\\|\\\\Opera Software\\\\Opera Neon\\\\User Data|\\\\Opera Software\\\\Opera Stable\\\\|\\\\Orbitum\\\\User Data|\\\\QIP Surf\\\\User Data|\\\\Sputnik\\\\User Data|\\\\Torch\\\\User Data|\\\\uCozMedia\\\\Uran\\\\User Data|\\\\Vivaldi\\\\User Data)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-com-objects-download-cradles-02b64f1b
    name: Potential COM Objects Download Cradles Usage - Process Creation
    description: "Detects usage of COM objects that can be abused to download files in PowerShell by CLSID Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use of the library. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_download_com_cradles.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "[Type]::GetTypeFromCLSID(" and xdm.target.process.command_line ~= "(?:0002DF01-0000-0000-C000-000000000046|F6D90F16-9C73-11D3-B32E-00C04F990BB4|F5078F35-C551-11D3-89B9-0000F81FE221|88d96a0a-f192-11d4-a65f-0040963251e5|AFBA6B42-5692-48EA-8141-DC517DCF0EF1|AFB40FFD-B609-40A3-9828-F88BBE11E4E3|88d96a0b-f192-11d4-a65f-0040963251e5|2087c2f4-2cef-4953-a8ab-66779b670495|000209FF-0000-0000-C000-000000000046|00024500-0000-0000-C000-000000000046)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-command-line-path-traversal-1327381e
    name: Potential Command Line Path Traversal Evasion Attempt
    description: "Detects potential evasion or obfuscation attempts using bogus path traversal via the commandline Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Google Drive; Citrix. Sigma rule by Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1327381e-6ab0-4f38-b583-4c1b8346a56b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_commandline_path_traversal_evasion.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path contains "\\Windows\\" and xdm.target.process.command_line ~= "(?:\\\\\\.\\.\\\\Windows\\\\|\\\\\\.\\.\\\\System32\\\\|\\\\\\.\\.\\\\\\.\\.\\\\)") or xdm.target.process.command_line contains ".exe\\..\\") and not ((xdm.target.process.command_line contains "\\Google\\Drive\\googledrivesync.exe\\..\\" or xdm.target.process.command_line contains "\\Citrix\\Virtual Smart Card\\Citrix.Authentication.VirtualSmartcard.Launcher.exe\\..\\")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-commandline-obfuscation-usin-f0cdd048
    name: Potential Commandline Obfuscation Using Escape Characters
    description: "Detects potential commandline obfuscation using known escape characters Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by juju4, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_cli_obfuscation_escape_char.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1140
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:h\\^t\\^t\\^p|h\"t\"t\"p)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-commandline-obfuscation-usin-584bca0f
    name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
    description: |-
      Detects potential commandline obfuscation using unicode characters.
      Adversaries may attempt to make an executable or file difficult to discover or analyze by encrypting, encoding, or otherwise obfuscating its contents on the system or in transit. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, Florian Roth (Nextron Systems), Josh Nickels, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 584bca0f-3608-4402-80fd-4075ff6072e3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_cli_obfuscation_unicode_img.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1027
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\powershell\\.exe|\\\\powershell_ise\\.exe|\\\\pwsh\\.exe|\\\\wscript\\.exe)$" and xdm.target.process.original_file_name ~= "^(?:Cmd\\.EXE|cscript\\.exe|PowerShell\\.EXE|PowerShell_ISE\\.EXE|pwsh\\.dll|wscript\\.exe)$") and xdm.target.process.command_line ~= "(?:ˣ|˪|ˢ|∕|⁄|―|—| |¯|®|¶|⠀)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-credential-dumping-attempt-u-baef1ec6
    name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
    description: "Detects when an attacker tries to add a new network provider in order to dump clear text credentials, similar to how the NPPSpy tool does it Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Other legitimate network providers used and not filtred in this rule. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id baef1ec6-2ca9-47a3-97cc-4cf2bda10b77. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_new_network_provider.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "\\\\System\\\\CurrentControlSet\\\\Services\\\\" and xdm.target.process.command_line ~= "\\\\NetworkProvider")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-credential-dumping-via-lsass-c8da0dfd
    name: Potential Credential Dumping Via LSASS Process Clone
    description: "Detects a suspicious LSASS process process clone that could be a sign of credential dumping activity Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), Samir Bousseaden, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c8da0dfd-4ed0-4b68-962d-13c9c884384e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lsass_process_clone.yml"
    kind: bioc
