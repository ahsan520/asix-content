    mitre:
      - T1003.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\cmdkey\\.exe$" or xdm.target.process.original_file_name ~= "^cmdkey\\.exe$") and xdm.target.process.command_line ~= " [-/–—―]l")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-register-app-vbs-lolscript-a-28c8f68b
    name: Potential Register_App.Vbs LOLScript Abuse
    description: 'Detects potential abuse of the "register_app.vbs" script that is part of the Windows SDK. The script offers the capability to register new VSS/VDS Provider as a COM+ application. Attackers can use this to install malicious DLLs for persistence and execution. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Other VB scripts that leverage the same starting command line flags. Sigma rule by Austin Songer @austinsonger, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 28c8f68b-098d-45af-8d43-8089f3e35403. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolscript_register_app.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\cscript\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:cscript\\.exe|wscript\\.exe)$") and xdm.target.process.command_line contains ".vbs -register ")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-regsvr32-commandline-flag-an-b236190c
    name: Potential Regsvr32 Commandline Flag Anomaly
    description: 'Detects a potential command line flag anomaly related to "regsvr32" in which the "/i" flag is used without the "/n" which should be uncommon. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Administrator typo might cause some false positives. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b236190c-1c61-41e9-84b3-3fe03f6d76b0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_regsvr32_flags_anomaly.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\regsvr32\\.exe$" and xdm.target.process.command_line ~= " [-/–—―]i:") and not (xdm.target.process.command_line ~= " [-/–—―]n "))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-remote-desktop-tunneling-8a3038e8
    name: Potential Remote Desktop Tunneling
    description: "Detects potential use of an SSH utility to establish RDP over a reverse SSH Tunnel. This can be used by attackers to enable routing of network packets that would otherwise not reach their intended destination. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Tim Rauch, Elastic (idea), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8a3038e8-9c9d-46f8-b184-66234a160f6f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_remote_desktop_tunneling.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1021
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line contains ":3389" and xdm.target.process.command_line ~= "(?: -L | -P | -R | -pw | -ssh )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-rundll32-execution-with-dll-9248c7e1
    name: Potential Rundll32 Execution With DLL Stored In ADS
    description: "Detects execution of rundll32 where the DLL being called is stored in an Alternate Data Stream (ADS). Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Harjot Singh, '@cyb3rjy0t', from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9248c7e1-2bf3-4661-a22c-600a8040b446. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_ads_stored_dll_execution.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1564.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or xdm.target.process.original_file_name ~= "^RUNDLL32\\.EXE$") and xdm.target.process.command_line ~= "[Rr][Uu][Nn][Dd][Ll][Ll]32(?:\\.[Ee][Xx][Ee])? \\S+?\\w:\\S+?:")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
