    mitre:
      - T1003
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\Windows\\\\System32\\\\lsass\\.exe$" and xdm.target.process.executable.path ~= "\\\\Windows\\\\System32\\\\lsass\\.exe$")
      group_by: field:xdm.source.host.hostname
