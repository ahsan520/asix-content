  - key: potential-powershell-execution-via-dll-6812a10b
    name: Potential PowerShell Execution Via DLL
    description: |-
      Detects potential PowerShell execution from a DLL instead of the usual PowerShell process as seen used in PowerShdll.
      This detection assumes that PowerShell commands are passed via the CommandLine. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Markus Neis, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6812a10b-60ea-420c-832f-dfcc33b646ba. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_powershell_execution_via_dll.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\InstallUtil\\.exe|\\\\RegAsm\\.exe|\\\\RegSvcs\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:InstallUtil\\.exe|RegAsm\\.exe|RegSvcs\\.exe|REGSVR32\\.EXE|RUNDLL32\\.EXE)$") and xdm.target.process.command_line ~= "(?:Default\\.GetString|DownloadString|FromBase64String|ICM |IEX |Invoke-Command|Invoke-Expression)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-privilege-escalation-to-loca-207b0396
    name: Potential Privilege Escalation To LOCAL SYSTEM
    description: "Detects unknown program using commandline flags usually used by tools such as PsExec and PAExec to start programs with SYSTEM Privileges Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Weird admins that rename their tools; Software companies that bundle PsExec/PAExec with their software and rename it, so that it is less embarrassing. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 207b0396-3689-42d9-8399-4222658efc99. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_susp_psexec_paexec_flags.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1587.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?: [-/–—―]s cmd| [-/–—―]s [-/–—―]i cmd| [-/–—―]i [-/–—―]s cmd| [-/–—―]s pwsh| [-/–—―]s [-/–—―]i pwsh| [-/–—―]i [-/–—―]s pwsh| [-/–—―]s powershell| [-/–—―]s [-/–—―]i powershell| [-/–—―]i [-/–—―]s powershell)" and not (xdm.target.process.command_line ~= "(?:paexec|PsExec|accepteula)"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-process-execution-proxy-via-a0459f02
    name: Potential Process Execution Proxy Via CL_Invocation.ps1
    description: 'Detects calls to "SyncInvoke" that is part of the "CL_Invocation.ps1" script to proxy execution using "System.Diagnostics.Process" Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a0459f02-ac51-4c09-b511-b8c9203fc429. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cl_invocation.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line contains "SyncInvoke "
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-process-injection-via-msra-e-744a188b
    name: Potential Process Injection Via Msra.EXE
    description: "Detects potential process injection via Microsoft Remote Asssistance (Msra.exe) by looking at suspicious child processes spawned from the aforementioned process. It has been a target used by many threat actors and used for discovery and persistence tactics Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use of Msra.exe. Sigma rule by Alexander McDonald, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 744a188b-0415-4792-896f-11ddb0588dbc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_msra_process_injection.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\msra\\.exe$" and xdm.source.process.command_line ~= "msra\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\arp\\.exe|\\\\cmd\\.exe|\\\\net\\.exe|\\\\netstat\\.exe|\\\\nslookup\\.exe|\\\\route\\.exe|\\\\schtasks\\.exe|\\\\whoami\\.exe)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-provisioning-registry-key-ab-2a4b3e61
    name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution
    description: 'Detects potential abuse of the provisioning registry key for indirect command execution through "Provlaunch.exe". Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2a4b3e61-9d22-4e4a-b60f-6e8f0cde6f25. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_provlaunch_provisioning_command.yml'
    kind: bioc
