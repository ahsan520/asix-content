      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "type " and xdm.target.process.command_line ~= " > \\\\\\\\\\\\\\\\") or (xdm.target.process.command_line ~= "type \\\\\\\\\\\\\\\\" and xdm.target.process.command_line ~= " > "))
      group_by: field:xdm.source.host.hostname
      threshold: 1
