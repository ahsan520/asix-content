      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line contains "SOFTWARE\\Microsoft\\Provisioning\\Commands\\"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-provlaunch-exe-binary-proxy-7f5d1c9a
    name: Potential Provlaunch.EXE Binary Proxy Execution Abuse
    description: 'Detects child processes of "provlaunch.exe" which might indicate potential abuse to proxy execution. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7f5d1c9a-3e83-48df-95a7-2b98aae6c13c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_provlaunch_potential_abuse.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\provlaunch\\.exe$" and not ((xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\notepad\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.executable.path ~= "(?::\\\\PerfLogs\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Public\\\\|\\\\AppData\\\\Temp\\\\|\\\\Windows\\\\System32\\\\Tasks\\\\|\\\\Windows\\\\Tasks\\\\|\\\\Windows\\\\Temp\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-psexec-remote-execution-ea011323
    name: Potential PsExec Remote Execution
    description: "Detects potential psexec command that initiate execution on a remote systems via common commandline flags used by the utility Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ea011323-7045-460b-b2d7-0f7442ea6b38. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_psexec_remote_execution.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1587.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "accepteula" and xdm.target.process.command_line ~= " -u " and xdm.target.process.command_line ~= " -p " and xdm.target.process.command_line ~= " \\\\\\\\\\\\\\\\") and not (xdm.target.process.command_line ~= "(?:\\\\\\\\\\\\\\\\localhost|\\\\\\\\\\\\\\\\127\\.)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-rdp-tunneling-via-plink-f38ce0b9
    name: Potential RDP Tunneling Via Plink
    description: "Execution of plink to perform data exfiltration and tunneling Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f38ce0b9-5e97-4b47-a211-7dc8d8b871da. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_plink_susp_tunneling.yml"
    kind: bioc
