    name: Potential RDP Tunneling Via SSH
    description: "Execution of ssh.exe to perform data exfiltration and tunneling through RDP Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f7d7ebd5-a016-46e2-9c54-f9932f2d386d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ssh_rdp_tunneling.yml"
    kind: bioc
