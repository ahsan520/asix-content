    category: process_creation
    mitre:
      - T1572
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\plink\\.exe$" and xdm.target.process.command_line contains ":127.0.0.1:3389") or ((xdm.target.process.executable.path ~= "\\\\plink\\.exe$" and xdm.target.process.command_line contains ":3389") and xdm.target.process.command_line ~= "(?: -P 443| -P 22)"))'
      group_by: field:xdm.source.host.hostname
