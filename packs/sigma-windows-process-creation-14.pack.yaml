  - key: gpscript-execution-1e59c230
    name: Gpscript Execution
    description: "Detects the execution of the LOLBIN gpscript, which executes logon or startup scripts configured in Group Policy Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate uses of logon scripts distributed via group policy. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1e59c230-6670-45bf-83b0-98903780607e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_gpscript.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\gpscript\\.exe$" or xdm.target.process.original_file_name ~= "^GPSCRIPT\\.EXE$") and xdm.target.process.command_line ~= "(?: /logon| /startup)") and not (xdm.source.process.command_line ~= "^C:\\\\windows\\\\system32\\\\svchost\\.exe -k netsvcs -p -s gpsvc$"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: greedy-file-deletion-using-del-204b17ae
    name: Greedy File Deletion Using Del
    description: 'Detects execution of the "del" builtin command to remove files using greedy/wildcard expression. This is often used by malware to delete content of folders that perhaps contains the initial malware infection or to delete evidence. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113 , X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 204b17ae-4007-471b-917b-b917b315c5db. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_del_greedy_deletion.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1070.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" or xdm.target.process.original_file_name ~= "^Cmd\\.Exe$") and xdm.target.process.command_line ~= "(?:del |erase )" and xdm.target.process.command_line ~= "(?:\\\\\\\\.*\\.au3|\\\\\\\\.*\\.dll|\\\\\\\\.*\\.exe|\\\\\\\\.*\\.js)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: gzip-archive-decode-via-powershell-98767d61
    name: Gzip Archive Decode Via PowerShell
    description: 'Detects attempts of decoding encoded Gzip archives via PowerShell. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate administrative scripts may use this functionality. Use "ParentImage" in combination with the script names and allowed users and applications to filter legitimate executions. Sigma rule by Hieu Tran, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 98767d61-b2e8-4d71-b661-e36783ee24c1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_decode_gzip.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1132.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "GZipStream" and xdm.target.process.command_line ~= "::Decompress")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-coercedpotato-execution-e8d34729
    name: HackTool - CoercedPotato Execution
    description: "Detects the use of CoercedPotato, a tool for privilege escalation Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e8d34729-86a4-4140-adfd-0a29c2106307. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_coercedpotato.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\CoercedPotato\\.exe$" or xdm.target.process.command_line contains " --exploitId " or xdm.target.process.hashes ~= "(?:IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6|IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9|IMPHASH=14C81850A079A87E83D50CA41C709A15)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-createminidump-execution-36d88494
    name: HackTool - CreateMiniDump Execution
    description: "Detects the use of CreateMiniDump hack tool used to dump the LSASS process memory for credential extraction on the attacker's machine Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 36d88494-1d43-4dc0-b3fa-35c8fea0ca9d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_createminidump.yml"
    kind: bioc
