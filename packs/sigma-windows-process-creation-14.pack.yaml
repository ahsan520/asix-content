  - key: file-deletion-via-del-379fa130
    name: File Deletion Via Del
    description: |-
      Detects execution of the builtin "del"/"erase" commands in order to delete files.
      Adversaries may delete files left behind by the actions of their intrusion activity.
      Malware, tools, or other non-native files dropped or created on a system by an adversary may leave traces to indicate to what was done within a network and how.
      Removal of these files can occur during an intrusion, or as part of a post-intrusion process to minimize the adversary's footprint. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: False positives levels will differ Depending on the environment. You can use a combination of ParentImage and other keywords from the CommandLine field to filter legitimate activity. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 379fa130-190e-4c3f-b7bc-6c8e834485f3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_del_execution.yml
    kind: bioc
    severity: low
    category: process_creation
    mitre:
      - T1070.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" or xdm.target.process.original_file_name ~= "^Cmd\\.Exe$") and xdm.target.process.command_line ~= "(?:del |erase )" and xdm.target.process.command_line ~= "(?: [-/–—―]f| [-/–—―]s| [-/–—―]q)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
