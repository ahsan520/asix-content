      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\CreateMiniDump\\.exe$" or xdm.target.process.hashes contains "IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f")
      group_by: field:xdm.source.host.hostname
