  - key: hacktool-defendnot-execution-0aaa9689
    name: HackTool - Defendnot Execution
    description: |-
      Detects the execution of the hacktool Defendnot. Defendnot is a hacktool that abuses Microsoft undocumented WSC (Windows Security Center) API
      to disable Windows Defender by registering itself as a fake antivirus product. Threat actors often use these kind of tools to bypass security measures. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0aaa9689-9f38-491d-bd4d-a9af6eb43138. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_defendnot_execution.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path contains "defendnot" or xdm.target.process.command_line ~= "(?:defendnot|https://dnot\\.sh/)" or xdm.target.process.hashes ~= "(?:IMPHASH=1FAAED26690A9455A795E2215661726F|IMPHASH=304786466DE25780347A9DCFAF381EF7|IMPHASH=55B10396EA722770E51BC288E62179DB|IMPHASH=59D65F5EFACBDB1AA2A6CF745B07C058|IMPHASH=6CEDEC3562FEF2DC2F959A1D0BF54DB8|IMPHASH=75002197E0D24AAF0B8C6A1BF68513D6|IMPHASH=7EC4023C85149450AB388F0837192FE0|IMPHASH=CA4A3E08E9410A6AEF018424C64C2641)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-dinjector-powershell-cradle-e-d78b5d61
    name: HackTool - DInjector PowerShell Cradle Execution
    description: "Detects the use of the Dinject PowerShell cradle based on the specific flags Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d78b5d61-187d-44b6-bf02-93486a80de5a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_dinjector.yml"
    kind: bioc
