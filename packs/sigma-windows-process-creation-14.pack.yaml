# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-14
name: "Sigma: Windows process creation (14 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: dllhost-exe-execution-anomaly-e7888eb1
    name: Dllhost.EXE Execution Anomaly
    description: 'Detects a "dllhost" process spawning with no commandline arguments which is very rare to happen and could indicate process injection activity or malware mimicking similar system processes. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e7888eb1-13b0-4616-bd99-4bc0c2b054b9. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dllhost_no_cli_execution.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\dllhost\\.exe$" and xdm.target.process.command_line ~= "^(?:dllhost\\.exe|dllhost)$") and not (not (xdm.target.process.command_line ~= ".")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dllunregisterserver-function-call-via-84f52741
    name: DllUnregisterServer Function Call Via Msiexec.EXE
    description: "Detects MsiExec loading a DLL and calling its DllUnregisterServer function Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 84f52741-8834-4a8c-a413-2eb2269aa6c8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_msiexec_dll.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\msiexec\\.exe$" or xdm.target.process.original_file_name ~= "^msiexec\\.exe$") and (xdm.target.process.command_line ~= " [-/–—―]z " and xdm.target.process.command_line contains ".dll")) and not (xdm.target.process.command_line ~= "\\\\MsiExec\\.exe\" /Z \"C:\\\\Windows\\\\CCM\\\\MsiHandler\\.dll\"$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: driver-dll-installation-via-odbcconf-e-3f5491e2
    name: Driver/DLL Installation Via Odbcconf.EXE
    description: 'Detects execution of "odbcconf" with "INSTALLDRIVER" which installs a new ODBC driver. Attackers abuse this to install and run malicious DLLs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate driver DLLs being registered via "odbcconf" will generate false positives. Investigate the path of the DLL and its contents to determine if the action is authorized.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3f5491e2-8db8-496b-9e95-1029fce852d4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_odbcconf_driver_install.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\odbcconf\\.exe$" or xdm.target.process.original_file_name ~= "^odbcconf\\.exe$") and (xdm.target.process.command_line ~= "INSTALLDRIVER " and xdm.target.process.command_line ~= "\\.dll"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dumping-of-sensitive-hives-via-reg-exe-fd877b94
    name: Dumping of Sensitive Hives Via Reg.EXE
    description: 'Detects the usage of "reg.exe" in order to dump sensitive registry hives. This includes SAM, SYSTEM and SECURITY hives. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Dumping hives for legitimate purpouse i.e. backup or forensic investigation. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Teymur Kheirkhabarov, Endgame, JHasenbusch, Daniil Yugoslavskiy, oscd.community, frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fd877b94-9bb5-4191-bb25-d79cbd93c167. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003.002
      - T1003.004
      - T1003.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" or xdm.target.process.original_file_name ~= "^reg\\.exe$") and xdm.target.process.command_line ~= "(?: save | export | ˢave | eˣport )" and xdm.target.process.command_line ~= "(hk[l˪]m|hkey_[l˪]oca[l˪]_machine)\"?\\\\[sˢ](y[sˢ]tem|am|ecurity)(\\\\|\"|\\s|$)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dumping-process-via-sqldumper-exe-23ceaf5c
    name: Dumping Process via Sqldumper.exe
    description: "Detects process dump via legitimate sqldumper.exe binary Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate MSSQL Server actions. Sigma rule by Kirill Kiryanov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 23ceaf5c-b6f1-4a32-8559-f2ff734be516. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_susp_sqldumper_activity.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\sqldumper\\.exe$" and xdm.target.process.command_line ~= "(?:0x0110|0x01100:40)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dumpminitool-execution-dee0a7a3
    name: DumpMinitool Execution
    description: 'Detects the use of "DumpMinitool.exe" a tool that allows the dump of process memory via the use of the "MiniDumpWriteDump" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dee0a7a3-f200-4112-a99b-952196d81e42. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dumpminitool_execution.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\DumpMinitool\\.exe|\\\\DumpMinitool\\.x86\\.exe|\\\\DumpMinitool\\.arm64\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:DumpMinitool\\.exe|DumpMinitool\\.x86\\.exe|DumpMinitool\\.arm64\\.exe)$") and xdm.target.process.command_line ~= "(?: Full| Mini| WithHeap)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dumpstack-log-defender-evasion-4f647cfa
    name: DumpStack.log Defender Evasion
    description: "Detects the use of the filename DumpStack.log to evade Microsoft Defender Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4f647cfa-b598-4e12-ad69-c68dd16caef8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_dumpstack_log_evasion.yml"
    kind: bioc
    severity: critical
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\DumpStack\\.log$" or xdm.target.process.command_line contains " -o DumpStack.log")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dynamic-net-compilation-via-csc-exe-dcaa3f04
    name: Dynamic .NET Compilation Via Csc.EXE
    description: 'Detects execution of "csc.exe" to compile .NET code. Attackers often leverage this to compile code on the fly and use it in other stages. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate software from program files - https://twitter.com/gN3mes1s/status/1206874118282448897; Legitimate Microsoft software - https://twitter.com/gabriele_pippi/status/1206907900268072962; Ansible. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Florian Roth (Nextron Systems), X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dcaa3f04-70c3-427a-80b4-b870d73c94c4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_csc_susp_dynamic_compilation.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1027.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\csc\\.exe$" and (xdm.target.process.command_line ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\Public\\\\|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Temporary Internet|\\\\Windows\\\\Temp\\\\)" or ((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Favorites\\\\") or (xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Favourites\\\\") or (xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Contacts\\\\") or (xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Pictures\\\\")) or xdm.target.process.command_line ~= "(?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\\\[Aa]pp[Dd]ata\\\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\\\[^\\\\]{1,256}$") and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\|C:\\\\Program Files\\\\)" or xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\sdiagnhost\\.exe$" or xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\inetsrv\\\\w3wp\\.exe$")) and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\ProgramData\\\\chocolatey\\\\choco\\.exe|C:\\\\ProgramData\\\\chocolatey\\\\tools\\\\shimgen\\.exe)$" or xdm.source.process.command_line contains "\\ProgramData\\Microsoft\\Windows Defender Advanced Threat Protection" or (xdm.source.process.command_line ~= "(?:JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw|cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA)" or xdm.source.process.command_line ~= "nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: enumeration-for-3rd-party-creds-from-c-87a476dc
    name: Enumeration for 3rd Party Creds From CLI
    description: "Detects processes that query known 3rd party registry keys that holds credentials via commandline Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 87a476dc-0079-4583-a985-dee7a20a03de. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_enumeration_for_credentials_cli.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1552.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "(?:\\\\Software\\\\Aerofox\\\\Foxmail\\\\V3\\.1|\\\\Software\\\\Aerofox\\\\FoxmailPreview|\\\\Software\\\\DownloadManager\\\\Passwords|\\\\Software\\\\FTPWare\\\\COREFTP\\\\Sites|\\\\Software\\\\IncrediMail\\\\Identities|\\\\Software\\\\Martin Prikryl\\\\WinSCP 2\\\\Sessions|\\\\Software\\\\Mobatek\\\\MobaXterm\\\\|\\\\Software\\\\OpenSSH\\\\Agent\\\\Keys|\\\\Software\\\\OpenVPN-GUI\\\\configs|\\\\Software\\\\ORL\\\\WinVNC3\\\\Password)" or xdm.target.process.command_line ~= "(?:\\\\Software\\\\Qualcomm\\\\Eudora\\\\CommandLine|\\\\Software\\\\RealVNC\\\\WinVNC4|\\\\Software\\\\RimArts\\\\B2\\\\Settings|\\\\Software\\\\SimonTatham\\\\PuTTY\\\\Sessions|\\\\Software\\\\SimonTatham\\\\PuTTY\\\\SshHostKeys\\\\|\\\\Software\\\\Sota\\\\FFFTP|\\\\Software\\\\TightVNC\\\\Server|\\\\Software\\\\WOW6432Node\\\\Radmin\\\\v3\\.0\\\\Server\\\\Parameters\\\\Radmin)") and not ((xdm.target.process.executable.path ~= "reg\\.exe$" and xdm.target.process.command_line ~= "(?:export|save)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: enumeration-for-credentials-in-registr-e0b0c2ab
    name: Enumeration for Credentials in Registry
    description: |-
      Adversaries may search the Registry on compromised systems for insecurely stored credentials.
      The Windows Registry stores configuration information that can be used by the system or other programs.
      Adversaries may query the Registry looking for credentials and passwords that have been stored for use by other programs or services Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_enumeration_for_credentials_in_registry.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1552.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" and (xdm.target.process.command_line ~= " query " and xdm.target.process.command_line ~= "/t " and xdm.target.process.command_line ~= "REG_SZ" and xdm.target.process.command_line ~= "/s")) and ((xdm.target.process.command_line ~= "/f " and xdm.target.process.command_line ~= "HKLM") or (xdm.target.process.command_line ~= "/f " and xdm.target.process.command_line ~= "HKCU") or xdm.target.process.command_line contains "HKCU\\Software\\SimonTatham\\PuTTY\\Sessions"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: esentutl-gather-credentials-7df1713a
    name: Esentutl Gather Credentials
    description: "Conti recommendation to its affiliates to use esentutl to access NTDS dumped file. Trickbot also uses this utilities to get MSEdge info via its module pwgrab. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: To be determined. Sigma rule by sam0x90, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7df1713a-1a5b-4a4b-a071-dc83b144a101. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_esentutl_params.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1003
      - T1003.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "esentutl" and xdm.target.process.command_line ~= " /p")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: etw-logging-tamper-in-net-processes-vi-41421f44
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    description: |-
      Detects changes to environment variables related to ETW logging via the CommandLine.
      This could indicate potential adversaries stopping ETW providers recording loaded .NET assemblies. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 41421f44-58f9-455d-838a-c398859841d4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_etw_modification_cmdline.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:COMPlus_ETWEnabled|COMPlus_ETWFlags)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: etw-trace-evasion-activity-a238b5d0
    name: ETW Trace Evasion Activity
    description: |-
      Detects command line activity that attempts to tamper with Event Tracing for Windows (ETW) by clearing or disabling
      trace logs or providers. Adversaries may target ETW to blind security tooling and evade detection by removing
      visibility into process activity, network connections, and other telemetry sources.
      Techniques include clearing logs via wevtutil, disabling trace sessions via logman, and removing or modifying
      ETW providers using PowerShell cmdlets such as Remove-EtwTraceProvider and Set-EtwTraceProvider. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by @neu5ron, Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a238b5d0-ce2d-4414-a676-7a531b3d13d6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_etw_trace_evasion.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1070
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
