  - key: dns-hybridconnectionmanager-service-bu-7bd3902d
    name: DNS HybridConnectionManager Service Bus
    description: "Detects Azure Hybrid Connection Manager services querying the Azure service bus service Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Legitimate use of Azure Hybrid Connection Manager and the Azure Service Bus service. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7bd3902d-8b8b-4dd4-838a-c6862d40150d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_hybridconnectionmgr_servicebus.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1554
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn contains "servicebus.windows.net" and xdm.source.process.executable.path contains "HybridConnectionManager")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-dns-query-for-ip-lookup-ser-ec82e2a5
    name: Suspicious DNS Query for IP Lookup Service APIs
    description: 'Detects DNS queries for IP lookup services such as "api.ipify.org" originating from a non browser process. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Legitimate usage of IP lookup services such as ipify API. Sigma rule by Brandon George (blog post), Thomas Patzke, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ec82e2a5-81ea-4211-a1f8-37a0286df2c2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_susp_external_ip_lookup.yml'
    kind: bioc
    severity: medium
    category: Reconnaissance
    mitre:
      - T1590
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and ((xdm.target.fqdn ~= "^(?:www\\.ip\\.cn|l2\\.io)$" or (xdm.target.fqdn ~= "(?:api\\.2ip\\.ua|api\\.bigdatacloud\\.net|api\\.ipify\\.org|bot\\.whatismyipaddress\\.com|canireachthe\\.net|checkip\\.amazonaws\\.com|checkip\\.dyndns\\.org|curlmyip\\.com|db-ip\\.com|edns\\.ip-api\\.com|eth0\\.me|freegeoip\\.app|geoipy\\.com|getip\\.pro|icanhazip\\.com|ident\\.me|ifconfig\\.io|ifconfig\\.me|ip-api\\.com|ip\\.360\\.cn|ip\\.anysrc\\.net|ip\\.taobao\\.com|ip\\.tyk\\.nu|ipaddressworld\\.com)" or xdm.target.fqdn ~= "(?:ipapi\\.co|ipconfig\\.io|ipecho\\.net|ipinfo\\.io|ipip\\.net|ipof\\.in|ipv4\\.icanhazip\\.com|ipv4bot\\.whatismyipaddress\\.com|ipv6-test\\.com|ipwho\\.is|jsonip\\.com|myexternalip\\.com|seeip\\.org|wgetip\\.com|whatismyip\\.akamai\\.com|whois\\.pconline\\.com\\.cn|wtfismyip\\.com)")) and not ((xdm.source.process.executable.path ~= "\\\\brave\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe|C:\\\\Program Files \\(x86\\)\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Mozilla Firefox\\\\firefox\\.exe|C:\\\\Program Files \\(x86\\)\\\\Mozilla Firefox\\\\firefox\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Internet Explorer\\\\iexplore\\.exe|C:\\\\Program Files\\\\Internet Explorer\\\\iexplore\\.exe)$" or xdm.source.process.executable.path ~= "\\\\maxthon\\.exe$" or (xdm.source.process.executable.path ~= "^C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\" or xdm.source.process.executable.path ~= "\\\\WindowsApps\\\\MicrosoftEdge\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe|C:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe)$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeCore\\\\|C:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\msedge\\.exe|\\\\msedgewebview2\\.exe)$") or xdm.source.process.executable.path ~= "\\\\opera\\.exe$" or xdm.source.process.executable.path ~= "\\\\safari\\.exe$" or xdm.source.process.executable.path ~= "\\\\seamonkey\\.exe$" or xdm.source.process.executable.path ~= "\\\\vivaldi\\.exe$" or xdm.source.process.executable.path ~= "\\\\whale\\.exe$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
