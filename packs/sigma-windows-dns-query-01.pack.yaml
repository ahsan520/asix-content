  - key: suspicious-cobalt-strike-dns-beaconing-f356a9c4
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    description: "Detects a program that invoked suspicious DNS queries known from Cobalt Strike beacons Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f356a9c4-effd-4608-bbf8-408afd5cd006. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_mal_cobaltstrike.yml"
    kind: bioc
    severity: critical
    category: dns_query
    mitre:
      - T1071.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "^(?:aaa\\.stage\\.|post\\.1)" or xdm.target.fqdn contains ".stage.123456.")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: teamviewer-domain-query-by-non-teamvie-778ba9a8
    name: TeamViewer Domain Query By Non-TeamViewer Application
    description: "Detects DNS queries to a TeamViewer domain only resolved by a TeamViewer client by an image that isn't named TeamViewer (sometimes used by threat actors for obfuscation) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unknown binary names of TeamViewer; Depending on the environment the rule might require some initial tuning before usage to avoid FP with third party applications. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 778ba9a8-45e4-4b80-8e3e-34a419f0b85e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_teamviewer_domain_query_by_uncommon_app.yml"
    kind: bioc
    severity: medium
    category: dns_query
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "^(?:taf\\.teamviewer\\.com|udp\\.ping\\.teamviewer\\.com)$" and not (xdm.source.process.executable.path contains "TeamViewer"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-query-by-finger-utility-c082c2b0
    name: DNS Query by Finger Utility
    description: |-
      Detects DNS queries made by the finger utility, which can be abused by threat actors to retrieve remote commands for execution on Windows devices.
      In one ClickFix malware campaign, adversaries leveraged the finger protocol to fetch commands from a remote server.
      Since the finger utility is not commonly used in modern Windows environments, its presence already raises suspicion.
      Investigating such DNS queries can also help identify potential malicious infrastructure used by threat actors for command and control (C2) communication. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c082c2b0-525b-4dbc-9a26-a57dc4692074. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_finger.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1071.004
      - T1059.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.source.process.executable.path ~= "\\\\finger\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-query-request-by-regsvr32-exe-36e037c4
    name: DNS Query Request By Regsvr32.EXE
    description: 'Detects DNS queries initiated by "Regsvr32.exe" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unknown. Sigma rule by Dmitriy Lifanov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 36e037c4-c228-4866-b6a3-48eb292b9955. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_regsvr32_dns_query.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1559.001
      - T1218.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.source.process.executable.path ~= "\\\\regsvr32\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-query-for-anonfiles-com-domain-sys-065cceea
    name: DNS Query for Anonfiles.com Domain - Sysmon
    description: 'Detects DNS queries for "anonfiles.com", which is an anonymous file upload platform often used for malicious purposes Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Rare legitimate access to anonfiles.com. Sigma rule by pH-T (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 065cceea-77ec-4030-9052-fc0affea7110. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_anonymfiles_com.yml'
    kind: bioc
    severity: high
    category: Exfiltration
    mitre:
      - T1567.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.target.fqdn contains ".anonfiles.com"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-query-to-mega-hosting-website-613c03ba
    name: DNS Query To MEGA Hosting Website
    description: "Detects DNS queries for subdomains related to MEGA sharing website Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Legitimate DNS queries and usage of Mega. Sigma rule by Aaron Greetham (@beardofbinary) - NCC Group, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 613c03ba-0779-4a53-8a1f-47f914a4ded3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_mega_nz.yml"
    kind: bioc
    severity: medium
    category: Exfiltration
    mitre:
      - T1567.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.target.fqdn contains "userstorage.mega.co.nz"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
