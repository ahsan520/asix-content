# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-dns-query-01
name: "Sigma: Windows dns query"
description: "22 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows dns query events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - dns-query
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22)
rules:
  - key: dns-query-request-to-onelaunch-update-df68f791
    name: DNS Query Request To OneLaunch Update Service
    description: |-
      Detects DNS query requests to "update.onelaunch.com". This domain is associated with the OneLaunch adware application.
      When the OneLaunch application is installed it will attempt to get updates from this domain. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unlikely. Sigma rule by Josh Nickels, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id df68f791-ad95-447f-a271-640a0dab9cf8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_onelaunch_update_service.yml
    kind: bioc
    severity: low
    category: Collection
    mitre:
      - T1056
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "^update\\.onelaunch\\.com$" and xdm.source.process.executable.path ~= "\\\\OneLaunch\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: notepad-updater-dns-query-to-uncommon-2074e137
    name: Notepad++ Updater DNS Query to Uncommon Domains
    description: |-
      Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that are not part of the known legitimate update infrastructure.
      This could indicate potential exploitation of the updater mechanism or suspicious network activity that warrants further investigation. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Some legitimate network misconfigurations or proxy issues causing unexpected DNS queries.; Other legitimate query to official domains not listed in the filter, needing tuning.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2074e137-1b73-4e2d-88ba-5a3407dbdce0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_gup_query_to_uncommon_domains.yml
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1195.002
      - T1557
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.source.process.executable.path ~= "\\\\gup\\.exe$" and not (xdm.target.fqdn ~= "^notepad-plus-plus\\.org$") and not ((xdm.target.fqdn ~= "\\.sourceforge\\.net$" or (xdm.target.fqdn ~= "\\.githubusercontent\\.com$" or xdm.target.fqdn ~= "^github\\.com$") or xdm.target.fqdn ~= "\\.googleapis\\.com$" or xdm.target.fqdn ~= "(?:\\.azurewebsites\\.net|block\\.opendns\\.com|gateway\\.zscalerthree\\.net)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-dns-query-indicating-kerber-e7a21b5f
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    description: |-
      Detects DNS queries containing patterns associated with Kerberos coercion attacks via DNS object spoofing.
      The pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds to a marshaled CREDENTIAL_TARGET_INFORMATION structure.
      Attackers can use this technique to coerce authentication from victim systems to attacker-controlled hosts.
      It is one of the strong indicators of a Kerberos coercion attack, where adversaries manipulate DNS records
      to spoof Service Principal Names (SPNs) and redirect authentication requests like CVE-2025-33073. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_kerberos_coercion_via_dns_object_spoofing.yml
    kind: bioc
    severity: high
    category: Collection
    mitre:
      - T1557.001
      - T1187
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "UWhRCA" and xdm.target.fqdn ~= "BAAAA")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-server-discovery-via-ldap-query-a21bcd7e
    name: DNS Server Discovery Via LDAP Query
    description: "Detects DNS server discovery via LDAP query requests from uncommon applications Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Likely. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a21bcd7e-38ec-49ad-b69a-9ea17e69509e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_dns_server_discovery_via_ldap_query.yml"
    kind: bioc
    severity: low
    category: Discovery
    mitre:
      - T1482
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "^_ldap\\." and not ((xdm.source.process.executable.path ~= "(?::\\\\Program Files\\\\|:\\\\Program Files \\(x86\\)\\\\|:\\\\Windows\\\\)" or (xdm.source.process.executable.path contains ":\\ProgramData\\Microsoft\\Windows Defender\\Platform\\" and xdm.source.process.executable.path ~= "\\\\MsMpEng\\.exe$") or xdm.source.process.executable.path ~= "^<unknown process>$" or not (xdm.source.process.executable.path ~= "."))) and not ((xdm.source.process.executable.path ~= "^C:\\\\WindowsAzure\\\\GuestAgent" or xdm.source.process.executable.path ~= "(?:\\\\chrome\\.exe|\\\\firefox\\.exe|\\\\opera\\.exe)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: appx-package-installation-attempts-via-7cff77e1
    name: AppX Package Installation Attempts Via AppInstaller.EXE
    description: 'Detects DNS queries made by "AppInstaller.EXE". The AppInstaller is the default handler for the "ms-appinstaller" URI. It attempts to load/install a package from the referenced URL Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7cff77e1-9663-46a3-8260-17f2e1aa9d0a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_appinstaller.yml'
    kind: bioc
    severity: medium
    category: dns_query
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and (xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\.DesktopAppInstaller_" and xdm.source.process.executable.path ~= "\\\\AppInstaller\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
