  - key: dns-query-to-ufile-io-1cbbeaaf
    name: DNS Query To Ufile.io
    description: 'Detects DNS queries to "ufile.io", which was seen abused by malware and threat actors as a method for data exfiltration Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: DNS queries for "ufile" are not malicious by nature necessarily. Investigate the source to determine the necessary actions to take. Sigma rule by yatinwad, TheDFIRReport, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1cbbeaaf-3c8c-4e4c-9d72-49485b6a176b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_ufile_io_query.yml'
    kind: bioc
    severity: low
    category: Exfiltration
    mitre:
      - T1567.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.target.fqdn contains "ufile.io"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
