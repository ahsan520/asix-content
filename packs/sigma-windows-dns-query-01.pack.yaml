  - key: dns-query-to-azurewebsites-net-by-non-e043f529
    name: DNS Query To AzureWebsites.NET By Non-Browser Process
    description: 'Detects a DNS query by a non browser process on the system to "azurewebsites.net". The latter was often used by threat actors as a malware hosting and exfiltration site. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Likely with other browser software. Apply additional filters for any other browsers you might use.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e043f529-8514-4205-8ab0-7f7d2927b400. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_domain_azurewebsites.yml'
    kind: bioc
