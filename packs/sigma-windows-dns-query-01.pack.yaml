      xql: xdm.event.type = "dns_query" and (xdm.target.fqdn ~= "azurewebsites\\.net$" and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe|C:\\\\Program Files \\(x86\\)\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Mozilla Firefox\\\\firefox\\.exe|C:\\\\Program Files \\(x86\\)\\\\Mozilla Firefox\\\\firefox\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Internet Explorer\\\\iexplore\\.exe|C:\\\\Program Files\\\\Internet Explorer\\\\iexplore\\.exe)$" or (xdm.source.process.executable.path ~= "^C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\" or xdm.source.process.executable.path ~= "\\\\WindowsApps\\\\MicrosoftEdge\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe|C:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe)$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeCore\\\\|C:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\msedge\\.exe|\\\\msedgewebview2\\.exe)$") or xdm.source.process.executable.path ~= "\\\\safari\\.exe$" or xdm.source.process.executable.path ~= "(?:\\\\MsMpEng\\.exe|\\\\MsSense\\.exe)$" or (xdm.source.process.executable.path ~= "\\\\brave\\.exe$" and xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\BraveSoftware\\\\") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Maxthon\\" and xdm.source.process.executable.path ~= "\\\\maxthon\\.exe$") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Programs\\Opera\\" and xdm.source.process.executable.path ~= "\\\\opera\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\SeaMonkey\\\\|C:\\\\Program Files \\(x86\\)\\\\SeaMonkey\\\\)" and xdm.source.process.executable.path ~= "\\\\seamonkey\\.exe$") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Vivaldi\\" and xdm.source.process.executable.path ~= "\\\\vivaldi\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Naver\\\\Naver Whale\\\\|C:\\\\Program Files \\(x86\\)\\\\Naver\\\\Naver Whale\\\\)" and xdm.source.process.executable.path ~= "\\\\whale\\.exe$") or xdm.source.process.executable.path contains "\\Tor Browser\\" or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Waterfox\\\\|C:\\\\Program Files \\(x86\\)\\\\Waterfox\\\\)" and xdm.source.process.executable.path ~= "\\\\Waterfox\\.exe$") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Programs\\midori-ng\\" and xdm.source.process.executable.path ~= "\\\\Midori Next Generation\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\SlimBrowser\\\\|C:\\\\Program Files \\(x86\\)\\\\SlimBrowser\\\\)" and xdm.source.process.executable.path ~= "\\\\slimbrowser\\.exe$") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Flock\\" and xdm.source.process.executable.path ~= "\\\\Flock\\.exe$") or (xdm.source.process.executable.path contains "\\AppData\\Local\\Phoebe\\" and xdm.source.process.executable.path ~= "\\\\Phoebe\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Falkon\\\\|C:\\\\Program Files \\(x86\\)\\\\Falkon\\\\)" and xdm.source.process.executable.path ~= "\\\\falkon\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Avant Browser\\\\|C:\\\\Program Files\\\\Avant Browser\\\\)" and xdm.source.process.executable.path ~= "\\\\avant\\.exe$"))))
      group_by: field:xdm.source.host.hostname
