      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dns-query-to-common-malware-hosting-an-f8c1e80b
    name: DNS Query To Common Malware Hosting and Shortener Services
    description: |-
      Detects DNS queries to domains commonly used by threat actors to host malware payloads or redirect through URL shorteners.
      These include platforms like Cloudflare Workers, TryCloudflare, InfinityFree, and URL shorteners such as tinyurl and lihi.cc.
      Such DNS activity can indicate potential delivery or command-and-control communication attempts. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Legitimate use of these services is possible but rare in enterprise environments. Sigma rule by Ahmed Nosir (@egycondor), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f8c1e80b-c73a-476a-ae24-6c72528b1521. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_common_malware_hosting_services.yml
    kind: bioc
    severity: medium
    category: dns_query
    mitre:
      - T1071.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.target.fqdn ~= "(?:msapp\\.workers\\.dev|trycloudflare\\.com|infinityfreeapp\\.com|my5353\\.com|reurl\\.cc|lihi\\.cc|tinyurl\\.com)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
