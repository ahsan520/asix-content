  - key: dns-query-to-wildcard-dns-services-win-4f8a1c2e
    name: DNS Query to Wildcard DNS Services - Windows
    description: |-
      Detects DNS queries to public wildcard DNS services that dynamically resolve subdomains to IP addresses embedded in the subdomain.
      Adversaries abuse these services to establish C2 channels or stage phishing infrastructure without registering a custom domain, potentially to evade detection and attribution. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 22). Known false positives: Developers on Windows workstations testing local services or web applications without editing the hosts file. Sigma rule by MahirAli Khan, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4f8a1c2e-7d3b-4e5f-9a6c-0b1d2e3f4a5b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/dns_query/dns_query_win_wildcard_dns_service.yml
    kind: bioc
    severity: medium
    category: dns_query
    mitre:
      - T1071.004
      - T1568
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "dns_query" and xdm.target.fqdn ~= "(?:\\.1u\\.ms|\\.backname\\.io|\\.nip\\.io|\\.sslip\\.io|\\.traefik\\.me|\\.xip\\.io)$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
