    description: "Detects a suspicious child process of a Microsoft HTML Help (HH.exe) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Maxim Pavlunin, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 52cad028-0ff0-4854-8f67-d25dfcbc78b4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hh_html_help_susp_child_process.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1047
      - T1059.001
      - T1059.003
      - T1059.005
      - T1059.007
      - T1218
      - T1218.001
      - T1218.010
      - T1218.011
      - T1566
      - T1566.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\hh\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\CertReq\\.exe|\\\\CertUtil\\.exe|\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\installutil\\.exe|\\\\MSbuild\\.exe|\\\\MSHTA\\.EXE|\\\\msiexec\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\schtasks\\.exe|\\\\wmic\\.exe|\\\\wscript\\.exe)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: ie-zonemap-setting-downgraded-to-mycom-10344bb3
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
    description: "Detects changes to Internet Explorer's (IE / Windows Internet properties) ZoneMap configuration of the \"HTTP\" and \"HTTPS\" protocols to point to the \"My Computer\" zone. This allows downloaded files from the Internet to be granted the same level of trust as files stored locally. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 10344bb3-7f65-46c2-b915-2d00d47be5b0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_ie_security_zone_protocol_defaults_downgrade.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Internet Settings\\\\ZoneMap\\\\ProtocolDefaults" and xdm.target.process.command_line ~= "http" and xdm.target.process.command_line ~= " 0")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: imagingdevices-unusual-parent-child-pr-f11f2808
    name: ImagingDevices Unusual Parent/Child Processes
    description: "Detects unusual parent or children of the ImagingDevices.exe (Windows Contacts) process as seen being used with Bumblebee activity Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f11f2808-adb4-46c0-802a-8660db50fa99. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_imagingdevices_unusual_parents.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "(?:\\\\WmiPrvSE\\.exe|\\\\svchost\\.exe|\\\\dllhost\\.exe)$" and xdm.target.process.executable.path ~= "\\\\ImagingDevices\\.exe$") or xdm.source.process.executable.path ~= "\\\\ImagingDevices\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: import-powershell-modules-from-suspici-c31364f7
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    description: "Detects powershell scripts that import modules from suspicious directories Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c31364f7-8be6-4b77-8483-dd2b5a7b69a3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_import_module_susp_dirs.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:Import-Module \"\\$Env:Temp\\\\|Import-Module '\\$Env:Temp\\\\|Import-Module \\$Env:Temp\\\\|Import-Module \"\\$Env:Appdata\\\\|Import-Module '\\$Env:Appdata\\\\|Import-Module \\$Env:Appdata\\\\|Import-Module C:\\\\Users\\\\Public\\\\|ipmo \"\\$Env:Temp\\\\|ipmo '\\$Env:Temp\\\\|ipmo \\$Env:Temp\\\\|ipmo \"\\$Env:Appdata\\\\|ipmo '\\$Env:Appdata\\\\|ipmo \\$Env:Appdata\\\\|ipmo C:\\\\Users\\\\Public\\\\)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: indirect-command-execution-by-program-b97cd4b1
    name: Indirect Command Execution By Program Compatibility Wizard
    description: "Detect indirect command execution via Program Compatibility Assistant pcwrun.exe Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Need to use extra processing with 'unique_count' / 'filter' to focus on outliers as opposed to commonly seen artifacts; Legit usage of scripts. Sigma rule by A. Sungurov , oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b97cd4b1-30b8-4a9d-bd72-6293928d52bc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_pcwrun.yml"
    kind: bioc
    severity: low
    category: Execution
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.source.process.executable.path ~= "\\\\pcwrun\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: insecure-proxy-doh-transfer-via-curl-e-2c1486f5
    name: Insecure Proxy/DOH Transfer Via Curl.EXE
    description: 'Detects execution of "curl.exe" with the "insecure" flag over proxy or DOH. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Access to badly maintained internal or development systems. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2c1486f5-02e8-4f86-9099-b97f2da4ed77. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_curl_insecure_proxy_or_doh.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\curl\\.exe$" or xdm.target.process.original_file_name ~= "^curl\\.exe$") and xdm.target.process.command_line ~= "(?:--doh-insecure|--proxy-insecure)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: insecure-transfer-via-curl-exe-cb9cc1d1
    name: Insecure Transfer Via Curl.EXE
    description: 'Detects execution of "curl.exe" with the "--insecure" flag. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Access to badly maintained internal or development systems. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_curl_insecure_connection.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\curl\\.exe$" or xdm.target.process.original_file_name ~= "^curl\\.exe$") and (xdm.target.process.command_line ~= "\\s-k\\s" or xdm.target.process.command_line contains "--insecure"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: install-new-package-via-winget-local-m-313d6012
    name: Install New Package Via Winget Local Manifest
    description: |-
      Detects usage of winget to install applications via manifest file. Adversaries can abuse winget to download payloads remotely and execute them.
      The manifest option enables you to install an application by passing in a YAML file directly to the client.
      Winget can be used to download and install exe, msi or msix files later. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Some false positives are expected in some environment that may use this functionality to install and test their custom applications. Sigma rule by Sreeman, Florian Roth (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 313d6012-51a0-4d93-8dfc-de8553239e25. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_winget_local_install_via_manifest.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\winget\\.exe$" or xdm.target.process.original_file_name ~= "^winget\\.exe$") and xdm.target.process.command_line ~= "(?:install| add )" and xdm.target.process.command_line ~= "(?:-m |--manifest)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: installation-of-wsl-kali-linux-eca8ae39
    name: Installation of WSL Kali-Linux
    description: |-
      Detects installation of Kali Linux distribution through Windows Subsystem for Linux (WSL).
      Attackers may use Kali Linux WSL to leverage its penetration testing tools and capabilities for malicious purposes. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate installation or usage of Kali Linux WSL by administrators or security teams. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id eca8ae39-5c3c-4321-b538-9e64fe25822e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wsl_kali_linux_installation.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wsl\\.exe$" or xdm.target.process.original_file_name ~= "^wsl$") and xdm.target.process.command_line ~= "(?: --install | -i )" and xdm.target.process.command_line contains "kali")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
