# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-04
name: "Sigma: Windows process creation (4 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Execution. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: cmstp-uac-bypass-via-com-object-access-4b60e6f2
    name: CMSTP UAC Bypass via COM Object Access
    description: "Detects UAC Bypass Attempt Using Microsoft Connection Manager Profile Installer Autoelevate-capable COM Objects (e.g. UACMe ID of 41, 43, 58 or 65) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate CMSTP use (unlikely in modern enterprise environments). Sigma rule by Nik Seetharaman, Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4b60e6f2-bf39-47b4-b4ea-398e33cfe253. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_uac_bypass_cmstp_com_object_access.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1548.002
      - T1218.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\DllHost\\.exe$" and xdm.source.process.command_line ~= "(?: /Processid:\\{3E5FC7F9-9A51-4367-9063-A120244FBEC7\\}| /Processid:\\{3E000D72-A845-4CD9-BD83-80C07C3B881F\\}| /Processid:\\{BD54C901-076B-434E-B6C7-17C531F4AB41\\}| /Processid:\\{D2E7041B-2927-42FB-8E9F-7CE93B6DC937\\}| /Processid:\\{E9495B87-D950-4AB5-87A5-FF6D70BF3E90\\})" and xdm.target.process.integrity_level ~= "^(?:High|System|S-1-16-16384|S-1-16-12288)$")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: command-line-execution-with-suspicious-1ac8666b
    name: Command Line Execution with Suspicious URL and AppData Strings
    description: "Detects a suspicious command line execution that includes an URL and AppData string in the command line parameters as used by several droppers (js/vbs > powershell) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: High. Sigma rule by Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1ac8666b-046f-4201-8aba-1951aaec03a3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_http_appdata.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.003
      - T1059.001
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" and (xdm.target.process.command_line ~= "http" and xdm.target.process.command_line ~= "://" and xdm.target.process.command_line ~= "%AppData%"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: computer-password-change-via-ksetup-ex-de16d92c
    name: Computer Password Change Via Ksetup.EXE
    description: "Detects password change for the computer's domain account or host principal via \"ksetup.exe\" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id de16d92c-c446-4d53-8938-10aeef41c8b6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ksetup_password_change_computer.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\ksetup\\.exe$" or xdm.target.process.original_file_name ~= "^ksetup\\.exe$") and xdm.target.process.command_line contains " /setcomputerpassword ")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: conhost-spawned-by-uncommon-parent-pro-cbb9e3d1
    name: Conhost Spawned By Uncommon Parent Process
    description: "Detects when the Console Window Host (conhost.exe) process is spawned by an uncommon parent process, which could be indicative of potential code injection activity. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Tim Rauch, Elastic (idea), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cbb9e3d1-2386-4e59-912e-62f1484f7a89. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_conhost_uncommon_parent.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\conhost\\.exe$" and xdm.source.process.executable.path ~= "(?:\\\\explorer\\.exe|\\\\lsass\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\services\\.exe|\\\\smss\\.exe|\\\\spoolsv\\.exe|\\\\svchost\\.exe|\\\\userinit\\.exe|\\\\wininit\\.exe|\\\\winlogon\\.exe)$") and not (xdm.source.process.command_line ~= "(?:-k apphost -s AppHostSvc|-k imgsvc|-k localService -p -s RemoteRegistry|-k LocalSystemNetworkRestricted -p -s NgcSvc|-k NetSvcs -p -s NcaSvc|-k netsvcs -p -s NetSetupSvc|-k netsvcs -p -s wlidsvc|-k NetworkService -p -s DoSvc|-k wsappx -p -s AppXSvc|-k wsappx -p -s ClipSVC|-k wusvcs -p -s WaaSMedicSvc)") and not (xdm.source.process.command_line ~= "(?:C:\\\\Program Files \\(x86\\)\\\\Dropbox\\\\Client\\\\|C:\\\\Program Files\\\\Dropbox\\\\Client\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: conhost-exe-commandline-path-traversal-ee5e119b
    name: Conhost.exe CommandLine Path Traversal
    description: "detects the usage of path traversal in conhost.exe indicating possible command/argument confusion/hijacking Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ee5e119b-1f75-4b34-add8-3be976961e39. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_conhost_path_traversal.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.command_line contains "conhost" and xdm.target.process.command_line contains "/../../")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: control-panel-items-0ba863e6
    name: Control Panel Items
    description: "Detects the malicious use of a control panel item Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Kyaw Min Thein, Furkan Caliskan (@caliskanfurkan_), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_control_panel_item.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1218.002
      - T1546
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" or xdm.target.process.original_file_name ~= "^reg\\.exe$") and (xdm.target.process.command_line ~= "add" and xdm.target.process.command_line ~= "CurrentVersion\\\\Control Panel\\\\CPLs")) or (xdm.target.process.command_line ~= "\\.cpl$" and not ((xdm.target.process.command_line ~= "(?:\\\\System32\\\\|%System%|\\|C:\\\\Windows\\\\system32\\|)" or (xdm.target.process.command_line ~= "regsvr32 " and xdm.target.process.command_line ~= " /s " and xdm.target.process.command_line ~= "igfxCPL\\.cpl")))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: convertto-securestring-cmdlet-usage-vi-74403157
    name: ConvertTo-SecureString Cmdlet Usage Via CommandLine
    description: 'Detects usage of the "ConvertTo-SecureString" cmdlet via the commandline. Which is fairly uncommon and could indicate potential suspicious activity Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use to pass password to different powershell commands. Sigma rule by Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 74403157-20f5-415d-89a7-c505779585cf. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cmdline_convertto_securestring.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line contains "ConvertTo-SecureString")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: csc-exe-execution-form-potentially-sus-b730a276
    name: Csc.EXE Execution Form Potentially Suspicious Parent
    description: 'Detects a potentially suspicious parent of "csc.exe", which could be a sign of payload delivery. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b730a276-6b63-41b8-bcf8-55930c8fc6ee. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_csc_susp_parent.yml'
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.005
      - T1059.007
      - T1218.005
      - T1027.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\csc\\.exe$" or xdm.target.process.original_file_name ~= "^csc\\.exe$") and (xdm.source.process.executable.path ~= "(?:\\\\cscript\\.exe|\\\\excel\\.exe|\\\\mshta\\.exe|\\\\onenote\\.exe|\\\\outlook\\.exe|\\\\powerpnt\\.exe|\\\\winword\\.exe|\\\\wscript\\.exe)$" or (xdm.source.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and xdm.source.process.command_line ~= "(?:-Encoded |FromBase64String)") or (xdm.source.process.command_line ~= "(?:[Pp]rogram[Dd]ata|%(?:[Ll]ocal)?[Aa]pp[Dd]ata%|\\\\[Aa]pp[Dd]ata\\\\(?:[Ll]ocal(?:[Ll]ow)?|[Rr]oaming))\\\\[^\\\\]{1,256}$" or xdm.source.process.command_line ~= "(?::\\\\PerfLogs\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\Temporary Internet)" or (xdm.source.process.command_line ~= ":\\\\Users\\\\" and xdm.source.process.command_line ~= "\\\\Favorites\\\\") or (xdm.source.process.command_line ~= ":\\\\Users\\\\" and xdm.source.process.command_line ~= "\\\\Favourites\\\\") or (xdm.source.process.command_line ~= ":\\\\Users\\\\" and xdm.source.process.command_line ~= "\\\\Contacts\\\\") or (xdm.source.process.command_line ~= ":\\\\Users\\\\" and xdm.source.process.command_line ~= "\\\\Pictures\\\\"))) and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\|C:\\\\Program Files\\\\)" or xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\sdiagnhost\\.exe$" or xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\inetsrv\\\\w3wp\\.exe$")) and not ((xdm.source.process.executable.path ~= "^C:\\\\ProgramData\\\\chocolatey\\\\choco\\.exe$" or xdm.source.process.command_line contains "\\ProgramData\\Microsoft\\Windows Defender Advanced Threat Protection" or (xdm.source.process.command_line ~= "(?:JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw|cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA)" or xdm.source.process.command_line ~= "nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: cscript-wscript-potentially-suspicious-b6676963
    name: Cscript/Wscript Potentially Suspicious Child Process
    description: |-
      Detects potentially suspicious child processes of Wscript/Cscript. These include processes such as rundll32 with uncommon exports or PowerShell spawning rundll32 or regsvr32.
      Malware such as Pikabot and Qakbot were seen using similar techniques as well as many others. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Some false positives might occur with admin or third party software scripts. Investigate and apply additional filters accordingly.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Alejandro Houspanossian ('@lekz86'), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b6676963-0353-4f88-90f5-36c20d443c6a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wscript_cscript_susp_child_processes.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "(?:\\\\wscript\\.exe|\\\\cscript\\.exe)$" and (xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or (xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and ((xdm.target.process.command_line ~= "mshta" and xdm.target.process.command_line ~= "http") or xdm.target.process.command_line ~= "(?:rundll32|regsvr32|msiexec)"))) and not ((xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" and xdm.target.process.command_line ~= "(?:UpdatePerUserSystemParameters|PrintUIEntry|ClearMyTracksByProcess)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: cscript-wscript-uncommon-script-extens-99b7460d
    name: Cscript/Wscript Uncommon Script Extension Execution
    description: "Detects Wscript/Cscript executing a file with an uncommon (i.e. non-script) extension Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 99b7460d-c9f1-40d7-a316-1f36f61d52ee. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wscript_cscript_uncommon_extension_exec.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.005
      - T1059.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^(?:wscript\\.exe|cscript\\.exe)$" or xdm.target.process.executable.path ~= "(?:\\\\wscript\\.exe|\\\\cscript\\.exe)$") and xdm.target.process.command_line ~= "(?:\\.csv|\\.dat|\\.doc|\\.gif|\\.jpeg|\\.jpg|\\.png|\\.ppt|\\.txt|\\.xls|\\.xml)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: curl-web-request-with-potential-custom-85de1f22
    name: Curl Web Request With Potential Custom User-Agent
    description: 'Detects execution of "curl.exe" with a potential custom "User-Agent". Attackers can leverage this to download or exfiltrate data via "curl" to a domain that only accept specific "User-Agent" strings Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 85de1f22-d189-44e4-8239-dc276b45379b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_curl_custom_user_agent.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\curl\\.exe$" or xdm.target.process.original_file_name ~= "^curl\\.exe$") and (xdm.target.process.command_line ~= "\\s-H\\s" or xdm.target.process.command_line contains "--header") and xdm.target.process.command_line contains "User-Agent:")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: data-export-from-mssql-table-via-bcp-e-c615d676
    name: Data Export From MSSQL Table Via BCP.EXE
    description: |-
      Detects the execution of the BCP utility in order to export data from the database.
      Attackers were seen saving their malware to a database column or table and then later extracting it via "bcp.exe" into a file. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate data export operations.. Sigma rule by Omar Khaled (@beacon_exe), MahirAli Khan (in/mahiralikhan), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c615d676-f655-46b9-b913-78729021e5d7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bcp_export_data.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1048
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\bcp\\.exe$" or xdm.target.process.original_file_name ~= "^BCP\\.exe$") and xdm.target.process.command_line ~= "(?: out | queryout )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: detection-of-powershell-execution-via-0152550d
    name: Detection of PowerShell Execution via Sqlps.exe
    description: |-
      This rule detects execution of a PowerShell code through the sqlps.exe utility, which is included in the standard set of utilities supplied with the MSSQL Server.
      Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Direct PS command execution through SQLPS.exe is uncommon, childprocess sqlps.exe spawned by sqlagent.exe is a legitimate action.. Sigma rule by Agro (@agro_sev) oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0152550d-3a26-4efd-9f0e-54a0b28ae2f3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_mssql_sqlps_susp_execution.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
      - T1127
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\sqlps\\.exe$" or ((xdm.target.process.executable.path ~= "\\\\sqlps\\.exe$" or xdm.target.process.original_file_name ~= "^sqlps\\.exe$") and not (xdm.source.process.executable.path ~= "\\\\sqlagent\\.exe$")))
