      filters: []
      xql: xdm.event.type = "image_load" and (xdm.target.module.path ~= "\\\\clfs\\.sys$" and (xdm.source.process.executable.path ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\Public\\\\|\\\\Temporary Internet|\\\\Windows\\\\Temp\\\\)" or ((xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Favorites\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Favourites\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Contacts\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Pictures\\\\"))))
      group_by: field:xdm.source.host.hostname
