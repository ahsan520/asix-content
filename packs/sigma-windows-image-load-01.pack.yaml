    name: Clfs.SYS Loaded By Process Located In a Potential Suspicious Location
    description: "Detects Clfs.sys being loaded by a process running from a potentially suspicious location. Clfs.sys is loaded as part of many CVEs exploits that targets Common Log File. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7). Known false positives: Unknown. Sigma rule by X__Junior, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fb4e2211-6d08-426b-8e6f-0d4a161e3b1d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/image_load/image_load_clfs_load.yml"
