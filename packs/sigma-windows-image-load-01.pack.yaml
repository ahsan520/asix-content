    severity: high
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "image_load" and (xdm.target.module.path ~= "(?:\\\\coreclr\\.dll|\\\\facesdk\\.dll|\\\\HPCustPartUI\\.dll|\\\\libcef\\.dll|\\\\ZIPDLL\\.dll)$" and (xdm.target.module.path ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\Public\\\\|\\\\Temporary Internet|\\\\Windows\\\\Temp\\\\)" or ((xdm.target.module.path ~= ":\\\\Users\\\\" and xdm.target.module.path ~= "\\\\Favorites\\\\") or (xdm.target.module.path ~= ":\\\\Users\\\\" and xdm.target.module.path ~= "\\\\Favourites\\\\") or (xdm.target.module.path ~= ":\\\\Users\\\\" and xdm.target.module.path ~= "\\\\Contacts\\\\") or (xdm.target.module.path ~= ":\\\\Users\\\\" and xdm.target.module.path ~= "\\\\Pictures\\\\"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
