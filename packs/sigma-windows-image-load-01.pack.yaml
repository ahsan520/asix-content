# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-image-load-01
name: "Sigma: Windows image load (1 of 2)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows image load events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - image-load
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7)
rules:
  - key: credui-dll-loaded-by-uncommon-process-9ae01559
    name: CredUI.DLL Loaded By Uncommon Process
    description: 'Detects loading of "credui.dll" and related DLLs by an uncommon process. Attackers might leverage this DLL for potential use of "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7). Known false positives: Other legitimate processes loading those DLLs in your environment.. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9ae01559-cf7e-4f8e-8e14-4c290a1b4784. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/image_load/image_load_dll_credui_uncommon_process_load.yml'
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1056.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "image_load" and ((xdm.target.module.path ~= "(?:\\\\credui\\.dll|\\\\wincredui\\.dll)$" or xdm.target.module.original_file_name ~= "^(?:credui\\.dll|wincredui\\.dll)$") and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\|C:\\\\Program Files\\\\|C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\|C:\\\\Windows\\\\SystemApps\\\\)" or xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\explorer\\.exe|C:\\\\Windows\\\\ImmersiveControlPanel\\\\SystemSettings\\.exe|C:\\\\Windows\\\\regedit\\.exe)$")) and not ((xdm.source.process.executable.path ~= "\\\\opera_autoupdate\\.exe$" or xdm.source.process.executable.path ~= "(?:\\\\procexp64\\.exe|\\\\procexp64a\\.exe|\\\\procexp\\.exe)$" or (xdm.source.process.executable.path ~= "^C:\\\\Users\\\\" and xdm.source.process.executable.path contains "\\AppData\\Local\\Microsoft\\Teams\\" and xdm.source.process.executable.path ~= "\\\\Teams\\.exe$") or (xdm.source.process.executable.path ~= "^C:\\\\Users\\\\" and xdm.source.process.executable.path contains "\\AppData\\Local\\Microsoft\\OneDrive\\"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
