((xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\.GetHelp_" and xdm.source.process.executable.path ~= "\\\\GetHelp\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft SQL Server Management Studio|C:\\\\Program Files\\\\Microsoft SQL Server Management Studio)" and xdm.source.process.executable.path ~= "\\\\IDE\\\\Ssms\\.exe$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft SQL Server\\\\|C:\\\\Program Files\\\\Microsoft SQL Server\\\\)" and xdm.source.process.executable.path ~= "\\\\Tools\\\\Binn\\\\SQLPS\\.exe$") or xdm.source.process.executable.path ~= "\\\\Citrix\\\\ConfigSync\\\\ConfigSyncRun\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft Visual Studio\\\\|C:\\\\Program Files\\\\Microsoft Visual Studio\\\\)" or xdm.source.process.executable.path ~= "^C:\\\\ProgramData\\\\chocolatey\\\\choco\\.exe" or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\Temp\\\\asgard2-agent\\\\" and xdm.source.process.executable.path ~= "(?:\\\\thor64\\.exe|\\\\thor\\.exe)$") or not (xdm.source.process.executable.path ~= "."))))
