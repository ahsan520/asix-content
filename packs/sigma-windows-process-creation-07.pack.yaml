      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or xdm.target.process.original_file_name ~= "^RUNDLL32\\.EXE$") and ((xdm.target.process.command_line ~= "shell32\\.dll" and xdm.target.process.command_line ~= "Control_RunDLL") and xdm.target.process.command_line ~= "(?:%AppData%|%LocalAppData%|%Temp%|%tmp%|\\\\AppData\\\\|\\\\Temp\\\\|\\\\Users\\\\Public\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: sql-client-tools-powershell-session-de-a746c9b8
    name: SQL Client Tools PowerShell Session Detection
    description: |-
      This rule detects execution of a PowerShell code through the sqltoolsps.exe utility, which is included in the standard set of utilities supplied with the Microsoft SQL Server Management studio.
      Script blocks are not logged in this case, so this utility helps to bypass protection mechanisms based on the analysis of these logs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Direct PS command execution through SQLToolsPS.exe is uncommon, childprocess sqltoolsps.exe spawned by smss.exe is a legitimate action.. Sigma rule by Agro (@agro_sev) oscd.communitly, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a746c9b8-a2fb-4ee5-a428-92bee9e99060. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_mssql_sqltoolsps_susp_execution.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
      - T1127
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\sqltoolsps\\.exe$" or xdm.source.process.executable.path ~= "\\\\sqltoolsps\\.exe$" or xdm.target.process.original_file_name ~= "^sqltoolsps\\.exe$") and not (xdm.source.process.executable.path ~= "\\\\smss\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: start-windows-service-via-net-exe-2a072a96
    name: Start Windows Service Via Net.EXE
    description: 'Detects the usage of the "net.exe" command to start a service using the "start" flag Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrator or user executes a service for legitimate reasons.. Sigma rule by Timur Zinniatullin, Daniil Yugoslavskiy, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2a072a96-a086-49fa-bcb5-15cc5a619093. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_start_service.yml'
    kind: bioc
    severity: low
    category: Execution
    mitre:
      - T1569.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\net\\.exe|\\\\net1\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:net\\.exe|net1\\.exe)$") and xdm.target.process.command_line contains " start ")
      group_by: field:xdm.source.host.hostname
