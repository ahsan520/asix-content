  - key: pua-runxcmd-execution-93199800
    name: PUA - RunXCmd Execution
    description: "Detects the use of the RunXCmd tool to execute commands with System or TrustedInstaller accounts Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use by administrators. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 93199800-b52a-4dec-b762-75212c196542. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_runxcmd.yml"
