  - key: renamed-schtasks-execution-f91e51c9
    name: Renamed Schtasks Execution
    description: |-
      Detects the execution of renamed schtasks.exe binary, which is a legitimate Windows utility used for scheduling tasks.
      One of the very common persistence techniques is schedule malicious tasks using schtasks.exe.
      Since, it is heavily abused, it is also heavily monitored by security products. To evade detection, threat actors may rename the schtasks.exe binary to schedule their malicious tasks. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f91e51c9-f344-4b32-969b-0b6f6b8537d4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_schtasks_execution.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1036.003
      - T1053.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.command_line ~= "(?: [-/–—―]create | [-/–—―]delete | [-/–—―]query | [-/–—―]change | [-/–—―]run | [-/–—―]end )" and xdm.target.process.command_line ~= "(?: [-/–—―]tn | [-/–—―]tr | [-/–—―]sc | [-/–—―]st | [-/–—―]ru | [-/–—―]fo )") and not (xdm.target.process.command_line contains "schtasks") and not ((xdm.target.process.command_line ~= "openfiles" and xdm.target.process.command_line ~= " /query " and xdm.target.process.command_line ~= " /fo"))) or (xdm.target.process.original_file_name ~= "^schtasks\\.exe$" and not (xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
