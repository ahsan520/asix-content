    name: PUA - NirCmd Execution As LOCAL SYSTEM
    description: "Detects the use of NirCmd tool for command execution as SYSTEM user Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use by administrators. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d9047477-0359-48c9-b8c7-792cedcdc9c4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_nircmd_as_system.yml"
