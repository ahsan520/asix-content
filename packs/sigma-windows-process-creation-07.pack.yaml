      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wsudo\\.exe$" or xdm.target.process.original_file_name ~= "^wsudo\\.exe$" or xdm.target.process.description ~= "^Windows sudo utility$" or xdm.source.process.executable.path ~= "\\\\wsudo-bridge\\.exe$") or xdm.target.process.command_line ~= "(?:-u System|-uSystem|-u TrustedInstaller|-uTrustedInstaller| --ti )")
