      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line contains " runassystem "
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-nsudo-execution-771d1eb5
    name: PUA - NSudo Execution
    description: "Detects the use of NSudo tool for command execution Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use by administrators. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 771d1eb5-9587-4568-95fb-9ec44153a012. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_nsudo.yml"
