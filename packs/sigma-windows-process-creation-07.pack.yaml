  - key: python-inline-command-execution-899133d5
    name: Python Inline Command Execution
    description: 'Detects execution of python using the "-c" flag. This is could be used as a way to launch a reverse shell or execute live python code. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Python libraries that use a flag starting with "-c". Filter according to your environment. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 899133d5-4d7c-4a7f-94ee-27355c879d90. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_python_inline_command_execution.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.original_file_name ~= "^python\\.exe$" or xdm.target.process.executable.path ~= "(?:python\\.exe|python3\\.exe|python2\\.exe)$") and xdm.target.process.command_line contains " -c") and not (((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Python|C:\\\\Program Files \\(x86\\)\\\\Python)" and xdm.source.process.executable.path ~= "\\\\python\\.exe$" and xdm.source.process.command_line contains "-E -s -m ensurepip -U --default-pip") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Python|C:\\\\Program Files \\(x86\\)\\\\Python)" and (xdm.target.process.command_line ~= "-W ignore::DeprecationWarning" and xdm.target.process.command_line ~= "\\['install', '--no-cache-dir', '--no-index', '--find-links'," and xdm.target.process.command_line ~= "'--upgrade', 'pip'")))) and not (((xdm.source.process.executable.path ~= "\\\\AppData\\\\Local\\\\Programs\\\\Microsoft VS Code\\\\Code\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Microsoft VS Code\\\\Code\\.exe|C:\\\\Program Files \\(x86\\)\\\\Microsoft VS Code\\\\Code\\.exe)$") or (xdm.target.process.command_line ~= "<pip-setuptools-caller>" and xdm.target.process.command_line ~= "exec\\(compile\\("))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: python-one-liners-with-base64-decoding-50a0aa3d
    name: Python One-Liners with Base64 Decoding
    description: |-
      Detects Python one-liners that use base64 decoding functions in command line executions.
      Malicious scripts or attackers often use python one-liners to decode and execute base64-encoded payloads, which is a common technique for obfuscation and evasion. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of Python for decoding data, which is uncommon in typical enterprise environments but possible in development or data analysis contexts.. Sigma rule by Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 50a0aa3d-ab16-4594-a8aa-5145a6e6792b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_python_base64_encoded_execution.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.006
      - T1027.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path contains "\\python" or xdm.target.process.original_file_name contains "python") and ((xdm.target.process.command_line ~= "import" and xdm.target.process.command_line ~= "base64" and xdm.target.process.command_line ~= " -c") and xdm.target.process.command_line ~= "(?:\\.decode|b16decode|b32decode|b32hexdecode|b64decode|b85decode|z85decode)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
