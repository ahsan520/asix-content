  - key: suspicious-arcsoc-exe-child-process-8e95e73e
    name: Suspicious ArcSOC.exe Child Process
    description: |-
      Detects script interpreters, command-line tools, and similar suspicious child processes of ArcSOC.exe.
      ArcSOC.exe is the process name which hosts ArcGIS Server REST services. If an attacker compromises an ArcGIS
      Server system and uploads a malicious Server Object Extension (SOE), they can send crafted requests to the corresponding
      service endpoint and remotely execute code from the ArcSOC.exe process. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Micah Babinski, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8e95e73e-ba02-4a87-b4d7-0929b8053038. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_arcsoc_susp_child_process.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059
      - T1203
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\ArcSOC\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wmic\\.exe|\\\\wscript\\.exe)$") and not ((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" and xdm.target.process.command_line ~= "^cmd\\.exe /c \"ver\"$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
