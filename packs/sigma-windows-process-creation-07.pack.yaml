  - key: pua-nircmd-execution-4e2ed651
    name: PUA - NirCmd Execution
    description: "Detects the use of NirCmd tool for command execution, which could be the result of legitimate administrative activity Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use by administrators. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4e2ed651-1906-4a59-a78a-18220fca1b22. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_nircmd.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1569.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\NirCmd\\.exe$" or xdm.target.process.original_file_name ~= "^NirCmd\\.exe$") or xdm.target.process.command_line ~= "(?: execmd |\\.exe script |\\.exe shexec | runinteractive )") or (xdm.target.process.command_line ~= "(?: exec | exec2 )" and xdm.target.process.command_line ~= "(?: show | hide )"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
