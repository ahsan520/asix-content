    name: UAC Notification Disabled
    description: |-
      Detects when an attacker tries to disable User Account Control (UAC) notification by tampering with the "UACDisableNotify" value.
      UAC is a critical security feature in Windows that prevents unauthorized changes to the operating system. It prompts the user for permission or an administrator password before allowing actions that could affect the system's operation or change settings that affect other users.
      When "UACDisableNotify" is set to 1, UAC prompts are suppressed. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c5f6a85d-b647-40f7-bbad-c10b66bab038. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_uac_disable_notification.yml
