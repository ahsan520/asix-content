  - key: potential-autologger-sessions-tamperin-f37b4bce
    name: Potential AutoLogger Sessions Tampering
    description: |-
      Detects tampering with autologger trace sessions which is a technique used by attackers to disable logging.
      The AutoLogger event tracing session records events up that occur early in the operating system boot process.
      Applications and device drivers can use the AutoLogger session to capture traces before the user logs in, and also used by security solutions as telemetry source.
      Adversaries may disable these sessions to evade detection and prevent security monitoring of early boot activities and system events. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f37b4bce-49d0-4087-9f5b-58bffda77316. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_disable_autologger_sessions.yml
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path contains "\\Control\\WMI\\Autologger\\" and (xdm.target.registry.path ~= "(?:\\\\EventLog-|\\\\Defender)" and xdm.target.registry.path ~= "(?:\\\\Enabled|\\\\Start)$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")) and not ((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\wevtutil\\.exe$" or (xdm.source.process.executable.path ~= "^(?:C:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\|C:\\\\Program Files\\\\Windows Defender\\\\|C:\\\\Program Files \\(x86\\)\\\\Windows Defender\\\\)" and xdm.source.process.executable.path ~= "\\\\MsMpEng\\.exe$" and xdm.target.registry.path ~= "(?:\\\\DefenderApiLogger\\\\|\\\\DefenderAuditLogger\\\\)"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
