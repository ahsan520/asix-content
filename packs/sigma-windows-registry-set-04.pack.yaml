  - key: windows-vulnerable-driver-blocklist-di-d526c60a
    name: Windows Vulnerable Driver Blocklist Disabled
    description: |-
      Detects when the Windows Vulnerable Driver Blocklist is set to disabled. This setting is crucial for preventing the loading of known vulnerable drivers,
      and its modification may indicate an attempt to bypass security controls. It is often targeted by threat actors to facilitate the installation of malicious or vulnerable drivers,
      particularly in scenarios involving Endpoint Detection and Response (EDR) bypass techniques.
      This rule applies to systems that support the Vulnerable Driver Blocklist feature, including Windows 10 version 1903 and later, and Windows Server 2022 and later.
      Note that this change will require a reboot to take effect, and this rule only detects the registry modification action. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely and should be investigated immediately.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d526c60a-e236-4011-b165-831ffa52ab70. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_vulnerable_driver_blocklist_disable.yml
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\Control\\\\CI\\\\Config\\\\VulnerableDriverBlocklistEnable$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
