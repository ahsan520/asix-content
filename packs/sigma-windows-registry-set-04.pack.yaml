  - key: windows-hypervisor-enforced-code-integ-8b7273a4
    name: Windows Hypervisor Enforced Code Integrity Disabled
    description: 'Detects changes to the HypervisorEnforcedCodeIntegrity registry key and the "Enabled" value being set to 0 in order to disable the Hypervisor Enforced Code Integrity feature. This allows an attacker to load unsigned and untrusted code to be run in the kernel Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate system administration tasks that require disabling HVCI for troubleshooting purposes when certain drivers or applications are incompatible with it.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Anish Bogati, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8b7273a4-ba5d-4d8a-b04f-11f2900d043a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_deviceguard_hypervisorenforcedcodeintegrity_disabled.yml'
    kind: bioc
    severity: high
