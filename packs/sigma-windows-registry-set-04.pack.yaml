# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-registry-set-04
name: "Sigma: Windows registry set (4 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows registry set events, grouped by tactic registry_set. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - registry-set
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13)
rules:
  - key: hide-schedule-task-via-index-value-tam-5b16df71
    name: Hide Schedule Task Via Index Value Tamper
    description: |-
      Detects when the "index" value of a scheduled task is modified from the registry
      Which effectively hides it from any tooling such as "schtasks /query" (Read the referenced link for more information about the effects of this technique) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5b16df71-8615-4f7f-ac9b-6c43c0509e61. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_hide_scheduled_task_via_index_tamper.yml
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Schedule\\\\TaskCache\\\\Tree\\\\" and xdm.target.registry.path ~= "Index") and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hiding-user-account-via-specialaccount-f8aebc67
    name: Hiding User Account Via SpecialAccounts Registry Key
    description: 'Detects modifications to the registry key "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist" where the value is set to "0" in order to hide user account from being listed on the logon screen. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f8aebc67-a56d-4ec9-9fbe-7b0e8b7b4efd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_special_accounts.yml'
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1564.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\SpecialAccounts\\UserList" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hypervisor-enforced-paging-translation-7f2954d2
    name: Hypervisor Enforced Paging Translation Disabled
    description: 'Detects changes to the "DisableHypervisorEnforcedPagingTranslation" registry value. Where the it is set to "1" in order to disable the Hypervisor Enforced Paging Translation feature. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7f2954d2-99c2-4d42-a065-ca36740f187b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_deviceguard_hypervisorenforcedpagingtranslation_disabled.yml'
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\DisableHypervisorEnforcedPagingTranslation$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: ie-zonemap-setting-downgraded-to-mycom-3fd4c8d7
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
    description: "Detects changes to Internet Explorer's (IE / Windows Internet properties) ZoneMap configuration of the \"HTTP\" and \"HTTPS\" protocols to point to the \"My Computer\" zone. This allows downloaded files from the Internet to be granted the same level of trust as files stored locally. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Michael Haag (idea), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3fd4c8d7-8362-4557-a8e6-83b29cc0d724. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_ie_security_zone_protocol_defaults_downgrade.yml"
    kind: bioc
    severity: high
    category: registry_set
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\ZoneMap\\ProtocolDefaults" and xdm.target.registry.path ~= "(?:\\\\http|\\\\https)$" and xdm.target.registry.data contains "DWORD (0x00000000)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: internet-explorer-disablefirstruncusto-ab567429
    name: Internet Explorer DisableFirstRunCustomize Enabled
    description: 'Detects changes to the Internet Explorer "DisableFirstRunCustomize" value, which prevents Internet Explorer from running the first run wizard the first time a user starts the browser after installing Internet Explorer or Windows. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: As this is controlled by group policy as well as user settings. Some false positives may occur.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ab567429-1dfb-4674-b6d2-979fd2f9d125. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_internet_explorer_disable_first_run_customize.yml'
    kind: bioc
    severity: medium
    category: registry_set
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\Microsoft\\\\Internet Explorer\\\\Main\\\\DisableFirstRunCustomize$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000001\\)|DWORD \\(0x00000002\\))$") and not (xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\explorer\\.exe|C:\\\\Windows\\\\System32\\\\ie4uinit\\.exe)$") and not ((((xdm.source.process.executable.path ~= "\\\\Temp\\\\" and xdm.source.process.executable.path ~= "\\\\\\.cr\\\\avira_") and xdm.target.registry.data contains "DWORD (0x00000001)") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Foxit Software\\\\Foxit PDF Reader\\\\FoxitPDFReader\\.exe|C:\\\\Program Files\\\\Foxit Software\\\\Foxit PDF Reader\\\\FoxitPDFReader\\.exe)$" and xdm.target.registry.data contains "DWORD (0x00000001)"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lolbas-onedrivestandaloneupdater-exe-p-3aff0be0
    name: Lolbas OneDriveStandaloneUpdater.exe Proxy Download
    description: |-
      Detects setting a custom URL for OneDriveStandaloneUpdater.exe to download a file from the Internet without executing any
      anomalous executables with suspicious arguments. The downloaded file will be in C:\Users\redacted\AppData\Local\Microsoft\OneDrive\StandaloneUpdaterreSignInSettingsConfig.json Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3aff0be0-7802-4a7e-a4fa-c60c74bc5e1d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_lolbin_onedrivestandaloneupdater.yml
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\OneDrive\\UpdateOfficeConfig\\UpdateRingSettingURLFromOC"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-full-dump-request-via-dumptype-r-33efc23c
    name: Lsass Full Dump Request Via DumpType Registry Settings
    description: 'Detects the setting of the "DumpType" registry value to "2" which stands for a "Full Dump". Technique such as LSASS Shtinkering requires this value to be "2" in order to dump LSASS. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate application that needs to do a full dump of their process. Sigma rule by @pbssubhash, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 33efc23c-6ea2-4503-8cfe-bdf82ce8f719. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_lsass_usermode_dumping.yml'
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "(?:\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\LocalDumps\\\\DumpType|\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\LocalDumps\\\\lsass\\.exe\\\\DumpType)" and xdm.target.registry.data ~= "^DWORD \\(0x00000002\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: maxmpxct-registry-value-changed-0e6a9e62
    name: MaxMpxCt Registry Value Changed
    description: |-
      Detects changes to the "MaxMpxCt" registry value.
      MaxMpxCt specifies the maximum outstanding network requests for the server per client, which is used when negotiating a Server Message Block (SMB) connection with a client. Note if the value is set beyond 125 older Windows 9x clients will fail to negotiate.
      Ransomware threat actors and operators (specifically BlackCat) were seen increasing this value in order to handle a higher volume of traffic. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0e6a9e62-627e-496c-aef5-bfa39da29b5e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_optimize_file_sharing_network.yml
    kind: bioc
    severity: low
    category: registry_set
    mitre:
      - T1070.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "\\\\Services\\\\LanmanServer\\\\Parameters\\\\MaxMpxCt$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: microsoft-office-protected-view-disabl-a5c7a43f
    name: Microsoft Office Protected View Disabled
    description: "Detects changes to Microsoft Office protected view registry keys with which the attacker disables this feature. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a5c7a43f-6009-4a8c-80c5-32abf1c53ecc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_office_disable_protected_view_features.yml"
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\Office\\\\" and xdm.target.registry.path ~= "\\\\Security\\\\ProtectedView\\\\") and ((xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$" and xdm.target.registry.path ~= "(?:\\\\DisableAttachementsInPV|\\\\DisableInternetFilesInPV|\\\\DisableIntranetCheck|\\\\DisableUnsafeLocationsInPV)$") or (xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$" and xdm.target.registry.path ~= "(?:\\\\enabledatabasefileprotectedview|\\\\enableforeigntextfileprotectedview)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: new-file-association-using-exefile-44a22d59
    name: New File Association Using Exefile
    description: "Detects the abuse of the exefile handler in new file association. Used for bypass of security products. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Andreas Hunkeler (@Karneades), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 44a22d59-b175-4f13-8c16-cbaef5b581ff. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_file_association_exefile.yml"
    kind: bioc
    severity: high
    category: registry_set
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path contains "Classes\\." and xdm.target.registry.data ~= "^exefile$") and not (xdm.target.registry.path ~= "Classes\\\\\\.exe\\\\\\(Default\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: old-tls1-0-tls1-1-protocol-version-ena-439957a7
    name: Old TLS1.0/TLS1.1 Protocol Version Enabled
    description: 'Detects applications or users re-enabling old TLS versions by setting the "Enabled" value to "1" for the "Protocols" registry key. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate enabling of the old tls versions due to incompatibility. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 439957a7-ad86-4a8f-9705-a28131c6821b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_tls_protocol_old_version_enabled.yml'
    kind: bioc
    severity: medium
    category: registry_set
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "(?:\\\\Control\\\\SecurityProviders\\\\SCHANNEL\\\\Protocols\\\\TLS 1\\.0\\\\|\\\\Control\\\\SecurityProviders\\\\SCHANNEL\\\\Protocols\\\\TLS 1\\.1\\\\)" and xdm.target.registry.path ~= "\\\\Enabled$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-amsi-com-server-hijacking-160d2780
    name: Potential AMSI COM Server Hijacking
    description: "Detects changes to the AMSI come server registry key in order disable AMSI scanning functionalities. When AMSI attempts to starts its COM component, it will query its registered CLSID and return a non-existent COM server. This causes a load failure and prevents any scanning methods from being accessed, ultimately rendering AMSI useless Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 160d2780-31f7-4922-8b3a-efce30e63e96. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_amsi_com_hijack.yml"
    kind: bioc
    severity: high
    category: registry_set
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\CLSID\\\\\\{fdb00e52-a214-4aa1-8fba-4357bb0072ec\\}\\\\InProcServer32\\\\\\(Default\\)$" and not (xdm.target.registry.data ~= "^(?:%%SystemRoot%%\\\\System32\\\\amsi\\.dll|%%SystemRoot%%\\\\SysWOW64\\\\amsi\\.dll|%%windir%%\\\\System32\\\\amsi\\.dll|%%windir%%\\\\SysWOW64\\\\amsi\\.dll|%SystemRoot%\\\\System32\\\\amsi\\.dll|%SystemRoot%\\\\SysWOW64\\\\amsi\\.dll|%windir%\\\\System32\\\\amsi\\.dll|%windir%\\\\SysWOW64\\\\amsi\\.dll|C:\\\\Windows\\\\System32\\\\amsi\\.dll|C:\\\\Windows\\\\SysWOW64\\\\amsi\\.dll)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-attachment-manager-settings-a9b6c011
    name: Potential Attachment Manager Settings Associations Tamper
    description: "Detects tampering with attachment manager settings policies associations to lower the default file type risks (See reference for more information) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_policies_associations_tamper.yml"
    kind: bioc
    severity: high
    category: registry_set
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Associations\\" and ((xdm.target.registry.path ~= "\\\\DefaultFileTypeRisk$" and xdm.target.registry.data ~= "^DWORD \\(0x00006152\\)$") or (xdm.target.registry.path ~= "\\\\LowRiskFileTypes$" and xdm.target.registry.data ~= "(?:\\.zip;|\\.rar;|\\.exe;|\\.bat;|\\.com;|\\.cmd;|\\.reg;|\\.msi;|\\.htm;|\\.html;)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-attachment-manager-settings-ee77a5db
    name: Potential Attachment Manager Settings Attachments Tamper
    description: "Detects tampering with attachment manager settings policies attachments (See reference for more information) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ee77a5db-b0f3-4be2-bfd4-b58be1c6b15a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_policies_attachments_tamper.yml"
