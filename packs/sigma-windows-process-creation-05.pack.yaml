    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "set" and xdm.target.process.command_line ~= "&&" and xdm.target.process.command_line ~= "mshta" and xdm.target.process.command_line ~= "vbscript:createobject" and xdm.target.process.command_line ~= "\\.run" and xdm.target.process.command_line ~= "\\(window\\.close\\)")
