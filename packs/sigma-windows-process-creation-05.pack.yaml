  - key: new-agent-skills-installation-attempt-afa71271
    name: New Agent Skills Installation Attempt Via Node.EXE
    description: |-
      Detects the attempt to install new skills for AI agents using the "npx skills" command.
      Agent skills enhance AI agents with new capabilities, but attackers may abuse this mechanism to inject malicious commands executed by the agent on behalf of the user.
      The "npx skills" command can install skills for various agents (e.g., Claude Code, Cursor, and others).
      Analysts should review any installed skills to verify their legitimacy.
      Note: Tune this rule based on whether AI agent tooling is allowed in your environment.
      In environments where such tooling is authorized, this detection may reflect normal activity and the alert level should be adjusted accordingly.
      In environments where AI agent tooling is not permitted, this activity is likely suspicious and may require immediate investigation. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: This rule will be triggered when a new agent skill is installed regardless if it is benign or malicious.; High false positive rate expected in environments where AI agent tooling is authorized and commonly used.. Sigma rule by Marco Pedrinazzi (@pedrinazziM) (InTheCyber), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id afa71271-6a97-4e47-810f-83120fb1a4ce. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_node_new_agent_skills_installed.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\node\\.exe$" or xdm.target.process.original_file_name ~= "^node\\.exe$") and (xdm.target.process.command_line ~= "npx-cli\\.js" and xdm.target.process.command_line ~= "skills " and xdm.target.process.command_line ~= " add "))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
