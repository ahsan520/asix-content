  - key: potential-dll-injection-via-acccheckco-0f6da907
    name: Potential DLL Injection Via AccCheckConsole
    description: |-
      Detects the execution "AccCheckConsole" a command-line tool for verifying the accessibility implementation of an application's UI.
      One of the tests that this checker can run are called "verification routine", which tests for things like Consistency, Navigation, etc.
      The tool allows a user to provide a DLL that can contain a custom "verification routine". An attacker can build such DLLs and pass it via the CLI, which would then be loaded in the context of the "AccCheckConsole" utility. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of the UI Accessibility Checker. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0f6da907-5854-4be6-859a-e9958747b0aa. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_acccheckconsole_execution.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\AccCheckConsole\\.exe$" or xdm.target.process.original_file_name ~= "^AccCheckConsole\\.exe$") and xdm.target.process.command_line ~= "(?: -hwnd| -process | -window )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
