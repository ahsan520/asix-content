      Attackers can abuse this utility in order to download arbitrary files via a configuration file.
      Inspect the location and the content of the file passed as an argument in order to determine if it is suspicious. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f37aba28-a9e6-4045-882c-d5004043b337. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmdl32_arbitrary_file_download.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1218
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\cmdl32\\.exe$" or xdm.target.process.original_file_name ~= "^CMDL32\\.EXE$") and (xdm.target.process.command_line ~= "/vpn" and xdm.target.process.command_line ~= "/lan"))
