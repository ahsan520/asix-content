    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "&&set" and xdm.target.process.command_line ~= "cmd" and xdm.target.process.command_line ~= "/c" and xdm.target.process.command_line ~= "-f") and xdm.target.process.command_line ~= "(?:\\{0\\}|\\{1\\}|\\{2\\}|\\{3\\}|\\{4\\}|\\{5\\})")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-via-use-mshta-ac20ae82
    name: Invoke-Obfuscation Via Use MSHTA
    description: "Detects Obfuscated Powershell via use MSHTA in Scripts Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nikita Nazarov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ac20ae82-8758-4f38-958e-b44a3140ca88. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_via_use_mhsta.yml"
