  - key: potential-commandline-path-traversal-v-087790e3
    name: Potential CommandLine Path Traversal Via Cmd.EXE
    description: "Detects potential path traversal attempt via cmd.exe. Could indicate possible command/argument confusion/hijacking Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Java tools are known to produce false-positive when loading libraries. Sigma rule by xknow @xknow_infosec, Tim Shelton, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 087790e3-3287-436c-bccf-cbd0184a7db1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_path_traversal.yml"
