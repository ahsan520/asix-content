# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-05
name: "Sigma: Windows process creation (5 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Execution. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: invoke-obfuscation-clip-launcher-b222df08
    name: Invoke-Obfuscation CLIP+ Launcher
    description: "Detects Obfuscated use of Clip.exe to execute PowerShell Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Jonathan Cheong, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b222df08-0e07-11eb-adc1-0242ac120002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_clip.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "cmd" and xdm.target.process.command_line ~= "&&" and xdm.target.process.command_line ~= "clipboard\\]::" and xdm.target.process.command_line ~= "-f") and xdm.target.process.command_line ~= "(?:/c|/r)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-compress-obfuscatio-7eedcc9d
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    description: "Detects Obfuscated Powershell via COMPRESS OBFUSCATION Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Timur Zinniatullin, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_via_compress.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "new-object" and xdm.target.process.command_line ~= "text\\.encoding\\]::ascii") and xdm.target.process.command_line ~= "(?:system\\.io\\.compression\\.deflatestream|system\\.io\\.streamreader|readtoend\\()")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-obfuscated-iex-invo-4bf943c6
    name: Invoke-Obfuscation Obfuscated IEX Invocation
    description: "Detects all variations of obfuscated powershell IEX invocation code generated by Invoke-Obfuscation framework from the following code block Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Daniel Bohannon (@Mandiant/@FireEye), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4bf943c6-5146-4273-98dd-e958fd1e3abf. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_obfuscated_iex_commandline.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "\\$PSHome\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$PSHome\\[" or xdm.target.process.command_line ~= "\\$ShellId\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$ShellId\\[" or xdm.target.process.command_line ~= "\\$env:Public\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$env:Public\\[" or xdm.target.process.command_line ~= "\\$env:ComSpec\\[(?:\\s*\\d{1,3}\\s*,){2}" or xdm.target.process.command_line ~= "\\*mdr\\*\\W\\s*\\)\\.Name" or xdm.target.process.command_line ~= "\\$VerbosePreference\\.ToString\\(" or xdm.target.process.command_line ~= "\\[String\\]\\s*\\$VerbosePreference")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-stdin-launcher-6c96fc76
    name: Invoke-Obfuscation STDIN+ Launcher
    description: "Detects Obfuscated use of stdin to execute PowerShell Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Jonathan Cheong, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6c96fc76-0eb1-11eb-adc1-0242ac120002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_stdin.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "cmd.{0,5}(?:/c|/r).+powershell.+(?:\\$\\{?input\\}?|noexit).+\\\""
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-var-launcher-27aec9c9
    name: Invoke-Obfuscation VAR+ Launcher
    description: "Detects Obfuscated use of Environment Variables to execute PowerShell Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Jonathan Cheong, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 27aec9c9-dbb0-4939-8422-1742242471d0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_var.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "cmd.{0,5}(?:/c|/r)(?:\\s|)\\\"set\\s[a-zA-Z]{3,6}.*(?:\\{\\d\\}){1,}\\\\\\\"\\s+?\\-f(?:.*\\)){1,}.*\\\""
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invoke-obfuscation-var-launcher-obfusc-e9f55347
    name: Invoke-Obfuscation VAR++ LAUNCHER OBFUSCATION
    description: "Detects Obfuscated Powershell via VAR++ LAUNCHER Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Timur Zinniatullin, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e9f55347-2928-4c06-88e5-1a7f8169942e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_invoke_obfuscation_via_var.yml"
    kind: bioc
