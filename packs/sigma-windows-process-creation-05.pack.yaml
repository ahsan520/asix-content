  - key: java-running-with-remote-debugging-8f88e3f6
    name: Java Running with Remote Debugging
    description: "Detects a JAVA process running with remote debugging allowing more than just localhost to connect Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_java_remote_debugging.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1203
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line contains "transport=dt_socket,address=" and xdm.target.process.command_line ~= "(?:jre1\\.|jdk1\\.)") and not (xdm.target.process.command_line ~= "(?:address=127\\.0\\.0\\.1|address=localhost)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: jscript-compiler-execution-52788a70
    name: JScript Compiler Execution
    description: |-
      Detects the execution of the "jsc.exe" (JScript Compiler).
      Attacker might abuse this in order to compile JScript files on the fly and bypassing application whitelisting. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use to compile JScript by developers.. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 52788a70-f1da-40dd-8fbd-73b5865d6568. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_jsc_execution.yml
    kind: bioc
    severity: low
    category: Execution
    mitre:
      - T1127
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\jsc\\.exe$" or xdm.target.process.original_file_name ~= "^jsc\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: kavremover-dropped-binary-lolbin-usage-d047726b
    name: Kavremover Dropped Binary LOLBIN Usage
    description: "Detects the execution of a signed binary dropped by Kaspersky Lab Products Remover (kavremover) which can be abused as a LOLBIN to execute arbitrary commands and binaries. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d047726b-c71c-4048-a99b-2e2f50dc107d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_kavremover_uncommon_execution.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1127
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains " run run-cmd " and not (xdm.source.process.executable.path ~= "(?:\\\\cleanapi\\.exe|\\\\kavremover\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: local-file-read-using-curl-exe-aa6f6ea6
    name: Local File Read Using Curl.EXE
    description: 'Detects execution of "curl.exe" with the "file://" protocol handler in order to read local files. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id aa6f6ea6-0676-40dd-b510-6e46f02d8867. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_curl_local_file_read.yml'
    kind: bioc
    severity: medium
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\curl\\.exe$" or xdm.target.process.original_file_name ~= "^curl\\.exe$") and xdm.target.process.command_line contains "file:///")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
