  - key: mmc-executing-files-with-reversed-exte-9cfe4b27
    name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
    description: "Detects malicious behavior where the MMC utility (`mmc.exe`) executes files with reversed extensions caused by Right-to-Left Override (RLO) abuse, disguising them as document formats. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative actions using MMC to execute misnamed `.msc` files.; Unconventional but non-malicious usage of RLO or reversed extensions.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9cfe4b27-1e56-48b4-b7a8-d46851c91a44. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_mmc_rlo_abuse_pattern.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.002
      - T1218.014
      - T1036.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\mmc\\.exe$" or xdm.target.process.original_file_name ~= "^MMC\\.exe$") and xdm.target.process.command_line ~= "(?:cod\\.msc|fdp\\.msc|ftr\\.msc|lmth\\.msc|slx\\.msc|tdo\\.msc|xcod\\.msc|xslx\\.msc|xtpp\\.msc)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: mmc20-lateral-movement-f1f3bf22
