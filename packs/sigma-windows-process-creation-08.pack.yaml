# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-08
name: "Sigma: Windows process creation (8 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Execution. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: suspicious-autorun-registry-modified-v-c80e66d8
    name: Suspicious Autorun Registry Modified via WMI
    description: "Detects suspicious activity where the WMIC process is used to create an autorun registry entry via reg.exe, which is often indicative of persistence mechanisms employed by malware. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative activity or software installations. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c80e66d8-1780-48a9-b412-46663fd21ac0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_autorun_registry_modified_via_wmic.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1547.001
      - T1047
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\wmic\\.exe$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$" or xdm.source.process.executable.path ~= "\\\\wmiprvse\\.exe$") and ((xdm.target.process.command_line ~= "reg" and xdm.target.process.command_line ~= " add ") and xdm.target.process.command_line ~= "(?:\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run)")) and (xdm.target.process.command_line ~= "(?::\\\\Perflogs|:\\\\ProgramData'|:\\\\Windows\\\\Temp|:\\\\Temp|\\\\AppData\\\\Local\\\\Temp|\\\\AppData\\\\Roaming|:\\\\\\$Recycle\\.bin|:\\\\Users\\\\Default|:\\\\Users\\\\public|%temp%|%tmp%|%Public%|%AppData%)" or (xdm.target.process.command_line contains ":\\Users\\" and xdm.target.process.command_line ~= "(?:\\\\Favorites|\\\\Favourites|\\\\Contacts|\\\\Music|\\\\Pictures|\\\\Documents|\\\\Photos)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-binary-in-user-directory-sp-aa3a6f94
    name: Suspicious Binary In User Directory Spawned From Office Application
    description: "Detects an executable in the users directory started from one of the Microsoft Office suite applications (Word, Excel, PowerPoint, Publisher, Visio) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Jason Lynch, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id aa3a6f94-890e-4e22-b634-ffdfd54792cc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_office_spawn_exe_from_users_directory.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "(?:\\\\WINWORD\\.EXE|\\\\EXCEL\\.EXE|\\\\POWERPNT\\.exe|\\\\MSPUB\\.exe|\\\\VISIO\\.exe|\\\\MSACCESS\\.exe|\\\\EQNEDT32\\.exe)$" and xdm.target.process.executable.path ~= "^C:\\\\users\\\\" and xdm.target.process.executable.path ~= "\\.exe$") and not (xdm.target.process.executable.path ~= "\\\\Teams\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
