      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "for /f" and xdm.target.process.command_line ~= "tokens=" and xdm.target.process.command_line ~= "in \\(" and xdm.target.process.command_line ~= "dir") or (xdm.source.process.command_line ~= "for /f" and xdm.source.process.command_line ~= "tokens=" and xdm.source.process.command_line ~= "in \\(" and xdm.source.process.command_line ~= "dir"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
