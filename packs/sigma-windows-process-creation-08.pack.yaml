    name: Suspicious Encoded PowerShell Command Line
    description: "Detects suspicious powershell process starts with base64 encoded commands (e.g. Emotet) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Sigma rule by Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, Anton Kutepov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ca2092a1-c273-4878-9b4b-0d60115bf5ea. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and ((xdm.target.process.command_line contains " -e" and xdm.target.process.command_line ~= "(?: JAB| SUVYI| SQBFAFgA| aQBlAHgA| aWV4I| IAA| IAB| UwB| cwB)") or xdm.target.process.command_line ~= "(?:\\.exe -ENCOD | BA\\^J e-)") and not (xdm.target.process.command_line contains " -ExecutionPolicy remotesigned "))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
