    description: "Detects Executables in the Downloads folder without FileVersion,Description,Product,Company likely created with py2exe Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Markus Neis, Sander Wiebing, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9637e8a5-7131-4f7f-bdc7-2b05d8670c43. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_file_characteristics.yml"
