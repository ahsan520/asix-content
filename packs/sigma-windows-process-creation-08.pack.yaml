  - key: suspicious-clickfix-filefix-execution-d487ed4a
    name: Suspicious ClickFix/FileFix Execution Pattern
    description: |-
      Detects suspicious execution patterns where users are tricked into running malicious commands via clipboard manipulation, either through the Windows Run dialog (ClickFix) or File Explorer address bar (FileFix).
      Attackers leverage social engineering campaigns—such as fake CAPTCHA challenges or urgent alerts—encouraging victims to paste clipboard contents, often executing mshta.exe, powershell.exe, or similar commands to infect systems. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by montysecurity, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d487ed4a-fd24-436d-a0b2-f4e95f7b2635. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_clickfix_filefix_execution.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.001
      - T1204.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\explorer\\.exe$" and xdm.target.process.command_line contains "#") and xdm.target.process.command_line ~= "(?:account|anti-bot|botcheck|captcha|challenge|confirmation|fraud|human|identification|identificator|identity|robot|validation|verification|verify)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-csi-exe-usage-40b95d31
    name: Suspicious Csi.exe Usage
    description: "Csi.exe is a signed binary from Microsoft that comes with Visual Studio and provides C# interactive capabilities. It can be used to run C# code from a file passed as a parameter in command line. Early version of this utility provided with Microsoft “Roslyn” Community Technology Preview was named 'rcsi.exe' Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate usage by software developers. Sigma rule by Konstantin Grishchenko, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 40b95d31-1afc-469e-8d34-9a3a667d058e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_csi_execution.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1072
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\csi\\.exe|\\\\rcsi\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:csi\\.exe|rcsi\\.exe)$") and xdm.target.process.company ~= "^Microsoft Corporation$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
