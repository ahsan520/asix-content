  - key: suspicious-explorer-process-with-white-3ae9974a
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    description: |-
      Detects process creation with suspicious whitespace padding followed by a '#' character, which may indicate ClickFix or FileFix techniques used to conceal malicious commands from visual inspection.
      ClickFix and FileFix are social engineering attack techniques where adversaries distribute phishing documents or malicious links that deceive users into opening the Windows Run dialog box or File Explorer search bar.
      The victims are then instructed to paste commands from their clipboard, which contain extensive whitespace padding using various Unicode space characters to push the actual malicious command far to the right, effectively hiding it from immediate view. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3ae9974a-eb09-4044-8e70-8980a50c12c8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_clickfix_filefix_whitespace_padding.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.004
      - T1027.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\explorer\\.exe$" and xdm.target.process.command_line contains "#") and xdm.target.process.command_line ~= "(?:            |            |            |            |            |            |            |            |            |            |            |            |            )")
      group_by: field:xdm.source.host.hostname
