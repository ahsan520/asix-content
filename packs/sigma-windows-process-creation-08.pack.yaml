  - key: suspicious-lnk-command-line-padding-wi-dd8756e7
    name: Suspicious LNK Command-Line Padding with Whitespace Characters
    description: |-
      Detects exploitation of LNK file command-line length discrepancy, where attackers hide malicious commands beyond the 260-character UI limit while the actual command-line argument field supports 4096 characters using whitespace padding (e.g., 0x20, 0x09-0x0D).
      Adversaries insert non-printable whitespace characters (e.g., Line Feed \x0A, Carriage Return \x0D) to pad the visible section of the LNK file, pushing malicious commands past the UI-visible boundary.
      The hidden payload, executed at runtime but invisible in Windows Explorer properties, enables stealthy execution and evasion—commonly used for social engineering attacks.
      This rule flags suspicious use of such padding observed in real-world attacks. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dd8756e7-a3a0-4768-b47e-8f545d1a751c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_lnk_exec_hidden_cmd.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\explorer\\.exe$" or xdm.source.process.command_line contains ".lnk") and (xdm.target.process.command_line ~= "(?:                 |\\\\u0009|\\\\u000A|\\\\u0011|\\\\u0012|\\\\u0013|\\\\u000B|\\\\u000C|\\\\u000D)" or xdm.target.process.command_line ~= "\\n\\n\\n\\n\\n\\n"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
