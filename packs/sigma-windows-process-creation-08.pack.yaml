      xql: xdm.event.type = "process" and (((xdm.target.process.description ~= "^\\?$" and xdm.target.process.file_version ~= "^\\?$") or (xdm.target.process.description ~= "^\\?$" and xdm.target.process.product ~= "^\\?$") or (xdm.target.process.description ~= "^\\?$" and xdm.target.process.company ~= "^\\?$")) and xdm.target.process.executable.path contains "\\Downloads\\")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-file-download-from-file-sha-56454143
