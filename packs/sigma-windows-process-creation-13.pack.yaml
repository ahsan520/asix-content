  - key: cmd-launched-with-hidden-start-flags-t-5a6b7c8d
    name: Cmd Launched with Hidden Start Flags to Suspicious Targets
    description: |-
      Detects cmd.exe executing commands with the "start" utility using "/b" (no window) or "/min" (minimized) flags.
      To reduce false positives from standard background tasks, detection is restricted to scenarios where the target is a known script extension or located in suspicious temporary/public directories.
      This technique was observed in Chaos, DarkSide, and Emotet malware campaigns. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative scripts running from temporary folders.; Niche software updaters utilizing hidden batch files in ProgramData.. Sigma rule by Vladan Sekulic, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_launched_with_hidden_start_flag.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1564.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" or xdm.target.process.original_file_name ~= "^Cmd\\.Exe$") and xdm.target.process.command_line ~= "(?:start |start/b|start/min)" and xdm.target.process.command_line ~= "(?:[-/–—―]b |[-/–—―]b\"|[-/–—―]min |[-/–—―]min\")") and (xdm.target.process.command_line ~= "(?::\\\\Perflogs\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Default\\\\|:\\\\Windows\\\\Temp\\\\|\\\\AppData\\\\Roaming\\\\|\\\\Contacts\\\\|\\\\Documents\\\\|\\\\Downloads\\\\|\\\\Favorites\\\\|\\\\Favourites\\\\|\\\\inetpub\\\\|\\\\Music\\\\|\\\\Photos\\\\|\\\\Temporary Internet\\\\|\\\\Users\\\\Public\\\\|\\\\Videos\\\\)" or xdm.target.process.command_line ~= "(?:\\.bat|\\.cmd|\\.cpl|\\.hta|\\.js|\\.ps1|\\.scr|\\.vbe|\\.vbs)" or xdm.target.process.command_line ~= "(?: -nop | -sta |\\.downloadfile\\(|\\.downloadstring\\(|-noni |-w hidden )"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
