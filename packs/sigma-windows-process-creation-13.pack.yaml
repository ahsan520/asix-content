  - key: disabling-windows-defender-wmi-autolog-a1b2c3d4
    name: Disabling Windows Defender WMI Autologger Session via Reg.exe
    description: |-
      Detects the use of reg.exe to disable the Event Tracing for Windows (ETW) Autologger session for Windows Defender API and Audit events.
      By setting the 'Start' value to '0' for the 'DefenderApiLogger' or 'DefenderAuditLogger' session, an attacker can prevent these critical security events
      from being logged, effectively blinding monitoring tools that rely on this data. This is a powerful defense evasion technique. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Highly unlikely. Sigma rule by Matt Anderson (Huntress), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_disable_defender_wmi_autologger.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" or xdm.target.process.original_file_name ~= "^reg\\.exe$") and xdm.target.process.command_line ~= "(?:\\\\Control\\\\WMI\\\\Autologger\\\\DefenderApiLogger\\\\Start|\\\\Control\\\\WMI\\\\Autologger\\\\DefenderAuditLogger\\\\Start)" and (xdm.target.process.command_line ~= "add" and xdm.target.process.command_line ~= "0")) and not (xdm.target.process.command_line contains "0x00000001"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: diskshadow-script-mode-execution-from-fa1a7e52
    name: Diskshadow Script Mode - Execution From Potential Suspicious Location
    description: 'Detects execution of "Diskshadow.exe" in script mode using the "/s" flag where the script is located in a potentially suspicious location. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: False positives may occur if you execute the script from one of the paths mentioned in the rule. Apply additional filters that fits your org needs.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fa1a7e52-3d02-435b-81b8-00da14dd66c1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_diskshadow_script_mode_susp_location.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^diskshadow\\.exe$" or xdm.target.process.executable.path ~= "\\\\diskshadow\\.exe$") and xdm.target.process.command_line ~= "[-/–—―]s " and xdm.target.process.command_line ~= "(?::\\\\Temp\\\\|:\\\\Windows\\\\Temp\\\\|\\\\AppData\\\\Local\\\\|\\\\AppData\\\\Roaming\\\\|\\\\ProgramData\\\\|\\\\Users\\\\Public\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: diskshadow-script-mode-uncommon-script-1dde5376
    name: Diskshadow Script Mode - Uncommon Script Extension Execution
    description: |-
      Detects execution of "Diskshadow.exe" in script mode to execute an script with a potentially uncommon extension.
      Initial baselining of the allowed extension list is required. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: False postitve might occur with legitimate or uncommon extensions used internally. Initial baseline is required.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1dde5376-a648-492e-9e54-4241dd9b0c7f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_diskshadow_script_mode_susp_ext.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.original_file_name ~= "^diskshadow\\.exe$" or xdm.target.process.executable.path ~= "\\\\diskshadow\\.exe$") and xdm.target.process.command_line ~= "[-/–—―]s ") and not (xdm.target.process.command_line contains ".txt"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
