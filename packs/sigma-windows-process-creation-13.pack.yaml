  - key: cloudflared-quick-tunnel-execution-222129f7
    name: Cloudflared Quick Tunnel Execution
    description: |-
      Detects creation of an ad-hoc Cloudflare Quick Tunnel, which can be used to tunnel local services such as HTTP, RDP, SSH and SMB.
      The free TryCloudflare Quick Tunnel will generate a random subdomain on trycloudflare[.]com, following a call to api[.]trycloudflare[.]com.
      The tool has been observed in use by threat groups including Akira ransomware. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate usage of Cloudflare Quick Tunnel. Sigma rule by Sajid Nawaz Khan, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 222129f7-f4dc-4568-b0d2-22440a9639ba. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cloudflared_quicktunnel_execution.yml
