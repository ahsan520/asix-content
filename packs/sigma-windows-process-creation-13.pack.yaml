      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: bypass-uac-via-cmstp-e66779cc
    name: Bypass UAC via CMSTP
    description: "Detect commandline usage of Microsoft Connection Manager Profile Installer (cmstp.exe) to install specially formatted local .INF files Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of cmstp.exe utility by legitimate user. Sigma rule by E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e66779cc-383e-4224-a3a4-267eeb585c40. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_uac_bypass_cmstp.yml"
