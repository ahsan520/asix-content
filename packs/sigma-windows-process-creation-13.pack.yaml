  - key: cloudflared-tunnel-execution-9a019ffc
    name: Cloudflared Tunnel Execution
    description: 'Detects execution of the "cloudflared" tool to connect back to a tunnel. This was seen used by threat actors to maintain persistence and remote access to compromised networks. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate usage of Cloudflared tunnel.. Sigma rule by Janantha Marasinghe, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cloudflared_tunnel_run.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1102
      - T1090
      - T1572
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= " tunnel " and xdm.target.process.command_line ~= " run ") and xdm.target.process.command_line ~= "(?:-config |-credentials-contents |-credentials-file |-token )")
