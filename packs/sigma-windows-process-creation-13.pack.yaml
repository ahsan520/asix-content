  - key: disabled-volume-snapshots-dee4af55
    name: Disabled Volume Snapshots
    description: "Detects commands that temporarily turn off Volume Snapshots Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate administration. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_volsnap_disable.yml"
