# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-13
name: "Sigma: Windows process creation (13 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic, starting with Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: webshell-tool-reconnaissance-activity-f64e5c19
    name: Webshell Tool Reconnaissance Activity
    description: "Detects processes spawned from web servers (PHP, Tomcat, IIS, etc.) that perform reconnaissance looking for the existence of popular scripting tools (perl, python, wget) on the system via the help commands Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Cian Heasley, Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f64e5c19-879c-4bae-b471-6d84c8339677. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_webshell_tool_recon.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1505.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "(?:\\\\caddy\\.exe|\\\\httpd\\.exe|\\\\nginx\\.exe|\\\\php-cgi\\.exe|\\\\w3wp\\.exe|\\\\ws_tomcatservice\\.exe)$" or (xdm.source.process.executable.path ~= "(?:\\\\java\\.exe|\\\\javaw\\.exe)$" and xdm.source.process.executable.path ~= "(?:-tomcat-|\\\\tomcat)") or (xdm.source.process.executable.path ~= "(?:\\\\java\\.exe|\\\\javaw\\.exe)$" and xdm.target.process.command_line ~= "(?:CATALINA_HOME|catalina\\.jar)")) and xdm.target.process.command_line ~= "(?:perl --help|perl -h|python --help|python -h|python3 --help|python3 -h|wget --help)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: wmi-backdoor-exchange-transport-agent-797011dc
    name: WMI Backdoor Exchange Transport Agent
    description: "Detects a WMI backdoor in Exchange Transport Agents via WMI event filters Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 797011dc-44f4-4e6f-9f10-a8ceefbe566b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmi_backdoor_exchange_transport_agent.yml"
    kind: bioc
    severity: critical
    category: Persistence
    mitre:
      - T1546.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\EdgeTransport\\.exe$" and not ((xdm.target.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\conhost\\.exe$" or (xdm.target.process.executable.path ~= "^C:\\\\Program Files\\\\Microsoft\\\\Exchange Server\\\\" and xdm.target.process.executable.path ~= "\\\\Bin\\\\OleConverter\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: wmi-persistence-script-event-consumer-ec1d5e28
    name: WMI Persistence - Script Event Consumer
    description: |-
      Detects the execution of a script event consumer. When scrcons.exe launches, it does so in response to the creation of an ActiveScriptEventConsumer instance
      and will execute registered JScript or VBScript code as a result.
      Script event consumers are a built-in Windows Management Instrumentation (WMI) class that
      automatically executes a predefined script (in VBScript or JScript) whenever a specific system event occurs.
      Adversaries often abuse script event consumers to maintain persistence on a compromised host
      by executing a malicious script whenever a specific event occurs. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate event consumers; Dell computers on some versions register an event consumer that is known to cause false positives when brightness is changed by the corresponding keyboard button. Sigma rule by Thomas Patzke, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmi_persistence_script_event_consumer.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1546.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "^C:\\\\WINDOWS\\\\system32\\\\wbem\\\\scrcons\\.exe$" and xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\svchost\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: writing-of-malicious-files-to-the-font-ae9b0bd7
    name: Writing Of Malicious Files To The Fonts Folder
    description: "Monitors for the hiding possible malicious files in the C:\\Windows\\Fonts\\ location. This folder doesn't require admin privillege to be written and executed from. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Sreeman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ae9b0bd7-8888-4606-b444-0ed7410cb728. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_hiding_malware_in_fonts_folder.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1211
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:echo|copy|type|file createnew|cacls)" and xdm.target.process.command_line contains "C:\\Windows\\Fonts\\" and xdm.target.process.command_line ~= "(?:\\.sh|\\.exe|\\.dll|\\.bin|\\.bat|\\.cmd|\\.js|\\.msh|\\.reg|\\.scr|\\.ps|\\.vb|\\.jar|\\.pl|\\.inf|\\.cpl|\\.hta|\\.msi|\\.vbs)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: xwizard-exe-execution-from-non-default-193d5ccd
    name: Xwizard.EXE Execution From Non-Default Location
    description: |-
      Detects the execution of Xwizard tool from a non-default directory.
      When executed from a non-default directory, this utility can be abused in order to side load a custom version of "xwizards.dll". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Windows installed on non-C drive. Sigma rule by Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_xwizard_execution_non_default_location.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1574.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\xwizard\\.exe$" or xdm.target.process.original_file_name ~= "^xwizard\\.exe$") and not (xdm.target.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\|C:\\\\Windows\\\\WinSxS\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: abusing-print-executable-bafac3d6
    name: Abusing Print Executable
    description: "Attackers can use print.exe for remote file copy Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id bafac3d6-7de9-4dd9-8874-4a1194b493ed. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_print_remote_file_copy.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\print\\.exe$" and xdm.target.process.command_line ~= "^print" and (xdm.target.process.command_line ~= "/D" and xdm.target.process.command_line ~= "\\.exe")) and not (xdm.target.process.command_line contains "print.exe"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: add-safeboot-keys-via-reg-utility-d7662ff6
    name: Add SafeBoot Keys Via Reg Utility
    description: 'Detects execution of "reg.exe" commands with the "add" or "copy" flags on safe boot registry keys. Often used by attacker to allow the ransomware to work in safe mode as some security products do not Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d7662ff6-9e97-4596-a61d-9839e32dee8d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_add_safeboot.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" or xdm.target.process.original_file_name ~= "^reg\\.exe$") and xdm.target.process.command_line contains "\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot" and xdm.target.process.command_line ~= "(?: copy | add )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: addinutil-exe-execution-from-uncommon-6120ac2a
    name: AddinUtil.EXE Execution From Uncommon Directory
    description: "Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) from a non-standard directory. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6120ac2a-a34b-42c0-a9bd-1fb9f459f348. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_addinutil_uncommon_dir_exec.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\addinutil\\.exe$" or xdm.target.process.original_file_name ~= "^AddInUtil\\.exe$") and not (xdm.target.process.executable.path ~= "(?::\\\\Windows\\\\Microsoft\\.NET\\\\Framework\\\\|:\\\\Windows\\\\Microsoft\\.NET\\\\Framework64\\\\|:\\\\Windows\\\\Microsoft\\.NET\\\\FrameworkArm\\\\|:\\\\Windows\\\\Microsoft\\.NET\\\\FrameworkArm64\\\\|:\\\\Windows\\\\WinSxS\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: agentexecutor-powershell-execution-7efd2c8d
    name: AgentExecutor PowerShell Execution
    description: 'Detects execution of the AgentExecutor.exe binary. Which can be abused as a LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any binary named "powershell.exe" located in the path provided by 6th positional argument Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use via Intune management. You exclude script paths and names to reduce FP rate. Sigma rule by Nasreddine Bencherchali (Nextron Systems), memory-shards, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7efd2c8d-8b18-45b7-947d-adfe9ed04f61. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_agentexecutor_potential_abuse.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\AgentExecutor\\.exe$" or xdm.target.process.original_file_name ~= "^AgentExecutor\\.exe$") and xdm.target.process.command_line ~= "(?: -powershell| -remediationScript)") and not (xdm.source.process.executable.path ~= "\\\\Microsoft\\.Management\\.Services\\.IntuneWindowsAgent\\.exe$"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: always-install-elevated-msi-spawned-cm-1e53dd56
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    description: 'Detects Windows Installer service (msiexec.exe) spawning "cmd" or "powershell" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1e53dd56-8d83-4eb4-a43e-b790a05510aa. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_elavated_msi_spawned_shell.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1548.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:Cmd\\.Exe|PowerShell\\.EXE|pwsh\\.dll)$") and ((xdm.source.process.executable.path ~= "\\\\Windows\\\\Installer\\\\" and xdm.source.process.executable.path ~= "msi") and xdm.source.process.executable.path ~= "tmp$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: arbitrary-dll-or-csproj-code-execution-d80d5c81
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    description: 'Detects execution of arbitrary DLLs or unsigned code via a ".csproj" files via Dotnet.EXE. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrator usage. Sigma rule by Beyu Denis, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d80d5c81-04ba-45b4-84e4-92eba40e0ad3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dotnet_arbitrary_dll_csproj_execution.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\dotnet\\.exe$" or xdm.target.process.original_file_name ~= "^\\.NET Host$") and xdm.target.process.command_line ~= "(?:\\.csproj|\\.csproj\"|\\.dll|\\.dll\"|\\.csproj'|\\.dll')$") and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Notepad\\+\\+\\\\notepad\\+\\+\\.exe|C:\\\\Program Files\\\\Notepad\\+\\+\\\\notepad\\+\\+\\.exe)$" and (xdm.target.process.command_line ~= "C:\\\\ProgramData\\\\CSScriptNpp\\\\" and xdm.target.process.command_line ~= "-cscs_path:" and xdm.target.process.command_line ~= "\\\\cs-script\\\\cscs\\.dll"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: arbitrary-file-download-via-gfxdownloa-eee00933
    name: Arbitrary File Download Via GfxDownloadWrapper.EXE
    description: "Detects execution of GfxDownloadWrapper.exe with a URL as an argument to download file. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Victor Sergeev, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id eee00933-a761-4cd0-be70-c42fe91731e7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_gfxdownloadwrapper_arbitrary_file_download.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\GfxDownloadWrapper\\.exe$" and xdm.target.process.command_line ~= "(?:http://|https://)") and not (xdm.target.process.command_line contains "https://gameplayapi.intel.com/"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: assembly-loading-via-cl-loadassembly-p-c57872c7
    name: Assembly Loading Via CL_LoadAssembly.ps1
    description: 'Detects calls to "LoadAssemblyFromPath" or "LoadAssemblyFromNS" that are part of the "CL_LoadAssembly.ps1" script. This can be abused to load different assemblies and bypass App locker controls. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c57872c7-614f-4d7f-a40d-b78c8df2d30d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cl_loadassembly.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:LoadAssemblyFromPath |LoadAssemblyFromNS )"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: audit-policy-tampering-via-auditpol-0a13e132
    name: Audit Policy Tampering Via Auditpol
    description: |-
      Threat actors can use auditpol binary to change audit policy configuration to impair detection capability.
      This can be carried out by selectively disabling/removing certain audit policies as well as restoring a custom policy owned by the threat actor. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administrator or administrator scripts might leverage the flags mentioned in the detection section. Either way, it should always be monitored. Sigma rule by Janantha Marasinghe (https://github.com/blueteam0ps), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0a13e132-651d-11eb-ae93-0242ac130002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_auditpol_susp_execution.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\auditpol\\.exe$" or xdm.target.process.original_file_name ~= "^AUDITPOL\\.EXE$") and xdm.target.process.command_line ~= "(?:disable|clear|remove|restore)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: audit-policy-tampering-via-nt-resource-c6c56ada
    name: Audit Policy Tampering Via NT Resource Kit Auditpol
    description: |-
      Threat actors can use an older version of the auditpol binary available inside the NT resource kit to change audit policy configuration to impair detection capability.
      This can be carried out by selectively disabling/removing certain audit policies as well as restoring a custom policy owned by the threat actor. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: The old auditpol utility isn't available by default on recent versions of Windows as it was replaced by a newer version. The FP rate should be very low except for tools that use a similar flag structure. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c6c56ada-612b-42d1-9a29-adad3c5c2c1e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_auditpol_nt_resource_kit_usage.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:/logon:none|/system:none|/sam:none|/privilege:none|/object:none|/process:none|/policy:none)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: awl-bypass-with-winrm-vbs-and-maliciou-074e0ded
    name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
    description: "Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl via winrm.vbs and copied cscript.exe (can be renamed) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Julia Fomina, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 074e0ded-6ced-4ebd-8b4d-53f55908119d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_winrm_awl_bypass.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "winrm" and (xdm.target.process.command_line ~= "(?:format:pretty|format:\"pretty\"|format:\"text\"|format:text)" and not (xdm.target.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: bad-opsec-defaults-sacrificial-process-a7c3d773
    name: Bad Opsec Defaults Sacrificial Processes With Improper Arguments
    description: |-
      Detects attackers using tooling with bad opsec defaults.
      E.g. spawning a sacrificial process to inject a capability into the process without taking into account how the process is normally run.
      One trivial example of this is using rundll32.exe without arguments as a sacrificial process (default in CS, now highlighted by c2lint), running WerFault without arguments (Kraken - credit am0nsec), and other examples. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Oleg Kolesnikov @securonix invrep_de, oscd.community, Florian Roth (Nextron Systems), Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a7c3d773-caef-227e-a7e7-c2f13c622329. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_bad_opsec_sacrificial_processes.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\WerFault\\.exe$" and xdm.target.process.command_line ~= "WerFault\\.exe$") or (xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" and xdm.target.process.command_line ~= "rundll32\\.exe$") or (xdm.target.process.executable.path ~= "\\\\regsvcs\\.exe$" and xdm.target.process.command_line ~= "regsvcs\\.exe$") or (xdm.target.process.executable.path ~= "\\\\regasm\\.exe$" and xdm.target.process.command_line ~= "regasm\\.exe$") or (xdm.target.process.executable.path ~= "\\\\regsvr32\\.exe$" and xdm.target.process.command_line ~= "regsvr32\\.exe$")) and not (((xdm.source.process.executable.path contains "\\AppData\\Local\\Microsoft\\EdgeUpdate\\Install\\{" and xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" and xdm.target.process.command_line ~= "rundll32\\.exe$") or (xdm.source.process.executable.path ~= "(?:\\\\AppData\\\\Local\\\\BraveSoftware\\\\Brave-Browser\\\\Application\\\\|\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\Application\\\\)" and xdm.source.process.executable.path ~= "\\\\Installer\\\\setup\\.exe$" and xdm.source.process.command_line contains "--uninstall " and xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" and xdm.target.process.command_line ~= "rundll32\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: bitlockertogo-exe-execution-7f2376f9
    name: BitLockerTogo.EXE Execution
    description: |-
      Detects the execution of "BitLockerToGo.EXE".
      BitLocker To Go is BitLocker Drive Encryption on removable data drives. This feature includes the encryption of, USB flash drives, SD cards, External hard disk drives, Other drives that are formatted by using the NTFS, FAT16, FAT32, or exFAT file system.
      This is a rarely used application and usage of it at all is worth investigating.
      Malware such as Lumma stealer has been seen using this process as a target for process hollowing. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate usage of BitLockerToGo.exe to encrypt portable devices.. Sigma rule by Josh Nickels, mttaggart, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7f2376f9-42ee-4dfc-9360-fecff9a88fc8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bitlockertogo_execution.yml
    kind: bioc
    severity: low
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.executable.path ~= "\\\\BitLockerToGo\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: browser-execution-in-headless-mode-ef9dcfed
    name: Browser Execution In Headless Mode
    description: "Detects execution of Chromium based browser in headless mode Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ef9dcfed-690c-4c5d-a9d1-482cd422225c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_browsers_chromium_headless_exec.yml"
