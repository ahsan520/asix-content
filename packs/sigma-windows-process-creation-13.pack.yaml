      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= " -name IEHarden " and xdm.target.process.command_line ~= " -value 0 ") or (xdm.target.process.command_line ~= " -name DEPOff " and xdm.target.process.command_line ~= " -value 1 ") or (xdm.target.process.command_line ~= " -name DisableFirstRunCustomize " and xdm.target.process.command_line ~= " -value 2 "))
      group_by: field:xdm.source.host.hostname
