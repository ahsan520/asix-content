  - key: windows-event-log-access-tampering-via-ba226dcf
    name: Windows Event Log Access Tampering Via Registry
    description: "Detects changes to the Windows EventLog channel permission values. It focuses on changes to the Security Descriptor Definition Language (SDDL) string, as modifications to these values can restrict access to specific users or groups, potentially aiding in defense evasion by controlling who can view or modify a event log channel. Upon execution, the user shouldn't be able to access the event log channel via the event viewer or via utilities such as \"Get-EventLog\" or \"wevtutil\". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Administrative activity, still unlikely. Sigma rule by X__Junior, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ba226dcf-d390-4642-b9af-b534872f1156. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_disable_windows_event_log_access.yml"
