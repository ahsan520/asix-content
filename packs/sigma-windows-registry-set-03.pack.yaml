# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-registry-set-03
name: "Sigma: Windows registry set (3 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows registry set events, grouped by tactic, starting with Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - registry-set
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13)
rules:
  - key: register-new-ifiltre-for-persistence-b23818c7
    name: Register New IFiltre For Persistence
    description: |-
      Detects when an attacker registers a new IFilter for an extension. Microsoft Windows Search uses filters to extract the content of items for inclusion in a full-text index.
      You can extend Windows Search to index new or proprietary file types by writing filters to extract the content, and property handlers to extract the properties of files. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate registration of IFilters by the OS or software. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b23818c7-e575-4d13-8012-332075ec0a2b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_persistence_ifilter.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Classes\\\\\\." and xdm.target.registry.path ~= "\\\\PersistentHandler") or (xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Classes\\\\CLSID" and xdm.target.registry.path ~= "\\\\PersistentAddinsRegistered\\\\\\{89BCB740-6119-101A-BCB7-00DD010655AF\\}")) and not (((xdm.target.registry.path ~= "(?:\\\\CLSID\\\\\\{4F46F75F-199F-4C63-8B7D-86D48FE7970C\\}\\\\|\\\\CLSID\\\\\\{4887767F-7ADC-4983-B576-88FB643D6F79\\}\\\\|\\\\CLSID\\\\\\{D3B41FA1-01E3-49AF-AA25-1D0D824275AE\\}\\\\|\\\\CLSID\\\\\\{72773E1A-B711-4d8d-81FA-B9A43B0650DD\\}\\\\|\\\\CLSID\\\\\\{098f2470-bae0-11cd-b579-08002b30bfeb\\}\\\\|\\\\CLSID\\\\\\{1AA9BF05-9A97-48c1-BA28-D9DCE795E93C\\}\\\\|\\\\CLSID\\\\\\{2e2294a9-50d7-4fe7-a09f-e6492e185884\\}\\\\)" or xdm.target.registry.path ~= "(?:\\\\CLSID\\\\\\{34CEAC8D-CBC0-4f77-B7B1-8A60CB6DA0F7\\}\\\\|\\\\CLSID\\\\\\{3B224B11-9363-407e-850F-C9E1FFACD8FB\\}\\\\|\\\\CLSID\\\\\\{3DDEB7A4-8ABF-4D82-B9EE-E1F4552E95BE\\}\\\\|\\\\CLSID\\\\\\{5645C8C1-E277-11CF-8FDA-00AA00A14F93\\}\\\\|\\\\CLSID\\\\\\{5645C8C4-E277-11CF-8FDA-00AA00A14F93\\}\\\\|\\\\CLSID\\\\\\{58A9EBF6-5755-4554-A67E-A2467AD1447B\\}\\\\|\\\\CLSID\\\\\\{5e941d80-bf96-11cd-b579-08002b30bfeb\\}\\\\)" or xdm.target.registry.path ~= "(?:\\\\CLSID\\\\\\{698A4FFC-63A3-4E70-8F00-376AD29363FB\\}\\\\|\\\\CLSID\\\\\\{7E9D8D44-6926-426F-AA2B-217A819A5CCE\\}\\\\|\\\\CLSID\\\\\\{8CD34779-9F10-4f9b-ADFB-B3FAEABDAB5A\\}\\\\|\\\\CLSID\\\\\\{9694E38A-E081-46ac-99A0-8743C909ACB6\\}\\\\|\\\\CLSID\\\\\\{98de59a0-d175-11cd-a7bd-00006b827d94\\}\\\\|\\\\CLSID\\\\\\{AA10385A-F5AA-4EFF-B3DF-71B701E25E18\\}\\\\|\\\\CLSID\\\\\\{B4132098-7A03-423D-9463-163CB07C151F\\}\\\\)" or xdm.target.registry.path ~= "(?:\\\\CLSID\\\\\\{d044309b-5da6-4633-b085-4ed02522e5a5\\}\\\\|\\\\CLSID\\\\\\{D169C14A-5148-4322-92C8-754FC9D018D8\\}\\\\|\\\\CLSID\\\\\\{DD75716E-B42E-4978-BB60-1497B92E30C4\\}\\\\|\\\\CLSID\\\\\\{E2F83EED-62DE-4A9F-9CD0-A1D40DCD13B6\\}\\\\|\\\\CLSID\\\\\\{E772CEB3-E203-4828-ADF1-765713D981B8\\}\\\\|\\\\CLSID\\\\\\{eec97550-47a9-11cf-b952-00aa0051fe20\\}|\\\\CLSID\\\\\\{FB10BD80-A331-4e9e-9EB7-00279903AD99\\}\\\\)") or xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Program Files \\(x86\\)\\\\|C:\\\\Program Files\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: registry-hide-function-from-user-5a93eb65
    name: Registry Hide Function from User
    description: "Detects registry modifications that hide internal tools or functions from the user (malware like Agent Tesla, Hermetic Wiper uses this technique) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate admin script. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5a93eb65-dffa-4543-b761-94aa60098fb6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_hide_function_user.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "(?:SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideClock|SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAHealth|SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCANetwork|SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAPower)$" or xdm.target.registry.path ~= "SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\HideSCAVolume$") and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$") or (xdm.target.registry.path ~= "(?:SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\ShowInfoTip|SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\ShowCompColor)$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: registry-modification-for-oci-dll-redi-c0e0bdec
    name: Registry Modification for OCI DLL Redirection
    description: |-
      Detects registry modifications related to 'OracleOciLib' and 'OracleOciLibPath' under 'MSDTC' settings.
      Threat actors may modify these registry keys to redirect the loading of 'oci.dll' to a malicious DLL, facilitating phantom DLL hijacking via the MSDTC service. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c0e0bdec-3e3d-47aa-9974-05539c999c89. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_potential_oci_dll_redirection.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
      - T1574.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLib$" and not (xdm.target.registry.data contains "oci.dll")) or (xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\MSDTC\\\\MTxOCI\\\\OracleOciLibPath$" and not (xdm.target.registry.data contains "%SystemRoot%\\System32\\")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: registry-modification-to-hidden-file-e-5df86130
    name: Registry Modification to Hidden File Extension
    description: "Hides the file extension through modification of the registry Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Administrative scripts. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5df86130-4e95-4a54-90f7-26541b40aec2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_hidden_extention.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1137
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\HideFileExt$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$") or (xdm.target.registry.path ~= "\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Advanced\\\\Hidden$" and xdm.target.registry.data ~= "^DWORD \\(0x00000002\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: registry-persistence-via-explorer-run-b7916c2a
    name: Registry Persistence via Explorer Run Key
    description: "Detects a possible persistence mechanism using RUN key for Windows Explorer and pointing to a suspicious folder Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b7916c2a-fa2f-4795-9477-32b731f70f11. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_susp_reg_persist_explorer_run.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run$" and xdm.target.registry.data ~= "(?::\\\\\\$Recycle\\.bin\\\\|:\\\\ProgramData\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Default\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\AppData\\\\Local\\\\Temp\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: restrictedadminmode-registry-value-tam-d6ce7ebd
    name: RestrictedAdminMode Registry Value Tampering
    description: |-
      Detects changes to the "DisableRestrictedAdmin" registry value in order to disable or enable RestrictedAdmin mode.
      RestrictedAdmin mode prevents the transmission of reusable credentials to the remote system to which you connect using Remote Desktop.
      This prevents your credentials from being harvested during the initial connection process if the remote server has been compromise Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d6ce7ebd-260b-4323-9768-a9631c8d4db2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_lsa_disablerestrictedadmin.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "System\\\\CurrentControlSet\\\\Control\\\\Lsa\\\\DisableRestrictedAdmin$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: security-event-logging-disabled-via-mi-8839e550
    name: Security Event Logging Disabled via MiniNt Registry Key - Registry Set
    description: |-
      Detects the addition of the 'MiniNt' key to the registry. Upon a reboot, Windows Event Log service will stop writing events.
      Windows Event Log is a service that collects and stores event logs from the operating system and applications. It is an important component of Windows security and auditing.
      Adversary may want to disable this service to disable logging of security events which could be used to detect their activities. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Highly Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8839e550-52d7-4958-9f2f-e13c1e736838. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_create_minint_key.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1685.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "^HKLM\\\\System\\\\CurrentControlSet\\\\Control\\\\MiniNt\\\\\\(Default\\)$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: service-binary-in-suspicious-folder-a07f0359
    name: Service Binary in Suspicious Folder
    description: "Detect the creation of a service with a service binary located in a suspicious directory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a07f0359-4c90-4dc4-a681-8ffea40b4f47. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_creation_service_susp_folder.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "^HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\" and xdm.target.registry.path ~= "\\\\Start$" and xdm.source.process.executable.path ~= "(?:\\\\Users\\\\Public\\\\|\\\\Perflogs\\\\|\\\\ADMIN\\$\\\\|\\\\Temp\\\\)" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000000\\)|DWORD \\(0x00000001\\)|DWORD \\(0x00000002\\))$") or (xdm.target.registry.path ~= "^HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\" and xdm.target.registry.path ~= "\\\\ImagePath$" and xdm.target.registry.data ~= "(?:\\\\Users\\\\Public\\\\|\\\\Perflogs\\\\|\\\\ADMIN\\$\\\\|\\\\Temp\\\\)")) and not (((xdm.source.process.executable.path ~= "\\\\Common Files\\\\" and xdm.source.process.executable.path ~= "\\\\Temp\\\\") or (xdm.target.registry.path ~= "\\\\CurrentControlSet\\\\Services\\\\MBAMInstallerService\\\\ImagePath$" and xdm.target.registry.data ~= "\\\\AppData\\\\Local\\\\Temp\\\\MBAMInstallerService\\.exe\"$" and xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\services\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: servicedll-hijack-612e47e9
    name: ServiceDll Hijack
    description: |-
      Detects changes to the "ServiceDLL" value related to a service in the registry.
      This is often used as a method of persistence. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Administrative scripts; Installation of a service. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 612e47e9-8a59-43a6-b404-f48683f45bd6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_servicedll_hijack.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1543.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "\\\\System\\\\" and xdm.target.registry.path ~= "ControlSet" and xdm.target.registry.path ~= "\\\\Services\\\\") and xdm.target.registry.path ~= "\\\\Parameters\\\\ServiceDll$") and not ((xdm.target.registry.data ~= "^C:\\\\Windows\\\\system32\\\\spool\\\\drivers\\\\x64\\\\3\\\\PrintConfig\\.dll$" or (xdm.source.process.executable.path ~= "\\\\regsvr32\\.exe$" and xdm.target.registry.path ~= "\\\\Services\\\\PrintNotify\\\\Parameters\\\\ServiceDll$" and xdm.target.registry.data ~= "^C:\\\\WINDOWS\\\\System32\\\\DriverStore\\\\FileRepository\\\\" and xdm.target.registry.data ~= "\\\\arm64\\\\PrintConfig\\.dll$") or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\lsass\\.exe$" and xdm.target.registry.path ~= "\\\\Services\\\\NTDS\\\\Parameters\\\\ServiceDll$" and xdm.target.registry.data ~= "^%%systemroot%%\\\\system32\\\\ntdsa\\.dll$") or xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\poqexec\\.exe$")) and not ((xdm.source.process.executable.path ~= "\\\\regsvr32\\.exe$" and xdm.target.registry.data ~= "^C:\\\\Windows\\\\System32\\\\STAgent\\.dll$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: session-manager-autorun-keys-modificat-046218bd
    name: Session Manager Autorun Keys Modification
    description: "Detects modification of autostart extensibility point (ASEP) in registry. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate software automatically (mostly, during installation) sets up autorun keys for legitimate reason; Legitimate administrator sets up autorun keys for legitimate reason. Sigma rule by Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 046218bd-e0d8-4113-a3c3-895a12b2b298. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_session_manager.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1547.001
      - T1546.009
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\System\\CurrentControlSet\\Control\\Session Manager" and xdm.target.registry.path ~= "(?:\\\\SetupExecute|\\\\S0InitialCommand|\\\\KnownDlls|\\\\Execute|\\\\BootExecute|\\\\AppCertDlls)" and not (xdm.target.registry.data ~= "^\\(Empty\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-environment-variable-has-be-966315ef
    name: Suspicious Environment Variable Has Been Registered
    description: "Detects the creation of user-specific or system-wide environment variables via the registry. Which contains suspicious commands and strings Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 966315ef-c5e1-4767-ba25-fce9c8de3660. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_suspicious_env_variables.yml"
