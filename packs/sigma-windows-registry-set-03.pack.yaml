  - key: suspicious-printer-driver-empty-manufa-e0813366
    name: Suspicious Printer Driver Empty Manufacturer
    description: "Detects a suspicious printer driver installation with an empty Manufacturer value Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Alerts on legitimate printer drivers that do not set any more details in the Manufacturer value. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e0813366-0407-449a-9869-a2db1119dc41. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_susp_printer_driver.yml"
