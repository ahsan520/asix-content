    severity: high
    category: Persistence
    mitre:
      - T1574
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path ~= "\\\\Control\\\\Print\\\\Environments\\\\Windows x64\\\\Drivers" and xdm.target.registry.path ~= "\\\\Manufacturer") and xdm.target.registry.data ~= "^\\(Empty\\)$") and not ((xdm.target.registry.path contains "\\CutePDF Writer v4.0\\" or xdm.target.registry.path ~= "(?:\\\\VNC Printer \\(PS\\)\\\\|\\\\VNC Printer \\(UD\\)\\\\)" or xdm.target.registry.path contains "\\Version-3\\PDF24\\")))
