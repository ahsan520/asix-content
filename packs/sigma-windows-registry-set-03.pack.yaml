        minutes: 60
  - key: suspicious-shell-open-command-registry-9e8894c0
    name: Suspicious Shell Open Command Registry Modification
    description: |-
      Detects modifications to shell open registry keys that point to suspicious locations typically used by malware for persistence.
      Generally, modifications to the `*\shell\open\command` registry key can indicate an attempt to change the default action for opening files,
      and various UAC bypass or persistence techniques involve modifying these keys to execute malicious scripts or binaries. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate software installations or updates that modify the shell open command registry keys to these locations.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9e8894c0-0ae0-11ef-9d85-1f2942bec57c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_susp_shell_open_keys_modification_patterns.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1548.002
      - T1546.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\shell\\open\\command\\" and xdm.target.registry.data ~= "(?:\\\\\\$Recycle\\.Bin\\\\|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Contacts\\\\|\\\\Music\\\\|\\\\PerfLogs\\\\|\\\\Photos\\\\|\\\\Pictures\\\\|\\\\Users\\\\Public\\\\|\\\\Videos\\\\|\\\\Windows\\\\Temp\\\\|%AppData%|%LocalAppData%|%Temp%|%tmp%)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
