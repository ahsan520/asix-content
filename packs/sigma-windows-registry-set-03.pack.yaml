    mitre:
      - T1547.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (((xdm.target.registry.path contains "\\SYSTEM\\CurrentControlSet\\Services\\EventLog\\" and xdm.target.registry.path ~= "\\\\CustomSD$") or (xdm.target.registry.path ~= "(?:\\\\Policies\\\\Microsoft\\\\Windows\\\\EventLog\\\\|\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\WINEVT\\\\Channels)" and xdm.target.registry.path ~= "\\\\ChannelAccess$")) and (xdm.target.registry.data contains "D:(D;" or (xdm.target.registry.data ~= "D:\\(" and xdm.target.registry.data ~= "\\)\\(D;")) and not ((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\servicing\\\\TrustedInstaller\\.exe$" or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\WinSxS\\\\" and xdm.source.process.executable.path ~= "\\\\TiWorker\\.exe$"))) and not ((not (xdm.source.process.executable.path ~= ".") or not (xdm.source.process.executable.path ~= "."))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
