    name: Remote Access Tool - UltraViewer Execution
    description: |-
      An adversary may use legitimate desktop support and remote access software, such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an interactive command and control channel to target systems within networks.
      These services are commonly used as legitimate technical support software, and may be allowed by application control within a target environment.
      Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared with other legitimate software commonly used by adversaries. (Citation: Symantec Living off the Land) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 88656cec-6c3b-487c-82c0-f73ebb805503. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_remote_access_tools_ultraviewer.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.product ~= "^UltraViewer$" or xdm.target.process.company ~= "^DucFabulous Co,ltd$" or xdm.target.process.original_file_name ~= "^UltraViewer_Desktop\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remote-chm-file-download-execution-via-f57c58b3
    name: Remote CHM File Download/Execution Via HH.EXE
    description: 'Detects the usage of "hh.exe" to execute/download remotely hosted ".chm" files. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f57c58b3-ee69-4ef5-9041-455bf39aaa89. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hh_chm_remote_download_or_execution.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^HH\\.exe$" or xdm.target.process.executable.path ~= "\\\\hh\\.exe$") and xdm.target.process.command_line ~= "(?:http://|https://|\\\\\\\\\\\\\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remote-code-execute-via-winrm-vbs-9df0dd3a
    name: Remote Code Execute via Winrm.vbs
    description: "Detects an attempt to execute code or create service on remote host via winrm.vbs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Julia Fomina, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_winrm_execution_via_scripting_api_winrm_vbs.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\cscript\\.exe$" or xdm.target.process.original_file_name ~= "^cscript\\.exe$") and (xdm.target.process.command_line ~= "winrm" and xdm.target.process.command_line ~= "invoke Create wmicimv2/Win32_" and xdm.target.process.command_line ~= "-r:http"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remote-file-download-via-desktopimgdow-214641c2
    name: Remote File Download Via Desktopimgdownldr Utility
    description: "Detects the desktopimgdownldr utility being used to download a remote file. An adversary may use desktopimgdownldr to download arbitrary files as an alternative to certutil. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Tim Rauch, Elastic (idea), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 214641c2-c579-4ecb-8427-0cf19df6842e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_desktopimgdownldr_remote_file_download.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\desktopimgdownldr\\.exe$" and xdm.source.process.executable.path ~= "\\\\desktopimgdownldr\\.exe$" and xdm.target.process.command_line contains "/lockscreenurl:http")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
