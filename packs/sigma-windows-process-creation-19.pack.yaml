      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\SepRemovalToolNative_x64\\.exe$" or (xdm.target.process.executable.path ~= "\\\\CATClean\\.exe$" and xdm.target.process.command_line contains "--uninstall") or (xdm.target.process.executable.path ~= "\\\\NetInstaller\\.exe$" and xdm.target.process.command_line contains "-r") or (xdm.target.process.executable.path ~= "\\\\WFPUnins\\.exe$" and (xdm.target.process.command_line ~= "/uninstall" and xdm.target.process.command_line ~= "/enterprise")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-defendercheck-execution-f0ca6c24
    name: PUA - DefenderCheck Execution
    description: "Detects the use of DefenderCheck, a tool to evaluate the signatures used in Microsoft Defender. It can be used to figure out the strings / byte chains used in Microsoft Defender to detect a tool and thus used for AV evasion. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f0ca6c24-3225-47d5-b1f5-352bf07ecfa7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_defendercheck.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1027.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\DefenderCheck\\.exe$" or xdm.target.process.description ~= "^DefenderCheck$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-dit-snapshot-viewer-d3b70aad
    name: PUA - DIT Snapshot Viewer
    description: "Detects the use of Ditsnap tool, an inspection tool for Active Directory database, ntds.dit. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate admin usage. Sigma rule by Furkan Caliskan (@caliskanfurkan_), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d3b70aad-097e-409c-9df2-450f80dc476b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_ditsnap.yml"
