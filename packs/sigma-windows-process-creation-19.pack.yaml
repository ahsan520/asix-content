  - key: pua-memory-dump-mount-via-memprocfs-8a1b2c3d
    name: PUA - Memory Dump Mount Via MemProcFS
    description: |-
      Detects execution of MemProcFS a memory forensics tool with the '-device' parameter.
      MemProcFS mounts physical memory as a virtual file system, allowing direct access to process memory and system structures.
      Threat actors were seen abusing this utility to mount memory dumps and then extract sensitive information from processes like LSASS or extract registry hives to obtain credentials, LSA secrets, SAM data, and cached domain credentials.
      MemProcFS usage that is not part of authorized forensic analysis should be treated as suspicious and warrants further investigation. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use during memory forensics; if not part of authorized analysis, warrants urgent investigation. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8a1b2c3d-4e5f-6789-abcd-ef1234567890. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_memprocfs.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003
      - T1003.001
      - T1003.004
      - T1003.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\MemProcFS\\.exe$" or xdm.target.process.original_file_name ~= "^MemProcFS\\.exe$" or xdm.target.process.description ~= "^MemProcFS$") and xdm.target.process.command_line contains "-device")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-netcat-suspicious-execution-e31033fc
    name: PUA - Netcat Suspicious Execution
    description: "Detects execution of Netcat. Adversaries may use a non-application layer protocol for communication between host and C2 server or among infected hosts within a network Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate ncat use. Sigma rule by frack113, Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e31033fc-33f0-4020-9a16-faf9b31cbf08. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_netcat.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1095
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.executable.path ~= "(?:\\\\nc\\.exe|\\\\ncat\\.exe|\\\\netcat\\.exe)$" or xdm.target.process.command_line ~= "(?: -lvp | -lvnp| -l -v -p | -lv -p | -l --proxy-type http | -vnl --exec | -vnl -e | --lua-exec | --sh-exec )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-ngrok-execution-ee37eb7c
    name: PUA - Ngrok Execution
    description: |-
      Detects the use of Ngrok, a utility used for port forwarding and tunneling, often used by threat actors to make local protected services publicly available.
      Involved domains are bin.equinox.io for download and *.ngrok.io for connections. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Another tool that uses the command line switches of Ngrok; Ngrok http 3978 (https://learn.microsoft.com/en-us/azure/bot-service/bot-service-debug-channel-ngrok?view=azure-bot-service-4.0). Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_ngrok.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1572
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?: tcp 139| tcp 445| tcp 3389| tcp 5985| tcp 5986)" or (xdm.target.process.command_line ~= " start " and xdm.target.process.command_line ~= "--all" and xdm.target.process.command_line ~= "--config" and xdm.target.process.command_line ~= "\\.yml") or (xdm.target.process.executable.path ~= "ngrok\\.exe$" and xdm.target.process.command_line ~= "(?: tcp | http | authtoken )") or xdm.target.process.command_line ~= "(?:\\.exe authtoken |\\.exe start --all)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
