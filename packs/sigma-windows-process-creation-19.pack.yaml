# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-19
name: "Sigma: Windows process creation (19 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: psexec-paexec-escalation-to-local-syst-8834e2f7
    name: PsExec/PAExec Escalation to LOCAL SYSTEM
    description: "Detects suspicious commandline flags used by PsExec and PAExec to escalate a command line to LOCAL_SYSTEM rights Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Admins that use PsExec or PAExec to escalate to the SYSTEM account for maintenance purposes (rare); Users that debug Microsoft Intune issues using the commands mentioned in the official documentation; see https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8834e2f7-6b4b-4f09-8906-d2276470ee23. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_psexec_paexec_escalate_system.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1587.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?: [-/–—―]s cmd| [-/–—―]s [-/–—―]i cmd| [-/–—―]i [-/–—―]s cmd| [-/–—―]s pwsh| [-/–—―]s [-/–—―]i pwsh| [-/–—―]i [-/–—―]s pwsh| [-/–—―]s powershell| [-/–—―]s [-/–—―]i powershell| [-/–—―]i [-/–—―]s powershell)" and xdm.target.process.command_line ~= "(?:psexec|paexec|accepteula)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-3proxy-execution-f38a82d2
    name: PUA - 3Proxy Execution
    description: "Detects the use of 3proxy, a tiny free proxy server Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administrative activity. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f38a82d2-fba3-4781-b549-525efbec8506. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_3proxy_execution.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1572
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\3proxy\\.exe$" or xdm.target.process.description ~= "^3proxy - tiny proxy server$" or xdm.target.process.command_line contains ".exe -i127.0.0.1 -p")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-advancedrun-suspicious-execution-fa00b701
    name: PUA - AdvancedRun Suspicious Execution
    description: "Detects the execution of AdvancedRun utility in the context of the TrustedInstaller, SYSTEM, Local Service or Network Service accounts Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fa00b701-44c6-4679-994d-5a18afa8a707. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_advancedrun_priv_user.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1134.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:/EXEFilename|/CommandLine)" and (xdm.target.process.command_line ~= "(?: /RunAs 8 | /RunAs 4 | /RunAs 10 | /RunAs 11 )" or xdm.target.process.command_line ~= "(?:/RunAs 8|/RunAs 4|/RunAs 10|/RunAs 11)$"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-chisel-tunneling-tool-execution-8b0e12da
    name: PUA - Chisel Tunneling Tool Execution
    description: "Detects usage of the Chisel tunneling tool via the commandline arguments Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Some false positives may occur with other tools with similar commandlines. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8b0e12da-d3c3-49db-bb4f-256703f380e5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_chisel.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1090.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\chisel\\.exe$" or (xdm.target.process.command_line ~= "(?:exe client |exe server )" and xdm.target.process.command_line ~= "(?:-socks5|-reverse| r:|:127\\.0\\.0\\.1:|-tls-skip-verify |:socks)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: pua-cleanwipe-execution-f44800ac
    name: PUA - CleanWipe Execution
    description: "Detects the use of CleanWipe a tool usually used to delete Symantec antivirus. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate administrative use (Should be investigated either way). Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f44800ac-38ec-471f-936e-3fa7d9c53100. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_cleanwipe.yml"
