    category: process_creation
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "(?:\\\\AnyDesk\\.exe|\\\\AnyDeskMSI\\.exe)$" or xdm.target.process.description ~= "^AnyDesk$" or xdm.target.process.product ~= "^AnyDesk$" or xdm.target.process.company ~= "^AnyDesk Software GmbH$")
