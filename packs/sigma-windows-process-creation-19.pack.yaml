  - key: pua-fast-reverse-proxy-frp-execution-32410e29
    name: PUA - Fast Reverse Proxy (FRP) Execution
    description: "Detects the use of Fast Reverse Proxy. frp is a fast reverse proxy to help you expose a local server behind a NAT or firewall to the Internet. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use. Sigma rule by frack113, Florian Roth, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 32410e29-5f94-4568-b6a3-d91a8adad863. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_pua_frp.yml"
