  - key: process-creation-attempt-via-wmic-exe-526be59f
    name: Process Creation Attempt via Wmic.EXE
    description: |-
      Detects the attempt to create a process via "wmic" with the "process call create" flag, which might
      indicate an attempt to execute a malicious process on the compromised host. Adversaries may use
      wmic to execute a process on the compromised host as part of their attack. This event is triggered on
      on attempt and process creation can be either successful or unsuccessful. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Michael Haag, Florian Roth (Nextron Systems), juju4, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 526be59f-a573-4eea-b5f7-f0973207634d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_process_creation.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1047
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wmic\\.exe$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$") and (xdm.target.process.command_line ~= "process" and xdm.target.process.command_line ~= "call" and xdm.target.process.command_line ~= "create"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-proxy-execution-via-squirrel-e-45239e6a
    name: Process Proxy Execution Via Squirrel.EXE
    description: 'Detects the usage of the "Squirrel.exe" binary to execute arbitrary processes. This binary is part of multiple Electron based software installations (Slack, Teams, Discord, etc.) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Expected FP with some Electron based applications such as (1Clipboard, Beaker Browser, Caret, Discord, GitHub Desktop, etc.). Sigma rule by Nasreddine Bencherchali (Nextron Systems), Karneades / Markus Neis, Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 45239e6a-b035-4aaf-b339-8ad379fcb67e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_squirrel_proxy_execution.yml'
    kind: bioc
    severity: medium
