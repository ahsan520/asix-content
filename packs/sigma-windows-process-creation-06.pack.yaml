    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line ~= "(?:hctac|kaerb|dnammoc|ekovn|eliFd|rahc|etirw|golon|tninon|eddih|tpircS|ssecorp|llehsrewop|esnopser|daolnwod|tneilCbeW|tneilc|ptth|elifotevas|46esab|htaPpmeTteG|tcejbO|maerts|hcaerof|retupmoc)") and not (xdm.target.process.command_line ~= "(?: -EncodedCommand | -enc )"))'
      group_by: field:xdm.source.host.hostname
