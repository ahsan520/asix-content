  - key: potential-powershell-command-line-obfu-d7bcd677
    name: Potential PowerShell Command Line Obfuscation
    description: "Detects the PowerShell command lines with special characters Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Amazon SSM Document Worker; Windows Defender ATP. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton (fp), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d7bcd677-645d-4691-a8d4-7a5602b780d1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cmdline_special_characters.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1027
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and (xdm.target.process.command_line ~= "\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+.*\\+" or xdm.target.process.command_line ~= "\\{.*\\{.*\\{.*\\{.*\\{.*\\{.*\\{.*\\{.*\\{.*\\{" or xdm.target.process.command_line ~= "\\^.*\\^.*\\^.*\\^.*\\^" or xdm.target.process.command_line ~= "`.*`.*`.*`.*`")) and not ((xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\Amazon\\\\SSM\\\\ssm-document-worker\\.exe$" or xdm.target.process.command_line ~= "(?:new EventSource\\(\"Microsoft\\.Windows\\.Sense\\.Client\\.Management\"|public static extern bool InstallELAMCertificateInfo\\(SafeFileHandle handle\\);)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-powershell-downgrade-attack-b3512211
    name: Potential PowerShell Downgrade Attack
    description: "Detects PowerShell downgrade attack by comparing the host versions with the actually used engine version 2.0 Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Harish Segar (rule), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b3512211-c67e-4707-bedc-66efc7848863. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_downgrade_attack.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\powershell\\.exe$" and xdm.target.process.command_line ~= "(?: -version 2 | -versio 2 | -versi 2 | -vers 2 | -ver 2 | -ve 2 | -v 2 )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-powershell-obfuscation-via-r-b6b49cd1
    name: Potential PowerShell Obfuscation Via Reversed Commands
    description: "Detects the presence of reversed PowerShell commands in the CommandLine. This is often used as a method of obfuscation by attackers Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b6b49cd1-34d6-4ead-b1bf-176e9edba9a4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cmdline_reversed_strings.yml"
