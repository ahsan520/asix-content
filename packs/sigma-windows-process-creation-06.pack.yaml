      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-powershell-obfuscation-via-w-e312efd0
    name: Potential PowerShell Obfuscation Via WCHAR/CHAR
    description: "Detects suspicious encoded character syntax often used for defense evasion Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e312efd0-35a1-407f-8439-b8d434b438a6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_obfuscation_via_utf8.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.001
      - T1027
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:\\[char\\]0x|\\(WCHAR\\)0x)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-powershell-reverseshell-conn-edc2f8ae
    name: Potential Powershell ReverseShell Connection
    description: 'Detects usage of the "TcpClient" class. Which can be abused to establish remote connections and reverse-shells. As seen used by the Nishang "Invoke-PowerShellTcpOneLine" reverse shell and other. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: In rare administrative cases, this function might be used to check network connectivity. Sigma rule by FPT.EagleEye, wagga, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id edc2f8ae-2412-4dfd-b9d5-0c57727e70be. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_reverse_shell_connection.yml'
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$" or xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$") and (xdm.target.process.command_line ~= " Net\\.Sockets\\.TCPClient" and xdm.target.process.command_line ~= "\\.GetStream\\(" and xdm.target.process.command_line ~= "\\.Write\\("))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-process-reconnaissance-via-w-221b251a
    name: Potential Process Reconnaissance via Wmic.EXE
    description: |-
      Detects the execution of "wmic" with the "process" flag, which might indicate an attempt to perform reconnaissance on running processes.
      Adversaries may use wmic to query for running processes and their details as part of their reconnaissance efforts. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 221b251a-357a-49a9-920a-271802777cc0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_recon_process.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1047
      - T1057
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\WMIC\\.exe$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$") and xdm.target.process.command_line contains "process") and not (((xdm.target.process.command_line ~= "call" and xdm.target.process.command_line ~= "create") or (xdm.target.process.command_line ~= "call" and xdm.target.process.command_line ~= "terminate"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-product-class-reconnaissance-e568650b
    name: Potential Product Class Reconnaissance Via Wmic.EXE
    description: |-
      Detects the execution of WMIC in order to get a list of firewall, antivirus and antispywware products.
      Adversaries often enumerate security products installed on a system to identify security controls and potential ways to evade detection or disable protection mechanisms.
      This information helps them plan their next attack steps and choose appropriate techniques to bypass security measures. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of wmic.exe for reconnaissance of firewall, antivirus and antispywware products.. Sigma rule by Michael Haag, Florian Roth (Nextron Systems), juju4, oscd.community, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e568650b-5dcd-4658-8f34-ded0b1e13992. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_recon_product_class.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1047
      - T1082
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wmic\\.exe$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$") and xdm.target.process.command_line ~= "(?:AntiVirusProduct|AntiSpywareProduct|FirewallProduct)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
