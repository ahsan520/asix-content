  - key: powershell-msi-install-via-windowsinst-222720a7
    name: PowerShell MSI Install via WindowsInstaller COM From Remote Location
    description: |-
      Detects the execution of PowerShell commands that attempt to install MSI packages via the
      Windows Installer COM object (`WindowsInstaller.Installer`) hosted remotely.
      This could be indication of malicious software deployment or lateral movement attempts using Windows Installer functionality.
      And the usage of WindowsInstaller COM object rather than msiexec could be an attempt to bypass the detection. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Meroujan Antonyan (vx3r), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 222720a7-047f-4054-baa5-bab9be757db0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_comobject_msi_remote.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
      - T1218
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "(?:\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell_ISE\\.EXE|PowerShell\\.EXE|pwsh\\.dll)$") and (xdm.target.process.command_line ~= "-ComObject" and xdm.target.process.command_line ~= "InstallProduct\\(") and xdm.target.process.command_line ~= "(?:http|\\\\\\\\\\\\\\\\)") and not (xdm.target.process.command_line ~= "(?:://127\\.0\\.0\\.1|://localhost)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: powershell-script-run-in-appdata-ac175779
    name: PowerShell Script Run in AppData
    description: "Detects a suspicious command line execution that invokes PowerShell with reference to an AppData folder Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Administrative scripts. Sigma rule by Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ac175779-025a-4f12-98b0-acdaeb77ea85. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_susp_ps_appdata.yml"
