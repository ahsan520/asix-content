    severity: high
    category: Execution
    mitre:
      - T1027.010
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:powershell\\.exe|pwsh\\.dll)$") and (xdm.target.process.command_line ~= "(?:Get-Module |gmo )" and (xdm.target.process.command_line ~= "ListAvailable" and xdm.target.process.command_line ~= "Microsoft\\.PowerShell\\.Utility" and xdm.target.process.command_line ~= "ExportedCommands" and xdm.target.process.command_line ~= "Values")) and xdm.target.process.command_line ~= "\\[.*\\]")
