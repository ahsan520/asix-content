      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\squirrel\\.exe|\\\\update\\.exe)$" and xdm.target.process.command_line ~= "(?:--processStart|--processStartAndWait|--createShortcut)") and not ((((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\AppData\\\\Local\\\\Discord\\\\Update\\.exe" and xdm.target.process.command_line ~= "Discord\\.exe") and xdm.target.process.command_line ~= "(?:--createShortcut|--processStart)") or ((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\AppData\\\\Local\\\\GitHubDesktop\\\\Update\\.exe" and xdm.target.process.command_line ~= "GitHubDesktop\\.exe") and xdm.target.process.command_line ~= "(?:--createShortcut|--processStartAndWait)") or ((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\AppData\\\\Local\\\\Microsoft\\\\Teams\\\\Update\\.exe" and xdm.target.process.command_line ~= "Teams\\.exe") and xdm.target.process.command_line ~= "(?:--processStart|--createShortcut)") or ((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\AppData\\\\Local\\\\yammerdesktop\\\\Update\\.exe" and xdm.target.process.command_line ~= "Yammer\\.exe") and xdm.target.process.command_line ~= "(?:--processStart|--createShortcut)"))))
