    description: 'Detects the creation of screensaver files (.scr) outside of system folders. Attackers may execute an application as an ".SCR" file using "rundll32.exe desk.cpl,InstallScreenSaver" for example. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: The installation of new screen savers by third party software. Sigma rule by Christopher Peacock @securepeacock, SCYTHE @scythe_io, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c048f047-7e2a-4888-b302-55f509d4a91d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_new_scr_file.yml'
