      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "\\.scr$" and not (xdm.target.file.path ~= "(?::\\\\\\$WINDOWS\\.~BT\\\\NewOS\\\\|:\\\\Windows\\\\System32\\\\|:\\\\Windows\\\\SysWOW64\\\\|:\\\\Windows\\\\WinSxS\\\\|:\\\\WUDownloadCache\\\\)"))
      group_by: field:xdm.source.host.hostname
