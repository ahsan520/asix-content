    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\eqnedt32\\.exe|\\\\wordpad\\.exe|\\\\wordview\\.exe|\\\\certutil\\.exe|\\\\certoc\\.exe|\\\\CertReq\\.exe|\\\\Desktopimgdownldr\\.exe|\\\\esentutl\\.exe|\\\\mshta\\.exe|\\\\AcroRd32\\.exe|\\\\RdrCEF\\.exe|\\\\hh\\.exe|\\\\finger\\.exe)$" and xdm.target.file.path ~= "(?:\\.com|\\.dll|\\.exe|\\.jar|\\.ocx|\\.pyc)$")
      group_by: field:xdm.source.host.hostname
