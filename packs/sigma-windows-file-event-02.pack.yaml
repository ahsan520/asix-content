  - key: suspicious-files-in-default-gpo-folder-5f87308a
    name: Suspicious Files in Default GPO Folder
    description: "Detects the creation of copy of suspicious files (EXE/DLL) to the default GPO storage folder Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by elhoim, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5f87308a-0a5b-4623-ae15-d8fa1809bc60. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_default_gpo_dir_write.yml"
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1036.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path contains "\\Policies\\{31B2F340-016D-11D2-945F-00C04FB984F9}\\" and xdm.target.file.path ~= "(?:\\.dll|\\.exe)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-lnk-double-extension-file-c-3215aa19
    name: Suspicious LNK Double Extension File Created
    description: 'Detects the creation of files with an "LNK" as a second extension. This is sometimes used by malware as a method to abuse the fact that Windows hides the "LNK" extension by default. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Some tuning is required for other general purpose directories of third party apps. Sigma rule by Nasreddine Bencherchali (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3215aa19-f060-4332-86d5-5602511f3ca8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_lnk_double_extension.yml'
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1036.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.target.file.path ~= "\\.lnk$" and xdm.target.file.path ~= "(?:\\.doc\\.|\\.docx\\.|\\.jpg\\.|\\.pdf\\.|\\.ppt\\.|\\.pptx\\.|\\.xls\\.|\\.xlsx\\.)") and not (xdm.target.file.path contains "\\AppData\\Roaming\\Microsoft\\Windows\\Recent\\") and not (((xdm.source.process.executable.path ~= "(?:\\\\excel\\.exe|\\\\powerpnt\\.exe|\\\\winword\\.exe)$" and xdm.target.file.path contains "\\AppData\\Roaming\\Microsoft\\Office\\Recent\\") or (xdm.source.process.executable.path ~= "\\\\excel\\.exe$" and xdm.target.file.path contains "\\AppData\\Roaming\\Microsoft\\Excel") or (xdm.source.process.executable.path ~= "\\\\powerpnt\\.exe$" and xdm.target.file.path contains "\\AppData\\Roaming\\Microsoft\\PowerPoint") or (xdm.source.process.executable.path ~= "\\\\winword\\.exe$" and xdm.target.file.path contains "\\AppData\\Roaming\\Microsoft\\Word"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-procexp152-sys-file-created-3da70954
    name: Suspicious PROCEXP152.sys File Created In TMP
    description: |-
      Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
      This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Other legimate tools using this driver and filename (like Sysinternals). Note - Clever attackers may easily bypass this detection by just renaming the driver filename. Therefore just Medium-level and don't rely on it.. Sigma rule by xknow (@xknow_infosec), xorxes (@xor_xes), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3da70954-0f2c-4103-adff-b7440368f50e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_procexplorer_driver_created_in_tmp_folder.yml
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.target.file.path contains "\\AppData\\Local\\Temp\\" and xdm.target.file.path ~= "PROCEXP152\\.sys$") and not (xdm.source.process.executable.path ~= "(?:\\\\procexp64\\.exe|\\\\procexp64a\\.exe|\\\\procexp\\.exe|\\\\procmon64\\.exe|\\\\procmon64a\\.exe|\\\\procmon\\.exe)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
