      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "^C:\\\\Windows\\\\System32\\\\drivers\\\\LiveKdD\\.SYS$" and not (xdm.source.process.executable.path ~= "(?:\\\\livekd\\.exe|\\\\livek64\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: livekd-kernel-memory-dump-file-created-814ddeca
    name: LiveKD Kernel Memory Dump File Created
    description: "Detects the creation of a file that has the same name as the default LiveKD kernel memory dump. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: In rare occasions administrators might leverage LiveKD to perform live kernel debugging. This should not be allowed on production systems. Investigate and apply additional filters where necessary.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 814ddeca-3d31-4265-8e07-8cc54fb44903. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_sysinternals_livekd_default_dump_name.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path ~= "^C:\\\\Windows\\\\livekd\\.dmp$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-process-dump-artefact-in-crashdu-6902955a
    name: LSASS Process Dump Artefact In CrashDumps Folder
    description: 'Detects the presence of an LSASS dump file in the "CrashDumps" folder. This could be a sign of LSASS credential dumping. Techniques such as the LSASS Shtinkering have been seen abusing the Windows Error Reporting to dump said process. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Rare legitimate dump of the process by the operating system due to a crash of lsass. Sigma rule by @pbssubhash, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6902955a-01b7-432c-b32a-6f5f81d8f625. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_lsass_shtinkering.yml'
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "^C:\\\\Windows\\\\System32\\\\config\\\\systemprofile\\\\AppData\\\\Local\\\\CrashDumps\\\\" and xdm.target.file.path contains "lsass.exe." and xdm.target.file.path ~= "\\.dmp$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-process-memory-dump-creation-via-69ca12af
    name: LSASS Process Memory Dump Creation Via Taskmgr.EXE
    description: 'Detects the creation of an "lsass.dmp" file by the taskmgr process. This indicates a manual dumping of the LSASS.exe process memory using Windows Task Manager. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Rare case of troubleshooting by an administrator or support that has to be investigated regardless. Sigma rule by Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 69ca12af-119d-44ed-b50f-a47af0ebc364. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_taskmgr_lsass_dump.yml'
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?::\\\\Windows\\\\system32\\\\taskmgr\\.exe|:\\\\Windows\\\\SysWOW64\\\\taskmgr\\.exe)$" and (xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Temp\\\\" and xdm.target.file.path ~= "\\\\lsass" and xdm.target.file.path ~= "\\.DMP"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-process-memory-dump-files-a5a2d357
    name: LSASS Process Memory Dump Files
    description: "Detects creation of files with names used by different memory dumping tools to create a memory dump of the LSASS process memory, which contains user credentials. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a5a2d357-1ab8-4675-a967-ef9990a59391. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_lsass_default_dump_file_names.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1003.001
    definition:
      regex: ""
