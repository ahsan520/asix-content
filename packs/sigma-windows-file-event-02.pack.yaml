  - key: screenconnect-temporary-installation-a-fec96f39
    name: ScreenConnect Temporary Installation Artefact
    description: |-
      An adversary may use legitimate desktop support and remote access software, such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an interactive command and control channel to target systems within networks.
      These services are commonly used as legitimate technical support software, and may be allowed by application control within a target environment.
      Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared with other legitimate software commonly used by adversaries. (Citation: Symantec Living off the Land) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate use. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fec96f39-988b-4586-b746-b93d59fd1922. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_remote_access_tools_screenconnect_artefact.yml
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path contains "\\Bin\\ScreenConnect."
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
