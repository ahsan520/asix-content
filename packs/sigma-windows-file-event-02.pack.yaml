  - key: legitimate-application-dropped-script-7d604714
    name: Legitimate Application Dropped Script
    description: |-
      Detects LOLBINs and applications that should not legitimately drop script files to disk.
      This may indicate malware staging or abuse of a trusted binary for script-based code execution. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by frack113, Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7d604714-e071-49ff-8726-edeb95a70679. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_script.yml
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.source.process.executable.path ~= "(?:\\\\eqnedt32\\.exe|\\\\wordpad\\.exe|\\\\wordview\\.exe|\\\\certutil\\.exe|\\\\certoc\\.exe|\\\\CertReq\\.exe|\\\\Desktopimgdownldr\\.exe|\\\\esentutl\\.exe|\\\\mshta\\.exe|\\\\AcroRd32\\.exe|\\\\RdrCEF\\.exe|\\\\hh\\.exe|\\\\finger\\.exe)$" and xdm.target.file.path ~= "(?:\\.bat|\\.chm|\\.csproj|\\.hta|\\.js|\\.jse|\\.proj|\\.ps1|\\.py|\\.scf|\\.vbe|\\.vbs|\\.wsf|\\.wsh)$") and not ((xdm.source.process.executable.path ~= "\\\\mshta\\.exe$" and xdm.target.file.path ~= "\\.hta$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: livekd-driver-creation-16fe46bb
    name: LiveKD Driver Creation
    description: "Detects the creation of the LiveKD driver, which is used for live kernel debugging Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate usage of LiveKD for debugging purposes will also trigger this. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 16fe46bb-4f64-46aa-817d-ff7bec4a2352. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_sysinternals_livekd_driver.yml"
    kind: bioc
    severity: medium
    category: file_event
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "^C:\\\\Windows\\\\System32\\\\drivers\\\\LiveKdD\\.SYS$" and xdm.source.process.executable.path ~= "(?:\\\\livekd\\.exe|\\\\livek64\\.exe)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: livekd-driver-creation-by-uncommon-pro-059c5af9
    name: LiveKD Driver Creation By Uncommon Process
    description: 'Detects the creation of the LiveKD driver by a process image other than "livekd.exe". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Administrators might rename LiveKD before its usage which could trigger this. Add additional names you use to the filter. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 059c5af9-5131-4d8d-92b2-de4ad6146712. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_sysinternals_livekd_driver_susp_creation.yml'
