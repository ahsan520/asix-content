  - key: registry-hive-file-staged-outside-stan-a7f3c891
    name: Registry Hive File Staged Outside Standard User Profile Path
    description: |-
      Detects the creation of a registry hive file (UsrClass.dat or NTUSER.DAT) outside of the standard user profile path.
      These files generally contain various user-specific registry settings and are typically located in the user's profile directory.
      Staging these files outside of the standard path can be indicative of an attacker attempting to manipulate user registry settings
      for persistence, privilege escalation, or dump user registry hives for credential harvesting. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Backup or profile migration software; Forensic acquisition tools. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a7f3c891-2e4d-4b6a-9f8c-d5e2a1b04c73. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_registry_hive_file_creation.yml
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1548
      - T1003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "(?:\\\\UsrClass\\.dat|\\\\NTUSER\\.DAT)$" and not ((xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\UsrClass\\.dat$" or xdm.target.file.path ~= "^C:\\\\Users\\\\[^\\\\]+\\\\NTUSER\\.DAT$" or xdm.target.file.path ~= "^(?:C:\\\\Windows\\\\System32\\\\config\\\\|C:\\\\Windows\\\\SYSVOL\\\\|C:\\\\Windows\\\\ServiceProfiles\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: renamed-vscode-code-tunnel-execution-f-d102b8f5
    name: Renamed VsCode Code Tunnel Execution - File Indicator
    description: 'Detects the creation of a file with the name "code_tunnel.json" which indicate execution and usage of VsCode tunneling utility by an "Image" or "Process" other than VsCode. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d102b8f5-61dc-4e68-bd83-9a3187c67377. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_vscode_tunnel_renamed_execution.yml'
