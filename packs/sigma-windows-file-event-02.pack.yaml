# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-file-event-02
name: "Sigma: Windows file event (2 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows file event events, grouped by tactic file_event. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - file-event
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11)
rules:
  - key: hacktool-quarkspwdump-dump-file-847def9e
    name: HackTool - QuarksPwDump Dump File
    description: "Detects a dump file written by QuarksPwDump password dumper Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 847def9e-924d-4e90-b7c4-5f581395a2b4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_hktl_quarkspw_filedump.yml"
    kind: bioc
    severity: critical
    category: file_event
    mitre:
      - T1003.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Temp\\\\SAM-" and xdm.target.file.path ~= "\\.dmp")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-remotekrbrelay-smb-relay-secr-3ab79e90
    name: HackTool - RemoteKrbRelay SMB Relay Secrets Dump Module Indicators
    description: "Detects the creation of file with specific names used by RemoteKrbRelay SMB Relay attack module. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3ab79e90-9fab-4cdf-a7b2-6522bc742adb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_hktl_krbrelay_remote_ioc.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path ~= "(?::\\\\windows\\\\temp\\\\sam\\.tmp|:\\\\windows\\\\temp\\\\sec\\.tmp|:\\\\windows\\\\temp\\\\sys\\.tmp)$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-safetykatz-dump-indicator-e074832a
    name: HackTool - SafetyKatz Dump Indicator
    description: "Detects default lsass dump filename generated by SafetyKatz. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Rare legitimate files with similar filename structure. Sigma rule by Markus Neis, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e074832a-eada-4fd7-94a1-10642b130e16. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_hktl_safetykatz.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path ~= "\\\\Temp\\\\debug\\.bin$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-typical-hivenightmare-sam-fil-6ea858a8
    name: HackTool - Typical HiveNightmare SAM File Export
    description: "Detects files written by the different tools that exploit HiveNightmare Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Files that accidentally contain these strings. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6ea858a8-ba71-4a12-b2cc-5d83312404c7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_hktl_hivenightmare_file_exports.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1552.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "(?:\\\\hive_sam_|\\\\SAM-2021-|\\\\SAM-2022-|\\\\SAM-2023-|\\\\SAM-haxx|\\\\Sam\\.save)" or xdm.target.file.path ~= "^C:\\\\windows\\\\temp\\\\sam$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hijack-legit-rdp-session-to-move-later-52753ea4
    name: Hijack Legit RDP Session to Move Laterally
    description: "Detects the usage of tsclient share to place a backdoor on the RDP source machine's startup folder Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unlikely. Sigma rule by Samir Bousseaden, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 52753ea4-b3a0-4365-910d-36cff487b789. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_tsclient_filewrite_startup.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "\\\\mstsc\\.exe$" and xdm.target.file.path contains "\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: installation-of-teamviewer-desktop-9711de76
    name: Installation of TeamViewer Desktop
    description: "TeamViewer_Desktop.exe is create during install Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9711de76-5d4f-4c50-a94f-21e4e8f8384d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_install_teamviewer_desktop.yml"
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path ~= "\\\\TeamViewer_Desktop\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: iso-file-created-within-temp-folders-2f9356ae
    name: ISO File Created Within Temp Folders
    description: "Detects the creation of a ISO file in the Outlook temp folder or in the Appdata temp folder. Typical of Qakbot TTP from end-July 2022. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Potential FP by sysadmin opening a zip file containing a legitimate ISO file. Sigma rule by @sam0x90, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2f9356ae-bf43-41b8-b858-4496d83b2acb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_iso_file_mount.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1566.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (((xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Temp\\\\" and xdm.target.file.path ~= "\\.zip\\\\") and xdm.target.file.path ~= "\\.iso$") or (xdm.target.file.path contains "\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.Outlook\\" and xdm.target.file.path ~= "\\.iso$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: iso-or-image-mount-indicator-in-recent-4358e5a5
    name: ISO or Image Mount Indicator in Recent Files
    description: |-
      Detects the creation of recent element file that points to an .ISO, .IMG, .VHD or .VHDX file as often used in phishing attacks.
      This can be a false positive on server systems but on workstations users should rarely mount .iso or .img files. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Cases in which a user mounts an image file for legitimate reasons. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4358e5a5-7542-4dcb-b9f3-87667371839b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_iso_file_recent.yml
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1566.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "(?:\\.iso\\.lnk|\\.img\\.lnk|\\.vhd\\.lnk|\\.vhdx\\.lnk)$" and xdm.target.file.path contains "\\Microsoft\\Windows\\Recent\\")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: legitimate-application-dropped-archive-654fcc6d
    name: Legitimate Application Dropped Archive
    description: "Detects programs on a Windows system that should not write an archive to disk Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by frack113, Florian Roth, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 654fcc6d-840d-4844-9b07-2c3300e54a26. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_archive.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\winword\\.exe|\\\\excel\\.exe|\\\\powerpnt\\.exe|\\\\msaccess\\.exe|\\\\mspub\\.exe|\\\\eqnedt32\\.exe|\\\\visio\\.exe|\\\\wordpad\\.exe|\\\\wordview\\.exe|\\\\certutil\\.exe|\\\\certoc\\.exe|\\\\CertReq\\.exe|\\\\Desktopimgdownldr\\.exe|\\\\esentutl\\.exe|\\\\finger\\.exe|\\\\notepad\\.exe|\\\\AcroRd32\\.exe|\\\\RdrCEF\\.exe|\\\\mshta\\.exe|\\\\hh\\.exe)$" and xdm.target.file.path ~= "(?:\\.zip|\\.rar|\\.7z|\\.diagcab|\\.appx)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: legitimate-application-dropped-executa-f0540f7e
    name: Legitimate Application Dropped Executable
    description: |-
