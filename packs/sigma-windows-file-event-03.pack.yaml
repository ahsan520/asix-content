# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-file-event-03
name: "Sigma: Windows file event (3 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows file event events, grouped by tactic, starting with file_event. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - file-event
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11)
rules:
  - key: teamviewer-remote-session-162ab1e4
    name: TeamViewer Remote Session
    description: "Detects the creation of log files during a TeamViewer remote session Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate uses of TeamViewer in an organisation. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 162ab1e4-6874-4564-853c-53ec3ab8be01. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_teamviewer_remote_session.yml"
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "(?:\\\\TeamViewer\\\\RemotePrinting\\\\tvprint\\.db|\\\\TeamViewer\\\\TVNetwork\\.log)$" or (xdm.target.file.path ~= "\\\\TeamViewer" and xdm.target.file.path ~= "_Logfile\\.log"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uac-bypass-abusing-winsat-path-parsing-155dbf56
    name: UAC Bypass Abusing Winsat Path Parsing - File
    description: "Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe (UACMe 52) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 155dbf56-e0a4-4dd0-8905-8a98705045e8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_uac_bypass_winsat.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1548.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "^C:\\\\Users\\\\" and xdm.target.file.path ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\system32\\\\winsat\\.exe|\\\\AppData\\\\Local\\\\Temp\\\\system32\\\\winmm\\.dll)$")
