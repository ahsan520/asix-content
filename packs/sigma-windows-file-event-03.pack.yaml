  - key: uncommon-file-created-in-office-startu-a10a2c40
    name: Uncommon File Created In Office Startup Folder
    description: "Detects the creation of a file with an uncommon extension in an Office application startup folder Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: False positive might stem from rare extensions used by other Office utilities.. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a10a2c40-2c4d-49f8-b557-1a946bc55d9d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_office_uncommon_file_startup.yml"
    kind: bioc
    severity: high
    category: file_event
    mitre:
      - T1587.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((((xdm.target.file.path contains "\\Microsoft\\Word\\STARTUP" or (xdm.target.file.path ~= "\\\\Office" and xdm.target.file.path ~= "\\\\Program Files" and xdm.target.file.path ~= "\\\\STARTUP")) and not (xdm.target.file.path ~= "(?:\\.docb|\\.docm|\\.docx|\\.dotm|\\.mdb|\\.mdw|\\.pdf|\\.wll|\\.wwl)$")) or ((xdm.target.file.path contains "\\Microsoft\\Excel\\XLSTART" or (xdm.target.file.path ~= "\\\\Office" and xdm.target.file.path ~= "\\\\Program Files" and xdm.target.file.path ~= "\\\\XLSTART")) and not (xdm.target.file.path ~= "(?:\\.xll|\\.xls|\\.xlsm|\\.xlsx|\\.xlt|\\.xltm|\\.xlw)$"))) and not (((xdm.source.process.executable.path contains ":\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\" and xdm.source.process.executable.path ~= "\\\\OfficeClickToRun\\.exe$") or (xdm.source.process.executable.path ~= "(?::\\\\Program Files\\\\Microsoft Office\\\\|:\\\\Program Files \\(x86\\)\\\\Microsoft Office\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\winword\\.exe|\\\\excel\\.exe)$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-file-creation-by-mysql-daemon-c61daa90
    name: Uncommon File Creation By Mysql Daemon Process
    description: |-
      Detects the creation of files with scripting or executable extensions by Mysql daemon.
      Which could be an indicator of "User Defined Functions" abuse to download malware. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Joseph Kamau, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c61daa90-3c1e-4f18-af62-8f288b5c9aaf. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_mysqld_uncommon_file_creation.yml
    kind: bioc
    severity: high
    category: file_event
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\mysqld\\.exe|\\\\mysqld-nt\\.exe)$" and xdm.target.file.path ~= "(?:\\.bat|\\.dat|\\.dll|\\.exe|\\.ps1|\\.psm1|\\.vbe|\\.vbs)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: vhd-image-download-via-browser-8468111a
    name: VHD Image Download Via Browser
    description: |-
      Detects creation of ".vhd"/".vhdx" files by browser processes.
      Malware can use mountable Virtual Hard Disk ".vhd" files to encapsulate payloads and evade security controls. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate downloads of ".vhd" files would also trigger this. Sigma rule by frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8468111a-ef07-4654-903b-b863a80bbc95. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_vhd_download_via_browsers.yml
    kind: bioc
    severity: medium
    category: file_event
    mitre:
      - T1587.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\brave\\.exe|\\\\chrome\\.exe|\\\\firefox\\.exe|\\\\iexplore\\.exe|\\\\maxthon\\.exe|\\\\MicrosoftEdge\\.exe|\\\\msedge\\.exe|\\\\msedgewebview2\\.exe|\\\\opera\\.exe|\\\\safari\\.exe|\\\\seamonkey\\.exe|\\\\vivaldi\\.exe|\\\\whale\\.exe)$" and xdm.target.file.path contains ".vhd")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
