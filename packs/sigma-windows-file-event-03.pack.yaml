      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and xdm.target.file.path contains "\\start menu\\programs\\startup\\" and xdm.target.file.path ~= "\\.lnk$")
