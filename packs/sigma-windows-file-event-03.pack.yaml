  - key: suspicious-file-creation-activity-from-cd8b36ac
    name: Suspicious File Creation Activity From Fake Recycle.Bin Folder
    description: "Detects file write event from/to a fake recycle bin folder that is often used as a staging directory for malware Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cd8b36ac-8e4a-4c2f-a402-a29b8fbd5bca. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_recycle_bin_fake_exec.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:RECYCLERS\\.BIN\\\\|RECYCLER\\.BIN\\\\)" or xdm.target.file.path ~= "(?:RECYCLERS\\.BIN\\\\|RECYCLER\\.BIN\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-file-write-to-sharepoint-la-1f0489be
    name: Suspicious File Write to SharePoint Layouts Directory
    description: |-
      Detects suspicious file writes to SharePoint layouts directory which could indicate webshell activity or post-exploitation.
      This behavior has been observed in the exploitation of SharePoint vulnerabilities such as CVE-2025-49704, CVE-2025-49706 or CVE-2025-53770. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1f0489be-b496-4ddf-b3a9-5900f2044e9c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_filewrite_in_sharepoint_layouts_dir.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1190
      - T1505.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\w3wp\\.exe)$" and xdm.target.file.path ~= "^(?:C:\\\\Program Files\\\\Common Files\\\\Microsoft Shared\\\\Web Server Extensions\\\\|C:\\\\Program Files \\(x86\\)\\\\Common Files\\\\Microsoft Shared\\\\Web Server Extensions\\\\)" and xdm.target.file.path ~= "(?:\\\\15\\\\TEMPLATE\\\\LAYOUTS\\\\|\\\\16\\\\TEMPLATE\\\\LAYOUTS\\\\)" and xdm.target.file.path ~= "(?:\\.asax|\\.ascx|\\.ashx|\\.asmx|\\.asp|\\.aspx|\\.bat|\\.cmd|\\.cer|\\.config|\\.hta|\\.js|\\.jsp|\\.jspx|\\.php|\\.ps1|\\.vbs)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-file-write-to-webapps-root-89c42960
    name: Suspicious File Write to Webapps Root Directory
    description: |-
      Detects suspicious file writes to the root directory of web applications, particularly Apache web servers or Tomcat servers.
      This may indicate an attempt to deploy malicious files such as web shells or other unauthorized scripts. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 89c42960-f244-4dad-9151-ae9b1a3287a2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_file_write_in_webapps_root.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1505.003
      - T1190
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\dotnet\\.exe|\\\\w3wp\\.exe|\\\\java\\.exe)$" and xdm.target.file.path ~= "(?:\\\\apache|\\\\tomcat)" and xdm.target.file.path contains "\\webapps\\ROOT\\" and xdm.target.file.path ~= "\\.jsp$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-get-variable-exe-creation-0c3fac91
    name: Suspicious Get-Variable.exe Creation
    description: |-
      Get-Variable is a valid PowerShell cmdlet
      WindowsApps is by default in the path where PowerShell is executed.
      So when the Get-Variable command is issued on PowerShell execution, the system first looks for the Get-Variable executable in the path and executes the malicious binary instead of looking for the PowerShell cmdlet. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_get_variable.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1546
      - T1027
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path ~= "Local\\\\Microsoft\\\\WindowsApps\\\\Get-Variable\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-msexchangemailboxreplicatio-7280c9f3
    name: Suspicious MSExchangeMailboxReplication ASPX Write
    description: "Detects suspicious activity in which the MSExchangeMailboxReplication process writes .asp and .apsx files to disk, which could be a sign of ProxyShell exploitation Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7280c9f3-a5af-45d0-916a-bc01cb4151c9. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_susp_exchange_aspx_write.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1190
      - T1505.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "\\\\MSExchangeMailboxReplication\\.exe$" and xdm.target.file.path ~= "(?:\\.aspx|\\.asp)$")
      group_by: field:xdm.source.host.hostname
