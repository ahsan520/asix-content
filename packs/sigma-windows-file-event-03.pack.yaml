  - key: potential-ripzip-attack-on-startup-fol-a6976974
    name: Potential RipZip Attack on Startup Folder
    description: |-
      Detects a phishing attack which expands a ZIP file containing a malicious shortcut.
      If the victim expands the ZIP file via the explorer process, then the explorer process expands the malicious ZIP file and drops a malicious shortcut redirected to a backdoor into the Startup folder.
      Additionally, the file name of the malicious shortcut in Startup folder contains {0AFACED1-E828-11D1-9187-B532F1E9575D} meaning the folder shortcut operation. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Greg (rule), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a6976974-ea6f-4e97-818e-ea08625c52cb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_ripzip_attack.yml
