    description: 'Detects creation of new ".dll" files inside the plugins directory of a notepad++ installation by a process other than "gup.exe". Which could indicates possible persistence Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Possible FPs during first installation of Notepad++; Legitimate use of custom plugins by users in order to enhance notepad++ functionalities. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 54127bd4-f541-4ac3-afdb-ea073f63f692. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_notepad_plus_plus_persistence.yml'
    kind: bioc
    severity: medium
    category: Persistence
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.target.file.path contains "\\Notepad++\\plugins\\" and xdm.target.file.path ~= "\\.dll$") and not ((xdm.source.process.executable.path ~= "\\\\Notepad\\+\\+\\\\updater\\\\gup\\.exe$" or (xdm.source.process.executable.path ~= "^C:\\\\Users\\\\" and xdm.source.process.executable.path contains "\\AppData\\Local\\Temp\\" and xdm.source.process.executable.path ~= "(?:\\\\target\\.exe|Installer\\.x64\\.exe)$") or (xdm.source.process.executable.path contains "\\npp." and xdm.source.process.executable.path ~= "\\.exe$" and xdm.target.file.path ~= "^(?:C:\\\\Program Files\\\\Notepad\\+\\+\\\\plugins\\\\NppExport\\\\NppExport\\.dll|C:\\\\Program Files\\\\Notepad\\+\\+\\\\plugins\\\\mimeTools\\\\mimeTools\\.dll|C:\\\\Program Files\\\\Notepad\\+\\+\\\\plugins\\\\NppConverter\\\\NppConverter\\.dll|C:\\\\Program Files\\\\Notepad\\+\\+\\\\plugins\\\\Config\\\\nppPluginList\\.dll)$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
