      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.target.file.path ~= "\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup" and xdm.target.file.path ~= "\\.lnk\\.\\{0AFACED1-E828-11D1-9187-B532F1E9575D\\}") and xdm.source.process.executable.path ~= "\\\\explorer\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-startup-shortcut-persistence-92fa78e7
    name: Potential Startup Shortcut Persistence Via PowerShell.EXE
    description: |-
