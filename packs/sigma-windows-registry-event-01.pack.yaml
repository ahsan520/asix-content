  - key: sticky-key-like-backdoor-usage-registr-baca5663
    name: Sticky Key Like Backdoor Usage - Registry
    description: "Detects the usage and installation of a backdoor that uses an option to register a malicious debugger for built-in tools that are accessible in the login screen Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), @twjackomo, Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id baca5663-583c-45f9-b5dc-ea96a22ce542. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_stickykey_like_backdoor.yml"
    kind: bioc
    severity: critical
    category: Persistence
    mitre:
      - T1546.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path ~= "(?:\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\sethc\\.exe\\\\Debugger|\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\utilman\\.exe\\\\Debugger|\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\osk\\.exe\\\\Debugger)$" or xdm.target.registry.path ~= "(?:\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\Magnify\\.exe\\\\Debugger|\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\Narrator\\.exe\\\\Debugger|\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\DisplaySwitch\\.exe\\\\Debugger)$" or xdm.target.registry.path ~= "(?:\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\atbroker\\.exe\\\\Debugger|\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Image File Execution Options\\\\HelpPane\\.exe\\\\Debugger)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-run-key-from-download-9c5037d1
    name: Suspicious Run Key from Download
    description: "Detects the suspicious RUN keys created by software located in Download or temporary Outlook/Internet Explorer directories Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Software installers downloaded and used by users. Sigma rule by Florian Roth (Nextron Systems), Swachchhanda Shrawan Poude (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9c5037d1-c568-49b3-88c7-9846a5bdc2be. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_susp_download_run_key.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.source.process.executable.path ~= "(?:\\\\AppData\\\\Local\\\\Packages\\\\Microsoft\\.Outlook_|\\\\AppData\\\\Local\\\\Microsoft\\\\Olk\\\\Attachments\\\\|\\\\Downloads\\\\|\\\\Temporary Internet Files\\\\Content\\.Outlook\\\\|\\\\Local Settings\\\\Temporary Internet Files\\\\)" and xdm.target.registry.path ~= "(?:\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run|\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: wdigest-credguard-registry-modificatio-1a2d6c47
    name: Wdigest CredGuard Registry Modification
    description: |-
      Detects potential malicious modification of the property value of IsCredGuardEnabled from
      HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest to disable Cred Guard on a system.
      This is usually used with UseLogonCredential to manipulate the caching credentials. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1a2d6c47-75b0-45bd-b133-2c0be75349fd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_disable_wdigest_credential_guard.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path ~= "\\\\IsCredGuardEnabled$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: winekey-registry-modification-b98968aa
    name: WINEKEY Registry Modification
    description: "Detects potential malicious modification of run keys by winekey or team9 backdoor Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by omkar72, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b98968aa-dbc0-4a9c-ac35-108363cbf8d5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_runkey_winekey.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path ~= "Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\Backup Mgr$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: esentutl-volume-shadow-copy-service-ke-5aad0995
    name: Esentutl Volume Shadow Copy Service Keys
    description: "Detects the volume shadow copy service initialization and processing via esentutl. Registry keys such as HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\VSS\\\\Diag\\\\VolSnap\\\\Volume are captured. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5aad0995-46ab-41bd-a9ff-724f41114971. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_esentutl_volume_shadow_copy_service_keys.yml"
    kind: bioc
    severity: high
    category: registry_event
    mitre:
      - T1003.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and ((xdm.target.registry.path contains "System\\CurrentControlSet\\Services\\VSS" and xdm.source.process.executable.path ~= "esentutl\\.exe$") and not (xdm.target.registry.path contains "System\\CurrentControlSet\\Services\\VSS\\Start"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hybridconnectionmanager-service-instal-ac8866c7
    name: HybridConnectionManager Service Installation - Registry
    description: "Detects the installation of the Azure Hybrid Connection Manager service to allow remote code execution from Azure function. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ac8866c7-ce44-46fd-8c17-b24acff96ca8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_hybridconnectionmgr_svc_installation.yml"
    kind: bioc
    severity: high
    category: registry_event
    mitre:
      - T1608
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path contains "\\Services\\HybridConnectionManager" or (xdm.event.operation = "registry_value_set" and xdm.target.registry.data contains "Microsoft.HybridConnectionManager.Listener.exe"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: new-portproxy-registry-entry-added-a54f842a
    name: New PortProxy Registry Entry Added
    description: "Detects the modification of the PortProxy registry key which is used for port forwarding. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g. https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723); Synergy Software KVM (https://symless.com/synergy). Sigma rule by Andreas Hunkeler (@Karneades), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a54f842a-3713-4b45-8c84-5f136fdebd3c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_portproxy_registry_key.yml"
    kind: bioc
    severity: medium
    category: registry_event
    mitre:
      - T1090
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path contains "\\Services\\PortProxy\\v4tov4\\tcp\\"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-credential-dumping-via-lsass-55e29995
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    description: "Detects changes to the Registry in which a monitor program gets registered to dump the memory of the lsass.exe process Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 55e29995-75e7-451a-bef0-6225e2f13597. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_silentprocessexit_lsass.yml"
    kind: bioc
    severity: critical
    category: registry_event
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path contains "Microsoft\\Windows NT\\CurrentVersion\\SilentProcessExit\\lsass.exe"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uac-bypass-via-wsreset-6ea3bf32
    name: UAC Bypass Via Wsreset
    description: "Unfixed method for UAC bypass from Windows 10. WSReset.exe file associated with the Windows Store. It will run a binary file contained in a low-privilege registry. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by oscd.community, Dmitry Uchakin, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6ea3bf32-9680-422d-9f50-e90716b12a66. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_bypass_via_wsreset.yml"
    kind: bioc
    severity: high
    category: registry_event
    mitre:
      - T1548.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path ~= "\\\\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\\\\Shell\\\\open\\\\command$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: windows-credential-editor-registry-a6b33c02
    name: Windows Credential Editor Registry
    description: "Detects the use of Windows Credential Editor (WCE) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a6b33c02-8305-488f-8585-03cb2a7763f2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_hack_wce_reg.yml"
    kind: bioc
    severity: critical
    category: registry_event
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path contains "Services\\WCESERVICE\\Start"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: windows-defender-threat-severity-defau-5a9e1b2c
    name: Windows Defender Threat Severity Default Action Modified
    description: |-
      Detects modifications or creations of Windows Defender's default threat action settings based on severity to 'allow' or take 'no action'.
      This is a highly suspicious configuration change that effectively disables Defender's ability to automatically mitigate threats of a certain severity level,
      allowing malicious software to run unimpeded. An attacker might use this technique to bypass defenses before executing payloads. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Legitimate administration via scripts or tools (e.g., SCCM, Intune, GPO enforcement). Correlate with administrative activity.; Software installations that legitimately modify Defender settings (less common for these specific keys).. Sigma rule by Matt Anderson (Huntress), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_defender_threat_action_modified.yml
    kind: bioc
    severity: high
    category: registry_event
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path contains "\\Microsoft\\Windows Defender\\Threats\\ThreatSeverityDefaultAction\\" and xdm.target.registry.path ~= "(?:\\\\1|\\\\2|\\\\4|\\\\5)$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000006\\)|DWORD \\(0x00000009\\))$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: windows-registry-trust-record-modifica-295a59c1
    name: Windows Registry Trust Record Modification
    description: "Alerts on trust record modification within the registry, indicating usage of macros Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: This will alert on legitimate macro usage as well, additional tuning is required. Sigma rule by Antonlovesdnb, Trent Liffick (@tliffick), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 295a59c1-7b79-4b47-a930-df12c15fc9c2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_office_trust_record_modification.yml"
    kind: bioc
    severity: medium
    category: registry_event
    mitre:
      - T1566.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.target.registry.path contains "\\Security\\Trusted Documents\\TrustRecords"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
