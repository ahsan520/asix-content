      xql: xdm.event.type = "registry" and xdm.target.registry.path contains "\\Software\\Microsoft\\Office test\\Special\\Perf"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
