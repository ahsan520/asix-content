    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1548.002
      - T1546.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (((xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\SymbolicLinkValue$" and xdm.target.registry.data contains "\\Software\\Classes\\{") or xdm.target.registry.path ~= "Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\DelegateExecute$" or (xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "(?:Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\\\(Default\\)|Classes\\\\exefile\\\\shell\\\\open\\\\command\\\\\\(Default\\))$")) and not ((xdm.target.registry.data ~= "^\\(Empty\\)$" or xdm.target.registry.data ~= "^(?:\\{4813071a-41ad-44a2-9835-886d2f63ca30\\}|\\{A56A841F-E974-45C1-8001-7E3F8A085917\\}|\\{4ED3A719-CEA8-4BD9-910D-E252F997AFC2\\}|\\{BFEC0C93-0B7D-4F2C-B09C-AFFFC4BDAE78\\})$" or (xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "\\\\exefile\\\\shell\\\\open\\\\command\\\\\\(Default\\)$" and xdm.target.registry.data ~= "^(?:\"%%1\" %%\\*|\"%1\" %\\*)$"))) and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\|C:\\\\Windows\\\\WinSxS\\\\)" and xdm.source.process.executable.path ~= "\\\\containerworker\\.exe$" and xdm.target.registry.path contains "\\Windows\\Containers\\Layers\\")))
