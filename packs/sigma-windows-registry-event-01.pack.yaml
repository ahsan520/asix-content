    description: "Detects value modification of registry key containing path to binary used as screensaver. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Legitimate modification of screensaver. Sigma rule by Bartlomiej Czyz @bczyz1, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 67a6c006-3fbe-46a7-9074-2ba3b82c3000. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_modify_screensaver_binary_path.yml"
