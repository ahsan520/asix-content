# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-registry-event-01
name: "Sigma: Windows registry event"
description: "27 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows registry event events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - registry-event
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14)
rules:
  - key: suspicious-camera-and-microphone-acces-62120148
    name: Suspicious Camera and Microphone Access
    description: "Detects Processes accessing the camera and microphone from suspicious folder Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unlikely, there could be conferencing software running from a Temp folder accessing the devices. Sigma rule by Den Iuzvyk, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 62120148-6b7a-42be-8b91-271c04e281a3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_susp_mic_cam_access.yml"
    kind: bioc
    severity: high
    category: Collection
    mitre:
      - T1125
      - T1123
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and ((xdm.target.registry.path ~= "\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\CapabilityAccessManager\\\\ConsentStore\\\\" and xdm.target.registry.path ~= "\\\\NonPackaged") and xdm.target.registry.path ~= "(?:microphone|webcam)" and xdm.target.registry.path ~= "(?::#Windows#Temp#|:#\\$Recycle\\.bin#|:#Temp#|:#Users#Public#|:#Users#Default#|:#Users#Desktop#)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: cmstp-app-paths-registry-key-modificat-b6d235fc
    name: CMSTP App Paths Registry Key Modification
    description: |-
      Detects modifications to the CMSTP App Paths registry key. This may indicate abuse of
      Microsoft Connection Manager Profile Installer (CMSTP) for arbitrary code execution or UAC bypass. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Legitimate CMSTP use (unlikely in modern enterprise environments). Sigma rule by Nik Seetharaman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b6d235fc-1d38-4b12-adbe-325f06728f37. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_cmstp_execution_by_registry.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1218.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path contains "SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\cmmgr32.exe\\" and not (((xdm.target.registry.path ~= "SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\App Paths\\\\cmmgr32\\.exe\\\\CmstpExtensionDll$" and xdm.target.registry.data ~= "^(?:C:\\\\Windows\\\\System32\\\\cmcfg32\\.dll|C:\\\\Windows\\\\SysWOW64\\\\cmcfg32\\.dll)$") or xdm.target.registry.data ~= "^\\(Empty\\)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: dll-load-via-lsass-b3503044
    name: DLL Load via LSASS
    description: "Detects a method to load DLL via LSASS process using an undocumented Registry key Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b3503044-60ce-4bf4-bbcb-e3db98788823. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_susp_lsass_dll_load.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1547.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path ~= "(?:\\\\CurrentControlSet\\\\Services\\\\NTDS\\\\DirectoryServiceExtPt|\\\\CurrentControlSet\\\\Services\\\\NTDS\\\\LsaDbExtPt)" and not ((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\lsass\\.exe$" and xdm.target.registry.data ~= "^(?:%%systemroot%%\\\\system32\\\\ntdsa\\.dll|%%systemroot%%\\\\system32\\\\lsadb\\.dll)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: atbroker-registry-change-9577edbb
    name: Atbroker Registry Change
    description: "Detects creation/modification of Assistive Technology applications and persistence with usage of 'at' Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Creation of non-default, legitimate at usage. Sigma rule by Mateusz Wydra, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9577edbb-851f-4243-8c91-1d5b50c1a39b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_susp_atbroker_change.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1218
      - T1547
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path ~= "(?:Software\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\ATs|Software\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\Configuration)" and not (((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\atbroker\\.exe$" and xdm.target.registry.path contains "\\Microsoft\\Windows NT\\CurrentVersion\\Accessibility\\Configuration" and xdm.target.registry.data ~= "^\\(Empty\\)$") or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\Installer\\\\MSI" and xdm.target.registry.path contains "Software\\Microsoft\\Windows NT\\CurrentVersion\\Accessibility\\ATs"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: creation-of-a-local-hidden-user-accoun-460479f3
    name: Creation of a Local Hidden User Account by Registry
    description: "Sysmon registry detection of a local hidden user account. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 460479f3-80b7-42da-9c43-2cc1d54dbccd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_add_local_hidden_user.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1136.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.target.registry.path contains "\\SAM\\SAM\\Domains\\Account\\Users\\Names\\" and xdm.target.registry.path ~= "\\$\\\\\\(Default\\)$" and xdm.source.process.executable.path ~= "\\\\lsass\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
