  - key: registry-tampering-by-potentially-susp-7f4c43f9
    name: Registry Tampering by Potentially Suspicious Processes
    description: |-
      Detects suspicious registry modifications made by suspicious processes such as script engine processes such as WScript, or CScript etc.
      These processes are rarely used for legitimate registry modifications, and their activity may indicate an attempt to modify the registry
      without using standard tools like regedit.exe or reg.exe, potentially for evasion and persistence. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Some legitimate admin or install scripts may use these processes for registry modifications.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_susp_process_registry_modification.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
      - T1059.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and (xdm.source.process.executable.path ~= "(?:\\\\mshta\\.exe|\\\\wscript\\.exe|\\\\cscript\\.exe)$" and not ((xdm.target.registry.data ~= "^Binary Data$" or not (xdm.target.registry.data ~= ".") or (xdm.source.process.executable.path ~= "\\\\wscript\\.exe$" and xdm.target.registry.path ~= "(?:SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Notifications\\\\Data\\\\|\\\\Services\\\\bam\\\\State\\\\UserSettings\\\\S-1-|Software\\\\Microsoft\\\\Windows Script\\\\Settings\\\\Telemetry\\\\wscript\\.exe\\\\|Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Internet Settings\\\\)") or (xdm.source.process.executable.path ~= "\\\\wscript\\.exe$" and xdm.target.registry.path contains "\\wscript.exe"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: run-once-task-configuration-in-registr-c74d7efc
    name: Run Once Task Configuration in Registry
    description: "Rule to detect the configuration of Run Once registry key. Configured payload can be run by runonce.exe /AlternateShellStartup Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Legitimate modification of the registry key by legitimate program. Sigma rule by Avneet Singh @v3t0_, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c74d7efc-8826-45d9-b8bb-f04fac9e4eff. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_runonce_persistence.yml"
    kind: bioc
