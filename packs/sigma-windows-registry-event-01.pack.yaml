  - key: netntlm-downgrade-attack-registry-d67572a0
    name: NetNTLM Downgrade Attack - Registry
    description: "Detects NetNTLM downgrade attack Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Services or tools that set the values to more restrictive values. Sigma rule by Florian Roth (Nextron Systems), wagga, Nasreddine Bencherchali (Splunk STRT), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d67572a0-e2ec-45d6-b8db-c100d14b8ef2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_net_ntlm_downgrade.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1685
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and ((xdm.target.registry.path ~= "SYSTEM\\\\" and xdm.target.registry.path ~= "ControlSet" and xdm.target.registry.path ~= "\\\\Control\\\\Lsa") and ((xdm.target.registry.path ~= "\\\\lmcompatibilitylevel$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000000\\)|DWORD \\(0x00000001\\)|DWORD \\(0x00000002\\))$") or (xdm.target.registry.path ~= "\\\\NtlmMinClientSec$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000000\\)|DWORD \\(0x00000010\\)|DWORD \\(0x00000020\\)|DWORD \\(0x00000030\\))$") or xdm.target.registry.path ~= "\\\\RestrictSendingNTLMTraffic$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: office-application-startup-office-test-3d27f6dd
    name: Office Application Startup - Office Test
    description: "Detects the addition of office test registry that allows a user to specify an arbitrary DLL that will be executed every time an Office application is started Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unlikely. Sigma rule by omkar72, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3d27f6dd-1c74-4687-b4fa-ca849d128d1c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_office_test_regadd.yml"
    kind: bioc
