    description: "Detects actions caused by the RedMimicry Winnti playbook Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (events 12, 13 and 14). Known false positives: Unknown. Sigma rule by Alexander Rausch, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5b175490-b652-4b02-b1de-5b5b4083c5f8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_event/registry_event_redmimicry_winnti_reg.yml"
