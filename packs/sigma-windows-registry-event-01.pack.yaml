      filters: []
      xql: xdm.event.type = "registry" and ((xdm.target.registry.path contains "\\Microsoft\\Active Setup\\Installed Components" and xdm.target.registry.path ~= "\\\\StubPath$") and not (((xdm.target.registry.data ~= "C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\" and xdm.target.registry.data ~= "\\\\Installer\\\\chrmstp\\.exe\" --configure-user-settings --verbose-logging --system-level") or (xdm.target.registry.data ~= "(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\Edge\\\\Application\\\\|C:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\)" and xdm.target.registry.data ~= "\\\\Installer\\\\setup\\.exe\" --configure-user-settings --verbose-logging --system-level --msedge --channel=stable$"))))
