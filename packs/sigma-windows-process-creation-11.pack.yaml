# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-11
name: "Sigma: Windows process creation (11 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: imports-registry-key-from-a-file-73bba97f
    name: Imports Registry Key From a File
    description: "Detects the import of the specified file to the registry with regedit.exe. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate import of keys; Evernote. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Oddvar Moe, Sander Wiebing, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 73bba97f-a82d-42ce-b315-9182e76c57b1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_regedit_import_keys.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\regedit\\.exe$" or xdm.target.process.original_file_name ~= "^REGEDIT\\.EXE$") and xdm.target.process.command_line ~= "(?: /i | /s |\\.reg)") and not ((xdm.target.process.command_line ~= "(?: [-/–—―]e | [-/–—―]a | [-/–—―]c )" and xdm.target.process.command_line ~= ":[^ \\\\]")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: imports-registry-key-from-an-ads-0b80ade5
