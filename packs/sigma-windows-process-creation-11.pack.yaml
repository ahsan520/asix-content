  - key: interactive-at-job-60fc936d
    name: Interactive AT Job
    description: "Detects an interactive AT job, which may be used as a form of privilege escalation. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely (at.exe deprecated as of Windows 8). Sigma rule by E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 60fc936d-2eb0-4543-8a13-911c750a1dfc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_at_interactive_execution.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1053.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\at\\.exe$" and xdm.target.process.command_line contains "interactive")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: monitoring-for-persistence-via-bits-b9cbbc17
    name: Monitoring For Persistence Via BITS
    description: |-
      BITS will allow you to schedule a command to execute after a successful download to notify you that the job is finished.
      When the job runs on the system the command specified in the BITS job will be executed.
      This can be abused by actors to create a backdoor within the system and for persistence.
      It will be chained in a BITS job to schedule the download of malware/additional binaries and execute the program after being downloaded. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Sreeman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b9cbbc17-d00d-4e3d-a827-b06d03d2380d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bitsadmin_potential_persistence.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1197
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\bitsadmin\\.exe$" or xdm.target.process.original_file_name ~= "^bitsadmin\\.exe$") and ((xdm.target.process.command_line contains "/SetNotifyCmdLine" and xdm.target.process.command_line ~= "(?:%COMSPEC%|cmd\\.exe|regsvr32\\.exe)") or (xdm.target.process.command_line contains "/Addfile" and xdm.target.process.command_line ~= "(?:http:|https:|ftp:|ftps:)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
