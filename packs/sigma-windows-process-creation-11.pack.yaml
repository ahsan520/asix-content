    description: "Detects the import of a alternate datastream to the registry with regedit.exe. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Oddvar Moe, Sander Wiebing, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0b80ade5-6997-4b1d-99a1-71701778ea61. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_regedit_import_keys_ads.yml"
