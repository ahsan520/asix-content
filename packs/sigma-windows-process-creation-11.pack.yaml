  - key: new-user-account-creation-attempt-via-7c9fed65
    name: New User Account Creation Attempt Via ADSI in CommandLine
    description: |-
      Detects PowerShell command line arguments containing ADSI (Active Directory Service Interfaces) patterns
      trying to create a new user account via the WinNT or LDAP provider. This is an uncommon method to create
      user accounts and may indicate an attempt to evade detection by avoiding more commonly monitored commands
      such as "net user", "New-LocalUser" or "New-ADUser". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative scripts that use ADSI to provision user accounts but should be rare in most environments. Sigma rule by William Gokah (idea), Raylee Hawkins, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7c9fed65-039a-4055-8c23-fa763d94aff6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_adsi_create_user.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1136.001
      - T1136.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line contains "[ADSI]" and xdm.target.process.command_line ~= "(?:\\.Create\\(\"user|\\.Create\\('user)" and xdm.target.process.command_line ~= "(?:WinNT://|LDAP://)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
