  - key: new-dmsa-service-account-created-in-sp-0ea8db81
    name: New DMSA Service Account Created in Specific OUs
    description: |-
      Detects the creation of a dMSASvc account using the New-ADServiceAccount cmdlet in certain OUs.
      The fact that the Cmdlet is used to create a dMSASvc account in a specific OU is highly suspicious.
      It is a pattern trying to exploit the BadSuccessor privilege escalation vulnerability in Windows Server 2025.
      On top of that, if the user that is creating the dMSASvc account is not a legitimate administrator or does not have the necessary permissions,
      it is a strong signal of an attempted or successful abuse of the BaDSuccessor vulnerability for privilege escalation within the Windows Server 2025 Active Directory environment. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0ea8db81-2ff6-4525-9448-33bbe7effc13. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_create_new_dmsasvc_account.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1078.002
      - T1098
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\powershell_ise\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:powershell\\.exe|pwsh\\.dll|powershell_ise\\.exe)$") and (xdm.target.process.command_line ~= "New-ADServiceAccount" and xdm.target.process.command_line ~= "-CreateDelegatedServiceAccount" and xdm.target.process.command_line ~= "-path"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: new-dns-serverlevelplugindll-installed-f63b56ee
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    description: "Detects the installation of a DNS plugin DLL via ServerLevelPluginDll parameter in registry, which can be used to execute code in context of the DNS server (restart required) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f63b56ee-3f79-4b8a-97fb-5c48007e8573. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dnscmd_install_new_server_level_plugin_dll.yml"
