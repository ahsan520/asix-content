      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\regedit\\.exe$" or xdm.target.process.original_file_name ~= "^REGEDIT\\.EXE$") and (xdm.target.process.command_line ~= "(?: /i |\\.reg)" and xdm.target.process.command_line ~= ":[^ \\\\]")) and not (xdm.target.process.command_line ~= "(?: [-/–—―]e | [-/–—―]a | [-/–—―]c )"))'
      group_by: field:xdm.source.host.hostname
