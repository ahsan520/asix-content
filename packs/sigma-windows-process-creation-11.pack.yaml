  - key: new-kernel-driver-via-sc-exe-431a1fdb
    name: New Kernel Driver Via SC.EXE
    description: 'Detects creation of a new service (kernel driver) with the type "kernel" Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Rare legitimate installation of kernel drivers via sc.exe. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 431a1fdb-4799-4f3b-91c3-a683b003fc49. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sc_new_kernel_driver.yml'
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1543.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\sc\\.exe$" and xdm.target.process.command_line ~= "(?:create|config)" and (xdm.target.process.command_line ~= "binPath" and xdm.target.process.command_line ~= "type" and xdm.target.process.command_line ~= "kernel")) and not (((xdm.target.process.command_line ~= "create netprotection_network_filter" and xdm.target.process.command_line ~= "type= kernel start= " and xdm.target.process.command_line ~= "binPath= System32\\\\drivers\\\\netprotection_network_filter" and xdm.target.process.command_line ~= "DisplayName= netprotection_network_filter" and xdm.target.process.command_line ~= "group= PNP_TDI tag= yes") or (xdm.target.process.command_line ~= "create avelam binpath=C:\\\\Windows\\\\system32\\\\drivers\\\\avelam\\.sys" and xdm.target.process.command_line ~= "type=kernel start=boot error=critical group=Early-Launch"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
