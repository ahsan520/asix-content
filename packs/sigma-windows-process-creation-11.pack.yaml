  - key: newactivescripteventconsumer-creation-ebef4391
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    description: |-
      Detects the attempt to create an ActiveScriptEventConsumer via WMIC.EXE.
      An ActiveScriptEventConsumer is a built-in Windows Management Instrumentation (WMI) class that
      automatically executes a predefined script (in VBScript or JScript) whenever a specific system event occurs.
      Adversaries often abuse ActiveScriptEventConsumer to maintain persistence on a compromised host by executing a malicious script whenever a specific event occurs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate software creating script event consumers. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ebef4391-1a81-4761-a40a-1db446c0e625. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_eventconsumer_creation.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1546.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^wmic\\.exe$" or xdm.target.process.executable.path ~= "\\\\WMIC\\.exe$") and (xdm.target.process.command_line ~= "ActiveScriptEventConsumer" and xdm.target.process.command_line ~= " CREATE "))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
