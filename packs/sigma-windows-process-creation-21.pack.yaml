# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-21
name: "Sigma: Windows process creation (21 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: suspicious-calculator-usage-737e618a
    name: Suspicious Calculator Usage
    description: "Detects suspicious use of 'calc.exe' with command line parameters or in a suspicious directory, which is likely caused by some PoC or detection evasion. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 737e618a-a410-49b5-bec3-9e55ff7fbc15. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_calc_uncommon_exec.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "\\calc.exe " or (xdm.target.process.executable.path ~= "\\\\calc\\.exe$" and not (xdm.target.process.executable.path ~= "(?::\\\\Windows\\\\System32\\\\|:\\\\Windows\\\\SysWOW64\\\\|:\\\\Windows\\\\WinSxS\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-certreq-command-to-download-4480827a
    name: Suspicious CertReq Command to Download
    description: |-
      Detects a suspicious CertReq execution downloading a file.
      This behavior is often used by attackers to download additional payloads or configuration files.
      Certreq is a built-in Windows utility used to request and retrieve certificates from a certification authority (CA). However, it can be abused by threat actors for malicious purposes. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Christian Burkard (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4480827a-9799-4232-b2c4-ccc6c4e9e12b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_certreq_download.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\certreq\\.exe$" or xdm.target.process.original_file_name ~= "^CertReq\\.exe$") and xdm.target.process.command_line ~= "[-/–—―]Post" and xdm.target.process.command_line ~= "[-/–—―]config" and xdm.target.process.command_line contains "http")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-child-process-of-manage-eng-cea2b7ea
    name: Suspicious Child Process Of Manage Engine ServiceDesk
    description: 'Detects suspicious child processes of the "Manage Engine ServiceDesk Plus" Java web service Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate sub processes started by Manage Engine ServiceDesk Pro. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cea2b7ea-792b-405f-95a1-b903ea06458f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_java_manageengine_susp_child_process.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1102
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.source.process.executable.path ~= "\\\\ManageEngine\\\\ServiceDesk\\\\" and xdm.source.process.executable.path ~= "\\\\java\\.exe") and xdm.target.process.executable.path ~= "(?:\\\\AppVLP\\.exe|\\\\bash\\.exe|\\\\bitsadmin\\.exe|\\\\calc\\.exe|\\\\certutil\\.exe|\\\\cscript\\.exe|\\\\curl\\.exe|\\\\forfiles\\.exe|\\\\mftrace\\.exe|\\\\mshta\\.exe|\\\\net\\.exe|\\\\net1\\.exe|\\\\notepad\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\query\\.exe|\\\\reg\\.exe|\\\\schtasks\\.exe|\\\\scrcons\\.exe|\\\\sh\\.exe|\\\\systeminfo\\.exe|\\\\whoami\\.exe|\\\\wmic\\.exe|\\\\wscript\\.exe)$") and not ((xdm.target.process.executable.path ~= "(?:\\\\net\\.exe|\\\\net1\\.exe)$" and xdm.target.process.command_line contains " stop")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-child-process-of-wermgr-exe-396f6630
    name: Suspicious Child Process Of Wermgr.EXE
    description: "Detects suspicious Windows Error Reporting manager (wermgr.exe) child process Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 396f6630-f3ac-44e3-bfc8-1b161bc00c4e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wermgr_susp_child_process.yml"
