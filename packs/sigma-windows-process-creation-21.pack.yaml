        minutes: 60
  - key: suspicious-copy-from-or-to-system-dire-fff9d2b7
    name: Suspicious Copy From or To System Directory
    description: |-
      Detects a suspicious copy operation that tries to copy a program from system (System32, SysWOW64, WinSxS) directories to another on disk.
      Often used to move LOLBINs such as 'certutil' or 'desktopimgdownldr' to a different location with a different name in order to bypass detections based on locations. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Depend on scripts and administrative tools used in the monitored environment (For example an admin scripts like https://www.itexperience.net/sccm-batch-files-and-32-bits-processes-on-64-bits-os/); When cmd.exe and xcopy.exe are called directly; When the command contains the keywords but not in the correct order. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Florian Roth (Nextron Systems), Markus Neis, Tim Shelton (HAWK.IO), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fff9d2b7-e11c-4a69-93d3-40ef66189767. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_copy_system_dir.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" and xdm.target.process.command_line contains "copy ") or (xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and xdm.target.process.command_line ~= "(?:copy-item| copy |cpi | cp )") or (xdm.target.process.executable.path ~= "(?:\\\\robocopy\\.exe|\\\\xcopy\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:robocopy\\.exe|XCOPY\\.EXE)$")) and xdm.target.process.command_line ~= "\\s['\"]?C:\\\\Windows\\\\(?:System32|SysWOW64|WinSxS)" and not ((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" and (xdm.target.process.command_line ~= "/c copy" and xdm.target.process.command_line ~= "\\\\Temp\\\\" and xdm.target.process.command_line ~= "\\\\avira_system_speedup\\.exe") and xdm.target.process.command_line ~= "(?:C:\\\\Program Files\\\\Avira\\\\|C:\\\\Program Files \\(x86\\)\\\\Avira\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-curl-exe-download-e218595b
    name: Suspicious Curl.EXE Download
    description: "Detects a suspicious curl process start on Windows and outputs the requested document to a local file Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e218595b-bbe7-4ee5-8a96-f32a24ad3468. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_curl_susp_download.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\curl\\.exe$" or xdm.target.process.product ~= "^The curl executable$") and (xdm.target.process.command_line ~= "(?:%AppData%|%Public%|%Temp%|%tmp%|\\\\AppData\\\\|\\\\Desktop\\\\|\\\\Temp\\\\|\\\\Users\\\\Public\\\\|C:\\\\PerfLogs\\\\|C:\\\\ProgramData\\\\|C:\\\\Windows\\\\Temp\\\\)" or xdm.target.process.command_line ~= "(?:\\.dll|\\.gif|\\.jpeg|\\.jpg|\\.png|\\.temp|\\.tmp|\\.txt|\\.vbe|\\.vbs)$") and not ((xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\sh\\.exe$" and xdm.target.process.executable.path ~= "^C:\\\\Program Files\\\\Git\\\\mingw64\\\\bin\\\\curl\\.exe$" and (xdm.target.process.command_line ~= "--silent --show-error --output " and xdm.target.process.command_line ~= "gfw-httpget-" and xdm.target.process.command_line ~= "AppData"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-customshellhost-execution-84b14121
    name: Suspicious CustomShellHost Execution
    description: "Detects the execution of CustomShellHost.exe where the child isn't located in 'C:\\Windows\\explorer.exe'. CustomShellHost is a known LOLBin that can be abused by attackers for defense evasion techniques. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: False positives are unlikely, investigate matches carefully.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 84b14121-9d14-416e-800b-f3b829c5a14d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_customshellhost_susp_exec.yml"
    kind: bioc
