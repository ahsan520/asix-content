    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\CustomShellHost\\.exe$" and not (xdm.target.process.executable.path ~= "^C:\\\\Windows\\\\explorer\\.exe$"))
      group_by: field:xdm.source.host.hostname
