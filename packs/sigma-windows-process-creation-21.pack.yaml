  - key: suspicious-codepage-switch-via-chcp-c7942406
    name: Suspicious CodePage Switch Via CHCP
    description: "Detects a code page switch in command line or batch scripts to a rare language Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Administrative activity (adjust code pages according to your organization's region). Sigma rule by Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c7942406-33dd-4377-a564-0f62db0593a3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_chcp_codepage_switch.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\chcp\\.com$" and xdm.target.process.command_line ~= "(?: 936| 1258)$")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-control-panel-dll-load-d7eb979b
    name: Suspicious Control Panel DLL Load
    description: "Detects suspicious Rundll32 execution from control.exe as used by Equation Group and Exploit Kits Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d7eb979b-c2b5-4a6f-a3a7-c87ce6763819. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_susp_control_dll_load.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\System32\\\\control\\.exe$" and (xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or xdm.target.process.original_file_name ~= "^RUNDLL32\\.EXE$")) and not (xdm.target.process.command_line contains "Shell32.dll"))
