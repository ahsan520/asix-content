  - key: suspicious-double-extension-file-execu-1cdd9a09
    name: Suspicious Double Extension File Execution
    description: "Detects suspicious use of an .exe extension after a non-executable file extension like .pdf.exe, a set of spaces or underlines to cloak the executable file in spear phishing campaigns Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), @blu3_team (idea), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1cdd9a09-06c9-4769-99ff-626e2b3991b8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_double_extension.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1566.001
    definition:
      regex: ""
      source_type: ""
