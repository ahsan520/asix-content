  - key: suspicious-parent-double-extension-fil-5e6a80c8
    name: Suspicious Parent Double Extension File Execution
    description: "Detect execution of suspicious double extension files in ParentCommandLine Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_double_extension_parent.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.007
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "(?:\\.doc\\.lnk|\\.docx\\.lnk|\\.xls\\.lnk|\\.xlsx\\.lnk|\\.ppt\\.lnk|\\.pptx\\.lnk|\\.rtf\\.lnk|\\.pdf\\.lnk|\\.txt\\.lnk|\\.doc\\.js|\\.docx\\.js|\\.xls\\.js|\\.xlsx\\.js|\\.ppt\\.js|\\.pptx\\.js|\\.rtf\\.js|\\.pdf\\.js|\\.txt\\.js)$" or xdm.source.process.command_line ~= "(?:\\.doc\\.lnk|\\.docx\\.lnk|\\.xls\\.lnk|\\.xlsx\\.lnk|\\.ppt\\.lnk|\\.pptx\\.lnk|\\.rtf\\.lnk|\\.pdf\\.lnk|\\.txt\\.lnk|\\.doc\\.js|\\.docx\\.js|\\.xls\\.js|\\.xlsx\\.js|\\.ppt\\.js|\\.pptx\\.js|\\.rtf\\.js|\\.pdf\\.js|\\.txt\\.js)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-ping-del-command-combinatio-54786ddc
    name: Suspicious Ping/Del Command Combination
    description: 'Detects a method often used by ransomware. Which combines the "ping" to wait a couple of seconds and then "del" to delete the file in question. Its used to hide the file responsible for the initial infection for example Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Ilya Krestinichev, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 54786ddc-5b8a-11ed-9b6a-0242ac120002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_ping_del_combined_execution.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1070.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= " [-/–—―]n " and xdm.target.process.command_line contains "Nul" and xdm.target.process.command_line ~= "(?: [-/–—―]f | [-/–—―]q )" and (xdm.target.process.command_line ~= "ping" and xdm.target.process.command_line ~= "del "))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-plink-port-forwarding-48a61b29
    name: Suspicious Plink Port Forwarding
    description: "Detects suspicious Plink tunnel port forwarding to a local port Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administrative activity using a remote port forwarding to a local port. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 48a61b29-389f-4032-b317-b30de6b95314. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_plink_port_forwarding.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1572
      - T1021.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.description ~= "^Command-line SSH, Telnet, and Rlogin client$" and xdm.target.process.command_line contains " -R ")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-powercfg-execution-to-chang-f8d6a15e
    name: Suspicious Powercfg Execution To Change Lock Screen Timeout
    description: "Detects suspicious execution of 'Powercfg.exe' to change lock screen timeout Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f8d6a15e-4bc8-4c27-8e5d-2b10f0b73e5b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powercfg_execution.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\powercfg\\.exe$" or xdm.target.process.original_file_name ~= "^PowerCfg\\.exe$") and ((xdm.target.process.command_line ~= "/setacvalueindex " and xdm.target.process.command_line ~= "SCHEME_CURRENT" and xdm.target.process.command_line ~= "SUB_VIDEO" and xdm.target.process.command_line ~= "VIDEOCONLOCK") or (xdm.target.process.command_line ~= "-change " and xdm.target.process.command_line ~= "-standby-timeout-")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-powershell-invocations-spec-536e2947
    name: Suspicious PowerShell Invocations - Specific - ProcessCreation
    description: "Detects suspicious PowerShell invocation command parameters Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 536e2947-3729-478c-9903-745aaffe60d2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_invocation_specific.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.command_line ~= "-nop" and xdm.target.process.command_line ~= " -w " and xdm.target.process.command_line ~= "hidden" and xdm.target.process.command_line ~= " -c " and xdm.target.process.command_line ~= "\\[Convert\\]::FromBase64String") or (xdm.target.process.command_line ~= " -w " and xdm.target.process.command_line ~= "hidden" and xdm.target.process.command_line ~= "-noni" and xdm.target.process.command_line ~= "-nop" and xdm.target.process.command_line ~= " -c " and xdm.target.process.command_line ~= "iex" and xdm.target.process.command_line ~= "New-Object") or (xdm.target.process.command_line ~= " -w " and xdm.target.process.command_line ~= "hidden" and xdm.target.process.command_line ~= "-ep" and xdm.target.process.command_line ~= "bypass" and xdm.target.process.command_line ~= "-Enc") or (xdm.target.process.command_line ~= "powershell" and xdm.target.process.command_line ~= "reg" and xdm.target.process.command_line ~= "add" and xdm.target.process.command_line ~= "\\\\software\\\\") or (xdm.target.process.command_line ~= "bypass" and xdm.target.process.command_line ~= "-noprofile" and xdm.target.process.command_line ~= "-windowstyle" and xdm.target.process.command_line ~= "hidden" and xdm.target.process.command_line ~= "new-object" and xdm.target.process.command_line ~= "system\\.net\\.webclient" and xdm.target.process.command_line ~= "\\.download") or (xdm.target.process.command_line ~= "iex" and xdm.target.process.command_line ~= "New-Object" and xdm.target.process.command_line ~= "Net\\.WebClient" and xdm.target.process.command_line ~= "\\.Download")) and not (xdm.target.process.command_line ~= "(?:\\(New-Object System\\.Net\\.WebClient\\)\\.DownloadString\\('https://community\\.chocolatey\\.org/install\\.ps1|Write-ChocolateyWarning)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-process-masquerading-as-svc-be58d2e2
    name: Suspicious Process Masquerading As SvcHost.EXE
    description: |-
      Detects a suspicious process that is masquerading as the legitimate "svchost.exe" by naming its binary "svchost.exe" and executing from an uncommon location.
      Adversaries often disguise their malicious binaries by naming them after legitimate system processes like "svchost.exe" to evade detection. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id be58d2e2-06c8-4f58-b666-b99f6dc3b6cd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_svchost_masqueraded_execution.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\svchost\\.exe$" and not ((xdm.target.process.executable.path ~= "^(?:C:\\\\Windows\\\\System32\\\\svchost\\.exe|C:\\\\Windows\\\\SysWOW64\\\\svchost\\.exe)$" or xdm.target.process.original_file_name ~= "^svchost\\.exe$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-process-parents-cbec226f
    name: Suspicious Process Parents
    description: "Detects suspicious parent processes that should not have any children or should only have a single possible child program Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id cbec226f-63d9-4eca-9f52-dfb6652f24df. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_parents.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "(?:\\\\minesweeper\\.exe|\\\\winver\\.exe|\\\\bitsadmin\\.exe)$" or (xdm.source.process.executable.path ~= "(?:\\\\csrss\\.exe|\\\\certutil\\.exe|\\\\eventvwr\\.exe|\\\\calc\\.exe|\\\\notepad\\.exe)$" and not ((xdm.target.process.executable.path ~= "(?:\\\\WerFault\\.exe|\\\\wermgr\\.exe|\\\\conhost\\.exe|\\\\mmc\\.exe|\\\\win32calc\\.exe|\\\\notepad\\.exe)$" or not (xdm.target.process.executable.path ~= ".")))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
