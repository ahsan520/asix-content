  - key: network-connection-initiated-via-finge-2fdaf50b
    name: Network Connection Initiated via Finger.EXE
    description: |-
      Detects network connections via finger.exe, which can be abused by threat actors to retrieve remote commands for execution on Windows devices.
      In one ClickFix malware campaign, adversaries leveraged the finger protocol to fetch commands from a remote server.
      Since the finger utility is not commonly used in modern Windows environments, its presence already raises suspicion.
      Investigating such network connections can also help identify potential malicious infrastructure used by threat actors Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2fdaf50b-9fd5-449f-ba69-f17248119af6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_finger.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1071.004
      - T1059.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and (xdm.network.direction = "OUTBOUND" and xdm.source.process.executable.path ~= "\\\\finger\\.exe$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: network-connection-initiated-via-notep-e81528db
    name: Network Connection Initiated Via Notepad.EXE
    description: |-
      Detects a network connection that is initiated by the "notepad.exe" process.
      This might be a sign of process injection from a beacon process or something similar.
      Notepad rarely initiates a network communication except when printing documents for example. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Printing documents via notepad might cause communication with the printer via port 9100 or similar.. Sigma rule by EagleEye Team, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e81528db-fc02-45e8-8e98-4e84aba1f10b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_notepad.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and (xdm.source.process.executable.path ~= "\\\\notepad\\.exe$" and not (xdm.target.port ~= "^9100$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
