  - key: communication-to-ngrok-tunneling-servi-1d08ac94
    name: Communication To Ngrok Tunneling Service Initiated
    description: |-
      Detects an executable initiating a network connection to "ngrok" tunneling domains.
      Attackers were seen using this "ngrok" in order to store their second stage payloads and malware.
      While communication with such domains can be legitimate, often times is a sign of either data exfiltration by malicious actors or additional download. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Legitimate use of the ngrok service.. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1d08ac94-400d-4469-a82f-daee9a908849. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_domain_ngrok_tunnel.yml
    kind: bioc
    severity: high
    category: Exfiltration
    mitre:
      - T1567
      - T1568.002
      - T1572
      - T1090
      - T1102
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and xdm.target.fqdn ~= "(?:tunnel\\.us\\.ngrok\\.com|tunnel\\.eu\\.ngrok\\.com|tunnel\\.ap\\.ngrok\\.com|tunnel\\.au\\.ngrok\\.com|tunnel\\.sa\\.ngrok\\.com|tunnel\\.jp\\.ngrok\\.com|tunnel\\.in\\.ngrok\\.com)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
