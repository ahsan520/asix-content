  - key: suspicious-non-browser-network-communi-7e9cf7b6
    name: Suspicious Non-Browser Network Communication With Google API
    description: 'Detects a non-browser process interacting with the Google API which could indicate the use of a covert C2 such as Google Sheet C2 (GC2-sheet) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Legitimate applications communicating with the "googleapis.com" endpoints that are not already in the exclusion list. This is environmental dependent and requires further testing and tuning.. Sigma rule by Gavin Knapp, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7e9cf7b6-e827-11ed-a05b-0242ac120003. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_domain_google_api_non_browser_access.yml'
    kind: bioc
    severity: medium
    category: network_connection
    mitre:
      - T1102
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and (xdm.target.fqdn ~= "(?:drive\\.googleapis\\.com|oauth2\\.googleapis\\.com|sheets\\.googleapis\\.com|www\\.googleapis\\.com)" and not ((not (xdm.source.process.executable.path ~= ".") or not (xdm.source.process.executable.path ~= "."))) and not ((xdm.source.process.executable.path ~= "\\\\brave\\.exe$" or xdm.source.process.executable.path ~= "(?::\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe|:\\\\Program Files \\(x86\\)\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe)$" or (xdm.source.process.executable.path contains ":\\Program Files\\Google\\Drive File Stream\\" and xdm.source.process.executable.path ~= "\\\\GoogleDriveFS\\.exe$") or xdm.source.process.executable.path ~= "(?::\\\\Program Files\\\\Mozilla Firefox\\\\firefox\\.exe|:\\\\Program Files \\(x86\\)\\\\Mozilla Firefox\\\\firefox\\.exe)$" or xdm.source.process.executable.path ~= "(?::\\\\Program Files \\(x86\\)\\\\Internet Explorer\\\\iexplore\\.exe|:\\\\Program Files\\\\Internet Explorer\\\\iexplore\\.exe)$" or xdm.source.process.executable.path ~= "\\\\maxthon\\.exe$" or (xdm.source.process.executable.path contains ":\\Program Files (x86)\\Microsoft\\EdgeWebView\\Application\\" or xdm.source.process.executable.path ~= "(?::\\\\Program Files \\(x86\\)\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe|:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe|\\\\WindowsApps\\\\MicrosoftEdge\\.exe)$") or (xdm.source.process.executable.path ~= "(?::\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeCore\\\\|:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\msedge\\.exe|\\\\msedgewebview2\\.exe)$") or xdm.source.process.executable.path ~= "\\\\opera\\.exe$" or xdm.source.process.executable.path ~= "\\\\safari\\.exe$" or xdm.source.process.executable.path ~= "\\\\seamonkey\\.exe$" or xdm.source.process.executable.path ~= "\\\\vivaldi\\.exe$" or xdm.source.process.executable.path ~= "\\\\whale\\.exe$" or xdm.source.process.executable.path ~= "\\\\GoogleUpdate\\.exe$" or xdm.source.process.executable.path ~= "\\\\outlook\\.exe$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-wordpad-outbound-connection-786cdae8
    name: Suspicious Wordpad Outbound Connections
    description: |-
      Detects a network connection initiated by "wordpad.exe" over uncommon destination ports.
      This might indicate potential process injection activity from a beacon or similar mechanisms. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Other ports can be used, apply additional filters accordingly. Sigma rule by X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 786cdae8-fefb-4eb2-9227-04e34060db01. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_wordpad_uncommon_ports.yml
    kind: bioc
    severity: medium
    category: network_connection
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and ((xdm.network.direction = "OUTBOUND" and xdm.source.process.executable.path ~= "\\\\wordpad\\.exe$") and not (xdm.target.port ~= "^(?:80|139|443|445|465|587|993|995)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-network-connection-initiated-0dba975d
    name: Uncommon Network Connection Initiated By Certutil.EXE
    description: |-
      Detects a network connection initiated by the certutil.exe utility.
      Attackers can abuse the utility in order to download malware or additional payloads. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Unknown. Sigma rule by frack113, Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0dba975d-a193-4ed1-a067-424df57570d1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_certutil_initiated_connection.yml
    kind: bioc
    severity: high
    category: network_connection
    mitre:
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and (xdm.source.process.executable.path ~= "\\\\certutil\\.exe$" and xdm.network.direction = "OUTBOUND" and xdm.target.port ~= "^(?:80|135|443|445)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-outbound-kerberos-connection-e54979bd
    name: Uncommon Outbound Kerberos Connection
    description: "Detects uncommon outbound network activity via Kerberos default port indicating possible lateral movement or first stage PrivEsc via delegation. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Web Browsers and third party application might generate similar activity. An initial baseline is required.. Sigma rule by Ilyas Ochkov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e54979bd-c5f9-4d6c-967b-a04b19ac4c74. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_susp_outbound_kerberos_connection.yml"
    kind: bioc
    severity: medium
    category: network_connection
    mitre:
      - T1558
      - T1550.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and ((xdm.target.port ~= "^88$" and xdm.network.direction = "OUTBOUND") and not (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\lsass\\.exe$") and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe|C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Mozilla Firefox\\\\firefox\\.exe|C:\\\\Program Files\\\\Mozilla Firefox\\\\firefox\\.exe)$" or xdm.source.process.executable.path ~= "\\\\tomcat\\\\bin\\\\tomcat8\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Zscaler\\\\ZSATunnel\\\\ZSATunnel\\.exe|C:\\\\Program Files \\(x86\\)\\\\Zscaler\\\\ZSATunnel\\\\ZSATunnel\\.exe)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remote-access-tool-anydesk-incoming-co-d58ba5c6
    name: Remote Access Tool - AnyDesk Incoming Connection
    description: "Detects incoming connections to AnyDesk. This could indicate a potential remote attacker trying to connect to a listening instance of AnyDesk and use it as potential command and control channel. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Legitimate incoming connections (e.g. sysadmin activity). Most of the time I would expect outgoing connections (initiated locally).. Sigma rule by @d4ns4n_ (Wuerth-Phoenix), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d58ba5c6-0ed7-4b9d-a433-6878379efda9. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_remote_access_tools_anydesk_incoming_connection.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1219.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and (xdm.source.process.executable.path ~= "(?:\\\\AnyDesk\\.exe|\\\\AnyDeskMSI\\.exe)$" and xdm.network.direction = "INBOUND")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
