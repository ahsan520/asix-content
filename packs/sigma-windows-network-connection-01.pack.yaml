# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-network-connection-01
name: "Sigma: Windows network connection"
description: "32 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows network connection events, grouped by tactic, starting with Discovery. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - network-connection
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3)
rules:
  - key: suspicious-network-connection-to-ip-lo-edf3485d
    name: Suspicious Network Connection to IP Lookup Service APIs
    description: 'Detects external IP address lookups by non-browser processes via services such as "api.ipify.org". This could be indicative of potential post compromise internet test activity. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Legitimate use of the external websites for troubleshooting or network monitoring. Sigma rule by Janantha Marasinghe, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id edf3485d-dac4-4d50-90e4-b0e5813f7e60. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_domain_external_ip_lookup.yml'
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1016
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and ((xdm.target.fqdn ~= "^(?:www\\.ip\\.cn|l2\\.io)$" or (xdm.target.fqdn ~= "(?:api\\.2ip\\.ua|api\\.bigdatacloud\\.net|api\\.ipify\\.org|bot\\.whatismyipaddress\\.com|canireachthe\\.net|checkip\\.amazonaws\\.com|checkip\\.dyndns\\.org|curlmyip\\.com|db-ip\\.com|edns\\.ip-api\\.com|eth0\\.me|freegeoip\\.app|geoipy\\.com|getip\\.pro|icanhazip\\.com|ident\\.me|ifconfig\\.io|ifconfig\\.me|ip-api\\.com|ip\\.360\\.cn|ip\\.anysrc\\.net|ip\\.taobao\\.com|ip\\.tyk\\.nu|ipaddressworld\\.com)" or xdm.target.fqdn ~= "(?:ipapi\\.co|ipconfig\\.io|ipecho\\.net|ipinfo\\.io|ipip\\.net|ipof\\.in|ipv4\\.icanhazip\\.com|ipv4bot\\.whatismyipaddress\\.com|ipv6-test\\.com|ipwho\\.is|jsonip\\.com|myexternalip\\.com|seeip\\.org|wgetip\\.com|whatismyip\\.akamai\\.com|whois\\.pconline\\.com\\.cn|wtfismyip\\.com)")) and not ((xdm.source.process.executable.path ~= "\\\\brave\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe|C:\\\\Program Files \\(x86\\)\\\\Google\\\\Chrome\\\\Application\\\\chrome\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Mozilla Firefox\\\\firefox\\.exe|C:\\\\Program Files \\(x86\\)\\\\Mozilla Firefox\\\\firefox\\.exe)$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Internet Explorer\\\\iexplore\\.exe|C:\\\\Program Files\\\\Internet Explorer\\\\iexplore\\.exe)$" or xdm.source.process.executable.path ~= "\\\\maxthon\\.exe$" or (xdm.source.process.executable.path ~= "^C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\" or xdm.source.process.executable.path ~= "\\\\WindowsApps\\\\MicrosoftEdge\\.exe$" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe|C:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\msedge\\.exe)$") or (xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Microsoft\\\\EdgeCore\\\\|C:\\\\Program Files\\\\Microsoft\\\\EdgeCore\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\msedge\\.exe|\\\\msedgewebview2\\.exe)$") or xdm.source.process.executable.path ~= "\\\\opera\\.exe$" or xdm.source.process.executable.path ~= "\\\\safari\\.exe$" or xdm.source.process.executable.path ~= "\\\\seamonkey\\.exe$" or xdm.source.process.executable.path ~= "\\\\vivaldi\\.exe$" or xdm.source.process.executable.path ~= "\\\\whale\\.exe$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-connection-to-active-director-b3ad3c0f
    name: Uncommon Connection to Active Directory Web Services
    description: "Detects uncommon network connections to the Active Directory Web Services (ADWS) from processes not typically associated with ADWS management. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: ADWS is used by a number of legitimate applications that need to interact with Active Directory. These applications should be added to the allow-listing to avoid false positives.. Sigma rule by @kostastsale, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b3ad3c0f-c949-47a1-a30e-b0491ccae876. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_adws_unusual_connection.yml"
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1087
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and ((xdm.network.direction = "OUTBOUND" and xdm.target.port ~= "^9389$") and not ((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\system32\\\\dsac\\.exe$" or xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\Microsoft Monitoring Agent\\\\" or xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\PowerShell\\\\7-preview\\\\pwsh\\.exe|C:\\\\Program Files\\\\PowerShell\\\\7\\\\pwsh\\.exe|C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1\\.0\\\\powershell_ise\\.exe|C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1\\.0\\\\powershell\\.exe|C:\\\\Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\v1\\.0\\\\powershell_ise\\.exe|C:\\\\Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\v1\\.0\\\\powershell\\.exe)$" or (xdm.source.process.executable.path ~= "(?:C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\.PowerShellPreview|\\\\AppData\\\\Local\\\\Microsoft\\\\WindowsApps\\\\Microsoft\\.PowerShellPreview)" and xdm.source.process.executable.path ~= "\\\\pwsh\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: network-connection-initiated-by-eqnedt-a66bc059
    name: Network Connection Initiated By Eqnedt32.EXE
    description: 'Detects network connections from the Equation Editor process "eqnedt32.exe". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Unlikely. Sigma rule by Max Altgelt (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a66bc059-c370-472c-a0d7-f8fd1bf9d583. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_eqnedt.yml'
    kind: bioc
