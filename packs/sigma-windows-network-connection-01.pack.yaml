    name: Network Connection Initiated By Regsvr32.EXE
    description: 'Detects a network connection initiated by "Regsvr32.exe" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 3). Known false positives: Unknown. Sigma rule by Dmitriy Lifanov, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c7e91a02-d771-4a6d-a700-42587e0b1095. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_regsvr32_network_activity.yml'
    kind: bioc
