    category: Execution
    mitre:
      - T1203
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "network_connection" and xdm.source.process.executable.path ~= "\\\\eqnedt32\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
