# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-02
name: "Sigma: Windows process creation (2 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Discovery. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: gpresult-display-group-policy-informat-e56d3073
    name: Gpresult Display Group Policy Information
    description: "Detects cases in which a user uses the built-in Windows utility gpresult to display the Resultant Set of Policy (RSoP) information Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e56d3073-83ff-4021-90fe-c658e0709e72. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_gpresult_execution.yml"
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1615
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\gpresult\\.exe$" and xdm.target.process.command_line ~= "(?:/z|/v)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: group-membership-reconnaissance-via-wh-bd8b828d
    name: Group Membership Reconnaissance Via Whoami.EXE
    description: "Detects the execution of whoami.exe with the /group command line flag to show group membership for the current user, account type, security identifiers (SID), and attributes. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id bd8b828d-0dca-48e1-8a63-8a58ecf2644f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_whoami_groups_discovery.yml"
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1033
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\whoami\\.exe$" or xdm.target.process.original_file_name ~= "^whoami\\.exe$") and xdm.target.process.command_line ~= "(?: /groups| -groups)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-bloodhound-sharphound-executi-f376c8a7
    name: HackTool - Bloodhound/Sharphound Execution
    description: "Detects command line parameters used by Bloodhound and Sharphound hack tools Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Other programs that use these command line option and accepts an 'All' parameter. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f376c8a7-a2d0-4ddc-aa0c-16c17236d962. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_bloodhound_sharphound.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1087.001
      - T1087.002
      - T1482
      - T1069.001
      - T1069.002
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.product contains "SharpHound" or xdm.target.process.description contains "SharpHound" or xdm.target.process.company ~= "(?:SpecterOps|evil corp)" or xdm.target.process.executable.path ~= "(?:\\\\Bloodhound\\.exe|\\\\SharpHound\\.exe)") or xdm.target.process.command_line ~= "(?: -CollectionMethod All | --CollectionMethods Session | --Loop --Loopduration | --PortScanTimeout |\\.exe -c All -d |Invoke-Bloodhound|Get-BloodHoundData)" or (xdm.target.process.command_line ~= " -JsonFolder " and xdm.target.process.command_line ~= " -ZipFileName ") or (xdm.target.process.command_line ~= " DCOnly " and xdm.target.process.command_line ~= " --NoSaveCache "))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
