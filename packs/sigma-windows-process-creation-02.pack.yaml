  - key: hacktool-netexec-execution-7638e5fe
    name: HackTool - NetExec Execution
    description: |-
      Detects execution of the hacktool NetExec.
      NetExec (formerly CrackMapExec) is a widely used post-exploitation tool designed for Active Directory penetration testing and network enumeration
      In enterprise environments, the use of NetExec is considered suspicious or potentially malicious because it enables attackers to enumerate hosts, exploit network services, and move laterally across systems.
      Threat actors and red teams commonly use NetExec to identify vulnerable systems, harvest credentials, and execute commands remotely. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use of NetExec by security professionals or system administrators for network assessment and management.. Sigma rule by Chirag Damani, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7638e5fe-600c-4289-a968-f49dd537ec7d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_netexec.yml
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1018
      - T1021
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\nxc\\.exe$" and xdm.target.process.command_line ~= "(?: ftp | ldap | mssql | nfs | rdp | smb | ssh | vnc | winrm | wmi )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
