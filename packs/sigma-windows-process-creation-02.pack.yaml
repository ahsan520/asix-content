      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: recon-command-output-piped-to-findstr-ccb5742c
    name: Recon Command Output Piped To Findstr.EXE
    description: |-
      Detects the execution of a potential recon command where the results are piped to "findstr". This is meant to trigger on inline calls of "cmd.exe" via the "/c" or "/k" for example.
      Attackers often time use this technique to extract specific information they require in their reconnaissance phase. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ccb5742c-c248-4982-8c5c-5571b9275ad3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_findstr_recon_pipe_output.yml
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1057
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:ipconfig.*\\|.*find|net.*\\|.*find|netstat.*\\|.*find|ping.*\\|.*find|systeminfo.*\\|.*find|tasklist.*\\|.*find|whoami.*\\|.*find)" and not ((xdm.target.process.command_line ~= "cmd\\.exe /c TASKLIST /V \\|" and xdm.target.process.command_line ~= "FIND /I" and xdm.target.process.command_line ~= "\\\\xampp\\\\" and xdm.target.process.command_line ~= "\\\\catalina_start\\.bat")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: renamed-adfind-execution-df55196f
    name: Renamed AdFind Execution
    description: "Detects the use of a renamed Adfind.exe. AdFind continues to be seen across majority of breaches. It is used to domain trust discovery to plan out subsequent steps in the attack chain. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id df55196f-f105-44d3-a675-e9dfb6cc2f2b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_adfind.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1018
      - T1087.002
      - T1482
      - T1069.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "(?:domainlist|trustdmp|dcmodes|adinfo| dclist |computer_pwdnotreqd|objectcategory=|-subnets -f|name=\"Domain Admins\"|-sc u:|domainncs|dompol| oudmp |subnetdmp|gpodmp|fspdmp|users_noexpire|computers_active|computers_pwdnotreqd)" or xdm.target.process.hashes ~= "(?:IMPHASH=BCA5675746D13A1F246E2DA3C2217492|IMPHASH=53E117A96057EAF19C41380D0E87F1C2|IMPHASH=d144de8117df2beceaba2201ad304764|IMPHASH=12ce1c0f3f5837ecc18a3782408fa975|IMPHASH=4fbf3f084fbbb2470b80b2013134df35|IMPHASH=49b639b4acbecc49d72a01f357aa4930|IMPHASH=680dad9e300346e05a85023965867201|IMPHASH=21aa085d54992511b9f115355e468782)" or xdm.target.process.original_file_name ~= "^AdFind\\.exe$") and not (xdm.target.process.executable.path ~= "\\\\AdFind\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: renamed-whoami-execution-f1086bf7
    name: Renamed Whoami Execution
    description: "Detects the execution of whoami that has been renamed to a different name to avoid detection Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f1086bf7-a0c4-4a37-9102-01e573caf4a0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_whoami.yml"
    kind: bioc
    severity: critical
    category: Discovery
    mitre:
      - T1033
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.original_file_name ~= "^whoami\\.exe$" and not (xdm.target.process.executable.path ~= "\\\\whoami\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: security-privileges-enumeration-via-wh-97a80ec7
    name: Security Privileges Enumeration Via Whoami.EXE
    description: "Detects a whoami.exe executed with the /priv command line flag instructing the tool to show all current user privileges. This is often used after a privilege escalation attempt. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 97a80ec7-0e2f-4d05-9ef4-65760e634f6b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_whoami_priv_discovery.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1033
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\whoami\\.exe$" or xdm.target.process.original_file_name ~= "^whoami\\.exe$") and xdm.target.process.command_line ~= "(?: /priv| -priv)")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: share-and-session-enumeration-using-ne-62510e69
    name: Share And Session Enumeration Using Net.EXE
    description: 'Detects attempts to enumerate file shares, printer shares and sessions using "net.exe" with the "view" flag. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of net.exe utility by legitimate user. Sigma rule by Endgame, JHasenbusch (ported for oscd.community), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 62510e69-616b-4078-b371-847da438cc03. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_view_share_and_sessions_enum.yml'
    kind: bioc
    severity: low
    category: Discovery
    mitre:
      - T1018
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "(?:\\\\net\\.exe|\\\\net1\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:net\\.exe|net1\\.exe)$") and xdm.target.process.command_line contains "view") and not (xdm.target.process.command_line contains "\\\\\\\\"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
