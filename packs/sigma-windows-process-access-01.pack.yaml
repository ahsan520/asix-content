# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-access-01
name: "Sigma: Windows process access"
description: "7 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process access events, grouped by tactic, starting with Execution. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-access
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10)
rules:
  - key: remote-lsass-process-access-through-wi-aa35a627
    name: Remote LSASS Process Access Through Windows Remote Management
    description: "Detects remote access to the LSASS process via WinRM. This could be a sign of credential dumping from tools like mimikatz. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Unlikely. Sigma rule by Patryk Prauze - ING Tech, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id aa35a627-33fb-4d04-a165-d33b4afca3e8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_lsass_remote_access_trough_winrm.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1003.001
      - T1059.001
      - T1021.006
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and ((xdm.target.process.executable.path ~= "\\\\lsass\\.exe$" and xdm.source.process.executable.path ~= ":\\\\Windows\\\\system32\\\\wsmprovhost\\.exe$") and not (xdm.target.process.granted_access ~= "^0x80000000$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: credential-dumping-attempt-via-svchost-174afcfa
    name: Credential Dumping Attempt Via Svchost
    description: "Detects when a process tries to access the memory of svchost to potentially dump credentials. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Unknown. Sigma rule by Florent Labouyrie, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 174afcfa-6e40-4ae9-af64-496546389294. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_svchost_credential_dumping.yml"
    kind: bioc
    severity: high
    category: process_access
    mitre:
      - T1548
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and ((xdm.target.process.executable.path ~= "\\\\svchost\\.exe$" and xdm.target.process.granted_access ~= "^0x143a$") and not (xdm.source.process.executable.path ~= "(?:\\\\services\\.exe|\\\\msiexec\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: credential-dumping-attempt-via-werfaul-e5b33f7d
    name: Credential Dumping Attempt Via WerFault
    description: "Detects process LSASS memory dump using Mimikatz, NanoDump, Invoke-Mimikatz, Procdump or Taskmgr based on the CallTrace pointing to ntdll.dll, dbghelp.dll or dbgcore.dll for win10, server2016 and up. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Actual failures in lsass.exe that trigger a crash dump (unlikely); Unknown cases in which WerFault accesses lsass.exe. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e5b33f7d-eb93-48b6-9851-09e1e610b6d7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_lsass_werfault.yml"
    kind: bioc
    severity: high
    category: process_access
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and (xdm.source.process.executable.path ~= "\\\\WerFault\\.exe$" and xdm.target.process.executable.path ~= "\\\\lsass\\.exe$" and xdm.target.process.granted_access ~= "^0x1FFFFF$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-generic-process-access-d0d2f720
    name: HackTool - Generic Process Access
    description: "Detects process access requests from hacktool processes based on their default image name Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d0d2f720-d14f-448d-8242-51ff396a334e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_hktl_generic_access.yml"
    kind: bioc
    severity: high
    category: process_access
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and ((xdm.source.process.executable.path ~= "(?:\\\\Akagi\\.exe|\\\\Akagi64\\.exe|\\\\atexec_windows\\.exe|\\\\Certify\\.exe|\\\\Certipy\\.exe|\\\\CoercedPotato\\.exe|\\\\crackmapexec\\.exe|\\\\CreateMiniDump\\.exe|\\\\dcomexec_windows\\.exe|\\\\dpapi_windows\\.exe|\\\\findDelegation_windows\\.exe|\\\\GetADUsers_windows\\.exe|\\\\GetNPUsers_windows\\.exe|\\\\getPac_windows\\.exe|\\\\getST_windows\\.exe|\\\\getTGT_windows\\.exe|\\\\GetUserSPNs_windows\\.exe|\\\\gmer\\.exe)$" or xdm.source.process.executable.path ~= "(?:\\\\hashcat\\.exe|\\\\htran\\.exe|\\\\ifmap_windows\\.exe|\\\\impersonate\\.exe|\\\\Inveigh\\.exe|\\\\LocalPotato\\.exe|\\\\mimikatz_windows\\.exe|\\\\mimikatz\\.exe|\\\\netview_windows\\.exe|\\\\nmapAnswerMachine_windows\\.exe|\\\\opdump_windows\\.exe|\\\\PasswordDump\\.exe|\\\\Potato\\.exe|\\\\PowerTool\\.exe|\\\\PowerTool64\\.exe|\\\\psexec_windows\\.exe|\\\\PurpleSharp\\.exe|\\\\pypykatz\\.exe|\\\\QuarksPwDump\\.exe)$" or xdm.source.process.executable.path ~= "(?:\\\\rdp_check_windows\\.exe|\\\\Rubeus\\.exe|\\\\SafetyKatz\\.exe|\\\\sambaPipe_windows\\.exe|\\\\SelectMyParent\\.exe|\\\\SharpChisel\\.exe|\\\\SharPersist\\.exe|\\\\SharpEvtMute\\.exe|\\\\SharpImpersonation\\.exe|\\\\SharpLDAPmonitor\\.exe|\\\\SharpLdapWhoami\\.exe|\\\\SharpUp\\.exe|\\\\SharpView\\.exe|\\\\smbclient_windows\\.exe|\\\\smbserver_windows\\.exe|\\\\sniff_windows\\.exe|\\\\sniffer_windows\\.exe)$" or xdm.source.process.executable.path ~= "(?:\\\\split_windows\\.exe|\\\\SpoolSample\\.exe|\\\\Stracciatella\\.exe|\\\\SysmonEOP\\.exe|\\\\temp\\\\rot\\.exe|\\\\ticketer_windows\\.exe|\\\\TruffleSnout\\.exe|\\\\winPEASany_ofs\\.exe|\\\\winPEASany\\.exe|\\\\winPEASx64_ofs\\.exe|\\\\winPEASx64\\.exe|\\\\winPEASx86_ofs\\.exe|\\\\winPEASx86\\.exe|\\\\xordump\\.exe)$") or xdm.source.process.executable.path ~= "(?:\\\\goldenPac|\\\\just_dce_|\\\\karmaSMB|\\\\kintercept|\\\\LocalPotato|\\\\ntlmrelayx|\\\\rpcdump|\\\\samrdump|\\\\secretsdump|\\\\smbexec|\\\\smbrelayx|\\\\wmiexec|\\\\wmipersist|HotPotato|Juicy Potato|JuicyPotato|PetitPotam|RottenPotato)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-access-from-potentially-white-li-4be8b654
    name: LSASS Access From Potentially White-Listed Processes
    description: "Detects a possible process memory dump that uses a white-listed filename like TrolleyExpress.exe as a way to dump the LSASS process memory without Microsoft Defender interference Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4be8b654-0c01-4c9d-a10c-6b28467fc651. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_lsass_whitelisted_process_names.yml"
    kind: bioc
    severity: high
    category: process_access
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and (xdm.target.process.executable.path ~= "\\\\lsass\\.exe$" and xdm.source.process.executable.path ~= "(?:\\\\TrolleyExpress\\.exe|\\\\ProcessDump\\.exe|\\\\dump64\\.exe)$" and xdm.target.process.granted_access ~= "(?:10|30|50|70|90|B0|D0|F0|18|38|58|78|98|B8|D8|F8|1A|3A|5A|7A|9A|BA|DA|FA|0x14C2|FF)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-memory-access-by-tool-with-dump-9bd012ee
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    description: 'Detects LSASS process access requests from a source process with the "dump" keyword in its image name. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Rare programs that contain the word dump in their name and access lsass. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9bd012ee-0dff-44d7-84a0-aa698cfd87a3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_lsass_dump_keyword_image.yml'
    kind: bioc
    severity: high
    category: process_access
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and (xdm.target.process.executable.path ~= "\\\\lsass\\.exe$" and xdm.source.process.executable.path contains "dump" and xdm.target.process.granted_access ~= "(?:10|30|50|70|90|B0|D0|F0|18|38|58|78|98|B8|D8|F8|1A|3A|5A|7A|9A|BA|DA|FA|0x14C2|FF)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-process-access-rights-for-tar-a24e5861
    name: Uncommon Process Access Rights For Target Image
    description: 'Detects process access request to uncommon target images with a "PROCESS_ALL_ACCESS" access mask. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 10). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a24e5861-c6ca-4fde-a93c-ba9256feddf0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_access/proc_access_win_susp_all_access_uncommon_target.yml'
    kind: bioc
    severity: low
    category: process_access
    mitre:
      - T1055.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process_access" and (xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\calculator\\.exe|\\\\mspaint\\.exe|\\\\notepad\\.exe|\\\\ping\\.exe|\\\\wordpad\\.exe|\\\\write\\.exe)$" and xdm.target.process.granted_access ~= "^0x1FFFFF$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
