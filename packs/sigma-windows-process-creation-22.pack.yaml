      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "rundll32.exe" and xdm.target.process.command_line ~= "(?:\\.sys,|\\.sys )")
      group_by: field:xdm.source.host.hostname
