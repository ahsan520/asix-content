    severity: high
    category: process_creation
    mitre:
      - T1218.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.command_line contains "SHELL32.DLL" and xdm.source.process.command_line ~= "(?:#568|#570|#572|#576)") and ((xdm.source.process.command_line ~= "(?:comspec|iex|Invoke-|msiexec|odbcconf|regsvr32)" or xdm.source.process.command_line ~= "(?:\\\\Desktop\\\\|\\\\ProgramData\\\\|\\\\Temp\\\\|\\\\Users\\\\Public\\\\)") or xdm.target.process.executable.path ~= "(?:\\\\bash\\.exe|\\\\bitsadmin\\.exe|\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\curl\\.exe|\\\\mshta\\.exe|\\\\msiexec\\.exe|\\\\msxsl\\.exe|\\\\odbcconf\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\schtasks\\.exe|\\\\wmic\\.exe|\\\\wscript\\.exe)$"))
