  - key: suspicious-response-file-execution-via-2d32dd6f
    name: Suspicious Response File Execution Via Odbcconf.EXE
    description: 'Detects execution of "odbcconf" with the "-f" flag in order to load a response file with a non-".rsp" extension. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_odbcconf_response_file_susp.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\odbcconf\\.exe$" or xdm.target.process.original_file_name ~= "^odbcconf\\.exe$") and xdm.target.process.command_line ~= " [-/–—―]f ") and not ((xdm.target.process.command_line contains ".rsp" or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\runonce\\.exe$" and xdm.target.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\odbcconf\\.exe$" and xdm.target.process.command_line contains ".exe /E /F \"C:\\WINDOWS\\system32\\odbcconf.tmp\""))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-runas-like-flag-combination-50d66fb0
    name: Suspicious RunAs-Like Flag Combination
    description: "Detects suspicious command line flags that let the user set a target user and command as e.g. seen in PsExec-like tools Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 50d66fb0-03f8-4da0-8add-84e77d12a020. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_privilege_escalation_cli_patterns.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: "xdm.event.type = \"process\" and (xdm.target.process.command_line ~= \"(?: -u system | --user system | -u NT| -u \\\"NT| -u 'NT| --system | -u administrator )\" and xdm.target.process.command_line ~= \"(?: -c cmd| -c \\\"cmd| -c powershell| -c \\\"powershell| --command cmd| --command powershell| -c whoami| -c wscript| -c cscript)\")"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-rundll32-activity-invoking-731231b9
    name: Suspicious Rundll32 Activity Invoking Sys File
    description: "Detects suspicious process related to rundll32 based on command line that includes a *.sys file as seen being used by UNC2452 Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 731231b9-0b5d-4219-94dd-abb6959aa7ea. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_sys.yml"
