    mitre:
      - T1218.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\regsvr32\\.exe$" or xdm.target.process.original_file_name ~= "^\\\\REGSVR32\\.EXE$") and xdm.target.process.command_line contains " \\\\\\\\")
      group_by: field:xdm.source.host.hostname
