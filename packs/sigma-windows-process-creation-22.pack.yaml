        minutes: 60
  - key: suspicious-rundll32-setupapi-dll-activ-285b85b1
    name: Suspicious Rundll32 Setupapi.dll Activity
    description: "setupapi.dll library provide InstallHinfSection function for processing INF files. INF file may contain instructions allowing to create values in the registry, modify files and install drivers. This technique could be used to obtain persistence via modifying one of Run or RunOnce registry keys, run process or use other DLLs chain calls (see references) InstallHinfSection function in setupapi.dll calls runonce.exe executable regardless of actual content of INF file. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Scripts and administrative tools that use INF files for driver installation with setupapi.dll. Sigma rule by Konstantin Grishchenko, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 285b85b1-a555-4095-8652-a8a4106af63f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_setupapi_installhinfsection.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\runonce\\.exe$" and xdm.source.process.executable.path ~= "\\\\rundll32\\.exe$" and (xdm.source.process.command_line ~= "setupapi\\.dll" and xdm.source.process.command_line ~= "InstallHinfSection"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
