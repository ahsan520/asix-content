# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-22
name: "Sigma: Windows process creation (22 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: suspicious-process-patterns-ntds-dit-e-8bc64091
    name: Suspicious Process Patterns NTDS.DIT Exfil
    description: "Detects suspicious process patterns used in NTDS.DIT exfiltration Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8bc64091-6875-4881-aaf9-7bd25b5dda08. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_ntds.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "(?:\\\\NTDSDump\\.exe|\\\\NTDSDumpEx\\.exe)$" or (xdm.target.process.command_line ~= "ntds\\.dit" and xdm.target.process.command_line ~= "system\\.hiv") or xdm.target.process.command_line contains "NTDSgrab.ps1") or (xdm.target.process.command_line ~= "ac i ntds" and xdm.target.process.command_line ~= "create full") or (xdm.target.process.command_line ~= "/c copy " and xdm.target.process.command_line ~= "\\\\windows\\\\ntds\\\\ntds\\.dit") or (xdm.target.process.command_line ~= "activate instance ntds" and xdm.target.process.command_line ~= "create full") or (xdm.target.process.command_line ~= "powershell" and xdm.target.process.command_line ~= "ntds\\.dit")) or (xdm.target.process.command_line contains "ntds.dit" and (xdm.source.process.executable.path ~= "(?:\\\\apache|\\\\tomcat|\\\\AppData\\\\|\\\\Temp\\\\|\\\\Public\\\\|\\\\PerfLogs\\\\)" or xdm.target.process.executable.path ~= "(?:\\\\apache|\\\\tomcat|\\\\AppData\\\\|\\\\Temp\\\\|\\\\Public\\\\|\\\\PerfLogs\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-process-start-locations-15b75071
    name: Suspicious Process Start Locations
    description: "Detects suspicious process run from unusual locations Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: False positives depend on scripts and administrative tools used in the monitored environment. Sigma rule by juju4, Jonhnathan Ribeiro, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 15b75071-74cc-47e0-b4c6-b43744a62a2b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_run_locations.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "(?::\\\\RECYCLER\\\\|:\\\\SystemVolumeInformation\\\\)" or xdm.target.process.executable.path ~= "^(?:C:\\\\Windows\\\\Tasks\\\\|C:\\\\Windows\\\\debug\\\\|C:\\\\Windows\\\\fonts\\\\|C:\\\\Windows\\\\help\\\\|C:\\\\Windows\\\\drivers\\\\|C:\\\\Windows\\\\addins\\\\|C:\\\\Windows\\\\cursors\\\\|C:\\\\Windows\\\\system32\\\\tasks\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-program-location-whiteliste-a35f5a72
    name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
    description: "Detects Netsh command execution that whitelists a program located in a suspicious location in the Windows Firewall Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Sander Wiebing, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a35f5a72-f347-4e36-8895-9869b0d5fc6d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_netsh_fw_allow_program_in_susp_location.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1686.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\netsh\\.exe$" or xdm.target.process.original_file_name ~= "^netsh\\.exe$") and ((xdm.target.process.command_line ~= "firewall" and xdm.target.process.command_line ~= "add" and xdm.target.process.command_line ~= "allowedprogram") or (xdm.target.process.command_line ~= "advfirewall" and xdm.target.process.command_line ~= "firewall" and xdm.target.process.command_line ~= "add" and xdm.target.process.command_line ~= "rule" and xdm.target.process.command_line ~= "action=allow" and xdm.target.process.command_line ~= "program=")) and (xdm.target.process.command_line ~= "(?::\\\\\\$Recycle\\.bin\\\\|:\\\\RECYCLER\\.BIN\\\\|:\\\\RECYCLERS\\.BIN\\\\|:\\\\SystemVolumeInformation\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Default\\\\|:\\\\Users\\\\Desktop\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\addins\\\\|:\\\\Windows\\\\cursors\\\\|:\\\\Windows\\\\debug\\\\|:\\\\Windows\\\\drivers\\\\|:\\\\Windows\\\\fonts\\\\|:\\\\Windows\\\\help\\\\|:\\\\Windows\\\\system32\\\\tasks\\\\|:\\\\Windows\\\\Tasks\\\\|:\\\\Windows\\\\Temp\\\\|\\\\Downloads\\\\)" or xdm.target.process.command_line ~= "(?:\\\\Local Settings\\\\Temporary Internet Files\\\\|\\\\Temporary Internet Files\\\\Content\\.Outlook\\\\|%Public%\\\\|%TEMP%|%TMP%)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-provlaunch-exe-child-proces-f9999590
    name: Suspicious Provlaunch.EXE Child Process
    description: 'Detects suspicious child processes of "provlaunch.exe" which might indicate potential abuse to proxy execution. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f9999590-1f94-4a34-a91e-951e47bedefd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_provlaunch_susp_child_process.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\provlaunch\\.exe$" and (xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\notepad\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.executable.path ~= "(?::\\\\PerfLogs\\\\|:\\\\Temp\\\\|:\\\\Users\\\\Public\\\\|\\\\AppData\\\\Temp\\\\|\\\\Windows\\\\System32\\\\Tasks\\\\|\\\\Windows\\\\Tasks\\\\|\\\\Windows\\\\Temp\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-rdp-redirect-using-tscon-f72aa3e8
    name: Suspicious RDP Redirect Using TSCON
    description: "Detects a suspicious RDP session redirect using tscon.exe Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_tscon_rdp_redirect.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1563.002
      - T1021.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line contains " /dest:rdp-tcp#"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-recursive-takeown-554601fb
    name: Suspicious Recursive Takeown
    description: "Adversaries can interact with the DACLs using built-in Windows commands takeown which can grant adversaries higher permissions on specific files and folders Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Scripts created by developers and admins; Administrative activity. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 554601fb-9b71-4bcc-abf4-21a611be4fde. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_takeown_recursive_own.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1222.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\takeown\\.exe$" and (xdm.target.process.command_line ~= "/f " and xdm.target.process.command_line ~= "/r"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-regsvr32-execution-from-rem-88a87a10
