    description: "Detects the execution of Rundll32.exe with DLL files masquerading as image files Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Hieu Tran, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4aa6040b-3f28-44e3-a769-9208e5feb5ec. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_susp_execution_with_image_extension.yml"
