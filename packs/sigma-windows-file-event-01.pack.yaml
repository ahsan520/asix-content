  - key: assembly-dll-creation-via-aspnetcompil-4c7f49ee
    name: Assembly DLL Creation Via AspNetCompiler
    description: 'Detects the creation of new DLL assembly files by "aspnet_compiler.exe", which could be a sign of "aspnet_compiler" abuse to proxy execution through a build provider. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate assembly compilation using a build provider. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4c7f49ee-2638-43bb-b85b-ce676c30b260. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_aspnet_temp_files.yml'
