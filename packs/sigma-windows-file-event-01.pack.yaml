  - key: hacktool-netexec-file-indicators-efc21479
    name: HackTool - NetExec File Indicators
    description: |-
      Detects file creation events indicating NetExec (nxc.exe) execution on the local machine.
      NetExec is a PyInstaller-bundled binary that extracts its embedded data files to a "_MEI<random>" directory
      under the Temp folder upon execution. Files dropped under the "\nxc\" sub-directory of that
      extraction path are unique to NetExec and serve as reliable on-disk indicators of execution.
      NetExec (formerly CrackMapExec) is a widely used post-exploitation and lateral movement tool used for
      Active Directory enumeration, credential harvesting, and remote code execution. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id efc21479-9e83-41da-8cf1-122e06ba8db3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_hktl_netexec_file_indicators.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1021.002
      - T1059.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path contains "\\nxc-windows-latest\\" or (xdm.target.file.path ~= "\\\\Temp\\\\_MEI" and xdm.target.file.path ~= "\\\\nxc\\\\data\\\\"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
