# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-file-event-01
name: "Sigma: Windows file event (1 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows file event events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - file-event
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11)
rules:
  - key: uncommon-file-created-by-notepad-updat-3b8f4c92
    name: Uncommon File Created by Notepad++ Updater Gup.EXE
    description: |-
      Detects when the Notepad++ updater (gup.exe) creates files in suspicious or uncommon locations.
      This could indicate potential exploitation of the updater component to deliver unwanted malware or unwarranted files. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Custom or portable Notepad++ installations in non-standard directories.; Legitimate update processes creating temporary files in unexpected locations.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_gup_uncommon_file_creation.yml
    kind: bioc
    severity: high
    category: Collection
    mitre:
      - T1195.002
      - T1557
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "\\\\gup\\.exe$" and not ((xdm.target.file.path ~= "^(?:C:\\\\Program Files\\\\Notepad\\+\\+\\\\|C:\\\\Program Files \\(x86\\)\\\\Notepad\\+\\+\\\\)" or (xdm.target.file.path ~= "^C:\\\\Users\\\\" and (xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Temp\\\\" and xdm.target.file.path ~= "npp\\." and xdm.target.file.path ~= "\\.Installer\\." and xdm.target.file.path ~= "\\.exe")) or (xdm.target.file.path ~= "^C:\\\\Users\\\\" and (xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Temp\\\\" and xdm.target.file.path ~= "\\.zip")) or xdm.target.file.path ~= "^C:\\\\\\$Recycle\\.Bin\\\\S-1-5-21" or (xdm.target.file.path ~= "(?:\\\\plugins\\\\JsonTools\\\\testfiles\\\\|\\\\Notepad\\+\\+\\\\plugins\\\\ComparePlugin\\\\)" or (xdm.target.file.path ~= "npp\\." and xdm.target.file.path ~= "\\.portable\\." and xdm.target.file.path ~= "\\\\plugins\\\\")))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: adexplorer-writing-complete-ad-snapsho-0a1255c5
    name: ADExplorer Writing Complete AD Snapshot Into .dat File
    description: "Detects the dual use tool ADExplorer writing a complete AD snapshot into a .dat file. This can be used by attackers to extract data for Bloodhound, usernames for password spraying or use the meta data for social engineering. The snapshot doesn't contain password hashes but there have been cases, where administrators put passwords in the comment field. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate use of ADExplorer by administrators creating .dat snapshots. Sigma rule by Arnim Rupp (Nextron Systems), Thomas Patzke, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0a1255c5-d732-4b62-ac02-b5152d34fb83. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_sysinternals_adexplorer_dump_written.yml"
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1087.002
      - T1069.002
      - T1482
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.source.process.executable.path ~= "(?:\\\\ADExp\\.exe|\\\\ADExplorer\\.exe|\\\\ADExplorer64\\.exe|\\\\ADExplorer64a\\.exe)$" and xdm.target.file.path ~= "\\.dat$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: advanced-ip-scanner-file-event-fed85bf9
    name: Advanced IP Scanner - File Event
    description: "Detects the use of Advanced IP Scanner. Seems to be a popular tool for ransomware groups. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Legitimate administrative use. Sigma rule by @ROxPinTeddy, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fed85bf9-e075-4280-9159-fbe8a023d6fa. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_advanced_ip_scanner.yml"
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1046
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and xdm.target.file.path contains "\\AppData\\Local\\Temp\\Advanced IP Scanner 2"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: bloodhound-collection-files-02773bed
    name: BloodHound Collection Files
    description: "Detects default file names outputted by the BloodHound collection tool SharpHound Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Some false positives may arise in some environment and this may require some tuning. Add additional filters or reduce level depending on the level of noise. Sigma rule by C.J. May, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 02773bed-83bf-469f-b7ff-e676e7d78bab. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_bloodhound_collection.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1087.001
      - T1087.002
      - T1482
      - T1069.001
      - T1069.002
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "(?:BloodHound\\.zip|_computers\\.json|_containers\\.json|_gpos\\.json|_groups\\.json|_ous\\.json|_users\\.json)$" and not ((xdm.source.process.executable.path ~= "\\\\svchost\\.exe$" and xdm.target.file.path ~= "^C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\." and xdm.target.file.path ~= "\\\\pocket_containers\\.json$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: gathernetworkinfo-vbs-reconnaissance-s-f92a6f1e
    name: GatherNetworkInfo.VBS Reconnaissance Script Output
    description: 'Detects creation of files which are the results of executing the built-in reconnaissance script "C:\Windows\System32\gatherNetworkInfo.vbs". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f92a6f1e-a512-4a15-9735-da09e78d7273. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_lolbin_gather_network_info_script_output.yml'
