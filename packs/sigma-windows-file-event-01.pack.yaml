      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "^C:\\\\Windows\\\\System32\\\\config" and xdm.target.file.path ~= "(?:\\\\Hotfixinfo\\.txt|\\\\netiostate\\.txt|\\\\sysportslog\\.txt|\\\\VmSwitchLog\\.evtx)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
