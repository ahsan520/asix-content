    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and (xdm.target.file.path ~= "\\.evtx$" and not ((xdm.target.file.path ~= "^C:\\\\Windows\\\\System32\\\\winevt\\\\Logs\\\\" or (xdm.target.file.path ~= "^C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Containers\\\\BaseImages\\\\" and xdm.target.file.path contains "\\Windows\\System32\\winevt\\Logs\\"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
