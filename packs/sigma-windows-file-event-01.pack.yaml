      - T1204.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "file" and xdm.event.operation = "file_created" and ((xdm.source.process.executable.path ~= "(?:\\\\excel\\.exe|\\\\msaccess\\.exe|\\\\mspub\\.exe|\\\\powerpnt\\.exe|\\\\visio\\.exe|\\\\winword\\.exe)$" and xdm.target.file.path ~= "(?:\\.bat|\\.cmd|\\.com|\\.dll|\\.exe|\\.hta|\\.ocx|\\.proj|\\.ps1|\\.scf|\\.scr|\\.sys|\\.vbe|\\.vbs|\\.wsf|\\.wsh)$") and not ((xdm.target.file.path contains "\\AppData\\Local\\assembly\\tmp\\" and xdm.target.file.path ~= "\\.dll$")) and not ((((xdm.target.file.path ~= "C:\\\\Users\\\\" and xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Microsoft\\\\Office\\\\" and xdm.target.file.path ~= "\\\\WebServiceCache\\\\AllUsers") and xdm.target.file.path ~= "\\.com$") or (xdm.source.process.executable.path ~= "\\\\winword\\.exe$" and xdm.target.file.path contains "\\AppData\\Local\\Temp\\webexdelta\\" and xdm.target.file.path ~= "(?:\\.dll|\\.exe)$") or ((xdm.target.file.path ~= "C:\\\\Users\\\\" and xdm.target.file.path ~= "\\\\AppData\\\\Local\\\\Microsoft\\\\Office\\\\" and xdm.target.file.path ~= "\\\\BackstageInAppNavCache\\\\") and xdm.target.file.path ~= "\\.com$"))))
