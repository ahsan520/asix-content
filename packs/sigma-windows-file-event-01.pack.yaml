    name: File With Uncommon Extension Created By An Office Application
    description: "Detects the creation of files with an executable or script extension by an Office application. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 11). Known false positives: Unknown. Sigma rule by Vadim Khrykov (ThreatIntel), Cyb3rEng (Rule), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c7a74c80-ba5a-486e-9974-ab9e682bc5e4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/file/file_event/file_event_win_office_susp_file_extension.yml"
    kind: bioc
