    description: "Adversaries may attempt to get a listing of network connections to or from the compromised system they are currently accessing or from remote systems by querying for information over the network. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1c67a717-32ba-409b-a45d-0fb704a73a81. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_use_network_connections_discovery.yml"
    kind: bioc
    severity: low
    category: Discovery
    mitre:
      - T1049
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\net\\.exe|\\\\net1\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:net\\.exe|net1\\.exe)$") and (xdm.target.process.command_line ~= "(?: use| sessions)$" or xdm.target.process.command_line ~= "(?: use | sessions )"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
