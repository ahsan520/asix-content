# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-03
name: "Sigma: Windows process creation (3 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic, starting with Discovery. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: suspicious-active-directory-database-s-ef61af62
    name: Suspicious Active Directory Database Snapshot Via ADExplorer
    description: "Detects the execution of Sysinternals ADExplorer with the \"-snapshot\" flag in order to save a local copy of the active directory database to a suspicious directory. This can be used by attackers to extract data for Bloodhound, usernames for password spraying or use the meta data for social engineering. The snapshot doesn't contain password hashes but there have been cases, where administrators put passwords in the comment field. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ef61af62-bc74-4f58-b49b-626448227652. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_adexplorer_susp_execution.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1087.002
      - T1069.002
      - T1482
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\ADExp\\.exe|\\\\ADExplorer\\.exe|\\\\ADExplorer64\\.exe|\\\\ADExplorer64a\\.exe)$" or xdm.target.process.original_file_name ~= "^AdExp$" or xdm.target.process.description ~= "^Active Directory Editor$" or xdm.target.process.product ~= "^Sysinternals ADExplorer$") and xdm.target.process.command_line contains "snapshot" and xdm.target.process.command_line ~= "(?:\\\\Downloads\\\\|\\\\Users\\\\Public\\\\|\\\\AppData\\\\|\\\\Windows\\\\Temp\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-execution-of-hostname-7be5fb68
    name: Suspicious Execution of Hostname
    description: "Use of hostname to get information Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7be5fb68-f9ef-476d-8b51-0256ebece19e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hostname_execution.yml"
    kind: bioc
    severity: low
    category: Discovery
    mitre:
      - T1082
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.executable.path ~= "\\\\HOSTNAME\\.EXE$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
