  - key: suspicious-group-and-account-reconnais-d95de845
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    description: |-
      Detects suspicious reconnaissance command line activity on Windows systems using Net.EXE
      Check if the user that executed the commands is suspicious (e.g. service accounts, LOCAL_SYSTEM) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Inventory tool runs; Administrative activity. Sigma rule by Florian Roth (Nextron Systems), omkar72, @svch0st, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d95de845-b83c-4a9a-8a6a-4fc802ebf6c0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_groups_and_accounts_recon.yml
    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1087.001
      - T1087.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\net\\.exe|\\\\net1\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:net\\.exe|net1\\.exe)$") and (((xdm.target.process.command_line ~= "(?: group | localgroup )" and xdm.target.process.command_line ~= "(?:domain admins| administrator| administrateur|enterprise admins|Exchange Trusted Subsystem|Remote Desktop Users|Utilisateurs du Bureau à distance|Usuarios de escritorio remoto| /do)") and not (xdm.target.process.command_line contains " /add")) or (xdm.target.process.command_line contains " accounts " and xdm.target.process.command_line contains " /do")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-kernel-dump-using-dtrace-7124aebe
    name: Suspicious Kernel Dump Using Dtrace
    description: "Detects suspicious way to dump the kernel on Windows systems using dtrace.exe, which is available on Windows systems since Windows 10 19H1 Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7124aebe-4cd7-4ccb-8df0-6d6b93c96795. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dtrace_kernel_dump.yml"
    kind: bioc
    severity: high
    category: Discovery
    mitre:
      - T1082
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\dtrace\\.exe$" and xdm.target.process.command_line contains "lkd(0)") or (xdm.target.process.command_line ~= "syscall:::return" and xdm.target.process.command_line ~= "lkd\\("))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-network-command-a29c1813
    name: Suspicious Network Command
    description: "Adversaries may look for details about the network configuration and settings of systems they access or through information discovery of remote systems Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Administrator, hotline ask to user. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a29c1813-ab1f-4dde-b489-330b952e91ae. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_network_command.yml"
    kind: bioc
    severity: low
    category: Discovery
    mitre:
      - T1016
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "ipconfig\\s+/all" or xdm.target.process.command_line ~= "netsh\\s+interface show interface" or xdm.target.process.command_line ~= "arp\\s+-a" or xdm.target.process.command_line ~= "nbtstat\\s+-n" or xdm.target.process.command_line ~= "net\\s+config" or xdm.target.process.command_line ~= "route\\s+print")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
