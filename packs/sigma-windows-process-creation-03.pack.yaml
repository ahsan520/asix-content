  - key: suspicious-where-execution-725a9768
    name: Suspicious Where Execution
    description: |-
      Adversaries may enumerate browser bookmarks to learn more about compromised hosts.
      Browser bookmarks may reveal personal information about users (ex: banking sites, interests, social media, etc.) as well as details about
      internal network resources such as servers, tools/dashboards, or other related infrastructure. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 725a9768-0f5e-4cb3-aec2-bc5719c6831a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_where_browser_data_recon.yml
    kind: bioc
