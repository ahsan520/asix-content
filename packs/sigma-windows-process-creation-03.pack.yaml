    kind: bioc
    severity: medium
    category: Discovery
    mitre:
      - T1082
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.description ~= "^WMI Commandline Utility$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$" or xdm.target.process.executable.path ~= "\\\\WMIC\\.exe$") and xdm.target.process.command_line ~= "(?:LOGICALDISK get Name,Size,FreeSpace|os get Caption,OSArchitecture,Version)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
