      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\where\\.exe$" or xdm.target.process.original_file_name ~= "^where\\.exe$") and xdm.target.process.command_line ~= "(?:places\\.sqlite|cookies\\.sqlite|formhistory\\.sqlite|logins\\.json|key4\\.db|key3\\.db|sessionstore\\.jsonlz4|History|Bookmarks|Cookies|Login Data)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
