# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-15
name: "Sigma: Windows process creation (15 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: hacktool-dumpert-process-dumper-execut-2704ab9e
    name: HackTool - Dumpert Process Dumper Execution
    description: "Detects the use of Dumpert process dumper, which dumps the lsass.exe process memory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Very unlikely. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2704ab9e-afe2-4854-a3b1-0c0706d03578. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_dumpert.yml"
    kind: bioc
    severity: critical
    category: process_creation
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.hashes contains "IMPHASH=09D278F9DE118EF09163C6140255C690" or xdm.target.process.command_line ~= "(?:Dumpert\\.dll|Dumpert\\.exe)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-edr-freeze-execution-c598cc0c
    name: Hacktool - EDR-Freeze Execution
    description: |-
      Detects execution of EDR-Freeze, a tool that exploits the MiniDumpWriteDump function and WerFaultSecure.exe to suspend EDR and Antivirus processes on Windows.
      EDR-Freeze leverages a race-condition attack to put security processes into a dormant state by suspending WerFaultSecure at the moment it freezes the target process.
      This technique does not require kernel-level exploits or BYOVD, but instead abuses user-mode functionality to temporarily disable monitoring by EDR or Antimalware solutions. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c598cc0c-9e70-4852-b9eb-8921af79f598. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_edr_freeze.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\EDR-Freeze|\\\\EDRFreeze)" and xdm.target.process.executable.path ~= "\\.exe$") or xdm.target.process.hashes ~= "(?:IMPHASH=1195F7935954A2CD09157390C33F8E8C|IMPHASH=129F58DE3D687FB7F012BF6C3D679997|IMPHASH=2C617A175D0086251642C6619F7CC8BA|IMPHASH=8828F0B906F7844358FB92A899E9520F|IMPHASH=AF76D95157EC554DC1EF178E4E66D447|IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5|IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0|IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-edrsilencer-execution-eb2d07d4
    name: HackTool - EDRSilencer Execution
    description: "Detects the execution of EDRSilencer, a tool that leverages Windows Filtering Platform (WFP) to block Endpoint Detection and Response (EDR) agents from reporting security events to the server based on PE metadata information. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by @gott_cyber, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id eb2d07d4-49cb-4523-801a-da002df36602. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_edrsilencer.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\EDRSilencer\\.exe$" or xdm.target.process.original_file_name ~= "^EDRSilencer\\.exe$" or xdm.target.process.description contains "EDRSilencer")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: hacktool-empire-powershell-uac-bypass-3268b746
    name: HackTool - Empire PowerShell UAC Bypass
    description: "Detects some Empire PowerShell UAC bypass methods Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Ecco, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3268b746-88d8-4cd3-bffc-30077d02c787. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_empire_powershell_uac_bypass.yml"
