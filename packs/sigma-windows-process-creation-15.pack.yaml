      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:cmd\\.exe|powershell\\.exe|powershell_ise\\.exe|pwsh\\.dll)$") and xdm.target.process.command_line ~= "(?:del |erase |rm |remove-item |rmdir )" and xdm.target.process.command_line contains "\\inetpub\\logs\\")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: import-ldap-data-interchange-format-fi-6f535e01
    name: Import LDAP Data Interchange Format File Via Ldifde.EXE
    description: 'Detects the execution of "Ldifde.exe" with the import flag "-i". The can be abused to include HTTP-based arguments which will allow the arbitrary download of files from a remote server. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Since the content of the files are unknown, false positives are expected. Sigma rule by @gott_cyber, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ldifde_file_load.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\ldifde\\.exe$" or xdm.target.process.original_file_name ~= "^ldifde\\.exe$") and (xdm.target.process.command_line ~= "-i" and xdm.target.process.command_line ~= "-f"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: indirect-command-execution-from-script-2d22a514
    name: Indirect Command Execution From Script File Via Bash.EXE
    description: |-
      Detects execution of Microsoft bash launcher without any flags to execute the content of a bash script directly.
      This can be used to potentially bypass defenses and execute Linux or Windows-based binaries directly via bash. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2d22a514-e024-4428-9dba-41505bd63a5b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bash_file_execution.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?::\\\\Windows\\\\System32\\\\bash\\.exe|:\\\\Windows\\\\SysWOW64\\\\bash\\.exe)$" or xdm.target.process.original_file_name ~= "^Bash\\.exe$") and not ((xdm.target.process.command_line ~= "(?:bash\\.exe -|bash -)" or not (xdm.target.process.command_line ~= ".") or not (xdm.target.process.command_line ~= ".") or xdm.target.process.command_line ~= "^(?:bash\\.exe|bash)$")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: indirect-command-execution-via-sftp-pr-762bb580
    name: Indirect Command Execution via SFTP ProxyCommand
    description: |-
      Detects the use of SFTP.exe to execute commands indirectly via ProxyCommand parameter.
      Threat actors were seen leveraging this legitimate Windows binary to bypass security controls and execute arbitrary commands while evading detection. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use of SFTP with proxy commands for administration or networking tasks. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 762bb580-79b4-40f4-8b9e-9349ce1710f4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sftp_proxy_command_execution.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\sftp\\.exe$" and xdm.target.process.command_line contains "ProxyCommand=")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
