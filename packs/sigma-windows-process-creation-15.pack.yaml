      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and xdm.target.process.command_line ~= "(?: -NoP -NonI -w Hidden -c \\$x=\\$\\(\\(gp HKCU:Software\\\\Microsoft\\\\Windows Update\\)\\.Update\\)| -NoP -NonI -c \\$x=\\$\\(\\(gp HKCU:Software\\\\Microsoft\\\\Windows Update\\)\\.Update\\);)"'
      group_by: field:xdm.source.host.hostname
