# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-01
name: "Sigma: Windows process creation (1 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: 7zip-compressing-dump-files-ec570e53
    name: 7Zip Compressing Dump Files
    description: 'Detects execution of 7z in order to compress a file with a ".dmp"/".dump" extension, which could be a step in a process of dump file exfiltration. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate use of 7z with a command line in which ".dmp" or ".dump" appears accidentally; Legitimate use of 7z to compress WER ".dmp" files for troubleshooting. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ec570e53-4c76-45a9-804d-dc3f355ff7a7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_7zip_exfil_dmp_files.yml'
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1560.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.description contains "7-Zip" or xdm.target.process.executable.path ~= "(?:\\\\7z\\.exe|\\\\7zr\\.exe|\\\\7za\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:7z\\.exe|7za\\.exe|7zr\\.exe)$") and xdm.target.process.command_line ~= "(?:\\.dmp|\\.dump|\\.hdmp)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: attempts-of-kerberos-coercion-via-dns-0ed99dda
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    description: |-
      Detects the presence of "UWhRC....AAYBAAAA" pattern in command line.
      The pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds to a marshaled CREDENTIAL_TARGET_INFORMATION structure.
      Attackers can use this technique to coerce authentication from victim systems to attacker-controlled hosts.
      It is one of the strong indicators of a Kerberos coercion attack, where adversaries manipulate DNS records
      to spoof Service Principal Names (SPNs) and redirect authentication requests like in CVE-2025-33073.
      If you see this pattern in the command line, it is likely an attempt to add spoofed Service Principal Names (SPNs) to DNS records,
      or checking for the presence of such records through the `nslookup` command. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0ed99dda-6a35-11ef-8c99-0242ac120002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_kerberos_coercion_via_dns_spn_spoofing.yml
    kind: bioc
    severity: high
    category: Collection
    mitre:
      - T1557.001
      - T1187
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "UWhRCA" and xdm.target.process.command_line ~= "BAAAA")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
