    name: Copy From Or To Admin Share Or Sysvol Folder
    description: "Detects a copy command or a copy utility execution to or from an Admin share or remote Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administrative scripts. Sigma rule by Florian Roth (Nextron Systems), oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 855bc8b5-2ae8-402e-a9ed-b889e6df1900. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_copy_lateral_movement.yml"
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1039
      - T1048
      - T1021.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:\\\\\\\\\\\\.*\\\\.*\\$|\\\\Sysvol\\\\)" and ((xdm.target.process.executable.path ~= "(?:\\\\robocopy\\.exe|\\\\xcopy\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:robocopy\\.exe|XCOPY\\.EXE)$") or ((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" or xdm.target.process.original_file_name ~= "^Cmd\\.Exe$") and xdm.target.process.command_line contains "copy") or ((xdm.target.process.executable.path ~= "(?:\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)" or xdm.target.process.original_file_name ~= "^(?:powershell_ise\\.exe|PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line ~= "(?:copy-item|copy |cpi | cp |move | move-item| mi | mv )")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
