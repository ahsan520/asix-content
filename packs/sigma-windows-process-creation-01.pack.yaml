      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:WindowsAudioDevice-Powershell-Cmdlet|Toggle-AudioDevice|Get-AudioDevice |Set-AudioDevice |Write-AudioDevice )"
