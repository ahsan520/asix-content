    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1574.011
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\sc\\.exe$" or xdm.target.process.original_file_name ~= "^sc\\.exe$") and (xdm.target.process.command_line ~= "sdset" and xdm.target.process.command_line ~= "DCLCWPDTSD"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: service-security-descriptor-tampering-98c5aeef
    name: Service Security Descriptor Tampering Via Sc.EXE
    description: "Detection of sc.exe utility adding a new service with special permission which hides that service. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 98c5aeef-32d5-492f-b174-64a691896d25. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sc_sdset_modification.yml"
