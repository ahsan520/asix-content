  - key: suspicious-command-patterns-in-schedul-f2c64357
    name: Suspicious Command Patterns In Scheduled Task Creation
    description: 'Detects scheduled task creation using "schtasks" that contain potentially suspicious or uncommon commands Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Software installers that run from temporary folders and also install scheduled tasks are expected to generate some false positives. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f2c64357-b1d2-41b7-849f-34d2682c0fad. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_susp_pattern.yml'
    kind: bioc
