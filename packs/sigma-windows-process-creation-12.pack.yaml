# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-12
name: "Sigma: Windows process creation (12 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: schedule-task-creation-from-env-variab-81325ce1
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    description: "Detects Schtask creations that point to a suspicious folder or an environment variable often used by malware Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Benign scheduled tasks creations or executions that happen often during software installations; Software that uses the AppData folder and scheduled tasks to update the software in the AppData folders. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 81325ce1-be01-4250-944f-b4789644556f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_env_folder.yml"
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1053.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((((xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$" and xdm.target.process.command_line ~= " [-/–—―]create ") and xdm.target.process.command_line ~= "(?::\\\\Perflogs|:\\\\Users\\\\All Users\\\\|:\\\\Users\\\\Default\\\\|:\\\\Users\\\\Public|:\\\\Windows\\\\Temp|\\\\AppData\\\\Local\\\\|\\\\AppData\\\\Roaming\\\\|%AppData%|%Public%)") or (xdm.source.process.command_line ~= "\\\\svchost\\.exe -k netsvcs -p -s Schedule$" and xdm.target.process.command_line ~= "(?::\\\\Perflogs|:\\\\Windows\\\\Temp|\\\\Users\\\\Public|%Public%)")) and not (((xdm.source.process.command_line contains "unattended.ini" or xdm.target.process.command_line contains "update_task.xml") or xdm.target.process.command_line contains "/Create /TN TVInstallRestore /TR" or (xdm.target.process.command_line ~= "/Create /Xml " and xdm.target.process.command_line ~= "\\\\Temp\\\\\\.CR\\." and xdm.target.process.command_line ~= "\\\\Avira_Security_Installation\\.xml") or ((xdm.target.process.command_line ~= "/Create /F /TN" and xdm.target.process.command_line ~= "/Xml " and xdm.target.process.command_line ~= "\\\\Temp\\\\" and xdm.target.process.command_line ~= "Avira_") and xdm.target.process.command_line ~= "(?:\\.tmp\\\\UpdateFallbackTask\\.xml|\\.tmp\\\\WatchdogServiceControlManagerTimeout\\.xml|\\.tmp\\\\SystrayAutostart\\.xml|\\.tmp\\\\MaintenanceTask\\.xml)") or (xdm.target.process.command_line ~= "\\\\Temp\\\\" and xdm.target.process.command_line ~= "/Create /TN \"klcp_update\" /XML " and xdm.target.process.command_line ~= "\\\\klcp_update_task\\.xml"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: schtasks-from-suspicious-folders-8a8379b8
    name: Schtasks From Suspicious Folders
    description: "Detects scheduled task creations that have suspicious action command and folder combinations Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8a8379b8-780b-4dbf-b1e9-31c8d112fefb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_folder_combos.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1053.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$" or xdm.target.process.original_file_name ~= "^schtasks\\.exe$") and xdm.target.process.command_line contains " /create " and xdm.target.process.command_line ~= "(?:powershell|pwsh|cmd /c |cmd /k |cmd /r |cmd\\.exe /c |cmd\\.exe /k |cmd\\.exe /r )" and xdm.target.process.command_line ~= "(?:C:\\\\ProgramData\\\\|%ProgramData%)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: security-event-logging-disabled-via-mi-1a4bd6af
    name: Security Event Logging Disabled via MiniNt Registry Key - Process
    description: |-
      Detects attempts to disable security event logging by adding the `MiniNt` registry key.
      This key is used to disable the Windows Event Log service, which collects and stores event logs from the operating system and applications.
      Adversaries may want to disable this service to prevent logging of security events that could be used to detect their activities. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Highly Unlikely. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1a4bd6af-99ac-4466-b5b2-7b72b4a05462. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_event_logging_disable_via_key_minint.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1685.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\reg\\.exe$" or xdm.target.process.original_file_name ~= "^reg\\.exe$") and (xdm.target.process.command_line ~= " add " and xdm.target.process.command_line ~= "\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\MiniNt")) or ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\powershell_ise\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line ~= "(?:New-Item |ni )" and xdm.target.process.command_line contains "\\SYSTEM\\CurrentControlSet\\Control\\MiniNt"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
