  - key: suspicious-debugger-registration-cmdli-ae215552
    name: Suspicious Debugger Registration Cmdline
    description: "Detects the registration of a debugger for a program that is available in the logon screen (sticky key backdoor). Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ae215552-081e-44c7-805f-be16f975c8a2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_registry_install_reg_debugger_backdoor.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1546.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "\\CurrentVersion\\Image File Execution Options\\" and xdm.target.process.command_line ~= "(?:sethc\\.exe|utilman\\.exe|osk\\.exe|magnify\\.exe|narrator\\.exe|displayswitch\\.exe|atbroker\\.exe|HelpPane\\.exe)")
