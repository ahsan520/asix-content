  - key: setup16-exe-execution-with-custom-lst-99c8be4f
    name: Setup16.EXE Execution With Custom .Lst File
    description: |-
      Detects the execution of "Setup16.EXE" and old installation utility with a custom ".lst" file.
      These ".lst" file can contain references to external program that "Setup16.EXE" will execute.
      Attackers and adversaries might leverage this as a living of the land utility. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: On modern Windows system, the "Setup16" utility is practically never used, hence false positive should be very rare.. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 99c8be4f-3087-4f9f-9c24-8c7e257b442e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_setup16_custom_lst_execution.yml
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1574.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\SysWOW64\\\\setup16\\.exe$" and xdm.source.process.command_line contains " -m ") and not (xdm.target.process.executable.path ~= "^C:\\\\~MSSETUP\\.T\\\\"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
