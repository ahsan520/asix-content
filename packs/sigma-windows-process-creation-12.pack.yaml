  - key: user-shell-folders-registry-modificati-8f3ab69a
    name: User Shell Folders Registry Modification via CommandLine
    description: |-
      Detects modifications to User Shell Folders registry values via reg.exe or PowerShell, which could indicate persistence attempts.
      Attackers may modify User Shell Folders registry values to point to malicious executables or scripts that will be executed during startup.
      This technique is often used to maintain persistence on a compromised system by ensuring that malicious payloads are executed automatically. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Usage of reg.exe or PowerShell to modify User Shell Folders for legitimate purposes; but rare.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8f3ab69a-aa22-4943-aa58-e0a52fdf6818. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_user_shell_folders_registry_modification.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547.001
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\reg\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:powershell\\.exe|pwsh\\.dll|reg\\.exe)$") and xdm.target.process.command_line ~= "(?: add |New-ItemProperty|Set-ItemProperty|si )" and xdm.target.process.command_line ~= "(?:\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Shell Folders|\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\User Shell Folders)" and xdm.target.process.command_line contains "Startup")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
