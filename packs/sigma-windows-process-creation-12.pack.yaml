    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$" and xdm.target.process.command_line contains "/Create ") and ((xdm.target.process.command_line ~= "(?:/sc minute |/ru system )" and xdm.target.process.command_line ~= "(?:cmd /c|cmd /k|cmd /r|cmd\\.exe /c |cmd\\.exe /k |cmd\\.exe /r )") or xdm.target.process.command_line ~= "(?: -decode | -enc | -w hidden | bypass | IEX|\\.DownloadData|\\.DownloadFile|\\.DownloadString|/c start /min |FromBase64String|mshta http|mshta\\.exe http)" or (xdm.target.process.command_line ~= "(?::\\\\ProgramData\\\\|:\\\\Temp\\\\|:\\\\Tmp\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\AppData\\\\|%AppData%|%Temp%|%tmp%)" and xdm.target.process.command_line ~= "(?:cscript|curl|wscript)")))'
