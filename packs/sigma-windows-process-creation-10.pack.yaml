  - key: file-recovery-from-backup-via-wbadmin-6fe4aa1e
    name: File Recovery From Backup Via Wbadmin.EXE
    description: |-
      Detects the recovery of files from backups via "wbadmin.exe".
      Attackers can restore sensitive files such as NTDS.DIT or Registry Hives from backups in order to potentially extract credentials. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6fe4aa1e-0531-4510-8be2-782154b73b48. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wbadmin_restore_file.yml
    kind: bioc
    severity: medium
    category: Impact
    mitre:
      - T1490
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wbadmin\\.exe$" or xdm.target.process.original_file_name ~= "^WBADMIN\\.EXE$") and (xdm.target.process.command_line ~= " recovery" and xdm.target.process.command_line ~= "recoveryTarget" and xdm.target.process.command_line ~= "itemtype:File"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: fsutil-suspicious-invocation-add64136
    name: Fsutil Suspicious Invocation
    description: |-
      Detects suspicious parameters of fsutil (deleting USN journal, configuring it with small size, etc).
      Might be used by ransomwares during the attack (seen by NotPetya and others). Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Admin activity; Scripts and administrative tools used in the monitored environment. Sigma rule by Ecco, E.M. Anhaus, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id add64136-62e5-48ea-807e-88638d02df1e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_fsutil_usage.yml
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1070
      - T1485
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\fsutil\\.exe$" or xdm.target.process.original_file_name ~= "^fsutil\\.exe$") and xdm.target.process.command_line ~= "(?:deletejournal|createjournal|setZeroData)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
