    description: "Detects when adversaries stop services or processes by disabling their respective scheduled tasks in order to conduct data destructive activities Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), X__Junior, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9ac94dc8-9042-493c-ba45-3b5e7c86b980. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_disable.yml"
