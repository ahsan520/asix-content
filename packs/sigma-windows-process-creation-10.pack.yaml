      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\gpg\\.exe|\\\\gpg2\\.exe)$" or xdm.target.process.original_file_name ~= "^gpg\\.exe$" or xdm.target.process.description ~= "^GnuPG’s OpenPGP tool$") and not (xdm.target.process.executable.path ~= "(?::\\\\Program Files \\(x86\\)\\\\GNU\\\\GnuPG\\\\bin\\\\|:\\\\Program Files \\(x86\\)\\\\GnuPG VS-Desktop\\\\|:\\\\Program Files \\(x86\\)\\\\GnuPG\\\\bin\\\\|:\\\\Program Files \\(x86\\)\\\\Gpg4win\\\\bin\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
