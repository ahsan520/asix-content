# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-10
name: "Sigma: Windows process creation (10 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic, starting with Exfiltration. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: tap-installer-execution-99793437
    name: Tap Installer Execution
    description: "Well-known TAP software installation. Possible preparation for data exfiltration using tunneling techniques Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate OpenVPN TAP installation. Sigma rule by Daniil Yugoslavskiy, Ian Davis, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 99793437-3e16-439b-be0f-078782cf953d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_tapinstall_execution.yml"
    kind: bioc
    severity: medium
    category: Exfiltration
    mitre:
      - T1048
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\tapinstall\\.exe$" and not ((xdm.target.process.executable.path ~= "(?::\\\\Program Files\\\\Avast Software\\\\SecureLine VPN\\\\|:\\\\Program Files \\(x86\\)\\\\Avast Software\\\\SecureLine VPN\\\\)" or xdm.target.process.executable.path contains ":\\Program Files\\OpenVPN Connect\\drivers\\tap\\" or xdm.target.process.executable.path contains ":\\Program Files (x86)\\Proton Technologies\\ProtonVPNTap\\installer\\")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: webdav-client-execution-via-rundll32-e-2dbd9d3d
    name: WebDav Client Execution Via Rundll32.EXE
    description: |-
      Detects "svchost.exe" spawning "rundll32.exe" with command arguments like "C:\windows\system32\davclnt.dll,DavSetCookie".
      This could be an indicator of exfiltration or use of WebDav to launch code (hosted on a WebDav server). Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_webdav_client_execution.yml
    kind: bioc
    severity: medium
    category: Exfiltration
    mitre:
      - T1048.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\svchost\\.exe$" and (xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or xdm.target.process.original_file_name ~= "^RUNDLL32\\.EXE$") and xdm.target.process.command_line contains "C:\\windows\\system32\\davclnt.dll,DavSetCookie")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: all-backups-deleted-via-wbadmin-exe-639c9081
    name: All Backups Deleted Via Wbadmin.EXE
    description: |-
      Detects the deletion of all backups or system state backups via "wbadmin.exe".
      This technique is used by numerous ransomware families and actors.
      This may only be successful on server platforms that have Windows Backup enabled. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 639c9081-f482-47d3-a0bd-ddee3d4ecd76. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wbadmin_delete_all_backups.yml
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1490
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\wbadmin\\.exe$" or xdm.target.process.original_file_name ~= "^WBADMIN\\.EXE$") and ((xdm.target.process.command_line ~= "delete" and xdm.target.process.command_line ~= "backup") and xdm.target.process.command_line contains "keepVersions:0"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: boot-configuration-tampering-via-bcded-1444443e
    name: Boot Configuration Tampering Via Bcdedit.EXE
    description: "Detects the use of the bcdedit command to tamper with the boot configuration data. This technique is often times used by malware or attackers as a destructive way before launching ransomware. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1444443e-6757-43e4-9ea4-c8fc705f79a2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml"
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1490
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\bcdedit\\.exe$" or xdm.target.process.original_file_name ~= "^bcdedit\\.exe$") and xdm.target.process.command_line contains "set" and ((xdm.target.process.command_line ~= "bootstatuspolicy" and xdm.target.process.command_line ~= "ignoreallfailures") or (xdm.target.process.command_line ~= "recoveryenabled" and xdm.target.process.command_line ~= "no")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: copy-from-volumeshadowcopy-via-cmd-exe-c73124a7
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    description: 'Detects the execution of the builtin "copy" command that targets a shadow copy (sometimes used to copy registry hives that are in use) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Backup scenarios using the commandline. Sigma rule by Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c73124a7-3e89-44a3-bdc1-25fe4df754b1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_shadowcopy_access.yml'
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1490
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "copy " and xdm.target.process.command_line ~= "\\\\\\\\\\\\\\\\.\\\\\\\\GLOBALROOT\\\\\\\\Device\\\\\\\\HarddiskVolumeShadowCopy")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: delete-all-scheduled-tasks-220457c1
    name: Delete All Scheduled Tasks
    description: "Detects the usage of schtasks with the delete flag and the asterisk symbol to delete all tasks from the schedule of the local computer, including tasks scheduled by other users. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 220457c1-1c9f-4c2e-afe6-9598926222c1. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_delete_all.yml"
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1489
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$" and (xdm.target.process.command_line ~= " /delete " and xdm.target.process.command_line ~= "/tn \\*" and xdm.target.process.command_line ~= " /f"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: delete-important-scheduled-task-dbc1f800
    name: Delete Important Scheduled Task
    description: "Detects when adversaries stop services or processes by deleting their respective scheduled tasks in order to conduct data destructive activities Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dbc1f800-0fe0-4bc0-9c66-292c2abe3f78. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_delete.yml"
