      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: deleted-data-overwritten-via-cipher-ex-4b046706
    name: Deleted Data Overwritten Via Cipher.EXE
    description: |-
      Detects usage of the "cipher" built-in utility in order to overwrite deleted data from disk.
      Adversaries may destroy data and files on specific systems or in large numbers on a network to interrupt availability to systems, services, and network resources.
      Data destruction is likely to render stored data irrecoverable by forensic techniques through overwriting files or data on local and remote drives Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4b046706-5789-4673-b111-66f25fe99534. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cipher_overwrite_deleted_data.yml
    kind: bioc
    severity: medium
    category: Impact
    mitre:
      - T1485
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^CIPHER\\.EXE$" or xdm.target.process.executable.path ~= "\\\\cipher\\.exe$") and xdm.target.process.command_line contains " /w:")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: deletion-of-volume-shadow-copies-via-w-21ff4ca9
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    description: "Detects deletion of Windows Volume Shadow Copies with PowerShell code and Get-WMIObject. This technique is used by numerous ransomware families such as Sodinokibi/REvil Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Tim Rauch, Elastic (idea), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 21ff4ca9-f13a-41ad-b828-0077b2af2e40. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_shadowcopy_deletion.yml"
    kind: bioc
    severity: high
    category: Impact
    mitre:
      - T1490
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:Get-WmiObject|gwmi|Get-CimInstance|gcim)" and xdm.target.process.command_line contains "Win32_ShadowCopy" and xdm.target.process.command_line ~= "(?:\\.Delete\\(\\)|Remove-WmiObject|rwmi|Remove-CimInstance|rcim)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
