      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\schtasks\\.exe$" or xdm.target.process.original_file_name ~= "^schtasks\\.exe$") and xdm.target.process.command_line ~= "[-/–—―]delete" and xdm.target.process.command_line ~= "(?:\\\\Windows\\\\BitLocker|\\\\Windows\\\\ExploitGuard|\\\\Windows\\\\SystemRestore\\\\SR|\\\\Windows\\\\UpdateOrchestrator\\\\|\\\\Windows\\\\Windows Defender\\\\|\\\\Windows\\\\WindowsBackup\\\\|\\\\Windows\\\\WindowsUpdate\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
