    description: "Detects WMI command line event consumers Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7). Known false positives: Unknown (data set is too small; further testing needed). Sigma rule by Thomas Patzke, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 05936ce2-ee05-4dae-9d03-9a391cf2d2c6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/image_load/image_load_wmi_persistence_commandline_event_consumer.yml"
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1546.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "image_load" and (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\wbem\\\\WmiPrvSE\\.exe$" and xdm.target.module.path ~= "\\\\wbemcons\\.dll$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
history:
  - version: 2026.1118.0
    released: 2026-11-18
    notes: Converted from the SigmaHQ rules at 698f0912f571d5fac3bf8c51f5421139834a011c.
