# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-image-load-02
name: "Sigma: Windows image load (2 of 2)"
description: "34 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows image load events, grouped by tactic Persistence. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - image-load
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7)
rules:
  - key: potential-dll-sideloading-of-dbgmodel-fef394cd
    name: Potential DLL Sideloading Of DbgModel.DLL
    description: 'Detects potential DLL sideloading of "DbgModel.dll" Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 7). Known false positives: Legitimate applications loading their own versions of the DLL mentioned in this rule. Sigma rule by Gary Lobermier, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id fef394cd-f44d-4040-9b18-95d92fe278c0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/image_load/image_load_side_load_dbgmodel.yml'
    kind: bioc
    severity: medium
    category: Persistence
    mitre:
      - T1574.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "image_load" and (xdm.target.module.path ~= "\\\\dbgmodel\\.dll$" and not (xdm.target.module.path ~= "^(?:C:\\\\Windows\\\\System32\\\\|C:\\\\Windows\\\\SysWOW64\\\\|C:\\\\Windows\\\\WinSxS\\\\)") and not ((xdm.target.module.path ~= "^C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\.WinDbg_" or xdm.target.module.path ~= "^(?:C:\\\\Program Files \\(x86\\)\\\\Windows Kits\\\\|C:\\\\Program Files\\\\Windows Kits\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
