      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:Add-MpPreference |Set-MpPreference )" and xdm.target.process.command_line ~= "(?: -ExclusionPath | -ExclusionExtension | -ExclusionProcess | -ExclusionIpAddress )")'
      group_by: field:xdm.source.host.hostname
