# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-18
name: "Sigma: Windows process creation (18 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: potential-script-proxy-execution-via-c-1e0e1a81
    name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
    description: 'Detects the use of the Microsoft signed script "CL_mutexverifiers" to proxy the execution of additional PowerShell script commands Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova, frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_cl_mutexverifiers.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and xdm.target.process.executable.path ~= "\\\\powershell\\.exe$" and xdm.target.process.command_line contains " -nologo -windowstyle minimized -file ") and xdm.target.process.command_line ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Windows\\\\Temp\\\\)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-signing-bypass-via-windows-d-a383dec4
    name: Potential Signing Bypass Via Windows Developer Features
    description: 'Detects when a user enable developer features such as "Developer Mode" or "Application Sideloading". Which allows the user to install untrusted packages. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a383dec4-deec-4e6e-913b-ed9249670848. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_systemsettingsadminflows_turn_on_dev_features.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\SystemSettingsAdminFlows\\.exe$" or xdm.target.process.original_file_name ~= "^SystemSettingsAdminFlows\\.EXE$") and xdm.target.process.command_line contains "TurnOnDeveloperFeatures" and xdm.target.process.command_line ~= "(?:DeveloperUnlock|EnableSideloading)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-spn-enumeration-via-setspn-e-1eeed653
    name: Potential SPN Enumeration Via Setspn.EXE
    description: "Detects service principal name (SPN) enumeration used for Kerberoasting Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administration activity. Sigma rule by Markus Neis, keepwatch, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1eeed653-dbc8-4187-ad0c-eeebb20e6599. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_setspn_spn_enumeration.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1558.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\setspn\\.exe$" or xdm.target.process.original_file_name ~= "^setspn\\.exe$" or (xdm.target.process.description ~= "Query or reset the computer" and xdm.target.process.description ~= "SPN attribute")) and xdm.target.process.command_line ~= "(?: -q | /q )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-suspicious-windows-feature-e-c740d4cf
    name: Potential Suspicious Windows Feature Enabled - ProcCreation
    description: |-
      Detects usage of the built-in PowerShell cmdlet "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and Management tool.
      Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure, and update features and packages in Windows images Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate usage of the features listed in the rule.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c740d4cf-a1e9-41de-bb16-8a46a4f57918. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_enable_susp_windows_optional_feature.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "Enable-WindowsOptionalFeature" and xdm.target.process.command_line ~= "-Online" and xdm.target.process.command_line ~= "-FeatureName") and xdm.target.process.command_line ~= "(?:TelnetServer|Internet-Explorer-Optional-amd64|TFTP|SMB1Protocol|Client-ProjFS|Microsoft-Windows-Subsystem-Linux)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-sysinternals-procdump-evasio-79b06761
    name: Potential SysInternals ProcDump Evasion
    description: "Detects uses of the SysInternals ProcDump utility in which ProcDump or its output get renamed, or a dump file is moved or copied to a different name Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: False positives are expected in cases in which ProcDump just gets copied to a different directory without any renaming. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 79b06761-465f-4f88-9ef2-150e24d3d737. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_evasion.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:copy procdump|move procdump)" or ((xdm.target.process.command_line ~= "copy " and xdm.target.process.command_line ~= "\\.dmp ") and xdm.target.process.command_line ~= "(?:2\\.dmp|lsass|out\\.dmp)") or xdm.target.process.command_line ~= "(?:copy lsass\\.exe_|move lsass\\.exe_)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-tampering-with-security-prod-847d5ff3
    name: Potential Tampering With Security Products Via WMIC
    description: "Detects uninstallation or termination of security products using the WMIC utility Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate administration. Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 847d5ff3-8a31-4737-a970-aeae8fe21765. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_uninstall_security_products.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((((xdm.target.process.command_line ~= "wmic" and xdm.target.process.command_line ~= "product " and xdm.target.process.command_line ~= "uninstall") and xdm.target.process.command_line ~= "[-/–—―]nointeractive") or ((xdm.target.process.command_line ~= "wmic" and xdm.target.process.command_line ~= "caption like ") and xdm.target.process.command_line ~= "(?:call delete|call terminate)") or (xdm.target.process.command_line ~= "process " and xdm.target.process.command_line ~= "where " and xdm.target.process.command_line ~= "delete")) and (xdm.target.process.command_line ~= "(?:%carbon%|%cylance%|%endpoint%|%eset%|%malware%|%Sophos%|%symantec%|Antivirus|AVG |Carbon Black|CarbonBlack|Cb Defense Sensor 64-bit|Crowdstrike Sensor|Cylance |Dell Threat Defense|DLP Endpoint|Endpoint Detection|Endpoint Protection|Endpoint Security|Endpoint Sensor|ESET File Security|LogRhythm System Monitor Service|Malwarebytes|McAfee Agent|Microsoft Security Client)" or xdm.target.process.command_line ~= "(?:Sophos Anti-Virus|Sophos AutoUpdate|Sophos Credential Store|Sophos Management Console|Sophos Management Database|Sophos Management Server|Sophos Remote Management System|Sophos Update Manager|Threat Protection|VirusScan|Webroot SecureAnywhere|Windows Defender)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-uac-bypass-via-sdclt-exe-40f9af16
    name: Potential UAC Bypass Via Sdclt.EXE
    description: "A General detection for sdclt being spawned as an elevated process. This could be an indicator of sdclt being used for bypass UAC techniques. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 40f9af16-589d-4984-b78d-8c2aec023197. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_uac_bypass_sdclt.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1548.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "sdclt\\.exe$" and xdm.target.process.integrity_level ~= "^(?:High|S-1-16-12288)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-windows-defender-av-bypass-v-129966c9
    name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
    description: |-
      Detects when a user is potentially trying to bypass the Windows Defender AV by renaming a tool to dump64.exe and placing it in the Visual Studio folder.
      Currently the rule is covering only usage of procdump but other utilities can be added in order to increase coverage. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Austin Songer @austinsonger, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 129966c9-de17-4334-a123-8b58172e664d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dump64_defender_av_bypass_rename.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "^C:\\\\Program Files" and xdm.target.process.executable.path contains "\\Microsoft Visual Studio\\" and xdm.target.process.executable.path ~= "\\\\dump64\\.exe$") and (xdm.target.process.original_file_name ~= "^procdump$" or xdm.target.process.command_line ~= "(?: -ma | -mp )"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-over-permissive-permission-01c42d3c
    name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
    description: "Detects usage of Dsacls to grant over permissive permissions Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrators granting over permissive permissions to users. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 01c42d3c-242d-4655-85b2-34f1739632f7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dsacls_abuse_permissions.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\dsacls\\.exe$" or xdm.target.process.original_file_name ~= "^DSACLS\\.EXE$") and xdm.target.process.command_line contains " /G " and xdm.target.process.command_line ~= "(?:GR|GE|GW|GA|WP|WD)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-cabinet-file-ex-9f107a84
    name: Potentially Suspicious Cabinet File Expansion
    description: "Detects the expansion or decompression of cabinet files from potentially suspicious or uncommon locations, e.g. seen in Iranian MeteorExpress related attacks Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: System administrator Usage. Sigma rule by Bhabesh Raj, X__Junior (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9f107a84-532c-41af-b005-8d12a607639f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_expand_cabinet_files.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\expand\\.exe$" and xdm.target.process.command_line ~= "[-/–—―]F:") and (xdm.target.process.command_line ~= "(?::\\\\Perflogs\\\\|:\\\\ProgramData|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\Admin\\$\\\\|\\\\AppData\\\\Local\\\\Temp\\\\|\\\\AppData\\\\Roaming\\\\|\\\\C\\$\\\\|\\\\Temporary Internet)" or ((xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Favorites\\\\") or (xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Favourites\\\\") or (xdm.target.process.command_line ~= ":\\\\Users\\\\" and xdm.target.process.command_line ~= "\\\\Contacts\\\\"))) and not ((xdm.source.process.executable.path ~= "^C:\\\\Program Files \\(x86\\)\\\\Dell\\\\UpdateService\\\\ServiceShell\\.exe$" and xdm.target.process.command_line contains "C:\\ProgramData\\Dell\\UpdateService\\Temp\\")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-call-to-win32-n-caf201a9
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    description: 'Detects usage of the WMI class "Win32_NTEventlogFile" in a potentially suspicious way (delete, backup, change permissions, etc.) from a PowerShell script Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id caf201a9-c2ce-4a26-9c3a-2b9525413711. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_nteventlogfile_usage.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "Win32_NTEventlogFile" and xdm.target.process.command_line ~= "(?:\\.BackupEventlog\\(|\\.ChangeSecurityPermissions\\(|\\.ChangeSecurityPermissionsEx\\(|\\.ClearEventLog\\(|\\.Delete\\(|\\.DeleteEx\\(|\\.Rename\\(|\\.TakeOwnerShip\\(|\\.TakeOwnerShipEx\\()")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-child-process-o-9f546b25
    name: Potentially Suspicious Child Process Of DiskShadow.EXE
    description: 'Detects potentially suspicious child processes of "Diskshadow.exe". This could be an attempt to bypass parent/child relationship detection or application whitelisting rules. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: False postitve can occur in cases where admin scripts levreage the "exec" flag to execute applications. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9f546b25-5f12-4c8d-8532-5893dcb1e4b8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_diskshadow_child_process_susp.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\diskshadow\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\certutil\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-child-process-o-6f0947a4
    name: Potentially Suspicious Child Process Of Regsvr32
    description: 'Detects potentially suspicious child processes of "regsvr32.exe". Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely, but can rarely occur. Apply additional filters accordingly.. Sigma rule by elhoim, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_regsvr32_susp_child_process.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.010
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\regsvr32\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\cscript\\.exe|\\\\explorer\\.exe|\\\\mshta\\.exe|\\\\net\\.exe|\\\\net1\\.exe|\\\\nltest\\.exe|\\\\notepad\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\reg\\.exe|\\\\schtasks\\.exe|\\\\werfault\\.exe|\\\\wscript\\.exe)$") and not ((xdm.target.process.executable.path ~= "\\\\werfault\\.exe$" and xdm.target.process.command_line contains " -u -p ")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-child-processes-dfa03a09
    name: Potentially Suspicious Child Processes Spawned by ConHost
    description: "Detects suspicious child processes related to Windows Shell utilities spawned by `conhost.exe`, which could indicate malicious activity using trusted system components. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate administrative tasks using `conhost.exe` to spawn child processes such as `cmd.exe`, `powershell.exe`, or `regsvr32.exe`.. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id dfa03a09-8b92-4d83-8e74-f72839b1c407. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_conhost_susp_winshell_child_process.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1202
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\conhost\\.exe$" and (xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\powershell_ise\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:cmd\\.exe|cscript\\.exe|mshta\\.exe|powershell_ise\\.exe|powershell\\.exe|pwsh\\.dll|regsvr32\\.exe|wscript\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-cmd-shell-outpu-8e0bb260
    name: Potentially Suspicious CMD Shell Output Redirect
    description: |-
      Detects inline Windows shell commands redirecting output via the ">" symbol to a suspicious location.
