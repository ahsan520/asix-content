  - key: process-access-via-trolleyexpress-excl-4c0aaedc
    name: Process Access via TrolleyExpress Exclusion
    description: "Detects a possible process memory dump that uses the white-listed Citrix TrolleyExpress.exe filename as a way to dump the lsass process memory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4c0aaedc-154c-4427-ada0-d80ef9c9deb6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_citrix_trolleyexpress_procdump.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218.011
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:\\\\TrolleyExpress 7|\\\\TrolleyExpress 8|\\\\TrolleyExpress 9|\\\\TrolleyExpress\\.exe 7|\\\\TrolleyExpress\\.exe 8|\\\\TrolleyExpress\\.exe 9|\\\\TrolleyExpress\\.exe -ma )" or (xdm.target.process.executable.path ~= "\\\\TrolleyExpress\\.exe$" and not ((xdm.target.process.original_file_name contains "CtxInstall" or not (xdm.target.process.original_file_name ~= ".")))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-creation-using-sysnative-folde-3c1b5fb0
    name: Process Creation Using Sysnative Folder
    description: "Detects process creation events that use the Sysnative folder (common for CobaltStrike spawns) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Max Altgelt (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_sysnative.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line contains ":\\Windows\\Sysnative\\" or xdm.target.process.executable.path contains ":\\Windows\\Sysnative\\") and not ((xdm.target.process.executable.path ~= "(?:C:\\\\Windows\\\\Microsoft\\.NET\\\\Framework64\\\\v|C:\\\\Windows\\\\Microsoft\\.NET\\\\Framework\\\\v|C:\\\\Windows\\\\Microsoft\\.NET\\\\FrameworkArm\\\\v|C:\\\\Windows\\\\Microsoft\\.NET\\\\FrameworkArm64\\\\v)" and xdm.target.process.executable.path ~= "\\\\ngen\\.exe$" and xdm.target.process.command_line contains "install")) and not ((xdm.target.process.command_line ~= "\"C:\\\\Windows\\\\sysnative\\\\cmd\\.exe\"" and xdm.target.process.command_line ~= "\\\\xampp\\\\" and xdm.target.process.command_line ~= "\\\\catalina_start\\.bat")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-execution-from-a-potentially-s-3dfd06d2
    name: Process Execution From A Potentially Suspicious Folder
    description: "Detects a potentially suspicious execution from an uncommon folder. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), Tim Shelton, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 3dfd06d2-eaf4-4532-9555-68aca59f57c4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_execution_path.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\All Users\\\\|:\\\\Users\\\\Default\\\\|:\\\\Users\\\\NetworkService\\\\|:\\\\Windows\\\\addins\\\\|:\\\\Windows\\\\debug\\\\|:\\\\Windows\\\\Fonts\\\\|:\\\\Windows\\\\Help\\\\|:\\\\Windows\\\\IME\\\\|:\\\\Windows\\\\Media\\\\|:\\\\Windows\\\\repair\\\\|:\\\\Windows\\\\security\\\\|:\\\\Windows\\\\System32\\\\Tasks\\\\|:\\\\Windows\\\\Tasks\\\\|\\$Recycle\\.bin|\\\\config\\\\systemprofile\\\\|\\\\Intel\\\\Logs\\\\|\\\\RSA\\\\MachineKeys\\\\)" and not ((xdm.target.process.executable.path ~= "^C:\\\\Users\\\\Public\\\\IBM\\\\ClientSolutions\\\\Start_Programs\\\\" or (xdm.target.process.executable.path ~= "^C:\\\\Windows\\\\SysWOW64\\\\config\\\\systemprofile\\\\Citrix\\\\UpdaterBinaries\\\\" and xdm.target.process.executable.path ~= "\\\\CitrixReceiverUpdater\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-launched-without-image-name-f208d6d8
    name: Process Launched Without Image Name
    description: 'Detect the use of processes with no name (".exe"), which can be used to evade Image-based detections. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Rare legitimate software.. Sigma rule by Matt Anderson (Huntress), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f208d6d8-d83a-4c2c-960d-877c37da84e5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_no_image_name.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.executable.path ~= "\\\\\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-memory-dump-via-comsvcs-dll-646ea171
    name: Process Memory Dump Via Comsvcs.DLL
    description: 'Detects a process memory dump via "comsvcs.dll" using rundll32, covering multiple different techniques (ordinal, minidump function, etc.) Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), Modexp, Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 646ea171-dded-4578-8a4d-65e9822892e3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\rundll32\\.exe$" or xdm.target.process.original_file_name ~= "^RUNDLL32\\.EXE$" or xdm.target.process.command_line contains "rundll32") and ((xdm.target.process.command_line ~= "comsvcs" and xdm.target.process.command_line ~= "full") and xdm.target.process.command_line ~= "(?:#-|#\\+|#24|24 |MiniDump|#65560)")) or ((xdm.target.process.command_line ~= "24" and xdm.target.process.command_line ~= "comsvcs" and xdm.target.process.command_line ~= "full") and xdm.target.process.command_line ~= "(?: #|,#|, #|\"#)"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-memory-dump-via-dotnet-dump-53d8d3e1
    name: Process Memory Dump Via Dotnet-Dump
    description: 'Detects the execution of "dotnet-dump" with the "collect" flag. The execution could indicate potential process dumping of critical processes such as LSASS. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Process dumping is the expected behavior of the tool. So false positives are expected in legitimate usage. The PID/Process Name of the process being dumped needs to be investigated. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 53d8d3e1-ca33-4012-adf3-e05a4d652e34. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dotnetdump_memory_dump.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\dotnet-dump\\.exe$" or xdm.target.process.original_file_name ~= "^dotnet-dump\\.dll$") and xdm.target.process.command_line contains "collect")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: process-memory-dump-via-rdrleakdiag-ex-edadb1e5
    name: Process Memory Dump via RdrLeakDiag.EXE
    description: 'Detects the use of the Microsoft Windows Resource Leak Diagnostic tool "rdrleakdiag.exe" to dump process memory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Cedric MAURUGEON, Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id edadb1e5-5919-4e4c-8462-a9e643b02c4b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rdrleakdiag_process_dumping.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\rdrleakdiag\\.exe$" or xdm.target.process.original_file_name ~= "^RdrLeakDiag\\.exe$") and xdm.target.process.command_line ~= "(?:[-/–—―]memdmp|fullmemdmp)" and xdm.target.process.command_line ~= "(?: [-/–—―]o | [-/–—―]p )")'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: program-executed-using-proxy-local-com-7d6d30b8
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    description: 'Detect usage of the "ssh.exe" binary as a proxy to launch other programs. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate usage for administration purposes. Sigma rule by frack113, Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 7d6d30b8-5b91-4b90-a891-46cccaf29598. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ssh_proxy_execution.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\OpenSSH\\\\sshd\\.exe$" or ((xdm.target.process.executable.path ~= "\\\\ssh\\.exe$" or xdm.target.process.product ~= "^OpenSSH for Windows$" or xdm.target.process.hashes ~= "(?:IMPHASH=55b4964d29aad5438b9e950052dbbbc0|IMPHASH=334d66c33503ccbf647c15b47c27eef4|IMPHASH=27b0da080ef92afb37983d30d839141e|IMPHASH=977eb4c263d384e47daa0712d34713ab|IMPHASH=3eaadce9ae43d5a918bb082065815c3b|IMPHASH=980fe6cf0d996ab1eedf877222e722aa|IMPHASH=5f959422308ac3d721010d66647e100e|IMPHASH=a49aaa3d03d1cd9c8dc7fca60f7f480b|IMPHASH=dd335f759b6d5d6a8382b71dd9d65791)") and (xdm.target.process.command_line contains "ProxyCommand=" or (xdm.target.process.command_line ~= "PermitLocalCommand=yes" and xdm.target.process.command_line ~= " LocalCommand"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: proxy-execution-via-vshadow-d7c75059
    name: Proxy Execution via Vshadow
    description: |-
      Detects the invocation of vshadow.exe with the -exec parameter that executes a specified script or command after the shadow copies are created but before the VShadow tool exits.
      VShadow is a command-line tool that you can use to create and manage volume shadow copies. While legitimate backup or administrative scripts may use this flag,
      attackers can leverage this parameter to proxy the execution of malware. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: System backup or administrator tools; Legitimate administrative scripts. Sigma rule by David Faiss, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d7c75059-2901-4578-b209-8837fd31c6a8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_vshadow_exec.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\vshadow\\.exe$" or xdm.target.process.original_file_name ~= "^vshadow\\.exe$") and xdm.target.process.command_line contains "-exec")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
