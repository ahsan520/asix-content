  - key: powershell-defender-threat-severity-de-1e8a9b4d
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    description: |-
      Detects the use of PowerShell to execute the 'Set-MpPreference' cmdlet to configure Windows Defender's threat severity default action to 'Allow' (value '6') or 'NoAction' (value '9').
      This is a highly suspicious configuration change that effectively disables Defender's ability to automatically mitigate threats of a certain severity level.
      An attacker might use this technique via the command line to bypass defenses before executing payloads. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Highly unlikely. Sigma rule by Matt Anderson (Huntress), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_defender_default_action_modified.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "Set-MpPreference" and xdm.target.process.command_line ~= "(?:-LowThreatDefaultAction|-ModerateThreatDefaultAction|-HighThreatDefaultAction|-SevereThreatDefaultAction|-ltdefac |-mtdefac |-htdefac |-stdefac )" and xdm.target.process.command_line ~= "(?:Allow|6|NoAction|9)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
