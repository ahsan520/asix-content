  - key: ppl-tampering-via-werfaultsecure-1f0b4cac
    name: PPL Tampering Via WerFaultSecure
    description: |-
      Detects potential abuse of WerFaultSecure.exe to dump Protected Process Light (PPL) processes like LSASS or to freeze security solutions (EDR/antivirus).
      This technique is used by tools such as EDR-Freeze and WSASS to bypass PPL protections and access sensitive information or disable security software.
      Distinct command line patterns help identify the specific tool:
      - WSASS usage typically shows: "WSASS.exe WerFaultSecure.exe [PID]" in ParentCommandLine
      - EDR-Freeze usage typically shows: "EDR-Freeze_[version].exe [PID] [timeout]" in ParentCommandLine
      Legitimate debugging operations using WerFaultSecure are rare in production environments and should be investigated. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate usage of WerFaultSecure for debugging purposes. Sigma rule by Jason (https://github.com/0xbcf), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1f0b4cac-9c81-41f4-95d0-8475ff46b3e2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_werfaultsecure_abuse.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\WerFaultSecure\\.exe$" or xdm.target.process.original_file_name ~= "^WerFaultSecure\\.exe$") and (xdm.target.process.command_line ~= " /h " and xdm.target.process.command_line ~= " /pid " and xdm.target.process.command_line ~= " /tid " and xdm.target.process.command_line ~= " /encfile " and xdm.target.process.command_line ~= " /cancel " and xdm.target.process.command_line ~= " /type " and xdm.target.process.command_line ~= " 268310"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: printbrm-zip-creation-of-extraction-cafeeba3
