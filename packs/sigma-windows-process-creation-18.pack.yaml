ss.command_line ~= "ShOpenVerbApplication") or (xdm.target.process.command_line ~= "dfshim\\.dll" and xdm.target.process.command_line ~= "ShOpenVerbShortcut") or (xdm.target.process.command_line ~= "scrobj\\.dll" and xdm.target.process.command_line ~= "GenerateTypeLib" and xdm.target.process.command_line ~= "http") or (xdm.target.process.command_line ~= "shimgvw\\.dll" and xdm.target.process.command_line ~= "ImageView_Fullscreen" and xdm.target.process.command_line ~= "http") or (xdm.target.process.command_line ~= "comsvcs\\.dll" and xdm.target.process.command_line ~= "MiniDump")) and not ((xdm.target.process.command_line contains "shell32.dll,Control_RunDLL desk.cpl,screensaver,@screensaver" or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\control\\.exe$" and xdm.source.process.command_line contains ".cpl" and (xdm.target.process.command_line ~= "Shell32\\.dll" and xdm.target.process.command_line ~= "Control_RunDLL" and xdm.target.process.command_line ~= "\\.cpl")) or (xdm.source.process.executable.path ~= "^C:\\\\Windows\\\\System32\\\\control\\.exe$" and xdm.target.process.command_line ~= "^\"C:\\\\Windows\\\\system32\\\\rundll32\\.exe\" Shell32\\.dll,Control_RunDLL \"C:\\\\Windows\\\\System32\\\\" and xdm.target.process.command_line ~= "\\.cpl\",$"))))
