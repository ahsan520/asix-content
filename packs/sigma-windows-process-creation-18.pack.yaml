    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: "xdm.event.type = \"process\" and ((xdm.target.process.executable.path ~= \"\\\\\\\\cmd\\\\.exe$\" or xdm.target.process.original_file_name ~= \"^Cmd\\\\.Exe$\") and (xdm.target.process.command_line ~= \"(?:>.%APPDATA%\\\\\\\\|>.%TEMP%\\\\\\\\|>.%TMP%\\\\\\\\|>.%USERPROFILE%\\\\\\\\|>.C:\\\\\\\\ProgramData\\\\\\\\|>.C:\\\\\\\\Temp\\\\\\\\|>.C:\\\\\\\\Users\\\\\\\\Public\\\\\\\\|>.C:\\\\\\\\Windows\\\\\\\\Temp\\\\\\\\)\" or (xdm.target.process.command_line ~= \"(?: >|\\\">|'>)\" and (xdm.target.process.command_line ~= \"C:\\\\\\\\Users\\\\\\\\\" and xdm.target.process.command_line ~= \"\\\\\\\\AppData\\\\\\\\Local\\\\\\\\\"))))"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
