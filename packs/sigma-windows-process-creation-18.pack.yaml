      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path contains "C:\\Program Files\\WindowsApps\\" and (xdm.target.process.executable.path ~= "(?:\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\powershell\\.exe|\\\\powershell_ise\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.command_line ~= "(?:cmd /c|Invoke-|Base64)") and not (((xdm.source.process.executable.path contains ":\\Program Files\\WindowsApps\\Microsoft.WindowsTerminal" and xdm.source.process.executable.path ~= "\\\\WindowsTerminal\\.exe$" and xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\cmd\\.exe|\\\\pwsh\\.exe)$") or (xdm.source.process.executable.path ~= "^C:\\\\Program Files\\\\WindowsApps\\\\Microsoft\\.SysinternalsSuite" and xdm.target.process.executable.path ~= "\\\\cmd\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: powershell-defender-exclusion-17769c90
    name: Powershell Defender Exclusion
    description: "Detects requests to exclude files, folders or processes from Antivirus scanning using PowerShell cmdlets Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Possible Admin Activity; Other Cmdlets that may use the same parameters. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 17769c90-230e-488b-a463-e05c08e9d48f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_defender_exclusion.yml"
