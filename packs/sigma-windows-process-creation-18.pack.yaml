  - key: potentially-suspicious-usage-of-qemu-5fc297ae
    name: Potentially Suspicious Usage Of Qemu
    description: |-
      Detects potentially suspicious execution of the Qemu utility in a Windows environment.
      Threat actors have leveraged this utility and this technique for achieving network access as reported by Kaspersky. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Muhammad Faisal (@faisalusuf), Hunter Juhan (@threatHNTR), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5fc297ae-25b6-488a-8f25-cc12ac29b744. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_qemu_suspicious_execution.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1090
      - T1572
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.command_line ~= "(?:-m 1M|-m 2M|-m 3M)" and (xdm.target.process.command_line ~= "restrict=off" and xdm.target.process.command_line ~= "-netdev " and xdm.target.process.command_line ~= "connect=" and xdm.target.process.command_line ~= "-nographic")) and not (xdm.target.process.command_line ~= "(?: -cdrom | type=virt | -blockdev )"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-windows-app-act-f91ed517
    name: Potentially Suspicious Windows App Activity
    description: 'Detects potentially suspicious child process of applications launched from inside the WindowsApps directory. This could be a sign of a rogue ".appx" package installation/execution Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate packages that make use of external binaries such as Windows Terminal. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f91ed517-a6ba-471d-9910-b3b4a398c0f3. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_appx_execution.yml'
