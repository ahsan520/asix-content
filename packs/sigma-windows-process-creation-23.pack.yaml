  - key: uncommon-svchost-command-line-paramete-f17211f1
    name: Uncommon Svchost Command Line Parameter
    description: |-
      Detects instances of svchost.exe running with an unusual or uncommon command line parameter by excluding known legitimate or common patterns.
      This could point at a file masquerading as svchost, a process injection, or hollowing of a legitimate svchost instance. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Regular expressions here ignore case in ASIX; in Sigma they are case-sensitive unless |i is given, so this rule can match a little more. Sigma rule by Liran Ravich, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f17211f1-1f24-4d0c-829f-31e28dc93cdd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_svchost_uncommon_command_line_flags.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.005
      - T1055
      - T1055.012
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\svchost\\.exe$" and not ((xdm.target.process.command_line ~= "-k\\s\\w{1,64}(?:\\s?(?:-p|-s))?" or not (xdm.target.process.command_line ~= ".") or not (xdm.target.process.command_line ~= "."))) and not (((xdm.source.process.executable.path ~= "\\\\MsMpEng\\.exe$" and xdm.target.process.command_line contains "svchost.exe") or (xdm.source.process.executable.path ~= "\\\\MRT\\.exe$" and xdm.target.process.command_line ~= "^svchost\\.exe$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
