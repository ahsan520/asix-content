  - key: uncommon-link-exe-parent-process-6e968eb1
    name: Uncommon Link.EXE Parent Process
    description: |-
      Detects an uncommon parent process of "LINK.EXE".
      Link.EXE in Microsoft incremental linker. Its a utility usually bundled with Visual Studio installation.
      Multiple utilities often found in the same folder (editbin.exe, dumpbin.exe, lib.exe, etc) have a hardcode call to the "LINK.EXE" binary without checking its validity.
      This would allow an attacker to sideload any binary with the name "link.exe" if one of the aforementioned tools get executed from a different location.
      By filtering the known locations of such utilities we can spot uncommon parent process of LINK.EXE that might be suspicious or malicious. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 6e968eb1-5f05-4dac-94e9-fd0c5cb49fd6. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_link_uncommon_parent_process.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\link\\.exe$" and xdm.target.process.command_line contains "LINK /") and not ((xdm.source.process.executable.path ~= "^(?:C:\\\\Program Files\\\\Microsoft Visual Studio\\\\|C:\\\\Program Files \\(x86\\)\\\\Microsoft Visual Studio\\\\)" and xdm.source.process.executable.path ~= "(?:\\\\VC\\\\bin\\\\|\\\\VC\\\\Tools\\\\)")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
