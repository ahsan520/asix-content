  - key: windows-eventlog-autologger-session-re-d7b81144
    name: Windows EventLog Autologger Session Registry Modification Via CommandLine
    description: |-
      Detects attempts to disable Windows EventLog autologger sessions via registry modification.
      The AutoLogger event tracing session records events that occur early in the operating system boot process.
      Applications and device drivers can use the AutoLogger session to capture traces before the user logs in.
      Adversaries may disable these sessions to evade detection and prevent security monitoring of early boot activities and system events. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d7b81144-b866-48a4-9bcc-275dc69d870e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_autologger_session_registry_modification.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\reg\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:reg\\.exe|PowerShell\\.EXE|pwsh\\.dll)$") and xdm.target.process.command_line ~= "(?:add |Set-ItemProperty|New-ItemProperty|si )" and xdm.target.process.command_line contains "\\Control\\WMI\\Autologger\\" and xdm.target.process.command_line ~= "(?:Start|Enabled)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
