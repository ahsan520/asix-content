        enabled: true
        minutes: 60
  - key: uncommon-child-process-spawned-from-xb-74697c29
    name: Uncommon Child Process Spawned From XBootMgrSleep.EXE
    description: |-
      Detects a process other than XBootMgr.exe spawned by XBootMgrSleep.exe.
