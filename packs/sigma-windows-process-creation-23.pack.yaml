  - key: uncommon-assistive-technology-applicat-f24bcaea
    name: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
    description: 'Detects the start of a non built-in assistive technology applications via "Atbroker.EXE". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Legitimate, non-default assistive technology applications execution. Sigma rule by Mateusz Wydra, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f24bcaea-0cd1-11eb-adc1-0242ac120002. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_atbroker_uncommon_ats_execution.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\AtBroker\\.exe$" or xdm.target.process.original_file_name ~= "^AtBroker\\.exe$") and xdm.target.process.command_line contains "start") and not ((xdm.target.process.command_line ~= "(?:animations|audiodescription|caretbrowsing|caretwidth|colorfiltering|cursorindicator|cursorscheme|filterkeys|focusborderheight|focusborderwidth|highcontrast|keyboardcues|keyboardpref|livecaptions|magnifierpane|messageduration|minimumhitradius|mousekeys|Narrator|osk|overlappedcontent|showsounds|soundsentry|speechreco|stickykeys|togglekeys|voiceaccess|windowarranging)" or xdm.target.process.command_line ~= "(?:windowtracking|windowtrackingtimeout|windowtrackingzorder)")) and not (xdm.target.process.command_line contains "Oracle_JavaAccessBridge"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-addinutil-exe-commandline-exe-4f2cd9b6
    name: Uncommon AddinUtil.EXE CommandLine Execution
    description: "Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4f2cd9b6-4a17-440f-bb2a-687abb65993a. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_addinutil_uncommon_cmdline.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\addinutil\\.exe$" or xdm.target.process.original_file_name ~= "^AddInUtil\\.exe$") and xdm.target.process.command_line ~= "(?:-AddInRoot:|-PipelineRoot:)") and not (xdm.target.process.command_line ~= "(?:-AddInRoot:\"C:\\\\Program Files \\(x86\\)\\\\Common Files\\\\Microsoft Shared\\\\VSTA|-AddInRoot:C:\\\\Program Files \\(x86\\)\\\\Common Files\\\\Microsoft Shared\\\\VSTA|-PipelineRoot:\"C:\\\\Program Files \\(x86\\)\\\\Common Files\\\\Microsoft Shared\\\\VSTA|-PipelineRoot:C:\\\\Program Files \\(x86\\)\\\\Common Files\\\\Microsoft Shared\\\\VSTA)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
