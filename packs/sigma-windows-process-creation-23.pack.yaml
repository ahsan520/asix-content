  - key: uncommon-child-process-of-setres-exe-835e75bf
    name: Uncommon Child Process Of Setres.EXE
    description: |-
      Detects uncommon child process of Setres.EXE.
      Setres.EXE is a Windows server only process and tool that can be used to set the screen resolution.
      It can potentially be abused in order to launch any arbitrary file with a name containing the word "choice" from the current execution path. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by @gott_cyber, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 835e75bf-4bfd-47a4-b8a6-b766cac8bcb7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_setres_uncommon_child_process.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.source.process.executable.path ~= "\\\\setres\\.exe$" and xdm.target.process.executable.path contains "\\choice") and not (xdm.target.process.executable.path ~= "(?:C:\\\\Windows\\\\System32\\\\choice\\.exe|C:\\\\Windows\\\\SysWOW64\\\\choice\\.exe)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-child-process-spawned-by-odbc-8e3c7994
    name: Uncommon Child Process Spawned By Odbcconf.EXE
    description: "Detects an uncommon child process of \"odbcconf.exe\" binary which normally shouldn't have any child processes. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: In rare occurrences where \"odbcconf\" crashes. It might spawn a \"werfault\" process; Other child processes will depend on the DLL being registered by actions like \"regsvr\". In case where the DLLs have external calls (which should be rare). Other child processes might spawn and additional filters need to be applied.. Sigma rule by Harjot Singh @cyb3rjy0t, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8e3c7994-131e-4ba5-b6ea-804d49113a26. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_odbcconf_uncommon_child_process.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218.008
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.source.process.executable.path ~= "\\\\odbcconf\\.exe$"
      group_by: field:xdm.source.host.hostname
