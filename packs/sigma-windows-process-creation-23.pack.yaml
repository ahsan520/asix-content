      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\xbootmgrsleep\\.exe$" and not (xdm.target.process.executable.path ~= "^C:\\\\Program Files \\(x86\\)\\\\Windows Kits\\\\10\\\\Windows Performance Toolkit\\\\xbootmgr\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
