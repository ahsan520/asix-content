    description: "Detects registry modifications that add Windows Filtering Platform (WFP) filters, which may be used to block security tools and EDR agents from reporting events. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1f1d8209-636e-4c6c-a137-781cca8b82f9. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_susp_wfp_filter_added.yml"
