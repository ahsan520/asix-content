  - key: modify-user-shell-folders-startup-valu-9c226817
    name: Modify User Shell Folders Startup Value
    description: |-
      Detect modification of the User Shell Folders registry values for Startup or Common Startup which could indicate persistence attempts.
      Attackers may modify User Shell Folders registry keys to point to malicious executables or scripts that will be executed during startup.
      This technique is often used to maintain persistence on a compromised system by ensuring that the malicious payload is executed automatically. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9c226817-8dc9-46c2-a58d-66655aafd7dc. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_susp_user_shell_folders.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1547.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "(?:SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\User Shell Folders|SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\Shell Folders)" and xdm.target.registry.path ~= "(?:\\\\Common Startup|\\\\Startup)$") and not ((not (xdm.target.registry.data ~= ".") or xdm.target.registry.data ~= "(?:C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup|%ProgramData%\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup)" or xdm.target.registry.data ~= "(?:%USERPROFILE%\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup|%%USERPROFILE%%\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup)" or (xdm.target.registry.data ~= "C:\\\\Users\\\\" and xdm.target.registry.data ~= "\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: net-ngenassemblyusagelog-registry-key-28036918
    name: NET NGenAssemblyUsageLog Registry Key Tamper
    description: |-
      Detects changes to the NGenAssemblyUsageLog registry key.
      .NET Usage Log output location can be controlled by setting the NGenAssemblyUsageLog CLR configuration knob in the Registry or by configuring an environment variable (as described in the next section).
      By simplify specifying an arbitrary value (e.g. fake output location or junk data) for the expected value, a Usage Log file for the .NET execution context will not be created. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 28036918-04d3-423d-91c0-55ecf99fb892. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_net_cli_ngenassemblyusagelog.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1112
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and xdm.target.registry.path ~= "SOFTWARE\\\\Microsoft\\\\\\.NETFramework\\\\NGenAssemblyUsageLog$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
