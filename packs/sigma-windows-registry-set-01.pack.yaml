# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-registry-set-01
name: "Sigma: Windows registry set (1 of 4)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows registry set events, grouped by tactic, starting with Collection. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - registry-set
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13)
rules:
  - key: periodic-backup-for-system-registry-hi-973ef012
    name: Periodic Backup For System Registry Hives Enabled
    description: |-
      Detects the enabling of the "EnablePeriodicBackup" registry value. Once enabled, The OS will backup System registry hives on restarts to the "C:\Windows\System32\config\RegBack" folder. Windows creates a "RegIdleBackup" task to manage subsequent backups.
      Registry backup was a default behavior on Windows and was disabled as of "Windows 10, version 1803". Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate need for RegBack feature by administrators.. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 973ef012-8f1a-4c40-93b4-7e659a5cd17f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_enable_periodic_backup.yml
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1113
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\Control\\\\Session Manager\\\\Configuration Manager\\\\EnablePeriodicBackup$" and xdm.target.registry.data ~= "^DWORD \\(0x00000001\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: windows-recall-feature-enabled-registr-75180c5f
    name: Windows Recall Feature Enabled - Registry
    description: |-
      Detects the enabling of the Windows Recall feature via registry manipulation. Windows Recall can be enabled by setting the value of "DisableAIDataAnalysis" to "0".
      Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities.
      This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate use/activation of Windows Recall. Sigma rule by Sajid Nawaz Khan, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 75180c5f-4ea1-461a-a4f6-6e4700c065d4. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_enable_windows_recall.yml
    kind: bioc
    severity: medium
    category: Collection
    mitre:
      - T1113
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\Software\\\\Policies\\\\Microsoft\\\\Windows\\\\WindowsAI\\\\DisableAIDataAnalysis$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: enable-microsoft-dynamic-data-exchange-63647769
    name: Enable Microsoft Dynamic Data Exchange
    description: "Enable Dynamic Data Exchange protocol (DDE) in all supported editions of Microsoft Word or Excel. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 63647769-326d-4dde-a419-b925cc0caf42. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_office_enable_dde.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1559.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\Word\\\\Security\\\\AllowDDE$" and xdm.target.registry.data ~= "^(?:DWORD \\(0x00000001\\)|DWORD \\(0x00000002\\))$") or (xdm.target.registry.path ~= "(?:\\\\Excel\\\\Security\\\\DisableDDEServerLaunch|\\\\Excel\\\\Security\\\\DisableDDEServerLookup)$" and xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: filefix-command-evidence-in-typedpaths-4fee3d51
    name: FileFix - Command Evidence in TypedPaths
    description: "Detects commonly-used chained commands and strings in the most recent 'url' value of the 'TypedPaths' key, which could be indicative of a user being targeted by the FileFix technique. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Alfie Champion (delivr.to), Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4fee3d51-8069-4a4c-a0f7-924fcaff2c70. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_filefix_typedpath_commands.yml"
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path ~= "\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\TypedPaths\\\\url1$" and (xdm.target.registry.data ~= "#" and xdm.target.registry.data ~= "http")) and (xdm.target.registry.data ~= "(?:account|anti-bot|botcheck|captcha|challenge|confirmation|fraud|human|identification|identificator|identity|robot|validation|verification|verify)" or xdm.target.registry.data ~= "(?:%comspec%|bitsadmin|certutil|cmd|cscript|curl|finger|mshta|powershell|pwsh|regsvr32|rundll32|schtasks|wget|wscript)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-clickfix-execution-pattern-r-f5fe36cf
    name: Potential ClickFix Execution Pattern - Registry
    description: |-
      Detects potential ClickFix malware execution patterns by monitoring registry modifications in RunMRU keys containing HTTP/HTTPS links.
      ClickFix is known to be distributed through phishing campaigns and uses techniques like clipboard hijacking and fake CAPTCHA pages.
      Through the fakecaptcha pages, the adversary tricks users into opening the Run dialog box and pasting clipboard-hijacked content,
      such as one-liners that execute remotely hosted malicious files or scripts. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate applications using RunMRU with HTTP links. Sigma rule by Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f5fe36cf-f1ec-4c23-903d-09a3110f6bbb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_potential_clickfix_execution.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1204.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU\\" and xdm.target.registry.data ~= "(?:http://|https://)" and (xdm.target.registry.data ~= "(?:account|anti-bot|botcheck|captcha|challenge|confirmation|fraud|human|identification|identificator|identity|robot|validation|verification|verify)" or xdm.target.registry.data ~= "(?:%comspec%|bitsadmin|certutil|cmd|cscript|curl|finger|mshta|powershell|pwsh|regsvr32|rundll32|schtasks|wget|wscript)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-registry-persistence-attempt-73a883d0
    name: Potential Registry Persistence Attempt Via Windows Telemetry
    description: |-
      Detects potential persistence behavior using the windows telemetry registry key.
      Windows telemetry makes use of the binary CompatTelRunner.exe to run a variety of commands and perform the actual telemetry collections.
      This binary was created to be easily extensible, and to that end, it relies on the registry to instruct on which commands to run.
      The problem is, it will run any arbitrary command without restriction of location or type. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Lednyov Alexey, oscd.community, Sreeman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 73a883d0-0348-4be4-a8d8-51031c2564f8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_telemetry_persistence.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1053.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and ((xdm.target.registry.path contains "\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\TelemetryController\\" and xdm.target.registry.path ~= "\\\\Command$" and xdm.target.registry.data ~= "(?:\\.bat|\\.bin|\\.cmd|\\.dat|\\.dll|\\.exe|\\.hta|\\.jar|\\.js|\\.msi|\\.ps|\\.sh|\\.vb)") and not (xdm.target.registry.data ~= "(?:\\\\system32\\\\CompatTelRunner\\.exe|\\\\system32\\\\DeviceCensus\\.exe)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potentially-suspicious-command-execute-a7df0e9e
    name: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
    description: |-
      Detects execution of commands via the run dialog box on Windows by checking values of the "RunMRU" registry key.
      This technique was seen being abused by threat actors to deceive users into pasting and executing malicious commands, often disguised as CAPTCHA verification steps. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Ahmed Farouk, Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a7df0e9e-91a5-459a-a003-4cde67c2ff5d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_runmru_susp_command_execution.yml
    kind: bioc
    severity: high
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path contains "\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU" and ((xdm.target.registry.data ~= "(?:powershell|pwsh)" and xdm.target.registry.data ~= "(?: -e | -ec | -en | -enc | -enco|ftp|Hidden|http|iex|Invoke-)") or (xdm.target.registry.data contains "wmic" and xdm.target.registry.data ~= "(?:shadowcopy|process call create)")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
