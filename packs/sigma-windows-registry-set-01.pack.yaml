    description: "Detects modification of autostart extensibility point (ASEP) in registry. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Legitimate software automatically (mostly, during installation) sets up autorun keys for legitimate reason; Legitimate administrator sets up autorun keys for legitimate reason. Sigma rule by Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a80f662f-022f-4429-9b8c-b1a41aaa6688. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_internet_explorer.yml"
