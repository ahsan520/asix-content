  - key: directory-service-restore-mode-dsrm-re-b61e87c0
    name: Directory Service Restore Mode(DSRM) Registry Value Tampering
    description: |-
      Detects changes to "DsrmAdminLogonBehavior" registry value.
      During a Domain Controller (DC) promotion, administrators create a Directory Services Restore Mode (DSRM) local administrator account with a password that rarely changes. The DSRM account is an “Administrator” account that logs in with the DSRM mode when the server is booting up to restore AD backups or recover the server from a failure.
      Attackers could abuse DSRM account to maintain their persistence and access to the organization's Active Directory.
      If the "DsrmAdminLogonBehavior" value is set to "0", the administrator account can only be used if the DC starts in DSRM.
      If the "DsrmAdminLogonBehavior" value is set to "1", the administrator account can only be used if the local AD DS service is stopped.
      If the "DsrmAdminLogonBehavior" value is set to "2", the administrator account can always be used. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 13). Known false positives: Unknown. Sigma rule by Nischal Khadgi, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b61e87c0-50db-4b2e-8986-6a2be94b33b0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/registry/registry_set/registry_set_dsrm_tampering.yml
    kind: bioc
    severity: high
    category: Persistence
    mitre:
      - T1556
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "registry" and xdm.event.operation = "registry_value_set" and (xdm.target.registry.path ~= "\\\\Control\\\\Lsa\\\\DsrmAdminLogonBehavior$" and not (xdm.target.registry.data ~= "^DWORD \\(0x00000000\\)$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
