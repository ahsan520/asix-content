  - key: suspicious-agentexecutor-powershell-ex-c0b40568
    name: Suspicious AgentExecutor PowerShell Execution
    description: 'Detects execution of the AgentExecutor.exe binary. Which can be abused as a LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any binary named "powershell.exe" located in the path provided by 6th positional argument Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), memory-shards, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c0b40568-b1e9-4b03-8d6c-b096da6da9ab. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_agentexecutor_susp_usage.yml'
