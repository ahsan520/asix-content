  - key: renamed-createdump-utility-execution-1a1ed54a
    name: Renamed CreateDump Utility Execution
    description: "Detects uses of a renamed legitimate createdump.exe LOLOBIN utility to dump process memory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Command lines that use the same flags. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 1a1ed54a-2ba4-4221-94d5-01dee560d71e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_createdump.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.original_file_name ~= "^FX_VER_INTERNALNAME_STR$" or ((xdm.target.process.command_line ~= " -u " and xdm.target.process.command_line ~= " -f " and xdm.target.process.command_line ~= "\\.dmp") or (xdm.target.process.command_line ~= " --full " and xdm.target.process.command_line ~= " --name " and xdm.target.process.command_line ~= "\\.dmp"))) and not (xdm.target.process.executable.path ~= "\\\\createdump\\.exe$"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
