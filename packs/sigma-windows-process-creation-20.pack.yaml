# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-20
name: "Sigma: Windows process creation (20 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: remote-file-download-via-findstr-exe-587254ee
    name: Remote File Download Via Findstr.EXE
    description: 'Detects execution of "findstr" with specific flags and a remote share path. This specific set of CLI flags would allow "findstr" to download the content of the file located on the remote share as described in the LOLBAS entry. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 587254ee-a24b-4335-b3cd-065c0f1f4baa. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_findstr_download.yml'
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
      - T1564.004
      - T1552.001
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line contains "findstr" or xdm.target.process.executable.path ~= "findstr\\.exe$" or xdm.target.process.original_file_name ~= "^FINDSTR\\.EXE$") and (xdm.target.process.command_line ~= " [-/–—―]v " and xdm.target.process.command_line ~= " [-/–—―]l " and xdm.target.process.command_line contains "\\\\\\\\"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remote-xsl-execution-via-msxsl-exe-75d0a94e
    name: Remote XSL Execution Via Msxsl.EXE
    description: 'Detects the execution of the "msxsl" binary with an "http" keyword in the command line. This might indicate a potential remote execution of XSL files. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Msxsl is not installed by default and is deprecated, so unlikely on most systems.. Sigma rule by Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 75d0a94e-6252-448d-a7be-d953dff527bb. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_msxsl_remote_execution.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1220
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\msxsl\\.exe$" and xdm.target.process.command_line contains "http")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: remotefxvgpudisablement-abuse-via-atom-a6fc3c46
    name: RemoteFXvGPUDisablement Abuse Via AtomicTestHarnesses
    description: 'Detects calls to the AtomicTestHarnesses "Invoke-ATHRemoteFXvGPUDisablementCommand" which is designed to abuse the "RemoteFXvGPUDisablement.exe" binary to run custom PowerShell code via module load-order hijacking. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id a6fc3c46-23b8-4996-9ea2-573f4c4d88c5. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_remotefxvgpudisablement_abuse.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:Invoke-ATHRemoteFXvGPUDisablementCommand|Invoke-ATHRemoteFXvGPUDisableme)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: renamed-autohotkey-exe-execution-0f16d9cf
    name: Renamed AutoHotkey.EXE Execution
    description: "Detects execution of a renamed autohotkey.exe binary based on PE metadata fields Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 0f16d9cf-0616-45c8-8fad-becc11b5a41c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_autohotkey.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.product contains "AutoHotkey" or xdm.target.process.description contains "AutoHotkey" or xdm.target.process.original_file_name ~= "^(?:AutoHotkey\\.exe|AutoHotkey\\.rc)$") and not ((xdm.target.process.executable.path ~= "(?:\\\\AutoHotkey\\.exe|\\\\AutoHotkey32\\.exe|\\\\AutoHotkey32_UIA\\.exe|\\\\AutoHotkey64\\.exe|\\\\AutoHotkey64_UIA\\.exe|\\\\AutoHotkeyA32\\.exe|\\\\AutoHotkeyA32_UIA\\.exe|\\\\AutoHotkeyU32\\.exe|\\\\AutoHotkeyU32_UIA\\.exe|\\\\AutoHotkeyU64\\.exe|\\\\AutoHotkeyU64_UIA\\.exe)$" or xdm.target.process.executable.path contains "\\AutoHotkey")))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: renamed-autoit-execution-f4264e47
    name: Renamed AutoIt Execution
    description: |-
      Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.
      AutoIt is a scripting language and automation tool for Windows systems. While primarily used for legitimate automation tasks, it can be misused in cyber attacks.
      Attackers can leverage AutoIt to create and distribute malware, including keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly suspicious. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f4264e47-f522-4c38-a420-04525d5b880f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_renamed_autoit.yml
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1027
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.command_line ~= "(?: /AutoIt3ExecuteScript| /ErrorStdOut)" or xdm.target.process.hashes ~= "(?:IMPHASH=FDC554B3A8683918D731685855683DDF|IMPHASH=CD30A61B60B3D60CECDB034C8C83C290|IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000)" or xdm.target.process.original_file_name ~= "^(?:AutoIt3\\.exe|AutoIt2\\.exe|AutoIt\\.exe)$") and not (xdm.target.process.executable.path ~= "(?:\\\\AutoIt\\.exe|\\\\AutoIt2\\.exe|\\\\AutoIt3_x64\\.exe|\\\\AutoIt3\\.exe)$"))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
