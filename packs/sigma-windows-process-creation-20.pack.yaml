    description: "Detects execution of the Add-In deployment cache updating utility (AddInutil.exe) with suspicious Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store payload. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_addinutil_suspicious_cmdline.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\addinutil\\.exe$" or xdm.target.process.original_file_name ~= "^AddInUtil\\.exe$") and ((xdm.target.process.command_line ~= "(?:-AddInRoot:|-PipelineRoot:)" and xdm.target.process.command_line ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Desktop\\\\|\\\\Downloads\\\\|\\\\Users\\\\Public\\\\|\\\\Windows\\\\Temp\\\\)") or (xdm.target.process.command_line ~= "(?:-AddInRoot:\\.|-AddInRoot:\"\\.\"|-PipelineRoot:\\.|-PipelineRoot:\"\\.\")" and xdm.target.process.current_directory ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\|\\\\Desktop\\\\|\\\\Downloads\\\\|\\\\Users\\\\Public\\\\|\\\\Windows\\\\Temp\\\\)")))
      group_by: field:xdm.source.host.hostname
