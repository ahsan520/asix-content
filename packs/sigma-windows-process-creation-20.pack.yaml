  - key: suspect-svchost-activity-16c37b52
    name: Suspect Svchost Activity
    description: "It is extremely abnormal for svchost.exe to spawn without any CLI arguments and is normally observed when a malicious process spawns the process and injects code into the process memory space. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Rpcnet.exe / rpcnetp.exe which is a lojack style software. https://www.blackhat.com/docs/us-14/materials/us-14-Kamlyuk-Kamluk-Computrace-Backdoor-Revisited.pdf. Sigma rule by David Burkett, @signalblur, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 16c37b52-b141-42a5-a3ea-bbe098444397. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_svchost_execution_with_no_cli_flags.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1055
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "svchost\\.exe$" and xdm.target.process.executable.path ~= "\\\\svchost\\.exe$") and not ((xdm.source.process.executable.path ~= "(?:\\\\rpcnet\\.exe|\\\\rpcnetp\\.exe)$" or not (xdm.target.process.command_line ~= "."))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: suspicious-addinutil-exe-commandline-e-631b22a4
