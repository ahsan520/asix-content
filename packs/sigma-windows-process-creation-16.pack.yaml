    category: process_creation
    mitre:
      - T1689
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\reg\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:reg\\.exe|powershell\\.exe|pwsh\\.dll)$") and ((xdm.target.process.command_line ~= "ControlSet" and xdm.target.process.command_line ~= "\\\\Control\\\\Lsa") and xdm.target.process.command_line ~= "(?:Set-ItemProperty|New-ItemProperty| add )") and xdm.target.process.command_line ~= "(?:IsPplAutoEnabled|RunAsPPL|RunAsPPLBoot)")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-dump-keyword-in-commandline-ffa6861c
    name: LSASS Dump Keyword In CommandLine
    description: 'Detects the presence of the keywords "lsass" and ".dmp" in the commandline, which could indicate a potential attempt to dump or create a dump of the lsass process. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by E.M. Anhaus, Tony Lambert, oscd.community, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ffa6861c-4461-4f59-8a41-578c39f3f23e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_lsass_dmp_cli_keywords.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1003.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "(?:lsass\\.dmp|lsass\\.zip|lsass\\.rar|Andrew\\.dmp|Coredump\\.dmp|NotLSASS\\.zip|lsass_2|lsassdump|lsassdmp)" or (xdm.target.process.command_line ~= "lsass" and xdm.target.process.command_line ~= "\\.dmp") or (xdm.target.process.command_line ~= "SQLDmpr" and xdm.target.process.command_line ~= "\\.mdmp") or (xdm.target.process.command_line ~= "nanodump" and xdm.target.process.command_line ~= "\\.dmp"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lsass-process-reconnaissance-via-finds-fe63010f
