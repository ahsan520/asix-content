    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\livekd\\.exe|\\\\livekd64\\.exe)$" or xdm.target.process.original_file_name ~= "^livekd\\.exe$") and xdm.target.process.command_line ~= " [-/–—―]m")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: launch-vsdevshell-ps1-proxy-execution-45d3a03d
    name: Launch-VsDevShell.PS1 Proxy Execution
    description: "Detects the use of the 'Launch-VsDevShell.ps1' Microsoft signed script to execute commands. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate usage of the script by a developer. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 45d3a03d-f441-458c-8883-df101a3bb146. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_launch_vsdevshell.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1216.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line contains "Launch-VsDevShell.ps1" and xdm.target.process.command_line ~= "(?:VsWherePath |VsInstallationPath )")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: loaded-module-enumeration-via-tasklist-34275eb8
    name: Loaded Module Enumeration Via Tasklist.EXE
    description: |-
      Detects the enumeration of a specific DLL or EXE being used by a binary via "tasklist.exe".
      This is often used by attackers in order to find the specific process identifier (PID) that is using the DLL in question.
      In order to dump the process memory or perform other nefarious actions. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 34275eb8-fa19-436b-b959-3d9ecd53fa1f. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_tasklist_module_enumeration.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\tasklist\\.exe$" or xdm.target.process.original_file_name ~= "^tasklist\\.exe$") and xdm.target.process.command_line ~= "[-/–—―]m" and xdm.target.process.command_line contains "rdpcorets.dll")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lol-binary-copied-from-system-director-f5d19838
    name: LOL-Binary Copied From System Directory
    description: "Detects a suspicious copy operation that tries to copy a known LOLBIN from system (System32, SysWOW64, WinSxS) directories to another on disk in order to bypass detections based on locations. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id f5d19838-41b5-476c-98d8-ba8af4929ee2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_copy_system_dir_lolbin.yml"
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1036.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (((xdm.target.process.executable.path ~= "\\\\cmd\\.exe$" and xdm.target.process.command_line contains "copy ") or (xdm.target.process.executable.path ~= "(?:\\\\powershell\\.exe|\\\\pwsh\\.exe)$" and xdm.target.process.command_line ~= "(?:copy-item| copy |cpi | cp )") or (xdm.target.process.executable.path ~= "(?:\\\\robocopy\\.exe|\\\\xcopy\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:robocopy\\.exe|XCOPY\\.EXE)$")) and (xdm.target.process.command_line ~= "(?:\\\\System32|\\\\SysWOW64|\\\\WinSxS)" and xdm.target.process.command_line ~= "(?:\\\\bitsadmin\\.exe|\\\\calc\\.exe|\\\\certutil\\.exe|\\\\cmdl32\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe|\\\\ie4uinit\\.exe)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: lolbin-execution-from-abnormal-drive-d4ca7c59
    name: LOLBIN Execution From Abnormal Drive
    description: "Detects LOLBINs executing from an abnormal or uncommon drive such as a mounted ISO. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Rare false positives could occur on servers with multiple drives.. Sigma rule by Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Angelo Violetti - SEC Consult '@angelo_violetti', Aaron Herman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d4ca7c59-e9e4-42d8-bf57-91a776efcb87. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_lolbin_exec_from_non_c_drive.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\certutil\\.exe|\\\\cmstp\\.exe|\\\\cscript\\.exe|\\\\installutil\\.exe|\\\\mshta\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.original_file_name ~= "^(?:CALC\\.EXE|CertUtil\\.exe|CMSTP\\.EXE|cscript\\.exe|installutil\\.exe|MSHTA\\.EXE|REGSVR32\\.EXE|RUNDLL32\\.EXE|wscript\\.exe)$") and not ((xdm.target.process.current_directory contains "C:\\" or not (xdm.target.process.current_directory ~= ".") or not (xdm.target.process.current_directory ~= "."))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
