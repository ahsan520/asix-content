  - key: lsa-ppl-protection-setting-modificatio-8c0eca51
    name: LSA PPL Protection Setting Modification via CommandLine
    description: |-
      Detects modification of LSA PPL protection settings via CommandLine.
      It may indicate an attempt to disable protection and enable credential dumping tools to access LSASS process memory. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely. Sigma rule by Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 8c0eca51-0f88-4db2-9183-fdfb10c703f9. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lsa_ppl_protection_setting_modification_via_cli.yml
    kind: bioc
