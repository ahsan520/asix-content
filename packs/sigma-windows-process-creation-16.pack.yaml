  - key: potential-amsi-bypass-using-null-bits-92a974db
    name: Potential AMSI Bypass Using NULL Bits
    description: "Detects usage of special strings/null bits in order to potentially bypass AMSI functionalities Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 92a974db-ab84-457f-9ec0-55db83d7a825. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_amsi_null_bits_bypass.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:if\\(0\\)\\{\\{\\{0\\}\\}\\}' -f \\$\\(0 -as \\[char\\]\\) \\+|#<NULL>)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-amsi-bypass-via-net-reflecti-30edb182
    name: Potential AMSI Bypass Via .NET Reflection
    description: 'Detects Request to "amsiInitFailed" that can be used to disable AMSI Scanning Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unlikely. Sigma rule by Markus Neis, @Kostastsale, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 30edb182-aa75-42c0-b0a9-e998bb29067c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_amsi_init_failed_bypass.yml'
    kind: bioc
    severity: high
    category: process_creation
    mitre:
      - T1685
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "System\\.Management\\.Automation\\.AmsiUtils" and xdm.target.process.command_line ~= "amsiInitFailed") or (xdm.target.process.command_line ~= "\\[Ref\\]\\.Assembly\\.GetType" and xdm.target.process.command_line ~= "SetValue\\(\\$null,\\$true\\)" and xdm.target.process.command_line ~= "NonPublic,Static"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: potential-application-whitelisting-byp-81ebd28b
    name: Potential Application Whitelisting Bypass via Dnx.EXE
    description: |-
      Detects the execution of Dnx.EXE. The Dnx utility allows for the execution of C# code.
      Attackers might abuse this in order to bypass application whitelisting. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Legitimate use of dnx.exe by legitimate user. Sigma rule by Beyu Denis, oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 81ebd28b-9607-4478-bf06-974ed9d53ed7. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_dnx_execute_csharp_code.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
      - T1027.004
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.executable.path ~= "\\\\dnx\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
