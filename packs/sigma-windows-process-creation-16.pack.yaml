# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-16
name: "Sigma: Windows process creation (16 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic process_creation. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
rules:
  - key: indirect-inline-command-execution-via-5edc2273
    name: Indirect Inline Command Execution Via Bash.EXE
    description: |-
      Detects execution of Microsoft bash launcher with the "-c" flag.
      This can be used to potentially bypass defenses and execute Linux or Windows-based binaries directly via bash. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 5edc2273-c26f-406c-83f3-f4d948e740dd. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_bash_command_execution.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "(?::\\\\Windows\\\\System32\\\\bash\\.exe|:\\\\Windows\\\\SysWOW64\\\\bash\\.exe)$" or xdm.target.process.original_file_name ~= "^Bash\\.exe$") and xdm.target.process.command_line contains " -c ")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: infdefaultinstall-exe-inf-execution-ce7cf472
    name: InfDefaultInstall.exe .inf Execution
    description: "Executes SCT script using scrobj.dll from a command in entered into a specially prepared INF file. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id ce7cf472-6fcc-490a-9481-3786840b5d9b. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_infdefaultinstall_execute_sct_scripts.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "InfDefaultInstall\\.exe " and xdm.target.process.command_line ~= "\\.inf")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: insensitive-subfolder-search-via-finds-04936b66
    name: Insensitive Subfolder Search Via Findstr.EXE
    description: 'Detects execution of findstr with the "s" and "i" flags for a "subfolder" and "insensitive" search respectively. Attackers sometimes leverage this built-in utility to search the system for interesting files or filter through results of commands. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Administrative or software activity. Sigma rule by Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 04936b66-3915-43ad-a8e5-809eadfd1141. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_findstr_subfolder_search.yml'
    kind: bioc
    severity: low
    category: process_creation
    mitre:
      - T1218
      - T1564.004
      - T1552.001
      - T1105
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line contains "findstr" or xdm.target.process.executable.path ~= "findstr\\.exe$" or xdm.target.process.original_file_name ~= "^FINDSTR\\.EXE$") and (xdm.target.process.command_line ~= " [-/–—―]s " and xdm.target.process.command_line ~= " [-/–—―]i "))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: interesting-service-enumeration-via-sc-e83e8899
    name: Interesting Service Enumeration Via Sc.EXE
    description: |-
      Detects the enumeration and query of interesting and in some cases sensitive services on the system via "sc.exe".
      Attackers often try to enumerate the services currently running on a system in order to find different attack vectors. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Swachchhanda Shrawan Poudel, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id e83e8899-c9b2-483b-b355-5decc942b959. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sc_query_interesting_services.yml
    kind: bioc
    severity: low
    category: process_creation
    mitre:
      - T1003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\sc\\.exe$" or xdm.target.process.original_file_name ~= "^sc\\.exe$") and xdm.target.process.command_line contains "query" and xdm.target.process.command_line contains "termservice")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: invocation-of-active-directory-diagnos-2afafd61
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    description: "Detects execution of ntdsutil.exe, which can be used for various attacks against the NTDS database (NTDS.DIT) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: NTDS maintenance. Sigma rule by Thomas Patzke, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2afafd61-6aae-4df4-baed-139fa1f4c345. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ntdsutil_usage.yml"
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1003.003
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.executable.path ~= "\\\\ntdsutil\\.exe$"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: kernel-memory-dump-via-livekd-c7746f1c
    name: Kernel Memory Dump Via LiveKD
    description: 'Detects execution of LiveKD with the "-m" flag to potentially dump the kernel memory Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unlikely in production environment. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_livekd_kernel_memory_dump.yml'
    kind: bioc
    severity: high
