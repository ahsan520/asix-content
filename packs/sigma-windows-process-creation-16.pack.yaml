  - key: malicious-pe-execution-by-microsoft-vi-15c7904e
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    description: |-
      There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to launch specified executable and attach a debugger.
      This option may be used adversaries to execute malicious code by signed verified binary.
      The debugger is installed alongside with Microsoft Visual Studio package. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: The process spawned by vsjitdebugger.exe is uncommon.. Sigma rule by Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 15c7904e-6ad1-4a45-9b46-5fb25df37fd2. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_use_of_vsjitdebugger_bin.yml
    kind: bioc
    severity: medium
    category: process_creation
    mitre:
      - T1218
    definition:
      regex: ""
