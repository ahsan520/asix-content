    name: Uncommon One Time Only Scheduled Task At 00:00
    description: "Detects scheduled task creation events that include suspicious actions, and is run once at 00:00 Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Software installation. Sigma rule by pH-T (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 970823b7-273b-460a-8afc-3a6811998529. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_one_time_only_midnight_task.yml"
