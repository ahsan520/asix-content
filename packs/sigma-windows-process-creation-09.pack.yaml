    mitre:
      - T1053.005
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.executable.path contains "\\schtasks.exe" or xdm.target.process.original_file_name ~= "^schtasks\\.exe$") and xdm.target.process.command_line ~= "(?:wscript|vbscript|cscript|wmic |wmic\\.exe|regsvr32\\.exe|powershell|\\\\AppData\\\\)" and (xdm.target.process.command_line ~= "once" and xdm.target.process.command_line ~= "00:00"))
