    kind: bioc
    severity: high
    category: Execution
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\wusa\\.exe$" and (xdm.source.process.executable.path ~= "(?::\\\\Perflogs\\\\|:\\\\Users\\\\Public\\\\|:\\\\Windows\\\\Temp\\\\|\\\\Appdata\\\\Local\\\\Temp\\\\|\\\\Temporary Internet)" or ((xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Favorites\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Favourites\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Contacts\\\\") or (xdm.source.process.executable.path ~= ":\\\\Users\\\\" and xdm.source.process.executable.path ~= "\\\\Pictures\\\\"))) and not (xdm.target.process.command_line contains ".msu"))
      group_by: field:xdm.source.host.hostname
