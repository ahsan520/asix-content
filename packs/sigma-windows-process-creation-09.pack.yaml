    description: 'Detects uncommon child processes of "DefaultPack.EXE" binary as a proxy to launch other programs Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id b2309017-4235-44fe-b5af-b15363011957. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_defaultpack_uncommon_child_process.yml'
