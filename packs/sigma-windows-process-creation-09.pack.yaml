        minutes: 60
  - key: uncommon-child-process-of-appvlp-exe-9c7e131a
    name: Uncommon Child Process Of Appvlp.EXE
    description: |-
      Detects uncommon child processes of Appvlp.EXE
      Appvlp or the Application Virtualization Utility is included with Microsoft Office. Attackers are able to abuse "AppVLP" to execute shell commands.
      Normally, this binary is used for Application Virtualization, but it can also be abused to circumvent the ASR file path rule folder
      or to mark a file as a system file. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Sreeman, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_appvlp_uncommon_child_process.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1218
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\appvlp\\.exe$" and not (xdm.target.process.executable.path ~= "(?::\\\\Windows\\\\SysWOW64\\\\rundll32\\.exe|:\\\\Windows\\\\System32\\\\rundll32\\.exe)$") and not (((xdm.target.process.executable.path contains ":\\Program Files\\Microsoft Office" and xdm.target.process.executable.path ~= "\\\\msoasb\\.exe$") or ((xdm.target.process.executable.path ~= ":\\\\Program Files\\\\Microsoft Office" and xdm.target.process.executable.path ~= "\\\\SkypeSrv\\\\") and xdm.target.process.executable.path ~= "\\\\SKYPESERVER\\.EXE$") or (xdm.target.process.executable.path contains ":\\Program Files\\Microsoft Office" and xdm.target.process.executable.path ~= "\\\\MSOUC\\.EXE$"))))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uncommon-child-process-of-bginfo-exe-aaf46cdc
