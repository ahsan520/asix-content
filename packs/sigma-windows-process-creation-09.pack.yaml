    description: "Detects uncommon or suspicious child processes spawning from a WSL process. This could indicate an attempt to evade parent/child relationship detections or persistence attempts via cron using WSL Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 2267fe65-0681-42ad-9a6d-46553d3f3480. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wsl_child_processes_anomalies.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1218
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "(?:\\\\wsl\\.exe|\\\\wslhost\\.exe)$" and (xdm.target.process.executable.path ~= "(?:\\\\calc\\.exe|\\\\cmd\\.exe|\\\\cscript\\.exe|\\\\mshta\\.exe|\\\\powershell\\.exe|\\\\pwsh\\.exe|\\\\regsvr32\\.exe|\\\\rundll32\\.exe|\\\\wscript\\.exe)$" or xdm.target.process.executable.path ~= "(?:\\\\AppData\\\\Local\\\\Temp\\\\|C:\\\\Users\\\\Public\\\\|C:\\\\Windows\\\\Temp\\\\|C:\\\\Temp\\\\|\\\\Downloads\\\\|\\\\Desktop\\\\)"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: wusa-exe-executed-by-parent-process-lo-ef64fc9c
