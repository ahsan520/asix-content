  - key: usage-of-web-request-commands-and-cmdl-9fc51a3c
    name: Usage Of Web Request Commands And Cmdlets
    description: "Detects the use of various web request commands with commandline tools and Windows PowerShell cmdlets (including aliases) via CommandLine Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Use of Get-Command and Get-Help modules to reference Invoke-WebRequest and Start-BitsTransfer.. Sigma rule by James Pemberton / @4A616D6573, Endgame, JHasenbusch, oscd.community, Austin Songer @austinsonger, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 9fc51a3c-81b3-4fa7-b35f-7c02cf10fd2d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_web_request_cmd_and_cmdlets.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059.001
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and xdm.target.process.command_line ~= "(?:\\[System\\.Net\\.WebRequest\\]::create|curl |Invoke-RestMethod|Invoke-WebRequest| irm |iwr |Resume-BitsTransfer|Start-BitsTransfer|wget |WinHttp\\.WinHttpRequest)"
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
