        minutes: 60
  - key: suspicious-powershell-mailbox-export-t-889719ef
    name: Suspicious PowerShell Mailbox Export to Share
    description: "Detects usage of the powerShell New-MailboxExportRequest Cmdlet to exports a mailbox to a remote or local share, as used in ProxyShell exploitations Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 889719ef-dd62-43df-86c3-768fb08dc7c0. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_mailboxexport_share.yml"
    kind: bioc
    severity: critical
    category: Exfiltration
    mitre: []
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.command_line ~= "New-MailboxExportRequest" and xdm.target.process.command_line ~= " -Mailbox " and xdm.target.process.command_line ~= " -FilePath \\\\\\\\\\\\\\\\")
