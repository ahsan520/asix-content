    category: Execution
    mitre:
      - T1548.002
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.source.process.executable.path ~= "\\\\DllHost\\.exe$" and xdm.source.process.command_line contains " /Processid:{12C21EA7-2EB8-4B55-9249-AC243DA8C666}" and xdm.target.process.integrity_level ~= "^(?:High|System|S-1-16-16384|S-1-16-12288)$")
      group_by: field:xdm.source.host.hostname
