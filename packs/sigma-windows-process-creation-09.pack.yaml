# ASIX content pack. Check it with: node scripts/pack-tool.js check <folder>
id: sigma-windows-process-creation-09
name: "Sigma: Windows process creation (9 of 24)"
description: "50 detection rules from the SigmaHQ community rule set (698f0912f571d5fac3bf8c51f5421139834a011c), converted for ASIX: Windows process creation events, grouped by tactic, starting with Execution. They install switched off: read each one, check it against your own logs, then switch it on. Every rule names its author, as the Detection Rule License requires."
version: 2026.1118.0
audience: enterprise
publisher:
  name: SigmaHQ community, converted for ASIX
  url: https://github.com/SigmaHQ/sigma
certification: community
supported_by: community
rules_start_off: true
tags:
  - sigma
  - windows
  - process-creation
license: DRL-1.1
sources:
  - "Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage)"
  - Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1)
rules:
  - key: suspicious-zipexec-execution-90dcf730
    name: Suspicious ZipExec Execution
    description: "ZipExec is a Proof-of-Concept (POC) tool to wrap binary-based tools into a password-protected zip file. Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: Unknown. Sigma rule by frack113, from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 90dcf730-1b71-4ae7-9ffc-6fcf62bd0132. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_zipexec.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1218
      - T1202
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and ((xdm.target.process.command_line ~= "/generic:Microsoft_Windows_Shell_ZipFolder:filename=" and xdm.target.process.command_line ~= "\\.zip" and xdm.target.process.command_line ~= "/pass:" and xdm.target.process.command_line ~= "/user:") or (xdm.target.process.command_line ~= "/delete" and xdm.target.process.command_line ~= "Microsoft_Windows_Shell_ZipFolder:filename=" and xdm.target.process.command_line ~= "\\.zip"))
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: sysprep-on-appdata-folder-d5b9ae7a
    name: Sysprep on AppData Folder
    description: "Detects suspicious sysprep process start with AppData folder as target (as used by Trojan Syndicasec in Thrip report by Symantec) Needs: Windows process creation: Sysmon event 1 (or Windows event 4688 with command-line auditing, for rules that only use Image, CommandLine and ParentImage). Known false positives: False positives depend on scripts and administrative tools used in the monitored environment. Sigma rule by Florian Roth (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id d5b9ae7a-e6fc-405e-80ff-2ff9dcc64e7e. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysprep_appdata.yml"
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1059
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: xdm.event.type = "process" and (xdm.target.process.executable.path ~= "\\\\sysprep\\.exe$" and xdm.target.process.command_line contains "\\AppData\\")
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: system-disk-and-volume-reconnaissance-c79da740
    name: System Disk And Volume Reconnaissance Via Wmic.EXE
    description: |-
      An adversary might use WMI to discover information about the system, such as the volume name, size,
      free space, and other disk information. This can be done using the 'wmic' command-line utility and has been
      observed being used by threat actors such as Volt Typhoon. Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Stephen Lincoln '@slincoln-aiq' (AttackIQ), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id c79da740-5030-45ec-a2e0-479e824a562c. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_wmic_recon_volume.yml
    kind: bioc
    severity: medium
    category: Execution
    mitre:
      - T1047
      - T1082
    definition:
      regex: ""
      source_type: ""
      filters: []
      xql: 'xdm.event.type = "process" and ((xdm.target.process.executable.path ~= "\\\\WMIC\\.exe$" or xdm.target.process.original_file_name ~= "^wmic\\.exe$") and (xdm.target.process.command_line ~= "(?: volumename| logicaldisk)" or (xdm.target.process.command_line ~= "path" and xdm.target.process.command_line ~= "win32_logicaldisk") or (xdm.target.process.command_line ~= " volume" and xdm.target.process.command_line ~= " list ")))'
      group_by: field:xdm.source.host.hostname
      threshold: 1
      window_minutes: 5
      run_every_minutes: 1
      mode: realtime
      suppression:
        enabled: true
        minutes: 60
  - key: uac-bypass-using-idiagnostic-profile-4cbef972
    name: UAC Bypass Using IDiagnostic Profile
    description: 'Detects the "IDiagnosticProfileUAC" UAC bypass technique Needs: Sysmon (Microsoft-Windows-Sysmon/Operational) forwarded to ASIX (event 1). Known false positives: Unknown. Sigma rule by Nasreddine Bencherchali (Nextron Systems), from SigmaHQ (Detection Rule License 1.1), converted for ASIX. Sigma id 4cbef972-f347-4170-b62a-8253f6168e6d. https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_uac_bypass_idiagnostic_profile.yml'
    kind: bioc
